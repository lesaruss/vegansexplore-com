<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer For The Plant Based Showcase - VEGANS EXPLORE</title>
<meta name="description" content="Open volunteer and staffing roles for the Plant Based Showcase at the Dolphins Garage.">
<link rel="icon" href="/public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.5);}
  body{font-family:"Montserrat",sans-serif;background:#fff;color:var(--ve-text);min-height:100vh;}
  main{max-width:700px;margin:0 auto;padding:0 24px 80px;}
  #pbs-gate{text-align:center;padding:100px 20px;}
  #pbs-gate button{margin-top:16px;background:var(--ve-green);color:#fff;border:none;padding:14px 28px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  #pbs-gate p{font-size:14px;color:var(--ve-text-75);margin-bottom:8px;}
  #pbs-content{display:none;}
  .pbs-back{display:inline-block;font-size:11px;font-weight:700;color:var(--ve-text-50);text-decoration:none;margin:20px 0 6px;}
  .pbs-back:hover{color:var(--ve-text);}

  .pbs-hero{margin-bottom:20px;height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(135deg,#F69820,#e07b00);color:#fff;}
  .pbs-hero-emoji{font-size:40px;margin-bottom:8px;}
  .pbs-hero h1{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:4px;}
  .pbs-hero-sub{font-size:12.5px;opacity:0.92;font-weight:600;}
  .pbs-intro{font-size:14px;color:var(--ve-text-75);line-height:1.6;margin-bottom:26px;}

  .pbs-opp-card{border:1.5px solid var(--ve-border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .pbs-opp-title{font-size:13.5px;font-weight:800;margin-bottom:4px;}
  .pbs-opp-toggle{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ve-green-dark);background:none;border:none;cursor:pointer;padding:0;margin-bottom:8px;}
  .pbs-opp-detail{display:none;font-size:12.5px;color:var(--ve-text-75);line-height:1.6;margin-bottom:12px;}
  .pbs-opp-detail.open{display:block;}
  .pbs-opp-req{font-size:12px;color:var(--ve-text-50);margin-top:8px;}
  .pbs-note{width:100%;border:1.5px solid var(--ve-border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12.5px;margin-bottom:8px;resize:vertical;min-height:50px;}
  .pbs-btn{background:var(--ve-green);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:800;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;}
  .pbs-btn:hover{background:var(--ve-green-dark);}
  .pbs-btn:disabled{opacity:0.6;cursor:default;}
  .pbs-status{display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;}
  .pbs-status.pending{background:#fff3e0;color:#7d4a00;}
  .pbs-status.accepted{background:var(--ve-green-light);color:var(--ve-green-dark);}
  .pbs-status.rejected{background:#fef2f2;color:#dc2626;}
  .pbs-empty{font-size:13px;color:var(--ve-text-50);}
</style>
</head>
<body>
<div class="page-frame">

<script src="/public/nav.js"></script>
<script src="/public/ve-auth.js"></script>

<main>
  <div id="pbs-gate"><p>Checking access&hellip;</p></div>

  <div id="pbs-content">
    <a class="pbs-back" href="/campaigns/plant-based-showcase-dolphins">&larr; Back</a>
    <div class="pbs-hero">
      <div class="pbs-hero-emoji">&#129309;</div>
      <h1 id="pbs-title">Volunteer &amp; Staffing</h1>
      <div class="pbs-hero-sub" id="pbs-subtitle">Loading&hellip;</div>
    </div>
    <p class="pbs-intro" id="pbs-intro"></p>

    <div id="pbs-opp-list"><p class="pbs-empty">Loading open roles&hellip;</p></div>
  </div>
</main>

<script src="/public/footer.js"></script>
</div>

<script>
  var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var INITIATIVE_SLUG = 'vegans-explore-initiative-plant-based-showcase';
  var TYPE_LABEL = { vegan_explorer: 'Vegan Explorer', volunteer: 'Volunteer', community_manager: 'Community Manager', community_coordinator: 'Community Coordinator' };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function call(action, payload, token) {
    return fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(Object.assign({ token: token }, payload || {}))
    }).then(function (r) { return r.json(); });
  }

  function renderOpportunities(opps, token) {
    var list = document.getElementById('pbs-opp-list');
    if (!opps.length) { list.innerHTML = '<p class="pbs-empty">No open roles posted yet for this event. Check back soon.</p>'; return; }
    list.innerHTML = opps.map(function (o, i) {
      var typeLabel = TYPE_LABEL[o.opportunity_type] || o.opportunity_type;
      var reqHtml = o.requirements ? '<div class="pbs-opp-req">' + esc(o.requirements) + '</div>' : '';
      if (o.my_status) {
        return '<div class="pbs-opp-card"><div class="pbs-opp-title">' + esc(o.title) + ' &middot; ' + esc(typeLabel) + '</div>' +
          '<div class="pbs-opp-detail open">' + esc(o.description || '') + reqHtml + '</div>' +
          '<span class="pbs-status ' + esc(o.my_status) + '">' + esc(o.my_status) + '</span></div>';
      }
      return '<div class="pbs-opp-card" data-oid="' + esc(o.id) + '">' +
        '<div class="pbs-opp-title">' + esc(o.title) + ' &middot; ' + esc(typeLabel) + '</div>' +
        '<button class="pbs-opp-toggle" data-i="' + i + '">See Full Details</button>' +
        '<div class="pbs-opp-detail" id="pbs-opp-detail-' + i + '">' + esc(o.description || '') + reqHtml + '</div>' +
        '<textarea class="pbs-note" placeholder="Say a little about why you\'re interested (optional)"></textarea>' +
        '<button class="pbs-btn" data-id="' + esc(o.id) + '">Apply</button></div>';
    }).join('');

    list.querySelectorAll('.pbs-opp-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = btn.getAttribute('data-i');
        var detail = document.getElementById('pbs-opp-detail-' + idx);
        var open = detail.classList.toggle('open');
        btn.textContent = open ? 'Hide Details' : 'See Full Details';
      });
    });

    list.querySelectorAll('.pbs-opp-card button[data-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('.pbs-opp-card');
        var note = card.querySelector('.pbs-note').value;
        btn.disabled = true; btn.textContent = 'Applying...';
        call('submit_opportunity_application', { opportunity_id: btn.getAttribute('data-id'), cover_note: note }, token)
          .then(function (d) {
            if (d && d.error) { btn.disabled = false; btn.textContent = 'Apply'; alert('Could not submit: ' + d.error); return; }
            card.querySelector('.pbs-note').remove();
            btn.outerHTML = '<span class="pbs-status pending">pending</span>';
          }).catch(function () { btn.disabled = false; btn.textContent = 'Apply'; alert('Could not reach the server, try again.'); });
      });
    });
  }

  function showDenied() {
    document.getElementById('pbs-gate').innerHTML = '<p>Sign in to see open roles for the Plant Based Showcase.</p><button id="pbs-signin-btn">Sign In</button>';
    var btn = document.getElementById('pbs-signin-btn');
    if (btn) btn.addEventListener('click', function () { VEAuth.showAuthModal('Sign in to get involved.', init); });
  }

  function init() {
    if (!window.VEAuth || !VEAuth.isLoggedIn()) { showDenied(); return; }
    var token = VEAuth.getToken();
    document.getElementById('pbs-gate').style.display = 'none';
    document.getElementById('pbs-content').style.display = 'block';

    call('get_initiative_front_door', { initiative_slug: INITIATIVE_SLUG }, token).then(function (d) {
      if (d && d.error) {
        document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now (' + esc(d.error) + ').</p>';
        return;
      }
      var door = d.door;
      var vol = door.volunteer || {};
      document.title = 'Volunteer - ' + door.title + ' - VEGANS EXPLORE';
      document.getElementById('pbs-subtitle').textContent = vol.subtitle || door.subtitle;
      document.getElementById('pbs-intro').textContent = vol.intro || '';

      renderOpportunities(d.opportunities || [], token);
    }).catch(function () {
      document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now.</p>';
    });
  }

  init();
</script>
</body>
</html>
