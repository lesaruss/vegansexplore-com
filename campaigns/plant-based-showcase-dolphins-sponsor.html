<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.5);}
  body{font-family:"Montserrat",sans-serif;background:#fff;color:var(--ve-text);min-height:100vh;}
  main{max-width:none;margin:0 auto;padding:0 24px 80px;}
  #pbs-gate{text-align:center;padding:100px 20px;}
  #pbs-gate button{margin-top:16px;background:var(--ve-green);color:#fff;border:none;padding:14px 28px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  #pbs-gate p{font-size:14px;color:var(--ve-text-75);margin-bottom:8px;}
  #pbs-content{display:none;}
  .pbs-back{display:inline-block;font-size:11px;font-weight:700;color:var(--ve-text-50);text-decoration:none;margin:20px 0 6px;}
  .pbs-back:hover{color:var(--ve-text);}

  .pbs-hero{margin-bottom:20px;height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(135deg,#F69820,#e07b00);color:#fff;}
  .pbs-hero-avatar{width:52px;height:52px;border-radius:100%;object-fit:cover;border:2.5px solid rgba(255,255,255,0.85);margin-bottom:8px;background:#fff;}
  .pbs-hero h1{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:4px;}
  .pbs-hero-sub{font-size:12.5px;opacity:0.92;font-weight:600;}
  .pbs-intro{font-size:14px;color:var(--ve-text-75);line-height:1.6;margin-bottom:26px;}
  .pbs-followup-note{font-size:12px;color:var(--ve-text-50);line-height:1.55;background:#fafafa;border:1px solid var(--ve-border);border-radius:8px;padding:12px 14px;margin-top:26px;}

  .pbs-tier-list{display:flex;flex-direction:column;gap:12px;}
  .pbs-tier{border:1.5px solid var(--ve-border);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .pbs-tier-info{flex:1;}
  .pbs-tier-title{font-size:13.5px;font-weight:800;margin-bottom:2px;}
  .pbs-tier-price{font-size:12px;font-weight:700;color:var(--ve-orange);margin-bottom:6px;}
  .pbs-tier-blurb{font-size:12.5px;color:var(--ve-text-75);line-height:1.5;}
  .pbs-tier-btn{background:#fff;border:1.5px solid var(--ve-green);color:var(--ve-green-dark);padding:9px 16px;border-radius:6px;font-weight:800;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .pbs-tier-btn:hover{background:var(--ve-green-light);}
  .pbs-tier-btn.done{background:var(--ve-green-light);border-color:var(--ve-green-light);color:var(--ve-green-dark);cursor:default;}
  @media (max-width:560px){ .pbs-tier{flex-direction:column;} .pbs-tier-btn{width:100%;} }
</style>
</head>
<body>
<div class="page-frame">

<main>
  <div id="pbs-gate"><p>Checking access&hellip;</p></div>

  <div id="pbs-content">
    <a class="pbs-back" href="/campaigns/plant-based-showcase-dolphins">&larr; Back</a>
    <div class="pbs-hero">
      <img class="pbs-hero-avatar" id="pbs-hero-avatar" src="" alt="">
      <h1 id="pbs-title">Sponsor The Plant Based Showcase</h1>
      <div class="pbs-hero-sub" id="pbs-subtitle">Loading&hellip;</div>
    </div>
    <p class="pbs-intro" id="pbs-intro"></p>

    <div class="pbs-tier-list" id="pbs-tier-list"></div>
    <p class="pbs-followup-note" id="pbs-followup-note"></p>
  </div>
</main>

<script src="/public/footer.js"></script>
</div>

<script>
  var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var INITIATIVE_SLUG = 'vegans-explore-initiative-plant-based-showcase';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function guideImg(name) { return '/public/guides/' + esc(name || 'pascal') + '.jpg'; }

  function call(action, payload, token) {
    return fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(Object.assign({ token: token }, payload || {}))
    }).then(function (r) { return r.json(); });
  }

  function renderTiers(tiers, myInterest, token) {
    var doneTiers = {};
    (myInterest || []).forEach(function (i) {
      if (i.action_type === 'vendor_tier' || i.action_type === 'sponsor_tier') doneTiers[i.tier_label] = true;
    });
    var list = document.getElementById('pbs-tier-list');
    list.innerHTML = (tiers || []).map(function (t) {
      var already = !!doneTiers[t.label];
      return '<div class="pbs-tier">' +
        '<div class="pbs-tier-info">' +
          '<div class="pbs-tier-title">' + esc(t.label) + '</div>' +
          '<div class="pbs-tier-price">' + esc(t.price) + '</div>' +
          '<div class="pbs-tier-blurb">' + esc(t.blurb) + '</div>' +
        '</div>' +
        '<button class="pbs-tier-btn' + (already ? ' done' : '') + '" data-tier="' + esc(t.label) + '"' + (already ? ' disabled' : '') + '>' +
          (already ? "Interest Sent" : "Select Interest") +
        '</button>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.pbs-tier-btn:not(.done)').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tierLabel = btn.getAttribute('data-tier');
        btn.disabled = true; btn.textContent = 'Submitting...';
        call('submit_initiative_interest', { initiative_slug: INITIATIVE_SLUG, action_type: 'sponsor_tier', tier_label: tierLabel }, token)
          .then(function (d) {
            if (d && d.error) { btn.disabled = false; btn.textContent = 'Select Interest'; alert('Could not submit: ' + d.error); return; }
            btn.classList.add('done'); btn.disabled = true; btn.textContent = 'Interest Sent';
          }).catch(function () { btn.disabled = false; btn.textContent = 'Select Interest'; alert('Could not reach the server, try again.'); });
      });
    });
  }

  function showDenied() {
    document.getElementById('pbs-gate').innerHTML = '<p>Sign in to see sponsor options for the Plant Based Showcase.</p><button id="pbs-signin-btn">Sign In</button>';
    var btn = document.getElementById('pbs-signin-btn');
    if (btn) btn.addEventListener('click', function () { VEAuth.showAuthModal('Sign in to get involved.', init); });
  }

  function init() {
    if (!window.VEAuth || !VEAuth.isLoggedIn()) { showDenied(); return; }
    var token = VEAuth.getToken();
    document.getElementById('pbs-gate').style.display = 'none';
    document.getElementById('pbs-content').style.display = 'block';

    call('get_initiative_front_door', { initiative_slug: INITIATIVE_SLUG }, token).then(function (d) {
      if (d && d.error) {
        document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now (' + esc(d.error) + ').</p>';
        return;
      }
      var door = d.door;
      var sponsor = door.sponsor || {};
      document.title = 'Sponsor ' + door.title + ' - VEGANS EXPLORE';
      document.getElementById('pbs-subtitle').textContent = sponsor.subtitle || door.subtitle;
      document.getElementById('pbs-hero-avatar').src = guideImg(sponsor.avatar || door.avatar);
      document.getElementById('pbs-intro').textContent = sponsor.intro || '';
      document.getElementById('pbs-followup-note').textContent = door.interest_followup_note || '';

      renderTiers(door.sponsorship_tiers, d.my_interest, token);
    }).catch(function () {
      document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now.</p>';
    });
  }

  init();
</script>
</body>
</html>
