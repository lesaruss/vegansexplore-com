<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attend The Plant Based Showcase - VEGANS EXPLORE</title>
<meta name="description" content="What's happening at the Plant Based Showcase at the Dolphins Garage, and how to join the waitlist.">
<link rel="icon" href="/public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.5);}
  body{font-family:"Montserrat",sans-serif;background:#fff;color:var(--ve-text);min-height:100vh;}
  main{max-width:700px;margin:0 auto;padding:0 24px 80px;}
  #pbs-gate{text-align:center;padding:100px 20px;}
  #pbs-gate button{margin-top:16px;background:var(--ve-green);color:#fff;border:none;padding:14px 28px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  #pbs-gate p{font-size:14px;color:var(--ve-text-75);margin-bottom:8px;}
  #pbs-content{display:none;}
  .pbs-back{display:inline-block;font-size:11px;font-weight:700;color:var(--ve-text-50);text-decoration:none;margin:20px 0 6px;}
  .pbs-back:hover{color:var(--ve-text);}

  .pbs-hero{margin-bottom:22px;height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(135deg,#F69820,#e07b00);color:#fff;}
  .pbs-hero-emoji{font-size:40px;margin-bottom:8px;}
  .pbs-hero h1{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:4px;}
  .pbs-hero-sub{font-size:12.5px;opacity:0.92;font-weight:600;}

  .pbs-list{list-style:none;display:flex;flex-direction:column;gap:14px;margin-bottom:32px;}
  .pbs-list li{font-size:14px;line-height:1.6;color:var(--ve-text-75);padding-left:26px;position:relative;}
  .pbs-list li::before{content:"\2713";position:absolute;left:0;top:0;color:var(--ve-green-dark);font-weight:800;}

  .pbs-cta-card{border:1.5px solid var(--ve-green);background:var(--ve-green-light);border-radius:14px;padding:22px;text-align:center;}
  .pbs-cta-title{font-size:15px;font-weight:800;margin-bottom:8px;color:var(--ve-green-dark);}
  .pbs-cta-note{font-size:12.5px;color:var(--ve-text-75);line-height:1.55;margin-bottom:16px;}
  .pbs-btn{background:var(--ve-green);color:#fff;border:none;padding:12px 24px;border-radius:6px;font-weight:800;font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;}
  .pbs-btn:hover{background:var(--ve-green-dark);}
  .pbs-btn:disabled{opacity:0.6;cursor:default;}
  .pbs-done{display:block;font-size:12px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--ve-green-dark);}
  .pbs-done-sub{display:block;font-size:12px;font-weight:600;text-transform:none;letter-spacing:normal;color:var(--ve-text-75);margin-top:6px;}
</style>
</head>
<body>
<div class="page-frame">

<script src="/public/nav.js"></script>
<script src="/public/ve-auth.js"></script>

<main>
  <div id="pbs-gate"><p>Checking access&hellip;</p></div>

  <div id="pbs-content">
    <a class="pbs-back" href="/campaigns/plant-based-showcase-dolphins">&larr; Back</a>
    <div class="pbs-hero">
      <div class="pbs-hero-emoji">&#127881;</div>
      <h1 id="pbs-title">Attend The Plant Based Showcase</h1>
      <div class="pbs-hero-sub" id="pbs-subtitle">Loading&hellip;</div>
    </div>

    <ul class="pbs-list" id="pbs-highlights"></ul>

    <div class="pbs-cta-card">
      <div class="pbs-cta-title">Join The Waitlist</div>
      <div class="pbs-cta-note" id="pbs-cta-note"></div>
      <button class="pbs-btn" id="pbs-waitlist-btn">Join The Waitlist</button>
    </div>
  </div>
</main>

<script src="/public/footer.js"></script>
</div>

<script>
  var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var INITIATIVE_SLUG = 'vegans-explore-initiative-plant-based-showcase';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function call(action, payload, token) {
    return fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(Object.assign({ token: token }, payload || {}))
    }).then(function (r) { return r.json(); });
  }

  function showDenied() {
    document.getElementById('pbs-gate').innerHTML = '<p>Sign in to see how to be part of the Plant Based Showcase.</p><button id="pbs-signin-btn">Sign In</button>';
    var btn = document.getElementById('pbs-signin-btn');
    if (btn) btn.addEventListener('click', function () { VEAuth.showAuthModal('Sign in to get involved.', init); });
  }

  function init() {
    if (!window.VEAuth || !VEAuth.isLoggedIn()) { showDenied(); return; }
    var token = VEAuth.getToken();
    document.getElementById('pbs-gate').style.display = 'none';
    document.getElementById('pbs-content').style.display = 'block';

    call('get_initiative_front_door', { initiative_slug: INITIATIVE_SLUG }, token).then(function (d) {
      if (d && d.error) {
        document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now (' + esc(d.error) + ').</p>';
        return;
      }
      var door = d.door;
      var attend = door.attend || {};
      document.title = 'Attend ' + door.title + ' - VEGANS EXPLORE';
      document.getElementById('pbs-subtitle').textContent = attend.subtitle || door.subtitle;
      document.getElementById('pbs-cta-note').textContent = attend.cta_note || '';
      document.getElementById('pbs-highlights').innerHTML = (attend.highlights || []).map(function (h) {
        return '<li>' + esc(h) + '</li>';
      }).join('');

      var already = (d.my_interest || []).some(function (i) { return i.action_type === 'ticket'; });
      var btn = document.getElementById('pbs-waitlist-btn');
      var doneMarkup = '<span class="pbs-done">You\'re On The Waitlist</span><span class="pbs-done-sub">We\'ll reach out the moment tickets open up.</span>';
      if (already) { btn.outerHTML = doneMarkup; return; }
      btn.addEventListener('click', function () {
        btn.disabled = true; btn.textContent = 'Submitting...';
        call('submit_initiative_interest', { initiative_slug: INITIATIVE_SLUG, action_type: 'ticket' }, token).then(function (r) {
          if (r && r.error) { btn.disabled = false; btn.textContent = 'Join The Waitlist'; alert('Could not submit: ' + r.error); return; }
          btn.outerHTML = doneMarkup;
        }).catch(function () { btn.disabled = false; btn.textContent = 'Join The Waitlist'; alert('Could not reach the server, try again.'); });
      });
    }).catch(function () {
      document.getElementById('pbs-content').innerHTML = '<p>Could not load this page right now.</p>';
    });
  }

  init();
</script>
</body>
</html>
