<!--
  Our Guides as the ads in every rail slot (Sean, 2026-10-31: "let's actually just retire Humble Cabbage for now and just make them
  all our guides, but just create an assortment of them around the different places"). One HTML5 ad for every Guide and every slot:
  ?g=<guide slug> picks the Guide, and the host (public/ve-ad-creative.js, or houseAd in directory/listing.html) passes the tracked
  /go/ link as ?clickTag=. A click opens the clickTag and posts {veAd:'click'} so the ad system counts it (ad-click).

  Rebuilt on the brand kit's ad template (Sean, 2026-11-11: "Fix the banners"; LOCKED template /mocks/brand-kit/templates, slide
  "ads", canon canon-ve-brand-kit-templates). Every ad is a door: the Guides pink block, the label in a solid ink block, the big line,
  the Guide's scene in a white frame with an ink shadow, and the logo signing off in a white bar at the bottom with the one button.
  Words never sit on a picture: the headline cycles in the color block above the frame, never over it.
  Each scene's frame takes that picture's own shape, measured when it loads (naturalWidth / naturalHeight), and the largest frame of
  that shape that fits the picture area is drawn, so a scene is never cropped and no face is cut. The layout follows the slot's shape:
    tall   (a 300 x 600 tower, a 160-wide skyscraper)   label, line, the Guide's sentence, the frame, the bar
    short  (300 x 250, the 6:5 billboard, a phone's box) label, line, the frame, the bar
    lead   (728 x 90)                                   the frame, the line, the logo, the button (template ad3)
    strip  (320 x 50)                                   the suitcase mark, the line, the button, the stripe; no picture (template ad4)
-->
<style>
  :root{--dk:#2D5C27;--or:#F69820;--pink:#FF9EC4;--peach:#FFEBD1;--br:#22C55E;--tint:#E8F5E9;--md:#3A9B3E;--ink:#1a1a1a;--u:1px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--pink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a.ad{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--ink);text-decoration:none;cursor:pointer;background:var(--pink);box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden}
  a.ad:focus-visible{outline:3px solid var(--or);outline-offset:-3px}
  .dl{align-self:flex-start;flex:none;background:var(--ink);color:#fff;font-weight:900;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
  .h{display:grid;flex:none}
  .h b{grid-area:1/1;align-self:start;font-weight:900;line-height:1.05;letter-spacing:-.02em;opacity:0;animation:t 16s infinite}
  .p{display:none;flex:none;font-weight:600;line-height:1.4}
  .pic{position:relative;flex:1 1 auto;min-height:0}
  .fr{position:absolute;display:block;background:#fff;border:solid #fff;overflow:hidden;opacity:0;visibility:hidden;animation:t 16s infinite}
  .fr.ok{visibility:visible}
  .fr img{display:block;width:100%;height:100%;object-fit:cover}
  .so{flex:none;display:flex;align-items:center;justify-content:space-between;background:#fff;border-top:2px solid var(--ink)}
  .so img{display:block;width:auto;min-width:0;max-width:50%;object-fit:contain;object-position:left center}
  .so{gap:8px}
  .bt{display:inline-block;flex:none;white-space:nowrap;background:var(--or);color:var(--ink);font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--ink);line-height:1.2}
  a.ad:hover .bt,a.ad:focus-visible .bt{background:#ffb04d}
  .mk,.stp{display:none}
  .h b:nth-child(1),.fr:nth-child(1){animation-delay:0s}.h b:nth-child(2),.fr:nth-child(2){animation-delay:4s}
  .h b:nth-child(3),.fr:nth-child(3){animation-delay:8s}.h b:nth-child(4),.fr:nth-child(4){animation-delay:12s}
  @keyframes t{0%{opacity:0}5%{opacity:1}25%{opacity:1}30%{opacity:0}100%{opacity:0}}

  /* short: the template's 300 x 250 (.ad2), in units of the slot (--u is one template pixel). */
  .short a.ad{padding:calc(10*var(--u)) calc(12*var(--u)) 0}
  .short .dl{font-size:max(8px,calc(9*var(--u)));padding:calc(3*var(--u)) calc(6*var(--u));border-radius:calc(3*var(--u))}
  .short .h{margin:calc(6*var(--u)) 0 calc(8*var(--u))}
  .short .h b{font-size:calc(22*var(--u))}
  .short .so{margin:calc(8*var(--u)) calc(-12*var(--u)) 0;padding:calc(7*var(--u)) calc(10*var(--u))}
  .short .so img{height:calc(22*var(--u))}
  .short .bt{font-size:max(9px,calc(10*var(--u)));padding:calc(6*var(--u)) calc(10*var(--u));border-radius:calc(4*var(--u))}

  /* tall: the template's 300 x 600 (.ad2.tall). */
  .tall a.ad{padding:calc(20*var(--u)) calc(22*var(--u)) 0}
  .tall .dl{font-size:max(8px,calc(14*var(--u)));padding:calc(6*var(--u)) calc(10*var(--u));border-radius:calc(4*var(--u))}
  .tall .h{margin:calc(12*var(--u)) 0 calc(10*var(--u))}
  .tall .h b{font-size:max(15px,calc(36*var(--u)))}
  .tall .p{display:block;font-size:max(11px,calc(14*var(--u)));margin:0 0 calc(14*var(--u))}
  .tall.nop .p{display:none}
  .tall .so{margin:calc(14*var(--u)) calc(-22*var(--u)) 0;padding:calc(14*var(--u)) calc(18*var(--u))}
  .tall .so img{height:calc(30*var(--u))}
  .tall .bt{font-size:max(9px,calc(13*var(--u)));padding:calc(9*var(--u)) calc(12*var(--u));border-radius:calc(4*var(--u))}
  /* A narrow tower (160 wide): the logo bar stacks, the logo over the button, both centered. */
  .narrow .so{flex-direction:column;gap:8px;padding:10px 8px}
  .narrow .so img{height:auto;width:min(100%,120px);max-width:100%;aspect-ratio:6732/1668}
  /* short, side by side: for portrait and square scenes the words take the left and the frame the right, so the picture is
     not shrunk under a two-row line (chosen per Guide, whichever gives its scenes the bigger frames). */
  .short.side a.ad{display:grid;grid-template-columns:minmax(min-content,40fr) minmax(0,60fr);grid-template-rows:auto 1fr auto;column-gap:calc(10*var(--u))}
  .short.side .dl{grid-column:1;grid-row:1}
  .short.side .h{grid-column:1;grid-row:2;align-self:start}
  .short.side .h b{font-size:calc(17*var(--u))}
  .short.side .pic{grid-column:2;grid-row:1/3;margin-top:0}
  .short.side .so{grid-column:1/3;grid-row:3;contain:inline-size}

  /* lead: the template's 728 x 90 (.ad3), in the Guide's pink: the frame, the line, the logo in ink, the button. */
  .lead a.ad{flex-direction:row;align-items:center;gap:calc(16*var(--u));padding:0 calc(14*var(--u))}
  .lead .dl{display:none}
  .lead .pic{flex:none;align-self:stretch;order:-1}
  .lead .h{flex:1 1 auto;min-width:0}
  .lead .h b{font-size:calc(19*var(--u))}
  .lead .so{background:none;border:0;gap:calc(16*var(--u))}
  .lead .so img{height:calc(46*var(--u))}
  .lead .bt{font-size:calc(12*var(--u));padding:calc(8*var(--u)) calc(12*var(--u));border-radius:calc(4*var(--u))}

  /* strip: the template's 320 x 50 (.ad4): white, the suitcase mark, one line, the button, the stripe. No picture. */
  .strip a.ad{flex-direction:row;align-items:center;gap:calc(8*var(--u));padding:0 calc(8*var(--u)) calc(3*var(--u));background:#fff}
  .strip .dl,.strip .pic,.strip .so img,.strip .h{display:none}
  .strip .mk{display:block;height:calc(26*var(--u));width:auto;flex:none}
  .strip .st{display:block;flex:1 1 auto;min-width:0;font-size:calc(11.5*var(--u));font-weight:900;line-height:1.1}
  .strip .so{background:none;border:0;padding:0;margin:0}
  .strip .bt{font-size:calc(9*var(--u));padding:calc(5*var(--u)) calc(8*var(--u));border-radius:calc(4*var(--u))}
  .strip .stp{display:grid;position:absolute;left:0;right:0;bottom:0;height:calc(3*var(--u));grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr}
  .st{display:none}
  .stp i:nth-child(1){background:var(--dk)}.stp i:nth-child(2){background:var(--or)}.stp i:nth-child(3){background:var(--pink)}
  .stp i:nth-child(4){background:var(--peach)}.stp i:nth-child(5){background:var(--br)}.stp i:nth-child(6){background:var(--tint)}.stp i:nth-child(7){background:var(--md)}

  @media (prefers-reduced-motion:reduce){ .fr,.h b{animation:none} .fr:first-child,.h b:first-child{opacity:1} }
</style>
</head>
