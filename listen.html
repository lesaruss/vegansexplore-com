  <style>
    /* One episode on its own (Sean, 2026-11-01, on the Day 7 email: "the episode isolated by itself... the horizontal podcast episode,
       like where we have in the listings, and then they could play it from there. And then we could have the text below").
       /listen?show=<listing slug>&ep=<feed guid>: the episode row (Play, Save, vote for the show), the player above it, the notes below.
       The episode comes from the show's feed through ve-podcast, the same as a show's own page. noindex: the show page is the one to find. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; color: #1a1a1a; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
    .page-frame { width: 100%; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; max-width: none; margin: 0; padding: 40px 40px 80px; }
    @media (max-width: 700px) { main { padding: 24px 16px 64px; } }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #1f5f22; margin-bottom: 14px; }
    .eyebrow a { color: inherit; text-decoration: none; } .eyebrow a:hover { text-decoration: underline; }
    #ep .vep-row { max-width: 1100px; }
    #ep .vep-sum { display: none; }
    .vote-count { font-size: 12px; font-weight: 800; color: rgba(26,26,26,.68); text-align: center; }
    .vote-btn { display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 6px; padding: 8px 12px; min-height: 36px; cursor: pointer; background: #fff; border: 1px solid rgba(0,0,0,.25); color: #1a1a1a; }
    .notes { max-width: 860px; margin-top: 26px; }
    .notes h2 { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: rgba(26,26,26,.75); margin: 0 0 12px; }
    .notes .vep-full { font-size: 15px; }
    .more { margin-top: 26px; font-size: 14px; } .more a { color: #1f5f22; font-weight: 800; }
    .vep-dock { max-width: 1100px; margin-bottom: 12px; }
    .msg { font-size: 15px; color: rgba(26,26,26,.75); }
  </style>
</head>
