  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ve-green: #3A9B3E; --ve-green-dark: #2d7d31; --ve-green-light: #e8f5e9; --ve-green-mid: #b8ddb9;
      --ve-orange: #F69820; --ve-orange-dark: #d4800f;
      --ve-border: rgba(0,0,0,0.09); --ve-text: #1a1a1a;
      --ve-text-75: rgba(26,26,26,0.75); --ve-text-50: rgba(26,26,26,0.50); --ve-text-30: rgba(26,26,26,0.30);
    }
    html { scroll-behavior: smooth; }
    body { background: #fff; color: var(--ve-text); font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
    .page-frame { width: 100%; background: #fff; }

    /* GRID SECTION */
    .grid-section { padding: 32px 40px 80px; }
    @media (max-width: 700px) { .grid-section { padding: 20px 16px 56px; } .bottom-cta { padding: 36px 16px; } }
    .count-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .count-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ve-text-50); }
    .count-label span { color: var(--ve-text); }

    /* FILTER CHIPS */
    .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-chip { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; border-radius: 100px; border: 2px solid var(--ve-border); background: #fff; color: var(--ve-text-50); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .filter-chip:hover { border-color: var(--ve-green); color: var(--ve-green); }
    .filter-chip.active { background: var(--ve-green); border-color: var(--ve-green); color: #fff; }

    /* COMMUNITY GRID */
    .community-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

    /* FLIP CARD WRAPPER */
    .card-wrapper { perspective: 1200px; height: 420px; position: relative; }
    .flip-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
    .flip-card.is-flipped { transform: rotateY(180deg); }

    /* FRONT AND BACK SHARED */
    .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; overflow: hidden; }

    /* FRONT */
    .flip-front { background: #1a1a1a; cursor: pointer; text-decoration: none; color: inherit; }
    .flip-front img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .card-wrapper:hover .flip-front img { transform: scale(1.03); }
    .front-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.1) 100%); }
    .front-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; }
    .front-tag { font-size: 9px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .front-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ve-green); flex-shrink: 0; }
    .front-tag.partner::before { background: var(--ve-orange); }
    .front-city { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; color: #fff; line-height: 1.05; margin-bottom: 4px; }
    .front-region { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55); margin-bottom: 18px; }
    .flip-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; padding: 10px 18px; border-radius: 4px; border: none; cursor: pointer; transition: all 0.15s; }
    .flip-btn.to-back { background: rgba(255,255,255,0.15); color: #fff; backdrop-filter: blur(4px); }
    .flip-btn.to-back:hover { background: rgba(255,255,255,0.28); }
    .flip-btn.to-front { background: transparent; color: var(--ve-text-50); border: 1.5px solid var(--ve-border); font-size: 10px; padding: 8px 14px; }
    .flip-btn.to-front:hover { color: var(--ve-text); border-color: var(--ve-text-50); }
    .flip-btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

    /* PARTNER FRONT (no photo) */
    .partner-front-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%); }
    .partner-front-accent { position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(246,152,32,0.08); }
    .placeholder-front-bg { position: absolute; inset: 0; background: linear-gradient(145deg, #1e2e1f 0%, #1a1a1a 100%); }
    .placeholder-front-accent { position: absolute; top: -30px; right: -30px; width: 160px; height: 160px; border-radius: 50%; background: rgba(58,155,62,0.1); }

    /* BACK */
    .flip-back { transform: rotateY(180deg); background: #fff; border: 1.5px solid var(--ve-border); padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 0; }
    .card-wrapper.is-featured-wrapper .flip-back { border-color: var(--ve-orange); background: #fffcf7; }

    .back-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .back-tag-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-tag { font-size: 9px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; }
    .card-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .card-tag.region-tag { color: var(--ve-green-dark); }
    .card-tag.partner-tag { color: var(--ve-text-75); }
    .card-tag.partner-tag::before { background: var(--ve-orange); }
    .featured-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ve-orange-dark); background: rgba(246,152,32,0.15); padding: 3px 8px; border-radius: 100px; }
    .featured-badge::before { content: '\2605'; }

    /* STAR BUTTON */
    .star-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ve-border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ve-text-30); transition: all 0.15s; flex-shrink: 0; }
    .star-btn:hover { border-color: var(--ve-orange); color: var(--ve-orange); background: rgba(246,152,32,0.08); }
    .card-wrapper.is-featured-wrapper .star-btn { border-color: var(--ve-orange); color: var(--ve-orange); background: rgba(246,152,32,0.12); }

    .back-city { font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 2px; }
    .back-region { font-size: 11px; font-weight: 600; color: var(--ve-text-50); margin-bottom: 12px; }

    .card-divider { height: 1px; background: var(--ve-border); margin-bottom: 12px; }

    /* FEATURES */
    .card-features { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; flex: 1; }
    .card-feature { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; color: var(--ve-text-75); }
    .card-feature::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ve-green-mid); flex-shrink: 0; }
    .card-wrapper .city-card.partner .card-feature::before { background: rgba(246,152,32,0.4); }

    /* PRICING ROW */
    .price-row { display: flex; align-items: stretch; border: 1.5px solid var(--ve-border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .price-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 8px; gap: 2px; }
    .price-item.passport { background: var(--ve-green-light); }
    .price-item.standard { background: #fafafa; }
    .price-divider-v { width: 1px; background: var(--ve-border); flex-shrink: 0; }
    .price-val { font-size: 18px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .price-item.passport .price-val { color: var(--ve-green-dark); }
    .price-item.standard .price-val { color: var(--ve-text); }
    .price-label { font-size: 8px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ve-text-50); }
    .price-item.passport .price-label { color: var(--ve-green-dark); opacity: 0.7; }

    /* BACK FOOTER */
    .back-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
    .btn-join { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 20px; border-radius: 4px; text-decoration: none; background: var(--ve-green); color: #fff; transition: background 0.15s; border: none; cursor: pointer; white-space: nowrap; }
    .btn-join:hover { background: var(--ve-green-dark); }
    .coming-soon-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ve-orange-dark); background: rgba(246,152,32,0.1); padding: 8px 14px; border-radius: 4px; }

    /* FEATURED CARD FRONT INDICATOR */
    .card-wrapper.is-featured-wrapper .flip-front::after { content: '\2605 Featured'; position: absolute; top: 14px; right: 14px; font-size: 9px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; background: var(--ve-orange); padding: 5px 10px; border-radius: 100px; }

    /* BOTTOM CTA */
    .bottom-cta { border-top: 1px solid var(--ve-border); padding: 56px; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; background: #fafafa; }
    .bottom-cta-text h2 { font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 8px; }
    .bottom-cta-text p { font-size: 14px; font-weight: 400; color: var(--ve-text-75); line-height: 1.6; max-width: 440px; }
    .bottom-cta-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
    .btn-primary { background: var(--ve-orange); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 14px 28px; border-radius: 4px; text-decoration: none; transition: background 0.15s; display: inline-block; }
    .btn-primary:hover { background: var(--ve-orange-dark); }
    .btn-outline { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 13px 24px; border-radius: 4px; text-decoration: none; background: transparent; color: var(--ve-text); border: 2px solid var(--ve-border); transition: all 0.15s; }
    .btn-outline:hover { border-color: var(--ve-text); }

    /* FOOTER */
    .footer { background: #1A1A1A; padding: 36px 56px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-wordmark { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; }
    .footer-copy { font-size: 11px; color: rgba(255,255,255,0.3); }
    .footer-links { display: flex; align-items: center; gap: 20px; }
    .footer-links a { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.15s; }
    .footer-links a:hover { color: rgba(255,255,255,0.7); }

    /* FOCUS */
    :focus-visible { outline: 3px solid var(--ve-orange); outline-offset: 3px; }

    /* MOTION */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .flip-card { transition: none !important; }
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      .community-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .grid-section { padding: 36px 24px 56px; }
      .community-grid { grid-template-columns: 1fr; }
      .card-wrapper { height: 400px; }
      .bottom-cta { padding: 40px 24px; }
      .footer { padding: 28px 24px; flex-direction: column; align-items: flex-start; }
    }
  
    .footer-social { display: flex; align-items: center; gap: 16px; }
    .footer-social .social-icon { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.55); transition: color 0.15s; text-decoration: none; }
    .footer-social .social-icon:hover { color: rgba(255,255,255,0.9); }
    .footer-social .social-icon svg { display: block; }
  </style>
</head>
<body>
<div class="page-frame">
  <script src="/public/nav.js"></script>

  <!-- HERO: the shared city banner (Sean, 2026-10-26: "a similar type menu, a header, as we do with the directory,
       where you can choose the cities from the dropdown... and then it'll populate to the bottom"). -->
  <script src="/public/ve-hubs.js"></script>
  <script src="/public/ve-city-banner.js"></script>
  <section id="com-hero"><h1 class="vcb-ssr" style="margin:0;padding:28px 16px;font:900 26px Montserrat,sans-serif">Vegan Communities</h1></section>

  <!-- The communities as Directory cards (Sean, 2026-11-01): the chapter's art on the left, vote, save, and the card opens the
       chapter as its own page. /public/ve-chapters.js, the same cards as the dashboard's Communities tab. -->
  <section class="grid-section" aria-label="Communities">
    <div id="vch-list"></div>
  </section>
  <!-- ve-auth.js before the cards: without it a signed-in member reads as signed out, and Vote and Save opened the
       members-only window (Brion Hurley, 2026-11-08). -->
  <script src="/public/ve-auth.js"></script>
  <script src="/public/ve-chapters.js"></script>
  <!-- Where should we go next? beside the chapters, first on phones (Sean, 2026-11-09, playbook ve-chapter-rankings). -->
  <script src="/public/ve-next-chapters.js"></script>

  <!-- FOOTER -->
  <script src="/public/footer.js"></script>

</div><!-- /page-frame -->

<script>
  (function () {
    // An old /communities?city=<slug> link forwards to the chapter (Sean, 2026-10-27).
    var asked = new URLSearchParams(location.search).get('city');
    if (asked && VECityBanner.hubBySlug(asked)) { location.replace('/communities/' + asked); return; }
    var banner = VECityBanner.mount('com-hero', {
      key: 'communities', title: 'Vegan Communities', allTitle: 'Every City', allLabel: 'All cities', param: false, hubLink: false,
      sub: "We're building the Vegan world's home base, city by city. Vote for your cities, save the ones you call home.",
      onChange: function (slug) { if (slug) location.href = '/communities/' + slug; }
    });
    banner.el.querySelector('select').setAttribute('autocomplete', 'off');
    window.addEventListener('pageshow', function () { setTimeout(function () { banner.setQuiet(''); }, 0); });
    VEChapters.mount('vch-list');
    if (window.VENextChapters) VENextChapters.beside(document.getElementById('vch-list'));
    document.getElementById('vch-list').addEventListener('click', function () { banner.autoFold(); });
  })();
</script>

</body>
</html>
