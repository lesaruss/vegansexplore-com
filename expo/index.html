  <!-- The World Vegan Expo (Sean, 2026-11-19, playbook ve-holiday-guide: "lock it", then "build /expo"). A Guide on the locked Guide layout,
       copied from /partners/giving (CLAUDE.md: a page a business or brand reads before saying yes is a Guide on that layout). The pitch is a ladder:
       the big idea (the Expo, early 2028), then the free first step (claim your listing), then campaigns, community events, and Expo tiers last.
       Liz's lines are written for Sean to record (voice booth set ve-expo); Play shows only once a recording is live. No city, date or tier
       is shown until Sean sets them. Never anything about another expo. -->
  <style>
    /* Option C, Real things first (brief: /mocks/guide-panel2/BRIEF.md, 2026-11-18). Everything is a kit part (k-) or a thin layout
       rule around one. Order on every view: slim Guide bar with the parts in one visible row, title, one line, the Guide beside the
       title, the one orange action, then the real thing (nutrients, airports) as the hero. No how-to boxes. */
    html, body { overflow-x: hidden; }
    body { margin: 0; background: #fff; color: var(--k-ink); font-family: 'Montserrat', system-ui, sans-serif; }

    /* The slim Guide bar: the Guide's name and who it is for, then every part, visible. */
    .rf-bar { background: var(--k-pink); padding: 8px 40px 0; display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
    .rf-name { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; padding-bottom: 8px; }
    .rf-name a { font-size: 16px; font-weight: 900; letter-spacing: -.02em; color: var(--k-ink); text-decoration: none; white-space: nowrap; }
    .rf-name span { font-size: 12px; font-weight: 800; }
    .rf-tabwrap { position: relative; flex: 1 1 520px; min-width: 0; }
    .rf-bar .k-tabs { padding: 0 0 8px; gap: 6px; }
    .rf-bar .k-tabs > a { font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
    .rf-bar .k-tabs > a.on { background: var(--k-ink); color: #fff; }
    .rf-bar .k-tabs > a svg { flex: none; }
    .rf-bar .k-tabs > a.join { background: var(--k-pinkt); }
    .rf-stripe.k-stripe { margin: 0; border-radius: 0; height: 6px; }

    main { padding: 26px 40px 70px; }
    .rf-crumb { font-size: 12px; font-weight: 800; margin: 0 0 8px; color: var(--k-mute); }
    .rf-crumb a { color: var(--k-ink); }
    /* Head: title and one line on the left; the Guide on the right, the same height as the title. */
    .rf-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); grid-template-areas: "t g" "a g"; gap: 0 36px; align-items: start; }
    .rf-head .rf-t { grid-area: t; } .rf-head .rf-guide { grid-area: g; } .rf-head .rf-act { grid-area: a; }
    .rf-head .k-h1 { margin-bottom: 8px; }
    .rf-head .k-lede { margin-bottom: 14px; }
    .rf-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    .rf-price { font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--k-ink); margin: 0; max-width: 620px; }
    .rf-price b { font-weight: 900; }

    /* The Guide: a small square avatar, one short line, Play. Pink, so it reads as the Guides section. */
    .rf-guide { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-pinkt); border: 2px solid var(--k-ink); border-radius: var(--k-rc); box-shadow: 4px 4px 0 var(--k-pink); padding: 10px 12px; }
    .rf-guide .av { width: 64px; height: 64px; border: 2px solid var(--k-ink); border-radius: 10px; background: #fff center / cover no-repeat; }
    .rf-guide .who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .rf-guide q { display: block; font-size: 14px; font-weight: 800; line-height: 1.35; quotes: none; }
    .rf-guide .k-btn { padding: 9px 12px; }
    .rf-guide .k-btn svg { flex: none; }
    .rf-guide .msg { grid-column: 2 / -1; font-size: 11.5px; font-weight: 700; color: var(--k-mute); margin: -4px 0 0; display: none; }
    .rf-guide.said .msg { display: block; }

    .rf-sec { margin-top: 28px; }
    .rf-sec > .k-label { margin-bottom: 10px; }

    /* Nutrients as the hero: big tiles, number left, name middle, one tag right (the same on phones). */

    /* The rest of the Guide: rows, one tag each. */
    .rf-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px 14px; }
    .rf-parts .k-row { text-decoration: none; color: var(--k-ink); }
    .rf-parts .k-row:hover { background: var(--k-tint); }

    /* One nutrient, open in place, with the list beside it */

    /* The airports: picture left in its own shape (never cropped), code and name middle, one tag right. Same on phones. */

    .rf-foot { margin-top: 34px; display: grid; gap: 12px; }

    @media (max-width: 900px) {
      .rf-bar { padding: 6px 16px 0; gap: 0; }
      .rf-name { padding-bottom: 6px; }
      .rf-name a { font-size: 15px; }
      .rf-name span { font-size: 11px; }
      .rf-tabwrap { flex-basis: 100%; margin: 0 -16px; }
      .rf-bar .k-tabs { padding: 0 16px 8px; }
      .rf-tabwrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 8px; width: 34px; background: linear-gradient(90deg, rgba(255,158,196,0), var(--k-pink)); pointer-events: none; }
      main { padding: 16px 16px 110px; }
      .rf-head { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "g" "a"; gap: 0; }
      .rf-head .rf-guide { margin-bottom: 12px; }
      .rf-crumb { display: none; }
      .rf-guide { grid-template-columns: 40px minmax(0, 1fr) auto; box-shadow: 3px 3px 0 var(--k-pink); }
      .rf-guide .av { width: 40px !important; height: 40px !important; border-radius: 8px; }
      .rf-guide .who { font-size: 9.5px; margin-bottom: 1px; }
      .rf-guide q { font-size: 12.5px; line-height: 1.3; }
      .rf-guide .k-btn { padding: 7px 9px; }
      .rf-sec { margin-top: 20px; }
      .rf-head .k-h1 { font-size: 28px; margin-bottom: 4px; }
      .rf-head .k-lede { font-size: 14px; margin-bottom: 10px; }
      .rf-act .k-btn.k-cta { width: 100%; }
      .rf-price { font-size: 12.5px; }
      .rf-guide { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; }
      .rf-guide .av { width: 48px; height: 48px; }
      .rf-guide q { font-size: 13px; }
    }

    /* This Guide's own parts, kit only */
    .gb-cover { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .6fr); gap: 24px 36px; align-items: start; margin-top: 26px; }
    .gb-cover .k-pic { aspect-ratio: 4 / 5; max-width: 360px; justify-self: end; width: 100%; }
    .gb-good { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
    .gb-good .k-block { font-size: 14px; font-weight: 600; line-height: 1.5; }
    .gb-next { margin-top: 34px; border-top: 2px solid var(--k-ink); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
    .gb-next a { font-size: 18px; font-weight: 900; color: var(--k-ink); }
    .gb-next span { font-size: 13px; font-weight: 700; color: var(--k-mute); }
    .gb-see { margin-top: 30px; border-top: 2px solid var(--k-line); padding-top: 18px; }
    .gb-see .k-label { color: var(--k-pinkd); }
    .gb-see h2 { font-size: 20px; font-weight: 900; margin: 2px 0 4px; }
    .gb-see p { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
    .gb-now .k-block .k-big { font-size: clamp(28px, 3vw, 40px); }
    .gb-quote { font-size: 16px; font-weight: 600; line-height: 1.55; border-left: 6px solid var(--k-or); padding: 4px 0 4px 16px; margin: 18px 0 6px; max-width: 900px; }
    .gb-fine { font-size: 12.5px; font-weight: 600; color: var(--k-mute); }
    .gb-form { max-width: 900px; }
    /* The Expo as a visual journey (Sean, 2026-11-19: "we should be showing them visuals of how we picture this event, from the aerial shot
       of all the vendors, from the outdoor area to the stage... what their booth could look like"): the rows on the left, a picture walk on the
       right, one scene at a time with Back and Next. */
    .ex-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 24px 32px; align-items: start; }
    .ex-two .rf-sec { margin-top: 0; }
    .ex-walk { display: grid; gap: 10px; }
    .ex-walk .k-pic { aspect-ratio: 4 / 5; width: 100%; }
    .ex-walk .k-pic img { transition: opacity .25s; }
    .ex-cap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
    .ex-cap small { font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); }
    .ex-cap b { display: block; font-size: 18px; font-weight: 900; }
    .ex-cap p { grid-column: 1 / -1; margin: 0; font-size: 14px; font-weight: 600; line-height: 1.5; }
    .ex-nav { display: flex; gap: 6px; }
    .ex-dots { display: flex; gap: 6px; }
    .ex-dots button { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--k-ink); background: #fff; padding: 0; cursor: pointer; }
    .ex-dots button.on { background: var(--k-ink); }

        '<div class="you"><em>Thursday, January 20</em><b>Trade and media day</b>The brands meet buyers and press. The Food Village opens to everyone. At night: Opening Night and the first chef dinner, the Host City Table.</div>' +
        '<div><em>Friday, January 21</em><b>Public day one</b>Every village opens. The opening keynote. At night: the World Table, a course from each World Food Pavilion chef, then the Friday party.</div>' +
        '<div class="you"><em>Saturday, January 22</em><b>The biggest day</b>The marquee panel and the activism keynote. At night: the Vegans Explore Awards, with the Awards dinner.</div>' +
        '<div><em>Sunday, January 23</em><b>Family and community day</b>Club meetups, a documentary premiere, and a chef dinner at a partner restaurant, then the Sunday party.</div>' +
        '<div><em>Monday, January 24</em><b>Industry and impact</b>Investor showcase and deep dives, an Impact Morning out in the host city, and the closing brunch.</div></div></section>' +
        '<div class="ex-two" style="margin-top:28px"><section class="rf-sec"><span class="k-label">The Vegans Explore Awards</span><div class="k-rows">' +
        row('A', 'or', 'Nominated by the community', 'Businesses, people, causes, chefs, creators and communities.', 'Saturday') +
        row('B', 'br', 'Chosen by members and a panel', 'Each member vouches once, and a panel weighs the impact.', 'Fair') +
        row('C', 'pk', 'Every ticket includes the digital pass', 'The stages live and on demand, for people at home too.', 'Included') +
        '</div></section><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/walk-6-evening.jpg" alt="An evening crowd at a festival plaza with a band on stage"></div></div>' + DISCLAIMER + see() + next(i);
    },
    why: function (i) {
      return head(i, COUNT) + '<section class="rf-sec"><span class="k-label">From our founder</span>' +
        '<p class="gb-quote">&ldquo;Before, the reason you couldn&rsquo;t show up is because everything&rsquo;s scattered. You don&rsquo;t know where to find it. And trust me, I know: I&rsquo;m working on this multiple hours a day, and it&rsquo;s not easy to find. So my job is to create the platform, make it easy for you to find these things. And then you show up, and you support, and you share, and you become a founding member, and let us know what&rsquo;s working and what&rsquo;s not.&rdquo;</p>' +
        '<p class="gb-fine">Sean A. Russell, founder. Seven years as marketing chair of the Seed Food and Wine Festival, and ten years of Vegan events in South and Central Florida.</p></section>' +
        '<div class="ex-two" style="margin-top:18px"><section class="rf-sec" style="margin-top:0"><span class="k-label">Our part, and yours</span><div class="k-rows">' +
        row(1, 'or', 'Our part', 'The strategy, bringing people together, and the tools and the platform to find everything Vegan in your city.', 'Ours') +
        row(2, 'br', 'Your part', 'Use the tools, tell us what works, show up to the events in our listings, whoever puts them on, and share what you love.', 'Yours') +
        row(3, 'pk', 'Not money', 'You do not support this with a donation. You support it by taking an active part in your community.', 'Free') +
        row(4, 'pe', 'Tied together', 'Our success is tied to the success of your community.', 'Together') +
        '</div></section><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/walk-2-village.jpg" alt="Friends sharing food at a festival food lane"></div></div>' + see() + next(i);
    },
    road: function (i) {
      return head(i, COUNT) +
        '<section class="rf-sec"><span class="k-label">The Road to the World Vegan Expo, live</span><div class="k-blocks" id="rdMeters">' +
          '<div class="k-block k-dk"><span class="k-big" data-rd="members">&nbsp;</span><small>Members on the road</small></div>' +
          '<div class="k-block k-peach"><span class="k-big" data-rd="businesses_claimed">&nbsp;</span><small>Vegan businesses on board</small></div>' +
          '<div class="k-block k-pink"><span class="k-big" data-rd="interested">&nbsp;</span><small>People counted in for the Expo</small></div>' +
          '<div class="k-block k-tint"><span class="k-big" data-rd="clubs">&nbsp;</span><small>Clubs that call it home</small></div></div>' +
          '<p class="rd-asof" id="rdAsOf">Counted live. Commitments, never money.</p></section>' +
        '<section class="rf-sec"><span class="k-label">What unlocks the Expo</span><div class="k-steps">' +
          '<div class="you"><em>Done</em><b>The Expo is announced</b>This Guide. Everyone can see where we are going.</div>' +
          '<div><em>February 2027</em><b>Community nights</b>Our first nights in our chapters, with local clubs. <a href="/expo/events">See a night</a></div>' +
          '<div><em>Next</em><b>Host city bids open</b>Our chapter cities bid to host the Expo.</div>' +
          '<div><em>The goal</em><b>The host city is announced</b>When its chapter has 80% of its Vegan businesses on board.</div>' +
          '<div><em>Then</em><b>Tickets, booths and travel</b>Opening first to everyone already counted in.</div>' +
          '<div class="you"><em>January 20 to 24, 2028</em><b>The World Vegan Expo</b>The whole Vegan world in one place.</div></div>' + DISCLAIMER + '</section>' +
        '<section class="rf-sec"><span class="k-label">Every chapter&rsquo;s meter: Vegan businesses on board, toward 80%</span><div class="rd-ch" id="rdCh"><p class="gb-fine">Loading the chapters&hellip;</p></div></section>' + see() + next(i);
    },
    part: function (i) {
      return head(i, COUNT) + '<div class="ex-two" style="margin-top:28px"><section class="rf-sec" style="margin-top:0"><span class="k-label">Pick who you are</span><div class="rd-who" id="rdWho">' + ROLES.map(function (r, j) { return '<button type="button" data-rd-who="' + j + '" aria-pressed="' + (j === 0) + '">' + esc(r[0]) + '</button>'; }).join('') + '</div>' +
          '<div class="k-rows" id="rdPart">' + rolePart(0) + '</div></section>' +
        '<div><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/walk-3-stage.jpg" alt="A panel on the main stage of the Expo"></div>' +
        '<div class="k-block k-peach" style="margin-top:18px"><span class="k-label">Every event counts</span>Show up to the events in our listings, whoever puts them on. <a href="/events">See what is on near you</a>.</div></div></div>' + see() + next(i);
    },
    'in': function (i) {
      return head(i, '') + '<div class="ex-two" style="margin-top:28px"><div><div class="k-card" style="--k-c:#F69820"><form id="inForm" class="k-form" novalidate>' +
        '<div class="k-f wide"><span class="k-label" style="margin:0 0 6px">I am counting myself in as</span><div class="ev-pick" id="inRoles">' + WHO.map(function (r) { return '<label><input type="radio" name="role" value="' + r[0] + '"' + (r[0] === picked ? ' checked' : '') + '> ' + ROLE_NAMES[r[0]] + '</label>'; }).join('') + '</div></div>' +
        '<div class="k-f"><label for="in-name">Your name</label><input id="in-name" maxlength="120" autocomplete="name" required></div>' +
        '<div class="k-f"><label for="in-email">Your email</label><input id="in-email" type="email" maxlength="200" autocomplete="email" required></div>' +
        '<div class="k-f"><label for="in-org">Business, club or organization (if any)</label><input id="in-org" maxlength="120" autocomplete="organization"></div>' +
        '<div class="k-f"><label for="in-city">Your city</label><input id="in-city" maxlength="80"></div>' +
        '<div class="k-f wide"><label for="in-note">Anything you would like us to know (optional)</label><textarea id="in-note" maxlength="600"></textarea></div>' +
        '<div class="k-f wide"><button type="submit" class="k-btn k-cta" id="in-go">Count me in</button><p class="k-msg" id="in-msg" role="status"></p></div>' +
        '</form></div>' + DISCLAIMER + '</div>' +
        '<div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/walk-1-above.jpg" alt="The whole Expo from above: the hall of brands, the food plaza and the stage"></div></div>' +
        good([['k-tint', 'Interest, not a ticket', 'Counting yourself in is free and holds nothing. You hear first when tickets, booths and travel open.'], ['k-peach', 'Not a member yet?', 'Join free with a short survey before January 1 and you are a Founding Member. <a href="/join">Join free</a>.']]);
    }
  };
  function wireIn() {
    var f = document.getElementById('inForm'); if (!f) return;
    var $ = function (id) { return document.getElementById(id); };
    try { var m = window.VEAuth && VEAuth.getMember ? VEAuth.getMember() : null; if (m) { if (m.name && !$('in-name').value) $('in-name').value = m.name; if (m.email && !$('in-email').value) $('in-email').value = m.email; } } catch (e) {}
    f.addEventListener('change', function (e) { if (e.target.name === 'role') picked = e.target.value; });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var r = f.querySelector('input[name=role]:checked'), msg = $('in-msg'), b = $('in-go');
      var body = { action: 'expo_interest', role: r ? r.value : '', name: $('in-name').value.trim(), email: $('in-email').value.trim(), org: $('in-org').value.trim(), city: $('in-city').value.trim(), note: $('in-note').value.trim() };
      if (!body.role) { msg.textContent = 'Pick how you are counting yourself in.'; return; }
      if (!body.name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email)) { msg.textContent = 'Add your name and your email.'; return; }
      b.disabled = true; msg.textContent = 'Sending...';
      var tok = ''; try { tok = (window.VEAuth && VEAuth.getToken && VEAuth.getToken()) || ''; } catch (x) {}
      fetch('https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-giving', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, tok ? { Authorization: 'Bearer ' + tok } : {}), body: JSON.stringify(body) })
        .then(function (x) { return x.json(); }).then(function (x) {
          if (x && x.ok) { msg.textContent = x.already ? 'You are already counted in. Thank you.' : 'You are counted in. Thank you. We will keep you posted on every step.'; f.querySelectorAll('input,textarea').forEach(function (el) { el.disabled = true; }); return; }
          b.disabled = false; msg.textContent = 'That did not go through. Try again in a moment.';
        }).catch(function () { b.disabled = false; msg.textContent = 'That did not go through. Try again in a moment.'; });
    });
  }
  document.addEventListener('click', function (e) { var a = e.target.closest('[data-role]'); if (a) picked = a.getAttribute('data-role'); });

  var audio = null, playing = null;
  function stop() { if (audio) audio.pause(); if (playing) playing.innerHTML = PLAY + '<span>Play</span>'; playing = null; }
  function render() {
    stop();
    var i = cur(), p = PARTS[i];
    bar(i);
    main.innerHTML = VIEWS[p[0]](i);
    document.title = (i ? p[1] + ' | ' : '') + 'The World Vegan Expo Guide — Vegans Explore';
    var g = main.querySelector('.rf-guide'), b = g && g.querySelector('[data-play]');
    if (b) {
      // Play shows only when the recording is there; nothing plays until pressed.
      b.style.display = 'none';
      fetch(g.getAttribute('data-audio'), { method: 'HEAD' }).then(function (r) { if (r.ok) b.style.display = ''; }).catch(function () {});
      b.addEventListener('click', function () {
        if (playing === b) { stop(); return; }
        stop(); audio = new Audio(g.getAttribute('data-audio')); audio.addEventListener('ended', stop);
        audio.play(); b.innerHTML = PAUSE + '<span>Pause</span>'; playing = b;
      });
    }
    if (p[0] === 'expo') wireWalk();
    if (p[0] === 'road') loadRoad();
    if (p[0] === 'in') wireIn();
    if (p[0] === 'room') fetch('https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-giving', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"action":"status"}' })
      .then(function (r) { return r.json(); }).then(function (r) { var e = document.getElementById('gbMembers'); if (e && r && r.entries > 0) e.textContent = Number(r.entries).toLocaleString('en-US'); else if (e) e.parentNode.hidden = true; })
      .catch(function () { var e = document.getElementById('gbMembers'); if (e) e.parentNode.hidden = true; });
    if (window.scrollY > 120) window.scrollTo(0, 0);
  }
  addEventListener('hashchange', render);
  render();
})();
</script>
<script src="/public/footer.js"></script>
</body>
