  <!-- Sponsor a community night (Sean, 2026-11-19: "build the community event sponsor page"; playbook ve-holiday-guide). Step 4 of the road on
       /expo: "Here's what it looks like to sponsor one. Here's what it looks like to sponsor all of them... they can see what the flow is going
       to be like, what the start of it is, what the middle of it is... how their brand is going to be integrated into it." Copied from /expo
       (the locked Guide layout). LOCKED by Sean 2026-11-19 ("lock it"). No prices or dates until set. -->
  <style>
    /* Option C, Real things first (brief: /mocks/guide-panel2/BRIEF.md, 2026-11-18). Everything is a kit part (k-) or a thin layout
       rule around one. Order on every view: slim Guide bar with the parts in one visible row, title, one line, the Guide beside the
       title, the one orange action, then the real thing (nutrients, airports) as the hero. No how-to boxes. */
    html, body { overflow-x: hidden; }
    body { margin: 0; background: #fff; color: var(--k-ink); font-family: 'Montserrat', system-ui, sans-serif; }

    /* The slim Guide bar: the Guide's name and who it is for, then every part, visible. */
    .rf-bar { background: var(--k-pink); padding: 8px 40px 0; display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
    .rf-name { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; padding-bottom: 8px; }
    .rf-name a { font-size: 16px; font-weight: 900; letter-spacing: -.02em; color: var(--k-ink); text-decoration: none; white-space: nowrap; }
    .rf-name span { font-size: 12px; font-weight: 800; }
    .rf-tabwrap { position: relative; flex: 1 1 520px; min-width: 0; }
    .rf-bar .k-tabs { padding: 0 0 8px; gap: 6px; }
    .rf-bar .k-tabs > a { font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
    .rf-bar .k-tabs > a.on { background: var(--k-ink); color: #fff; }
    .rf-bar .k-tabs > a svg { flex: none; }
    .rf-bar .k-tabs > a.join { background: var(--k-pinkt); }
    .rf-stripe.k-stripe { margin: 0; border-radius: 0; height: 6px; }

    main { padding: 26px 40px 70px; }
    .rf-crumb { font-size: 12px; font-weight: 800; margin: 0 0 8px; color: var(--k-mute); }
    .rf-crumb a { color: var(--k-ink); }
    /* Head: title and one line on the left; the Guide on the right, the same height as the title. */
    .rf-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); grid-template-areas: "t g" "a g"; gap: 0 36px; align-items: start; }
    .rf-head .rf-t { grid-area: t; } .rf-head .rf-guide { grid-area: g; } .rf-head .rf-act { grid-area: a; }
    .rf-head .k-h1 { margin-bottom: 8px; }
    .rf-head .k-lede { margin-bottom: 14px; }
    .rf-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    .rf-price { font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--k-ink); margin: 0; max-width: 620px; }
    .rf-price b { font-weight: 900; }

    /* The Guide: a small square avatar, one short line, Play. Pink, so it reads as the Guides section. */
    .rf-guide { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-pinkt); border: 2px solid var(--k-ink); border-radius: var(--k-rc); box-shadow: 4px 4px 0 var(--k-pink); padding: 10px 12px; }
    .rf-guide .av { width: 64px; height: 64px; border: 2px solid var(--k-ink); border-radius: 10px; background: #fff center / cover no-repeat; }
    .rf-guide .who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .rf-guide q { display: block; font-size: 14px; font-weight: 800; line-height: 1.35; quotes: none; }
    .rf-guide .k-btn { padding: 9px 12px; }
    .rf-guide .k-btn svg { flex: none; }
    .rf-guide .msg { grid-column: 2 / -1; font-size: 11.5px; font-weight: 700; color: var(--k-mute); margin: -4px 0 0; display: none; }
    .rf-guide.said .msg { display: block; }

    .rf-sec { margin-top: 28px; }
    .rf-sec > .k-label { margin-bottom: 10px; }

    /* Nutrients as the hero: big tiles, number left, name middle, one tag right (the same on phones). */

    /* The rest of the Guide: rows, one tag each. */
    .rf-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px 14px; }
    .rf-parts .k-row { text-decoration: none; color: var(--k-ink); }
    .rf-parts .k-row:hover { background: var(--k-tint); }

    /* One nutrient, open in place, with the list beside it */

    /* The airports: picture left in its own shape (never cropped), code and name middle, one tag right. Same on phones. */

    .rf-foot { margin-top: 34px; display: grid; gap: 12px; }

    @media (max-width: 900px) {
      .rf-bar { padding: 6px 16px 0; gap: 0; }
      .rf-name { padding-bottom: 6px; }
      .rf-name a { font-size: 15px; }
      .rf-name span { font-size: 11px; }
      .rf-tabwrap { flex-basis: 100%; margin: 0 -16px; }
      .rf-bar .k-tabs { padding: 0 16px 8px; }
      .rf-tabwrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 8px; width: 34px; background: linear-gradient(90deg, rgba(255,158,196,0), var(--k-pink)); pointer-events: none; }
      main { padding: 16px 16px 110px; }
      .rf-head { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "g" "a"; gap: 0; }
      .rf-head .rf-guide { margin-bottom: 12px; }
      .rf-crumb { display: none; }
      .rf-guide { grid-template-columns: 40px minmax(0, 1fr) auto; box-shadow: 3px 3px 0 var(--k-pink); }
      .rf-guide .av { width: 40px !important; height: 40px !important; border-radius: 8px; }
      .rf-guide .who { font-size: 9.5px; margin-bottom: 1px; }
      .rf-guide q { font-size: 12.5px; line-height: 1.3; }
      .rf-guide .k-btn { padding: 7px 9px; }
      .rf-sec { margin-top: 20px; }
      .rf-head .k-h1 { font-size: 28px; margin-bottom: 4px; }
      .rf-head .k-lede { font-size: 14px; margin-bottom: 10px; }
      .rf-act .k-btn.k-cta { width: 100%; }
      .rf-price { font-size: 12.5px; }
      .rf-guide { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; }
      .rf-guide .av { width: 48px; height: 48px; }
      .rf-guide q { font-size: 13px; }
    }

    /* This Guide's own parts, kit only */
    .gb-cover { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .6fr); gap: 24px 36px; align-items: start; margin-top: 26px; }
    .gb-cover .k-pic { aspect-ratio: 4 / 5; max-width: 360px; justify-self: end; width: 100%; }
    .gb-good { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
    .gb-good .k-block { font-size: 14px; font-weight: 600; line-height: 1.5; }
    .gb-next { margin-top: 34px; border-top: 2px solid var(--k-ink); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
    .gb-next a { font-size: 18px; font-weight: 900; color: var(--k-ink); }
    .gb-next span { font-size: 13px; font-weight: 700; color: var(--k-mute); }
    .gb-see { margin-top: 30px; border-top: 2px solid var(--k-line); padding-top: 18px; }
    .gb-see .k-label { color: var(--k-pinkd); }
    .gb-see h2 { font-size: 20px; font-weight: 900; margin: 2px 0 4px; }
    .gb-see p { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
    .gb-now .k-block .k-big { font-size: clamp(28px, 3vw, 40px); }
    .gb-quote { font-size: 16px; font-weight: 600; line-height: 1.55; border-left: 6px solid var(--k-or); padding: 4px 0 4px 16px; margin: 18px 0 6px; max-width: 900px; }
    .gb-fine { font-size: 12.5px; font-weight: 600; color: var(--k-mute); }
    .gb-form { max-width: 900px; }
    .rf-head .rf-act:empty { display: none; }
    /* The night (Sean, 2026-11-19: "maybe it's just one image, and then these three items stacked... in a column"): one picture, the
       three parts stacked beside it. One or all: the two ways and Good to know side by side. Tell us: the form with a tall picture beside it. */
    .ev-night { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px 32px; align-items: start; }
    .ev-night .k-pic { aspect-ratio: 4 / 5; width: 100%; }
    .ev-steps { display: grid; gap: 14px; }
    .ev-step { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; align-items: start; border-bottom: 2px solid var(--k-line); padding-bottom: 14px; }
    .ev-step:last-child { border-bottom: 0; }
    .ev-step .k-num { grid-row: 1 / 3; }
    .ev-step h3 { font-size: 19px; font-weight: 900; margin: 6px 0 0; letter-spacing: -.01em; }
    .ev-step p { font-size: 14px; font-weight: 600; line-height: 1.5; margin: 0; grid-column: 2; }
    .ev-you { grid-column: 3; grid-row: 1 / 3; border: 2px solid var(--k-ink); border-radius: var(--k-rc); background: var(--k-tint); padding: 10px 12px; font-size: 13.5px; font-weight: 700; line-height: 1.45; }
    .ev-you b { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .ev-two { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px 28px; align-items: start; }
    .ev-two .gb-good { grid-template-columns: minmax(0, 1fr); }
    .ev-two .rf-sec { margin-top: 0; }
    .ev-ask { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 24px 32px; align-items: start; }
    .ev-ask .k-pic { aspect-ratio: 9 / 16; width: 100%; }
    .ev-ask .gb-good { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1100px) { .ev-ask .gb-good { grid-template-columns: minmax(0, 1fr); } }
    .ev-pick { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .ev-pick label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0; text-transform: none; white-space: nowrap; }
    @media (max-width: 900px) {
      .ev-night, .ev-two, .ev-ask { grid-template-columns: minmax(0, 1fr); }
      .ev-night .k-pic { max-width: 320px; }
      .ev-ask .k-pic { display: none; }
      .ev-step { grid-template-columns: 44px minmax(0, 1fr); }
      .ev-you { grid-column: 2; grid-row: auto; }
    }
    @media (max-width: 900px) { .gb-cover { grid-template-columns: minmax(0, 1fr); } .gb-cover .k-pic { justify-self: start; max-width: 320px; } }
    /* Liz's card (Sean, 2026-11-19: "make the image of Liz a little bit bigger... keep Liz solid and then make just the text scroll... 3 rows of
       text, so that way the rectangular box is a little bit more compact"): a bigger fixed picture, her line in a 3-line box that scrolls. A small
       exception to "nothing scrolls inside itself", at Sean's word; overscroll-behavior keeps the page scrolling past it. */
    .rf-guide { grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; }
    .rf-guide .av { width: 96px; height: 96px; border-radius: 12px; }
    .rf-guide q { max-height: calc(1.35em * 3); overflow-y: auto; overscroll-behavior: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--k-pink) transparent; }
    .rf-guide q::-webkit-scrollbar { width: 6px; } .rf-guide q::-webkit-scrollbar-thumb { background: var(--k-pink); border-radius: 3px; }
    /* Next part: a real button at the bottom (Sean: "a little bit more prominent button at the bottom"); outlined, the orange stays Save your day. */
    .gb-next { align-items: center; gap: 10px 16px; }
    .gb-next a.k-btn { font-size: 13px; padding: 14px 22px; text-decoration: none; }
    @media (max-width: 900px) {
      .rf-guide { grid-template-columns: 64px minmax(0, 1fr) auto; }
      .rf-guide .av { width: 64px !important; height: 64px !important; }
      .gb-next a.k-btn { width: 100%; }
    }
  </style>

<body>
<script src="/public/nav.js"></script>

<div data-k-section="guides">
  <div class="rf-bar">
    <div class="rf-name"><a id="gName" href="#/">Sponsor a Community Night</a><span id="gFor">On the road to the World Vegan Expo · Philadelphia and Los Angeles first</span></div>
    <div class="rf-tabwrap"><nav class="k-tabs" id="gTabs" aria-label="Parts of this Guide"></nav></div>
  </div>
  <div class="k-stripe rf-stripe"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<main id="main" data-k-section="guides"></main>

<script>
(function () {
  var PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
  var PAUSE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  var VB = 'https://fwbhwfxpncrsfhttimna.supabase.co/storage/v1/object/public/vegan-media/media/voices/expo-events/';
  var main = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function art() { try { if (window.VEGuideArt) return window.VEGuideArt('liz', 'square'); } catch (e) {} return '/public/brand-kit/avatars/liz-v2.jpg'; }

  // The parts, in order: [key, tab label, title (html), one line, Liz's line (for Sean to record), her file, next-part line]
  var PARTS = [
    ['start', 'Overview', 'Sponsor a <span class="k-hl o">community night</span>',
      'Our chapters bring the local Vegan community together for one evening: food, people and a reason to come back. Philadelphia and Los Angeles are first.',
      "Hi, I'm Liz. Our community nights are where the World Vegan Expo starts: one city, one evening, everyone in the room. Here's how your brand fits in.", 'liz-events-start-v1.mp3', 'The whole picture on one page'],
    ['night', 'The night', 'The night, <span class="k-hl g">start to finish</span>',
      'Three parts: the welcome, the main event and the send-off. Under each, where your brand sits.',
      "Here's the whole night. Guests arrive and taste, we gather for the main event, and everyone leaves with something to remember. Your brand is part of every step.", 'liz-events-night-v1.mp3', 'Arrive, the main event, the send-off'],
    ['choose', 'One or all', 'Sponsor <span class="k-hl p">one night, or every one</span>',
      'Start with the city that matters most to you, or be with us in every city as the series grows.',
      "Pick one city, or come with us to every one. Either way, you're with us from the start of the road to the Expo.", 'liz-events-choose-v1.mp3', 'Two ways to sponsor'],
    ['ask', 'Tell us', 'Tell us you are <span class="k-hl o">interested</span>',
      'Nothing is final until you say yes. Our team writes back with the dates, the details and the options.',
      "Tell us which night, and we'll send you the dates and the details. Nothing's final until you say yes.", 'liz-events-ask-v1.mp3', 'A short form, about a minute']
  ];
  function idx(k) { for (var i = 0; i < PARTS.length; i++) if (PARTS[i][0] === k) return i; return 0; }
  function cur() { var k = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'start'; return idx(k); }
  function link(k) { return k === 'start' ? '#/' : '#/' + k; }

  function bar(i) {
    document.getElementById('gTabs').innerHTML = PARTS.map(function (p, j) {
      return '<a href="' + link(p[0]) + '"' + (j === i ? ' class="on" aria-current="page"' : p[0] === 'ask' ? ' class="join"' : '') + '>' + esc(p[1]) + '</a>';
    }).join('');
    var t = document.querySelector('#gTabs .on'); if (t && innerWidth < 900) document.getElementById('gTabs').scrollLeft = Math.max(0, t.offsetLeft - 16);
  }
  function guide(p) {
    return '<div class="rf-guide" data-audio="' + VB + p[5] + '"><span class="av" role="img" aria-label="Liz, our Guide for businesses" style="background-image:url(\'' + art() + '\')"></span>' +
      '<div><span class="who">Liz, Explorer</span><q>' + esc(p[4]) + '</q></div>' +
      '<button type="button" class="k-btn k-sm" data-play aria-label="Play Liz">' + PLAY + '<span>Play</span></button></div>';
  }
  function head(i, action) {
    var p = PARTS[i];
    return (i ? '<div class="rf-crumb"><a href="/expo">The World Vegan Expo</a> &rsaquo; <a href="#/">Sponsor a Community Night</a> &rsaquo; ' + esc(p[1]) + '</div>' : '<div class="rf-crumb"><a href="/expo">The World Vegan Expo</a> &rsaquo; Sponsor a Community Night</div>') +
      '<div class="rf-head"><div class="rf-t"><h1 class="k-h1">' + p[2] + '</h1><p class="k-lede">' + esc(p[3]) + '</p></div>' + guide(p) +
      '<div class="rf-act">' + (action || '') + '</div></div>';
  }
  var ASK = '<a class="k-btn k-cta" href="#/ask">Tell us you are interested</a><p class="rf-price">Philadelphia, Los Angeles, or every night. Dates and details from our team.</p>';
  function row(n, cls, title, body, tag, tagCls) {
    return '<div class="k-row"><span class="k-num ' + cls + '">' + n + '</span><span class="k-row-t"><b>' + title + '</b><small>' + body + '</small></span>' + (tag ? '<span class="k-tag ' + (tagCls || 'live') + '">' + tag + '</span>' : '<span></span>') + '</div>';
  }
  function good(blocks) { return '<section class="rf-sec"><span class="k-label">Good to know</span><div class="gb-good">' + blocks.map(function (b) { return '<div class="k-block ' + b[0] + '"><span class="k-label">' + b[1] + '</span>' + b[2] + '</div>'; }).join('') + '</div></section>'; }
  function see() { return '<div class="gb-see"><span class="k-label">Ready?</span><h2>Tell us which night.</h2><p>Our team writes back with the dates, the details and the options. Nothing is final until you say yes.</p><a class="k-btn k-sm" href="#/ask">Tell us you are interested &rsaquo;</a></div>'; }
  function next(i) { var n = PARTS[i + 1]; return n ? '<div class="gb-next"><a class="k-btn" href="' + link(n[0]) + '">Next part: ' + esc(n[1]) + ' &rsaquo;</a><span>' + esc(n[6]) + '</span></div>' : ''; }

  var STEPS = [
    ['1', 'or', 'The welcome', 'Guests check in at the door, get a first taste and meet the people around them.', 'A tasting table at the door, your product in the first hands, your name at check-in.', '/public/expo/night-1-welcome.jpg', 'Liz welcoming guests at the check-in table, with a tasting table beside her'],
    ['2', 'br', 'The main event', 'Local Vegan food, a short talk from a voice the city knows, and a giveaway drawn live on stage.', 'Thanked from the stage, your prize drawn live, your logo on the screen while it happens.', '/public/expo/night-2-main.jpg', 'Liz on a small stage with a microphone, drawing a winner from a bowl beside a wrapped gift'],
    ['3', 'pk', 'The send-off', 'A photo wall, a thank-you bag on the way out, and what is coming next in the city.', 'Your logo on the photo wall in every picture people share, your item in the bag, your name in the recap.', '/public/expo/night-3-sendoff.jpg', 'Liz handing a gift bag to a guest at the door while friends take a photo at a colorful wall']
  ];
  function flow() {
    return '<div class="ev-night"><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/night-2-main.jpg" alt="Liz on a small stage at a community night, drawing a winner beside a wrapped gift"></div><div class="ev-steps">' + STEPS.map(function (s) {
      return '<div class="ev-step"><span class="k-num ' + s[1] + '">' + s[0] + '</span><h3>' + s[2] + '</h3><p>' + s[3] + '</p><div class="ev-you"><b>Your brand</b>' + s[4] + '</div></div>';
    }).join('') + '</div></div>';
  }

  var VIEWS = {
    start: function (i) {
      return head(i, ASK) +
        '<div class="gb-cover"><div>' +
          '<div class="k-blocks"><div class="k-block k-dk"><span class="k-big">2 cities first</span><small>Philadelphia and Los Angeles</small></div>' +
          '<div class="k-block k-peach"><span class="k-big">3 parts</span><small>The welcome, the main event, the send-off</small></div>' +
          '<div class="k-block k-pink"><span class="k-big">One or all</span><small>Sponsor a night, or the series</small></div></div>' +
          '<section class="rf-sec"><span class="k-label">In this Guide</span><div class="rf-parts">' + PARTS.slice(1).map(function (p, j) {
            return '<a class="k-row" href="' + link(p[0]) + '"><span class="k-num ' + ['or', 'br', 'pk', 'pe'][j % 4] + '">' + (j + 1) + '</span><span class="k-row-t"><b>' + esc(p[1]) + '</b><small>' + esc(p[6]) + '</small></span><span></span></a>';
          }).join('') + '</div></section>' +
        '</div><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/night-1-welcome.jpg" alt="Liz welcoming guests at a community night"></div></div>' + next(i);
    },
    night: function (i) {
      return head(i, ASK) + '<section class="rf-sec"><span class="k-label">One night, three parts</span>' + flow() + '</section>' +
        good([['k-tint', 'After the night', 'A recap post and a recap in the chapter\'s Daily Pulse, both naming you, and a short report with the real numbers: guests, check-ins, giveaway entries and clicks on your link.'], ['k-peach', 'Drawn for you first', 'This is how a night runs. Your night\'s plan is shown to you before anything is final.']]) + see() + next(i);
    },
    choose: function (i) {
      return head(i, ASK) + '<div class="ev-two"><section class="rf-sec"><span class="k-label">Two ways to sponsor</span><div class="k-rows">' +
        row('A', 'or', 'One night', 'The city that matters most to you, Philadelphia or Los Angeles. Your brand in all three parts of that night, and in its recap.', 'One city') +
        row('B', 'br', 'Every night', 'Every community night as the series grows, city by city, with your name on the series itself. The first to hear about the Expo partner options.', 'The series') +
        '</div></section>' + good([['k-pink', 'On the road to the Expo', 'Each night builds toward the World Vegan Expo in early 2028. Sponsors of the nights are in the room when Expo partners and booths open.'], ['k-tint', 'Dates and options', 'Set with each chapter. Our team sends them when you tell us you are interested.']]).replace('rf-sec', 'rf-sec ev-good') + '</div>' + see() + next(i);
    },
    ask: function (i) {
      return head(i, '') + '<section class="rf-sec"><div class="ev-ask"><div><div class="k-card" style="--k-c:#F69820"><form id="evAsk" class="k-form" novalidate>' +
        '<div class="k-f"><label for="e-brand">Brand</label><input id="e-brand" maxlength="120" autocomplete="organization" required></div>' +
        '<div class="k-f"><label for="e-name">Your name</label><input id="e-name" maxlength="120" autocomplete="name" required></div>' +
        '<div class="k-f wide"><label for="e-email">Your email</label><input id="e-email" type="email" maxlength="200" autocomplete="email" required></div>' +
        '<div class="k-f wide"><span class="k-label" style="margin:0 0 6px">Which night</span><div class="ev-pick">' +
          '<label><input type="radio" name="ev" value="philadelphia"> Philadelphia</label><label><input type="radio" name="ev" value="los-angeles"> Los Angeles</label><label><input type="radio" name="ev" value="all"> Every night</label></div></div>' +
        '<div class="k-f wide"><label for="e-note">Anything we should know (optional)</label><textarea id="e-note" maxlength="600" placeholder="What you would like to bring to the night: tastings, a product for the bags, a prize."></textarea></div>' +
        '<div class="k-f wide"><button type="submit" class="k-btn k-cta" id="e-go">Send</button><p class="k-msg" id="e-msg" role="status"></p></div>' +
        '</form></div>' + good([['k-tint', 'What happens next', 'Our team writes back within a business day with the dates, the details and the options. Nothing is final until you say yes.'], ['k-peach', 'Your listing', 'Every brand we work with has a page in our Directory. <a href="/claim">Claim yours</a>, free.']]) +
        '</div><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/expo/night-plan.jpg" alt="Liz with a clipboard, getting a venue ready for a community night"></div></div></section>';
    }
  };

  var audio = null, playing = null;
  function stop() { if (audio) audio.pause(); if (playing) playing.innerHTML = PLAY + '<span>Play</span>'; playing = null; }
  function render() {
    stop();
    var i = cur(), p = PARTS[i];
    bar(i);
    main.innerHTML = VIEWS[p[0]](i);
    document.title = (i ? p[1] + ' | ' : '') + 'Sponsor a Community Night — Vegans Explore';
    var g = main.querySelector('.rf-guide'), b = g && g.querySelector('[data-play]');
    if (b) {
      // Play shows only when the recording is there; nothing plays until pressed.
      b.style.display = 'none';
      fetch(g.getAttribute('data-audio'), { method: 'HEAD' }).then(function (r) { if (r.ok) b.style.display = ''; }).catch(function () {});
      b.addEventListener('click', function () {
        if (playing === b) { stop(); return; }
        stop(); audio = new Audio(g.getAttribute('data-audio')); audio.addEventListener('ended', stop);
        audio.play(); b.innerHTML = PAUSE + '<span>Pause</span>'; playing = b;
      });
    }
    if (p[0] === 'ask') wireForm();
    if (window.scrollY > 120) window.scrollTo(0, 0);
  }
  function wireForm() {
    var f = document.getElementById('evAsk'); if (!f) return;
    var $ = function (id) { return document.getElementById(id); };
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var pick = f.querySelector('input[name=ev]:checked');
      var m = $('e-msg'), b = $('e-go'), body = { action: 'event_sponsor_interest', brand: $('e-brand').value.trim(), name: $('e-name').value.trim(), email: $('e-email').value.trim(), events: pick ? pick.value : '', note: $('e-note').value.trim(), page: location.pathname + location.search };
      if (!body.brand || !body.name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email)) { m.textContent = 'Add your brand, your name and your email.'; return; }
      if (!body.events) { m.textContent = 'Pick a night, or Every night.'; return; }
      b.disabled = true; m.textContent = 'Sending...';
      fetch('https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-giving', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); }).then(function (r) {
          if (r && r.ok) { m.textContent = 'Thank you. Our team will write back within a business day with the dates and the details.'; f.querySelectorAll('input,textarea').forEach(function (x) { x.disabled = true; }); return; }
          b.disabled = false; m.textContent = r && r.error === 'too_many' ? 'We already have your note. Our team will be in touch.' : 'That did not go through. Try again in a moment.';
        }).catch(function () { b.disabled = false; m.textContent = 'That did not go through. Try again in a moment.'; });
    });
  }
  addEventListener('hashchange', render);
  render();
})();
</script>
