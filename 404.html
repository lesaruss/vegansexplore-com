  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ve-green: #3A9B3E;
      --ve-green-dark: #2d7d31;
      --ve-green-light: #e8f5e9;
      --ve-orange: #F69820;
      --ve-orange-dark: #d4800f;
      --ve-text: #1a1a1a;
      --ve-text-50: rgba(26,26,26,0.50);
    }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: var(--ve-text);
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }


    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 48px;
      text-align: center;
    }
    .inner {
      max-width: 480px;
    }
    .error-num {
      font-size: clamp(96px, 18vw, 160px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
      color: var(--ve-green-light);
      margin-bottom: -8px;
      user-select: none;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ve-green);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      width: 20px;
      height: 2px;
      background: var(--ve-green);
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--ve-text);
      margin-bottom: 16px;
      line-height: 1.05;
    }
    .body-text {
      font-size: 15px;
      font-weight: 400;
      color: var(--ve-text-50);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--ve-green);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { background: var(--ve-green-dark); }
    .btn-primary:focus-visible { outline: 3px solid var(--ve-orange); outline-offset: 3px; }
    .btn-secondary {
      background: transparent;
      color: var(--ve-text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 24px;
      border-radius: 4px;
      text-decoration: none;
      border: 1.5px solid rgba(0,0,0,0.15);
      transition: border-color 0.15s;
      display: inline-flex;
      align-items: center;
    }
    .btn-secondary:hover { border-color: rgba(0,0,0,0.4); }
    .btn-secondary:focus-visible { outline: 3px solid var(--ve-orange); outline-offset: 3px; }


    @media (max-width: 480px) {
      .main { padding: 60px 24px; }
    }
  </style>
</head>
<body>
  <script>
    // signal (Sean, 2026-11-06): nobody lands on a broken page. A missing address goes to /api/gone, which sends it to the listing or
    // Pulse article it matches, else to the Explorer intake (/passport?from=old-link), and logs it for Signal. The 404 status stays,
    // so search engines drop the dead address. Bots and a loop back here are left on this page.
    (function () {
      var p = location.pathname || '/';
      if (/^\/(api|public|_vercel)\//.test(p) || /\.(js|css|png|jpe?g|gif|webp|svg|ico|json|xml|txt|mp3|mp4|pdf|woff2?)$/i.test(p)) return;
      if (/bot|crawl|spider|slurp|preview/i.test(navigator.userAgent || '')) return;
      try { if (sessionStorage.getItem('ve_gone') === p) return; sessionStorage.setItem('ve_gone', p); } catch (e) {}
      location.replace('/api/gone?p=' + encodeURIComponent(p));
    })();
  </script>
