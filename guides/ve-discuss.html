<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vegans Explore — Discuss</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ve-green: #3A9B3E; --ve-green-dark: #2d7d31; --ve-green-light: #e8f5e9; --ve-green-mid: #c8e6c9;
      --ve-orange: #F69820; --ve-orange-dark: #d4800f;
      --ve-border: rgba(0,0,0,0.09); --ve-text: #1a1a1a;
      --ve-text-75: rgba(26,26,26,0.75); --ve-text-50: rgba(26,26,26,0.50); --ve-text-30: rgba(26,26,26,0.30);
    }
    html { scroll-behavior: smooth; }
    .page-frame { width: 100%; max-width: 1200px; margin: 0 auto; background: #fff; }
    body { background: #f5f5f5; color: var(--ve-text); font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }

    /* Discuss board */
    .discuss-outer { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
    .discuss-sticky-bar {
      position: sticky; top: 60px; z-index: 300;
      background: rgba(255,255,255,0.98);
      border-bottom: 1px solid var(--ve-border);
      padding: 16px 40px 14px;
    }
    .discuss-top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .discuss-board-title { font-size: 17px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ve-text); }
    .discuss-board-count { font-size: 11px; font-weight: 600; color: var(--ve-text-50); margin-top: 2px; }
    .discuss-search {
      flex: 1; max-width: 340px;
      border: 1px solid var(--ve-border); border-radius: 6px;
      padding: 8px 14px; font-family: 'Montserrat', sans-serif;
      font-size: 12px; font-weight: 500; color: var(--ve-text);
      background: #fff; outline: none; transition: border-color 0.15s;
    }
    .discuss-search:focus { border-color: var(--ve-green-dark); }
    .discuss-search::placeholder { color: var(--ve-text-30); }
    .discuss-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-today {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--ve-orange); color: #fff;
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 20px;
      text-decoration: none; border: none; cursor: pointer;
      transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-today:hover { background: var(--ve-orange-dark); }
    .btn-today:focus-visible { outline: 2px solid var(--ve-orange); outline-offset: 2px; }
    .btn-today svg { width: 9px; height: 9px; fill: none; stroke: #fff; stroke-width: 2.5; }
    .discuss-filter-btn {
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: #fff; border: 1px solid var(--ve-border);
      border-radius: 20px; padding: 5px 14px; cursor: pointer;
      color: var(--ve-text-50); transition: all 0.15s;
    }
    .discuss-filter-btn:hover { border-color: var(--ve-green-dark); color: var(--ve-green-dark); }
    .discuss-filter-btn.active { background: var(--ve-green-dark); border-color: var(--ve-green-dark); color: #fff; }
    .discuss-filter-btn:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }

    .discuss-list-wrap { flex: 1; padding: 24px 40px 64px; max-width: 840px; margin: 0 auto; width: 100%; }
    .discuss-list { display: flex; flex-direction: column; gap: 10px; }
    .discuss-empty { text-align: center; padding: 60px 24px; font-size: 13px; font-weight: 600; color: var(--ve-text-50); }

    /* Topic card */
    .topic-card {
      background: #fff; border: 1px solid var(--ve-border);
      border-radius: 10px; padding: 18px 20px;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
      display: flex; align-items: flex-start; gap: 16px;
      text-decoration: none; color: inherit;
    }
    .topic-card:hover:not(.tc-locked) { border-color: var(--ve-green-dark); box-shadow: 0 2px 12px rgba(45,125,49,0.1); }
    .topic-card:focus-visible { outline: 3px solid var(--ve-green-dark); outline-offset: 2px; }
    .topic-card.tc-locked { opacity: 0.55; cursor: default; pointer-events: none; }
    .tc-guide-av {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .tc-guide-av img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .tc-lock-av {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: #eee; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .tc-body { flex: 1; min-width: 0; }
    .tc-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .tc-cat {
      font-size: 9px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      background: var(--ve-green-light); color: var(--ve-green-dark);
      border-radius: 3px; padding: 2px 8px;
    }
    .tc-headline { font-size: 14px; font-weight: 800; color: var(--ve-text); line-height: 1.35; margin-bottom: 10px; }
    .tc-stats { display: flex; align-items: center; gap: 18px; }
    .tc-stat { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ve-text-50); }
    .tc-stat svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tc-time { font-size: 10px; font-weight: 600; color: var(--ve-text-30); margin-left: auto; white-space: nowrap; }
    .tc-upcoming { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ve-text-30); margin-left: auto; white-space: nowrap; }

    @media (max-width: 640px) {
      .discuss-sticky-bar { padding: 14px 16px 12px; top: 60px; }
      .discuss-list-wrap { padding: 16px 16px 48px; }
      .discuss-search { max-width: 160px; }
    }
  
/* ---- Discuss hero ---- */
.discuss-hero {
  position: relative;
  min-height: 520px;
  background-image: url('/public/pulse-ve-banner.png');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
}
.discuss-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.96) 0%, transparent 82%);
  z-index: 1;
}
.discuss-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.32) 0%, transparent 28%);
  z-index: 1;
}
.discuss-hero .hero-inner {
  position: relative;
  z-index: 2;
  padding: 88px 56px 72px;
  max-width: 600px;
}
.discuss-hero .hero-eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ve-green);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.discuss-hero .hero-eyebrow::before {
  content: '';
  width: 20px;
  height: 2px;
  background: var(--ve-green);
  flex-shrink: 0;
}
.discuss-hero h1 {
  font-size: clamp(40px, 6.5vw, 80px);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 22px;
}
.discuss-hero h1 em { color: var(--ve-green); font-style: normal; }
.discuss-hero .hero-sub {
  font-size: 16px;
  font-weight: 400;
  line-height: 1.65;
  color: rgba(255,255,255,0.62);
  max-width: 520px;
  margin-bottom: 36px;
}
.discuss-hero .hero-ctas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.discuss-hero .btn-hero-primary {
  background: var(--ve-orange);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 30px;
  border-radius: 4px;
  text-decoration: none;
  transition: background 0.15s;
  display: inline-block;
}
.discuss-hero .btn-hero-primary:hover { background: var(--ve-orange-dark); }
.discuss-hero .btn-hero-ghost {
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 26px;
  border-radius: 4px;
  text-decoration: none;
  transition: all 0.15s;
  display: inline-block;
  border: 1.5px solid rgba(255,255,255,0.22);
}
.discuss-hero .btn-hero-ghost:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
@media (max-width: 640px) {
  .discuss-hero { min-height: 400px; }
  .discuss-hero .hero-inner { padding: 64px 24px 48px; }
}
</style>
</head>
<body>

  <div class="page-frame">
  <script src="/public/nav.js"></script>

  <!-- Discuss hero -->
  <section class="discuss-hero" aria-labelledby="discuss-hero-h1">
    <div class="hero-inner">
      <p class="hero-eyebrow">Vegans Explore</p>
      <h1 id="discuss-hero-h1">The Daily<br><em>Discuss.</em></h1>
      <p class="hero-sub">A new conversation every day. Real topics, real guides, real community. Jump in and add your voice to the vegan conversation.</p>
      <div class="hero-ctas">
        <a href="#discussList" class="btn-hero-primary">Join the Discuss</a>
        <a href="/guides" class="btn-hero-ghost">Find Your Guide</a>
      </div>
    </div>
  </section>

  <div class="discuss-outer">
    <div class="discuss-sticky-bar">
      <div class="discuss-top-row">
        <div class="discuss-title-group">
          <div class="discuss-board-title">Discuss</div>
          <div class="discuss-board-count" id="discussCount">7 topics</div>
        </div>
        <input class="discuss-search" id="discussSearch" type="search" placeholder="Search topics..." aria-label="Search discussions" oninput="filterBoard()">
      </div>
      <script src="/public/discuss-bar.js"></script>
    </div>

    <div class="discuss-list-wrap">
      <div class="discuss-list" id="discussList" role="list" aria-label="Discussion topics"></div>
      <div class="discuss-empty" id="discussEmpty" style="display:none;">No topics match your search.</div>
    </div>
  </div>
  </div><!-- /.page-frame -->

<script>
  var topics = [
    {
      headline: "Vegan dating - does it matter if your partner isn't vegan?",
      categories: ["Relationships", "Community", "Lifestyle"],
      participants: 11, comments: 63, lastPost: "14m ago",
      guide: { name: "Maya", color: "#3A9B3E", img: "../public/guides/maya.png" },
      locked: false
    },
    {
      headline: '"But where do you get your protein?" - the question that never stops.',
      categories: ["Nutrition", "Fitness", "Lifestyle"],
      participants: 8, comments: 52, lastPost: "1h ago",
      guide: { name: "Theo", color: "#8B6914", img: "../public/guides/theo.png" },
      locked: false
    },
    {
      headline: "Are ultra-processed vegan foods actually good for you?",
      categories: ["Nutrition", "Food Science"],
      participants: 9, comments: 47, lastPost: "2h ago",
      guide: { name: "Maya", color: "#3A9B3E", img: "../public/guides/maya.png" },
      locked: false
    },
    {
      headline: "Going vegan when your family isn't. How do you handle the table?",
      categories: ["Relationships", "Lifestyle"],
      participants: 7, comments: 38, lastPost: "6h ago",
      guide: { name: "June", color: "#2A6B5A", img: "../public/guides/june.png" },
      locked: false
    },
    {
      headline: "Is the vegan movement becoming too exclusive?",
      categories: ["Activism", "Community"],
      participants: 0, comments: 0, lastPost: "Drops tomorrow",
      guide: null, locked: true
    },
    {
      headline: "How do you stay vegan when you're broke?",
      categories: ["Lifestyle", "Community"],
      participants: 0, comments: 0, lastPost: "Drops Mon, May 18",
      guide: null, locked: true
    },
    {
      headline: "Should vegan businesses hire non-vegans?",
      categories: ["Business", "Activism"],
      participants: 0, comments: 0, lastPost: "Drops Tue, May 19",
      guide: null, locked: true
    }
  ];

  var activeFilter = 'all';

  function setFilter(cat, btn) {
    activeFilter = cat;
    document.querySelectorAll('.discuss-filter-btn').forEach(function(b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    filterBoard();
  }

  function filterBoard() {
    var query = (document.getElementById('discussSearch').value || '').toLowerCase().trim();
    var list = document.getElementById('discussList');
    var empty = document.getElementById('discussEmpty');
    var count = document.getElementById('discussCount');

    var filtered = topics.filter(function(t) {
      var matchCat = activeFilter === 'all' || t.categories.indexOf(activeFilter) !== -1;
      var matchQ = !query || t.headline.toLowerCase().indexOf(query) !== -1
        || t.categories.some(function(c) { return c.toLowerCase().indexOf(query) !== -1; });
      return matchCat && matchQ;
    });

    list.innerHTML = '';
    if (filtered.length === 0) {
      empty.style.display = 'block';
      list.style.display = 'none';
      count.textContent = '0 topics';
      return;
    }
    empty.style.display = 'none';
    list.style.display = 'flex';
    count.textContent = filtered.length + ' topic' + (filtered.length !== 1 ? 's' : '');

    filtered.forEach(function(t) {
      var card = document.createElement(t.locked ? 'div' : 'a');
      card.className = 'topic-card' + (t.locked ? ' tc-locked' : '');
      card.setAttribute('role', 'listitem');
      if (!t.locked) {
        card.setAttribute('href', '/guides/ve-guide-chat-v1');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', t.headline);
      } else {
        card.setAttribute('tabindex', '-1');
        card.setAttribute('aria-label', t.headline + ' - upcoming');
      }

      var avHtml = t.locked
        ? '<div class="tc-lock-av" aria-hidden="true">&#128274;</div>'
        : '<div class="tc-guide-av" style="background:' + t.guide.color + ';" aria-hidden="true"><img src="' + t.guide.img + '" alt="' + t.guide.name + '"></div>';

      var catsHtml = t.categories.map(function(c) {
        return '<span class="tc-cat">' + c + '</span>';
      }).join('');

      var statsHtml = t.locked
        ? '<div class="tc-upcoming">' + t.lastPost + '</div>'
        : '<div class="tc-stat"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="5" cy="4" r="2.5"/><path d="M1 12c0-2.2 1.8-4 4-4s4 1.8 4 4"/><circle cx="10" cy="4" r="2"/><path d="M10 8c1.7 0 3 1.3 3 3"/></svg>' + t.participants + ' joined</div>'
          + '<div class="tc-stat"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2h10v8H7l-3 2V10H2z"/></svg>' + t.comments + ' replies</div>'
          + '<div class="tc-time">' + t.lastPost + '</div>';

      card.innerHTML = avHtml
        + '<div class="tc-body">'
        + '<div class="tc-cats">' + catsHtml + '</div>'
        + '<div class="tc-headline">' + t.headline + '</div>'
        + '<div class="tc-stats">' + statsHtml + '</div>'
        + '</div>';

      list.appendChild(card);
    });
  }

  filterBoard();
</script>

<script src="/public/footer.js"></script>
</body>
</html>
