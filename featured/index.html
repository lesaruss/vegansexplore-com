  <!-- The featured page (Sean, 2026-11-21: "Go ahead, build An's page"; playbook ve-podcast-studio). One page per business per episode at
       /featured/<code> (vercel.json rewrite), built from the locked mock /mocks/featured (v2, locked 2026-11-21), which is a copy of /partners/giving
       (the locked layout for a page a business reads before saying yes). Content comes from ve_featured_pages through ve_featured_get; the
       collaborator answer is saved by ve_featured_answer; views, parts opened, plays and clicks go to ve_featured_events (ve_featured_track).
       A draft page is Sean's preview: it shows a Preview tag, tracks nothing and saves no answer. Liz's lines are text-to-speech in her voice
       (Sean, 2026-11-21: "You can have Liz do it automatically"), leveled and checked word for word: vegan-media/media/voices/featured/. -->
  <style>
    /* Option C, Real things first (brief: /mocks/guide-panel2/BRIEF.md, 2026-11-18). Everything is a kit part (k-) or a thin layout
       rule around one. Order on every view: slim Guide bar with the parts in one visible row, title, one line, the Guide beside the
       title, the one orange action, then the real thing (nutrients, airports) as the hero. No how-to boxes. */
    html, body { overflow-x: hidden; }
    .fx-reel { position: relative; } .fx-reel video { display:block; width:100%; aspect-ratio: 9/16; object-fit: contain; background: #000; }
    .fx-free { margin: 14px 0 0; padding: 12px 16px; border-left: 6px solid #22C55E; background: #E8F5E9; border-radius: 6px; font-size: 15px; }
    .fx-from { margin-top: 22px; } .fx-from p { margin: 6px 0 0; }
    @media (max-width: 900px) { .gb-cover .fx-reel { order: -1; } }
    .fx-prev { position: absolute; top: 10px; right: 10px; background: #1a1a1a; color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 5px 9px; border-radius: 6px; }
    body { margin: 0; background: #fff; color: var(--k-ink); font-family: 'Montserrat', system-ui, sans-serif; }

    /* The slim Guide bar: the Guide's name and who it is for, then every part, visible. */
    .rf-bar { background: var(--k-pink); padding: 8px 40px 0; display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
    .rf-name { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; padding-bottom: 8px; }
    .rf-name a { font-size: 16px; font-weight: 900; letter-spacing: -.02em; color: var(--k-ink); text-decoration: none; white-space: nowrap; }
    .rf-name span { font-size: 12px; font-weight: 800; }
    .rf-tabwrap { position: relative; flex: 1 1 520px; min-width: 0; }
    .rf-bar .k-tabs { padding: 0 0 8px; gap: 6px; }
    .rf-bar .k-tabs > a { font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
    .rf-bar .k-tabs > a.on { background: var(--k-ink); color: #fff; }
    .rf-bar .k-tabs > a svg { flex: none; }
    .rf-bar .k-tabs > a.join { background: var(--k-pinkt); }
    .rf-stripe.k-stripe { margin: 0; border-radius: 0; height: 6px; }

    main { padding: 26px 40px 70px; }
    .rf-crumb { font-size: 12px; font-weight: 800; margin: 0 0 8px; color: var(--k-mute); }
    .rf-crumb a { color: var(--k-ink); }
    /* Head: title and one line on the left; the Guide on the right, the same height as the title. */
    .rf-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); grid-template-areas: "t g" "a g"; gap: 0 36px; align-items: start; }
    .rf-head .rf-t { grid-area: t; } .rf-head .rf-guide { grid-area: g; } .rf-head .rf-act { grid-area: a; }
    .rf-head .k-h1 { margin-bottom: 8px; }
    .rf-head .k-lede { margin-bottom: 14px; }
    .rf-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    .rf-price { font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--k-ink); margin: 0; max-width: 620px; }
    .rf-price b { font-weight: 900; }

    /* The Guide: a small square avatar, one short line, Play. Pink, so it reads as the Guides section. */
    .rf-guide { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-pinkt); border: 2px solid var(--k-ink); border-radius: var(--k-rc); box-shadow: 4px 4px 0 var(--k-pink); padding: 10px 12px; }
    .rf-guide .av { width: 64px; height: 64px; border: 2px solid var(--k-ink); border-radius: 10px; background: #fff center / cover no-repeat; }
    .rf-guide .who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .rf-guide q { display: block; font-size: 14px; font-weight: 800; line-height: 1.35; quotes: none; }
    .rf-guide .k-btn { padding: 9px 12px; }
    .rf-guide .k-btn svg { flex: none; }
    .rf-guide .msg { grid-column: 2 / -1; font-size: 11.5px; font-weight: 700; color: var(--k-mute); margin: -4px 0 0; display: none; }
    .rf-guide.said .msg { display: block; }

    .rf-sec { margin-top: 28px; }
    .rf-sec > .k-label { margin-bottom: 10px; }

    /* Nutrients as the hero: big tiles, number left, name middle, one tag right (the same on phones). */

    /* The rest of the Guide: rows, one tag each. */
    .rf-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px 14px; }
    .rf-parts .k-row { text-decoration: none; color: var(--k-ink); }
    .rf-parts .k-row:hover { background: var(--k-tint); }

    /* One nutrient, open in place, with the list beside it */

    /* The airports: picture left in its own shape (never cropped), code and name middle, one tag right. Same on phones. */

    .rf-foot { margin-top: 34px; display: grid; gap: 12px; }

    @media (max-width: 900px) {
      .rf-bar { padding: 6px 16px 0; gap: 0; }
      .rf-name { padding-bottom: 6px; }
      .rf-name a { font-size: 15px; }
      .rf-name span { font-size: 11px; }
      .rf-tabwrap { flex-basis: 100%; margin: 0 -16px; }
      .rf-bar .k-tabs { padding: 0 16px 8px; }
      .rf-tabwrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 8px; width: 34px; background: linear-gradient(90deg, rgba(255,158,196,0), var(--k-pink)); pointer-events: none; }
      main { padding: 16px 16px 110px; }
      .rf-head { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "g" "a"; gap: 0; }
      .rf-head .rf-guide { margin-bottom: 12px; }
      .rf-crumb { display: none; }
      .rf-guide { grid-template-columns: 40px minmax(0, 1fr) auto; box-shadow: 3px 3px 0 var(--k-pink); }
      .rf-guide .av { width: 40px !important; height: 40px !important; border-radius: 8px; }
      .rf-guide .who { font-size: 9.5px; margin-bottom: 1px; }
      .rf-guide q { font-size: 12.5px; line-height: 1.3; }
      .rf-guide .k-btn { padding: 7px 9px; }
      .rf-sec { margin-top: 20px; }
      .rf-head .k-h1 { font-size: 28px; margin-bottom: 4px; }
      .rf-head .k-lede { font-size: 14px; margin-bottom: 10px; }
      .rf-act .k-btn.k-cta { width: 100%; }
      .rf-price { font-size: 12.5px; }
      .rf-guide { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; }
      .rf-guide .av { width: 48px; height: 48px; }
      .rf-guide q { font-size: 13px; }
    }

    /* This Guide's own parts, kit only */
    .gb-cover { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .6fr); gap: 24px 36px; align-items: start; margin-top: 26px; }
    .gb-cover .k-pic { aspect-ratio: 4 / 5; max-width: 360px; justify-self: end; width: 100%; }
    .gb-good { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
    .gb-good .k-block { font-size: 14px; font-weight: 600; line-height: 1.5; }
    .gb-next { margin-top: 34px; border-top: 2px solid var(--k-ink); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
    .gb-next a { font-size: 18px; font-weight: 900; color: var(--k-ink); }
    .gb-next span { font-size: 13px; font-weight: 700; color: var(--k-mute); }
    .gb-see { margin-top: 30px; border-top: 2px solid var(--k-line); padding-top: 18px; }
    .gb-see .k-label { color: var(--k-pinkd); }
    .gb-see h2 { font-size: 20px; font-weight: 900; margin: 2px 0 4px; }
    .gb-see p { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
    .gb-now .k-block .k-big { font-size: clamp(28px, 3vw, 40px); }
    .gb-quote { font-size: 16px; font-weight: 600; line-height: 1.55; border-left: 6px solid var(--k-or); padding: 4px 0 4px 16px; margin: 18px 0 6px; max-width: 900px; }
    .gb-fine { font-size: 12.5px; font-weight: 600; color: var(--k-mute); }
    .gb-form { max-width: 900px; }
    .rf-head .rf-act:empty { display: none; }
    @media (max-width: 900px) { .gb-cover { grid-template-columns: minmax(0, 1fr); } .gb-cover .k-pic { justify-self: start; max-width: 320px; } }
    /* Liz's card (Sean, 2026-11-19: "make the image of Liz a little bit bigger... keep Liz solid and then make just the text scroll... 3 rows of
       text, so that way the rectangular box is a little bit more compact"): a bigger fixed picture, her line in a 3-line box that scrolls. A small

    .rf-guide { grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; }
    .rf-guide .av { width: 96px; height: 96px; border-radius: 12px; }
    .rf-guide q { max-height: calc(1.35em * 3); overflow-y: auto; overscroll-behavior: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--k-pink) transparent; }
    .rf-guide q::-webkit-scrollbar { width: 6px; } .rf-guide q::-webkit-scrollbar-thumb { background: var(--k-pink); border-radius: 3px; }
    /* Next part: a real button at the bottom (Sean: "a little bit more prominent button at the bottom"); outlined, the orange stays Save your day. */
    .gb-next { align-items: center; gap: 10px 16px; }
    .gb-next a.k-btn { font-size: 13px; padding: 14px 22px; text-decoration: none; }
    @media (max-width: 900px) {
      .rf-guide { grid-template-columns: 64px minmax(0, 1fr) auto; }
      .rf-guide .av { width: 64px !important; height: 64px !important; }
      .gb-next a.k-btn { width: 100%; }
    }
  </style>
</head>
<body>
<script src="/public/nav.js"></script>

<div data-k-section="guides">
  <div class="rf-bar">
    <div class="rf-name"><a id="gName" href="#/">Featured on the podcast</a><span id="gFor"></span></div>
    <div class="rf-tabwrap"><nav class="k-tabs" id="gTabs" aria-label="Parts of this Guide"></nav></div>
  </div>
  <div class="k-stripe rf-stripe"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<main id="main" data-k-section="guides"></main>

<script>
(function () {
  var PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
  var PAUSE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  var VB = 'https://fwbhwfxpncrsfhttimna.supabase.co/storage/v1/object/public/vegan-media/media/voices/featured/';
  var main = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function art() { try { if (window.VEGuideArt) return window.VEGuideArt('liz', 'square'); } catch (e) {} return '/public/brand-kit/avatars/liz-v2.jpg'; }

  // The page's data, by its code: /featured/<code> (or ?c=<code>).
  var SB = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var MEDIA = SB + '/storage/v1/object/public/vegan-media/';
  var CODE = ((location.pathname.match(/^\/featured\/([a-z0-9-]{4,80})\/?$/) || [])[1]) || new URLSearchParams(location.search).get('c') || '';
  function rpc(fn, body) {
    return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', keepalive: true, headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.ok ? r.json().catch(function () { return null; }) : null; });
  }
  var B = null, LIVE = false;
  var BOT = /bot|crawl|spider|preview|HeadlessChrome|facebookexternalhit|Slackbot/i.test(navigator.userAgent || '');
  function track(kind, part, meta) { if (!LIVE || BOT || !B) return; rpc('ve_featured_track', { p_code: B.code, p_kind: kind, p_part: part || null, p_meta: meta || {} }).catch(function () {}); }
  var ET = 'America/New_York';
  function longDay(iso) { return new Date(iso).toLocaleDateString('en-US', { timeZone: ET, weekday: 'long', month: 'long', day: 'numeric' }); }
  function clock(iso) { return new Date(iso).toLocaleTimeString('en-US', { timeZone: ET, hour: 'numeric', minute: '2-digit' }).replace(':00', ''); }
  function shortWhen(iso) { return new Date(iso).toLocaleDateString('en-US', { timeZone: ET, weekday: 'short' }) + ' ' + clock(iso); }

  // The parts, in order: [key, tab label, title (html), one line, Liz's line (short enough to show whole on a phone), her file, next-part line]
  // v2 (owner panel): the gift first (the reel), one plain line that nothing costs anything, a real sender, the collab spelled out, the
  // listing shown before it is claimed, and Claim asked once, at the end.
  var PARTS = [];
  function makeParts() { PARTS = [
    ['start', 'Your reel', B.name + ' was <span class="k-hl o">featured on the Vegans Explore Podcast</span>',
      'Episode ' + B.ep + ', ' + B.aired + '. We made a reel from your segment, and it goes up ' + B.post + '. Watch it first.',
      "Hi, I'm Liz. We made this page just for you.", 'liz-start-v2.mp3', 'Watch it, and when it goes up'],
    ['collab', 'Be a collaborator?', 'Want the reel on <span class="k-hl p">your Instagram</span> too?',
      'Say yes and it shows on both accounts. Say no and we still post and promote it.',
      "One question, and either answer is fine.", 'liz-collab-v2.mp3', 'One yes or no'],
    ['episode', 'Your episode', 'Hear <span class="k-hl o">your segment</span>',
      'Episode ' + B.ep + ': ' + B.epTitle + '.',
      "Here's your segment. Share it with your regulars.", 'liz-episode-v2.mp3', 'Listen and share'],
    ['listing', 'Your listing', 'Your listing is <span class="k-hl g">free, and yours if you want it</span>',
      'It stays up whether you claim it or not. Claiming it lets you keep it right.',
      "Have a look. Claim it only if you want to.", 'liz-listing-v2.mp3', 'See it, and claim it if you like']
  ]; }
  function idx(k) { for (var i = 0; i < PARTS.length; i++) if (PARTS[i][0] === k) return i; return 0; }
  function cur() { var k = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'start'; return idx(k); }
  function link(k) { return k === 'start' ? '#/' : '#/' + k; }

  function bar(i) {
    document.getElementById('gTabs').innerHTML = PARTS.map(function (p, j) {
      return '<a href="' + link(p[0]) + '"' + (j === i ? ' class="on" aria-current="page"' : '') + '>' + esc(p[1]) + '</a>';
    }).join('');
    var t = document.querySelector('#gTabs .on'); if (t && innerWidth < 900) document.getElementById('gTabs').scrollLeft = Math.max(0, t.offsetLeft - 16);
  }
  // Liz's summary of each part, written for this business and voiced for it (Sean, 2026-11-21: "Shouldn't she summarize what's on the
  // page? The whole idea of the audio is to give people a summary so they don't have to read"): ve_featured_pages.voice {part: {text, path}}.
  // The words on her card are the words in the recording; the generic greeting is only a fallback.
  function guide(p) {
    var v = (B.voice || {})[p[0]], src = v && v.path ? MEDIA + v.path : VB + p[5], line = v && v.text ? v.text : p[4];
    return '<div class="rf-guide" data-audio="' + esc(src) + '"><span class="av" role="img" aria-label="Liz, our Guide for businesses" style="background-image:url(\'' + art() + '\')"></span>' +
      '<div><span class="who">Liz, Explorer</span><q>' + esc(line) + '</q></div>' +
      '<button type="button" class="k-btn k-sm" data-play aria-label="Play Liz">' + PLAY + '<span>Play</span></button></div>';
  }
  function head(i, action) {
    var p = PARTS[i];
    return (i ? '<div class="rf-crumb"><a href="#/">' + esc(B.name) + ' on the podcast</a> &rsaquo; ' + esc(p[1]) + '</div>' : '') +
      '<div class="rf-head"><div class="rf-t"><h1 class="k-h1">' + p[2] + '</h1><p class="k-lede">' + esc(p[3]) + '</p></div>' + guide(p) +
      '<div class="rf-act">' + (action || '') + '</div></div>';
  }
  var FREE = '<p class="fx-free"><b>No cost. Nothing to buy.</b> Your listing stays up either way, and claiming it is optional.</p>';
  var FROM = '<div class="k-card fx-from" style="--k-c:#FFEBD1"><span class="k-label">From</span><p><b>Sean A. Russell</b>, founder of Vegans Explore. Questions, or want something changed? Write to <a href="mailto:hello@vegansexplore.com" data-t="mail_click">hello@vegansexplore.com</a> and a person answers.</p></div>';
  function yes() { return B.answer ? '<a class="k-btn k-cta" href="#/collab">' + (B.answer === 'yes' ? 'You said yes: see what happens next' : 'You said no thanks: change it') + '</a><p class="rf-price">It posts ' + esc(B.post) + '.</p>' : '<a class="k-btn k-cta" href="#/collab">Yes, add us as a collaborator</a><p class="rf-price">Or say no. Either way it posts ' + esc(B.post) + '.</p>'; }
  function row(n, cls, title, body, tag) {
    return '<div class="k-row"><span class="k-num ' + cls + '">' + n + '</span><span class="k-row-t"><b>' + title + '</b><small>' + body + '</small></span>' + (tag ? '<span class="k-tag live">' + tag + '</span>' : '<span></span>') + '</div>';
  }
  function good(blocks) { return '<section class="rf-sec"><span class="k-label">Good to know</span><div class="gb-good">' + blocks.map(function (b) { return '<div class="k-block ' + b[0] + '"><span class="k-label">' + b[1] + '</span>' + b[2] + '</div>'; }).join('') + '</div></section>'; }
  function next(i) { var n = PARTS[i + 1]; return n ? '<div class="gb-next"><a class="k-btn" href="' + link(n[0]) + '">Next: ' + esc(n[1]) + ' &rsaquo;</a><span>' + esc(n[6]) + '</span></div>' : ''; }
  // The real, locked reel (an-sen-saigon reel-v4, 2026-11-19). Watch only: no download, nothing for them to post.
  function reel() { return '<div class="k-pic fx-reel" style="--k-c:#2D5C27"><video src="' + MEDIA + esc(B.reel) + '#t=0.5" controls playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false" aria-label="' + esc(B.name) + '\'s reel"></video>' + (LIVE ? '' : '<span class="fx-prev">Preview</span>') + '</div>'; }

  var VIEWS = {
    start: function (i) {
      return head(i, yes()) + FREE +
        '<div class="gb-cover"><div>' +
          '<div class="k-blocks"><div class="k-block k-dk"><span class="k-big">Ep ' + B.ep + '</span><small>Aired ' + esc(B.aired) + '</small></div>' +
          '<div class="k-block k-peach"><span class="k-big">' + esc(B.postShort) + '</span><small>Your reel goes up, ' + esc(B.post) + '</small></div>' +
          '<div class="k-block k-pink"><span class="k-big">$0</span><small>Nothing here costs anything</small></div></div>' +
          '<section class="rf-sec"><span class="k-label">On this page</span><div class="rf-parts">' + PARTS.slice(1).map(function (p, j) {
            return '<a class="k-row" href="' + link(p[0]) + '"><span class="k-num ' + ['or', 'br', 'pk', 'pe'][j % 4] + '">' + (j + 1) + '</span><span class="k-row-t"><b>' + esc(p[1]) + '</b><small>' + esc(p[6]) + '</small></span><span></span></a>';
          }).join('') + '</div></section>' + FROM +
        '</div>' + reel() + '</div>' + next(i);
    },
    collab: function (i) {
      return head(i, '') + '<section class="rf-sec"><div class="k-card" style="--k-c:#FF9EC4;max-width:900px"><span class="k-label">One question</span>' +
        '<h2 style="margin:6px 0 10px">Be a collaborator on ' + esc(B.name) + '\'s reel?</h2>' +
        '<p style="margin:0 0 12px">It goes up <b>' + esc(B.post) + '</b> on @vegansexplore.</p>' +
        '<div class="k-f" style="max-width:420px;margin:0 0 14px"><label for="fxIg">Your Instagram handle</label><input id="fxIg" maxlength="40" placeholder="@yourhandle" value="' + esc(B.ig ? '@' + B.ig : '') + '"></div>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="k-btn k-cta" data-ans="yes">' + (B.answer === 'yes' ? 'Update my handle' : 'Yes, add us') + '</button><button type="button" class="k-btn" data-ans="no">No thanks</button></div>' +
        '<p class="k-msg" id="fxMsg" role="status" style="margin-top:14px">' + (B.answer === 'yes' ? 'You said yes. We will add @' + esc(B.ig) + ' when it posts and email you once it is live.' : B.answer === 'no' ? 'You said no thanks. We will still post and promote it.' : '') + '</p></div></section>' +
        '<section class="rf-sec"><span class="k-label">If you say yes</span><div class="k-rows">' +
        row(1, 'or', 'You get an invite on Instagram', 'When it posts, @vegansexplore sends a collab invite to the handle above. Open it and tap Accept.', 'Tap Accept') +
        row(2, 'br', 'It shows on both accounts', 'Same post, same likes and comments, on your profile and ours.', '') +
        row(3, 'pk', 'We email you when it is live', 'With the link, so you can share it to your story.', '') +
        row(4, 'pe', 'Change your mind any time', 'Write to hello@vegansexplore.com and we take you off as a collaborator.', '') +
        '</div></section>' + good([['k-peach', 'If you say no', 'That is fine. We still post and promote it, and nothing more is asked.']]) + next(i);
    },
    episode: function (i) {
      return head(i, '') + '<section class="rf-sec"><span class="k-label">Your segment</span><div class="k-card" style="--k-c:#FFEBD1;max-width:900px">' +
        '<p style="margin:0 0 10px"><b>Spotlight: ' + esc(B.person) + ' of ' + esc(B.name) + '</b>, from the Vegans Explore Podcast, Episode ' + B.ep + '.</p>' +
        '<audio id="fxClip" controls preload="none" src="' + MEDIA + esc(B.clip) + '" style="width:100%"></audio>' +
        '<p class="gb-fine" style="margin-top:10px">Hear the whole show on <a href="/media" data-t="media_open">Vegans Explore Media</a>.</p></div></section>' + next(i);
    },
    listing: function (i) {
      return head(i, '') + FREE + '<section class="rf-sec"><a class="k-btn" href="/directory/' + esc(B.slug) + '" data-t="listing_open">See your listing as people see it &rsaquo;</a></section>' +
        '<section class="rf-sec"><span class="k-label">If you claim it</span><div class="k-rows">' +
        row(1, 'or', 'You keep it right', 'Your hours, menu, photos and links, in your words. You approve what shows.', 'You edit') +
        row(2, 'br', 'See who finds you', 'Your dashboard shows views, saves and check-ins on your page.', 'Your numbers') +
        row(3, 'pk', 'No card, no fee', 'Claiming is free. You sign in with your email, and nothing asks you to pay.', 'Free') +
        '</div></section><section class="rf-sec"><a class="k-btn k-cta" href="/claim?listing=' + encodeURIComponent(B.slug) + '" data-t="claim_click">Claim ' + esc(B.name) + '</a><p class="rf-price">Optional. About two minutes.</p></section>' + FROM;
    }
  };

  var audio = null, playing = null;
  function stop() { if (audio) audio.pause(); if (playing) playing.innerHTML = PLAY + '<span>Play</span>'; playing = null; }
  function render() {
    stop();
    var i = cur(), p = PARTS[i];
    bar(i);
    main.innerHTML = VIEWS[p[0]](i);
    document.title = (i ? p[1] + ' | ' : '') + B.name + ' on the Vegans Explore Podcast — Vegans Explore';
    var g = main.querySelector('.rf-guide'), b = g && g.querySelector('[data-play]');
    if (b) {
      // Play shows only when the recording is there; nothing plays until pressed.
      b.style.display = 'none';
      fetch(g.getAttribute('data-audio'), { method: 'HEAD' }).then(function (r) { if (r.ok) b.style.display = ''; }).catch(function () {});
      b.addEventListener('click', function () {
        if (playing === b) { stop(); return; }
        stop(); audio = new Audio(g.getAttribute('data-audio')); audio.addEventListener('ended', stop);
        audio.play(); b.innerHTML = PAUSE + '<span>Pause</span>'; playing = b;
      });
    }
    track('part', p[0]);
    if (b) b.addEventListener('click', function () { if (playing === b) track('play_liz', p[0]); });
    var v = main.querySelector('.fx-reel video'); if (v) v.addEventListener('play', function () { track('play_reel', p[0]); }, { once: true });
    var c = document.getElementById('fxClip'); if (c) c.addEventListener('play', function () { track('play_clip', p[0]); }, { once: true });
    main.querySelectorAll('[data-t]').forEach(function (a) { a.addEventListener('click', function () { track(a.getAttribute('data-t'), p[0]); }); });
    if (p[0] === 'collab') main.querySelectorAll('[data-ans]').forEach(function (x) { x.addEventListener('click', function () {
      var ans = x.getAttribute('data-ans'), msg = document.getElementById('fxMsg'), h = (document.getElementById('fxIg').value || '').trim().replace(/^@/, '');
      if (ans === 'yes' && !/^[A-Za-z0-9._]{1,30}$/.test(h)) { msg.textContent = 'Add your Instagram handle above, so we can send the invite.'; document.getElementById('fxIg').focus(); return; }
      if (!LIVE) { msg.textContent = 'Preview: answers are saved once this page is live.'; return; }
      main.querySelectorAll('[data-ans]').forEach(function (y) { y.disabled = true; });
      msg.textContent = 'Saving…';
      rpc('ve_featured_answer', { p_code: B.code, p_answer: ans, p_handle: ans === 'yes' ? h : null }).then(function (r) {
        main.querySelectorAll('[data-ans]').forEach(function (y) { y.disabled = false; });
        if (!r || !r.ok) { msg.textContent = 'That did not save. Try again, or write to hello@vegansexplore.com.'; return; }
        B.answer = ans; if (ans === 'yes') B.ig = h;
        msg.textContent = ans === 'yes' ? 'Thank you. We will add @' + h + ' when it posts and email you once it is live.' : 'No problem. We will still post and promote it.';
      });
    }); });
    if (window.scrollY > 120) window.scrollTo(0, 0);
  }
  function missing() {
    document.getElementById('gTabs').innerHTML = '';
    main.innerHTML = '<div class="rf-head"><div class="rf-t"><h1 class="k-h1">This page is not here</h1><p class="k-lede">The link may be old. Write to <a href="mailto:hello@vegansexplore.com">hello@vegansexplore.com</a> and a person answers.</p></div></div>';
  }
  if (!CODE) { missing(); return; }
  rpc('ve_featured_get', { p_code: CODE }).then(function (d) {
    if (!d || !d.code) { missing(); return; }
    B = { code: d.code, name: d.name, person: d.person || '', slug: d.slug, ep: d.ep, epTitle: d.ep_title || '', ig: d.ig || '', answer: d.answer || '', voice: d.voice || {},
      reel: d.reel, clip: d.clip,
      aired: d.aired_on ? longDay(d.aired_on + 'T12:00:00Z') : '',
      post: d.post_at ? longDay(d.post_at) + ' at ' + clock(d.post_at) + ' Eastern' : 'soon',
      postShort: d.post_at ? shortWhen(d.post_at) : 'Soon' };
    LIVE = d.status === 'live';
    makeParts();
    document.getElementById('gName').textContent = B.name + ' on the podcast';
    document.getElementById('gFor').textContent = 'Made for ' + B.name + ' · Episode ' + B.ep + (LIVE ? '' : ' · Preview');
    addEventListener('hashchange', render);
    render();
    track('view', null, { ref: document.referrer ? 'yes' : 'no' });
  }).catch(missing);
})();
</script>
<script src="/public/footer.js"></script>
