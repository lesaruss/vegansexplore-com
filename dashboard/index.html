<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - VEGANS EXPLORE</title>
<meta name="description" content="Your Community Manager dashboard.">
<link rel="icon" href="/public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.5);}
  body{font-family:"Montserrat",sans-serif;background:#fff;color:var(--ve-text);min-height:100vh;}
  main{max-width:1400px;margin:0 auto;padding:44px 32px 80px;}
  @media (max-width:700px){ main{padding:32px 16px 60px;} }
  #dash-gate{text-align:center;padding:100px 20px;}
  #dash-gate button{margin-top:16px;background:var(--ve-green);color:#fff;border:none;padding:14px 28px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  #dash-gate p{font-size:14px;color:var(--ve-text-75);margin-bottom:8px;}
  #dash-content{display:none;}

  .dash-welcome{padding-bottom:24px;border-bottom:1px solid var(--ve-border);margin-bottom:24px;}
  .dash-eyebrow{font-size:10px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--ve-green-dark);margin-bottom:6px;}
  .dash-welcome h1{font-size:26px;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase;margin-bottom:4px;}
  .dash-welcome-sub{font-size:13px;color:var(--ve-text-50);}

  .dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
  .dash-stat{border:1.5px solid var(--ve-border);border-radius:10px;padding:16px;}
  .dash-stat-label{font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:6px;}
  .dash-stat-value{font-size:20px;font-weight:900;}
  a.dash-stat{text-decoration:none;color:var(--ve-text);display:block;transition:border-color .15s,background .15s;}
  a.dash-stat:hover{border-color:var(--ve-green);background:var(--ve-green-light);}
  @media (max-width:640px){ .dash-stats{grid-template-columns:1fr 1fr;} }

  .dash-section-title{font-size:11px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:12px;}
  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:1100px){ .dash-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .dash-grid{grid-template-columns:1fr; } }
  .dash-tile{border:1.5px solid var(--ve-border);border-radius:14px;text-decoration:none;color:var(--ve-text);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s;background:#fff;}
  .dash-tile:hover{border-color:var(--ve-green);box-shadow:0 6px 18px rgba(58,155,62,0.12);transform:translateY(-2px);}
  .dash-tile.coming{opacity:0.55;pointer-events:none;}
  .dash-thumb{aspect-ratio:8/5;width:100%;display:flex;align-items:center;justify-content:center;font-size:40px;flex-shrink:0;background-size:cover;background-position:center;}
  .dash-tile-body{padding:16px 18px;flex:1;}
  .dash-tile-title{font-size:14px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .dash-tile-desc{font-size:12.5px;color:var(--ve-text-75);line-height:1.55;}
  .dash-tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;background:#fff3e0;color:#7d4a00;white-space:nowrap;}
  .dash-tag.superadmin{background:#eef2ff;color:#3730a3;}
  .dash-tag.live{background:var(--ve-green-light);color:var(--ve-green-dark);}
  .dash-badge-count{background:var(--ve-orange);color:#fff;border-radius:100px;font-size:11px;font-weight:900;padding:2px 9px;}
</style>
</head>
<body>
<script src="/public/nav.js"></script>
<script src="/public/ve-auth.js"></script>

<main>
  <div id="dash-gate">
    <p>Checking access&hellip;</p>
  </div>

  <div id="dash-content">
    <div class="dash-welcome">
      <p class="dash-eyebrow" id="dash-eyebrow">Member</p>
      <h1 id="dash-welcome-name">Your Dashboard</h1>
      <p class="dash-welcome-sub" id="dash-welcome-sub">Loading&hellip;</p>
    </div>

    <div class="dash-stats" id="dash-stats-row" style="display:none;">
      <div class="dash-stat"><div class="dash-stat-label">Your City</div><div class="dash-stat-value" id="dash-stat-city">--</div></div>
      <a class="dash-stat" href="/dashboard/opportunities"><div class="dash-stat-label">Pending Applications</div><div class="dash-stat-value" id="dash-stat-pending" style="color:var(--ve-orange);">--</div></a>
      <div class="dash-stat"><div class="dash-stat-label">Status</div><div class="dash-stat-value" style="color:var(--ve-green-dark);">Active</div></div>
    </div>

    <p class="dash-section-title">Your Tools</p>
    <div class="dash-grid" id="dash-tile-grid">
      <a class="dash-tile" href="/dashboard/opportunities">
        <div class="dash-thumb" style="background:linear-gradient(135deg,var(--ve-orange),var(--ve-green));">&#127775;</div>
        <div class="dash-tile-body">
          <div class="dash-tile-title">Opportunities</div>
          <div class="dash-tile-desc" id="dash-opps-desc">Volunteer, become a Vegan Explorer, and more.</div>
        </div>
      </a>
    </div>
    <p style="font-size:11px;color:var(--ve-text-50);margin-top:10px;">Thumbnails are placeholders. Real illustrated artwork, in the GeekFon style, is next.</p>
  </div>
</main>

<script src="/public/footer.js"></script>

<script>
  var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var VE_CITY_NAMES = {'atlanta':'ATL Vegans','central-florida':'Central Florida Vegans','dmv':'DMV Vegans','london':'London Vegans','los-angeles':'LA Vegans','new-york':'NYC Vegans','philadelphia':'Philly Vegans','south-florida':'South Florida Vegans'};

  function showDenied() {
    document.getElementById('dash-gate').innerHTML = '<p>Sign in to view your dashboard.</p><button id="dash-signin-btn">Sign In</button>';
    var btn = document.getElementById('dash-signin-btn');
    if (btn) btn.addEventListener('click', function () { VEAuth.showAuthModal('Sign in to view your dashboard.', init); });
  }

  function addTile(html, prepend) {
    var grid = document.getElementById('dash-tile-grid');
    var tile = document.createElement('a');
    tile.className = 'dash-tile';
    tile.innerHTML = html;
    var href = tile.querySelector('[data-href]');
    if (href) { tile.href = href.getAttribute('data-href'); href.remove(); }
    if (prepend) grid.insertBefore(tile, grid.firstChild); else grid.appendChild(tile);
  }

  function addCmTiles() {
    addTile('<span data-href="/dashboard/2026-initiatives"></span><div class="dash-thumb" style="background:linear-gradient(135deg,var(--ve-orange),var(--ve-green));">&#127758;</div><div class="dash-tile-body"><div class="dash-tile-title">2026 Initiatives Portfolio</div><div class="dash-tile-desc">The 13 programs Sean laid out for the year, tailgates, supermarket campaigns, the World Vegan Expo, and more.</div></div>');
    addTile('<span data-href="/dashboard/handbook"></span><div class="dash-thumb" style="background:linear-gradient(135deg,var(--ve-green),var(--ve-green-dark));">&#128214;</div><div class="dash-tile-body"><div class="dash-tile-title">Community Manager Handbook</div><div class="dash-tile-desc">The full training handbook, straight from Sean: what the role covers, how you\'re supported and paid.</div></div>');
    var grid = document.getElementById('dash-tile-grid');
    var coming1 = document.createElement('a'); coming1.className = 'dash-tile coming'; coming1.href = '#';
    coming1.innerHTML = '<div class="dash-thumb" style="background:linear-gradient(135deg,#c7c7c7,#9a9a9a);">&#128197;</div><div class="dash-tile-body"><div class="dash-tile-title">Event Management <span class="dash-tag">Coming Soon</span></div><div class="dash-tile-desc">Post and manage events for your city\'s hub page directly from here.</div></div>';
    grid.appendChild(coming1);
    var coming2 = document.createElement('a'); coming2.className = 'dash-tile coming'; coming2.href = '#';
    coming2.innerHTML = '<div class="dash-thumb" style="background:linear-gradient(135deg,#c7c7c7,#9a9a9a);">&#128193;</div><div class="dash-tile-body"><div class="dash-tile-title">Directory Review <span class="dash-tag">Coming Soon</span></div><div class="dash-tile-desc">Approve or edit business and listing submissions for your city before they go live.</div></div>';
    grid.appendChild(coming2);
  }

  function loadPendingCount(token) {
    fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=list_opportunity_applications', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ token: token, status: 'pending', opportunity_type: 'vegan_explorer' })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var count = (d && d.items && d.items.length) || 0;
      document.getElementById('dash-stat-pending').textContent = count;
    }).catch(function () {
      document.getElementById('dash-stat-pending').textContent = '--';
    });
  }

  function showDashboard(member) {
    document.getElementById('dash-gate').style.display = 'none';
    document.getElementById('dash-content').style.display = 'block';
    var firstName = member.name ? member.name.split(' ')[0] : 'there';
    var isStaff = member.ve_role === 'community_manager' || member.is_superadmin;

    document.getElementById('dash-welcome-name').textContent = 'Welcome back, ' + firstName;
    document.getElementById('dash-eyebrow').textContent = member.is_superadmin ? 'Superadmin' : (member.ve_role === 'community_manager' ? 'Community Manager' : (member.ve_tier === 'passport' ? 'Passport Member' : 'Member'));

    if (isStaff) {
      addCmTiles();
      document.getElementById('dash-stats-row').style.display = 'grid';
      document.getElementById('dash-opps-desc').textContent = 'Review applications, manage campaigns, and more.';
      loadPendingCount(VEAuth.getToken());

      fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=my_applications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
        body: JSON.stringify({ token: VEAuth.getToken() })
      }).then(function (r) { return r.json(); }).then(function (d) {
        var apps = (d && d.applications) || [];
        var accepted = apps.filter(function (a) { return a.status === 'accepted' && a.opportunities && a.opportunities.opportunity_type === 'community_manager'; });
        var sub = document.getElementById('dash-welcome-sub');
        if (accepted.length) {
          var cityName = VE_CITY_NAMES[accepted[0].opportunities.city_slug] || accepted[0].opportunities.city_slug;
          sub.textContent = 'You manage ' + cityName + '.';
          document.getElementById('dash-stat-city').textContent = cityName;
        } else if (member.is_superadmin) {
          sub.textContent = 'Superadmin preview, no city assignment on file for this account.';
          document.getElementById('dash-stat-city').textContent = 'All Cities';
        } else {
          sub.textContent = 'Role active, city assignment record not found. Flag this to the team.';
        }
      }).catch(function () {
        document.getElementById('dash-welcome-sub').textContent = 'Could not load your city assignment right now.';
      });
    } else {
      document.getElementById('dash-welcome-sub').textContent = member.ve_tier === 'passport' ? 'Passport member.' : 'Free member.';
    }
  }

  function init() {
    var gate = document.getElementById('dash-gate');
    if (!window.VEAuth || !VEAuth.isLoggedIn()) { showDenied(); return; }
    var token = VEAuth.getToken();
    fetch(SUPABASE_URL + '/functions/v1/ve-auth?action=me', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ action: 'me', token: token })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var member = d && d.member;
      if (!member) { showDenied(); return; }
      try { localStorage.setItem('ve_member', JSON.stringify(member)); } catch (e) {}
      showDashboard(member);
    }).catch(function () {
      var cached = VEAuth.getMember();
      if (cached) { showDashboard(cached); }
      else { showDenied(); }
    });
  }

  init();
</script>
</body>
</html>
