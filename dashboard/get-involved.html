<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunities - VEGANS EXPLORE Dashboard</title>
<meta name="description" content="Open roles across every VE city. See the full role, then apply.">
<link rel="icon" href="/public/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.5);}
  body{font-family:"Montserrat",sans-serif;background:#fff;color:var(--ve-text);min-height:100vh;}
  main{max-width:860px;margin:0 auto;padding:44px 24px 80px;}
  #gi-gate{text-align:center;padding:100px 20px;}
  #gi-gate button{margin-top:16px;background:var(--ve-green);color:#fff;border:none;padding:14px 28px;border-radius:6px;font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
  #gi-gate p{font-size:14px;color:var(--ve-text-75);margin-bottom:8px;}
  #gi-content{display:none;}
  .gi-back{font-size:11px;font-weight:700;color:var(--ve-green-dark);text-decoration:none;margin-bottom:14px;display:inline-block;}
  .gi-hero{height:130px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:20px;background:linear-gradient(135deg,#3A9B3E,#2d7d31);}
  .gi-eyebrow{font-size:10px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--ve-green-dark);margin-bottom:6px;}
  h1{font-size:24px;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase;margin-bottom:6px;}
  .gi-sub{font-size:13px;color:var(--ve-text-50);margin-bottom:28px;}
  .gi-section-title{font-size:11px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--ve-text-50);margin:28px 0 12px;}
  .gi-section-title:first-child{margin-top:0;}
  .gi-role{border:1.5px solid var(--ve-border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .gi-role-head{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .gi-role-head:hover{background:var(--ve-green-light);}
  .gi-role-titlewrap{flex:1;min-width:0;}
  .gi-role-city{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:3px;}
  .gi-role-title{font-size:14px;font-weight:800;}
  .gi-role-toggle{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ve-green-dark);white-space:nowrap;flex-shrink:0;}
  .gi-role-body{padding:0 18px 18px;display:none;}
  .gi-role.open .gi-role-body{display:block;}
  .gi-role.open .gi-role-toggle{color:var(--ve-text-50);}
  .gi-role-desc{font-size:13px;color:var(--ve-text-75);line-height:1.6;margin-bottom:12px;}
  .gi-role-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .gi-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:4px 9px;border-radius:100px;background:#f2f2f2;color:var(--ve-text-75);}
  .gi-role-req-label{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:4px;}
  .gi-role-req{font-size:12.5px;color:var(--ve-text-75);line-height:1.55;margin-bottom:14px;}
  .gi-note{width:100%;border:1.5px solid var(--ve-border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12.5px;margin-bottom:10px;resize:vertical;min-height:50px;}
  .gi-apply-btn{background:var(--ve-green);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-weight:800;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;}
  .gi-apply-btn:hover{background:var(--ve-green-dark);}
  .gi-status{display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;}
  .gi-status.pending{background:#fff3e0;color:#7d4a00;}
  .gi-status.accepted{background:var(--ve-green-light);color:var(--ve-green-dark);}
  .gi-status.rejected{background:#fef2f2;color:#dc2626;}
  .gi-empty{font-size:13px;color:var(--ve-text-50);}
</style>
</head>
<body>
<script src="/public/nav.js"></script>
<script src="/public/ve-auth.js"></script>

<main>
  <div id="gi-gate"><p>Checking access&hellip;</p></div>
  <div id="gi-content">
    <a class="gi-back" href="/dashboard/opportunities">&larr; Back to Opportunities</a>
    <div class="gi-hero">&#127793;</div>
    <p class="gi-eyebrow">Open Roles</p>
    <h1>Opportunities</h1>
    <p class="gi-sub">Every open role across VE, job-posting style. Click into one to see the full role, then apply.</p>
    <div id="gi-list"><p class="gi-empty">Loading opportunities&hellip;</p></div>
  </div>
</main>

<script src="/public/ve-tour.js"></script>
<script src="/public/footer.js"></script>
<script>
  var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var TYPE_LABEL = { community_manager: 'Lead Your City', vegan_explorer: 'Vegan Explorer', volunteer: 'Volunteer' };
  var TYPE_ORDER = ['community_manager', 'vegan_explorer', 'volunteer'];
  var VE_CITY_NAMES = {'atlanta':'ATL Vegans','central-florida':'Central Florida Vegans','dmv':'DMV Vegans','london':'London Vegans','los-angeles':'LA Vegans','new-york':'NYC Vegans','philadelphia':'Philly Vegans','south-florida':'South Florida Vegans'};

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function roleCard(o, token) {
    var cityName = VE_CITY_NAMES[o.city_slug] || o.city_slug || 'All Cities';
    var metaTags = '<span class="gi-tag">' + esc(o.location || cityName) + '</span>' + (o.is_remote ? '<span class="gi-tag">Remote OK</span>' : '');
    var actionHtml;
    if (o.my_status) {
      actionHtml = '<span class="gi-status ' + esc(o.my_status) + '">' + esc(o.my_status) + '</span>';
    } else {
      actionHtml = '<textarea class="gi-note" placeholder="Say a little about why you\'re interested (optional)"></textarea>' +
        '<button class="gi-apply-btn" data-id="' + esc(o.id) + '">Apply</button>';
    }
    return '<div class="gi-role" data-oid="' + esc(o.id) + '">' +
      '<div class="gi-role-head">' +
        '<div class="gi-role-titlewrap"><div class="gi-role-city">' + esc(cityName) + '</div><div class="gi-role-title">' + esc(o.title) + '</div></div>' +
        '<div class="gi-role-toggle">View Role</div>' +
      '</div>' +
      '<div class="gi-role-body">' +
        '<div class="gi-role-desc">' + esc(o.description || '') + '</div>' +
        '<div class="gi-role-meta">' + metaTags + '</div>' +
        (o.requirements ? '<div class="gi-role-req-label">What It Takes</div><div class="gi-role-req">' + esc(o.requirements) + '</div>' : '') +
        actionHtml +
      '</div>' +
    '</div>';
  }

  function renderList(items, token) {
    var list = document.getElementById('gi-list');
    if (!items.length) { list.innerHTML = '<p class="gi-empty">No open opportunities right now. Check back soon.</p>'; return; }

    var byType = {};
    items.forEach(function (o) {
      var t = TYPE_ORDER.indexOf(o.opportunity_type) === -1 ? 'volunteer' : o.opportunity_type;
      (byType[t] = byType[t] || []).push(o);
    });

    var html = '';
    TYPE_ORDER.forEach(function (t) {
      var rows = byType[t];
      if (!rows || !rows.length) return;
      html += '<p class="gi-section-title">' + esc(TYPE_LABEL[t] || t) + '</p>';
      html += rows.map(function (o) { return roleCard(o, token); }).join('');
    });
    list.innerHTML = html || '<p class="gi-empty">No open opportunities right now. Check back soon.</p>';

    list.querySelectorAll('.gi-role-head').forEach(function (head) {
      head.addEventListener('click', function () {
        var role = head.closest('.gi-role');
        var wasOpen = role.classList.contains('open');
        list.querySelectorAll('.gi-role.open').forEach(function (r) { if (r !== role) r.classList.remove('open'); });
        role.classList.toggle('open', !wasOpen);
        head.querySelector('.gi-role-toggle').textContent = role.classList.contains('open') ? 'Hide' : 'View Role';
      });
    });

    list.querySelectorAll('.gi-apply-btn').forEach(function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var role = btn.closest('.gi-role');
        var note = role.querySelector('.gi-note').value;
        btn.disabled = true; btn.textContent = 'Applying...';
        fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=submit_opportunity_application', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ token: token, opportunity_id: btn.getAttribute('data-id'), cover_note: note })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.error) { btn.disabled = false; btn.textContent = 'Apply'; alert('Could not submit: ' + d.error); return; }
          var body = role.querySelector('.gi-role-body');
          body.innerHTML = body.innerHTML.split('<textarea')[0] + '<span class="gi-status pending">pending</span>';
        }).catch(function () { btn.disabled = false; btn.textContent = 'Apply'; alert('Could not reach the server, try again.'); });
      });
    });
  }

  function showDenied() {
    document.getElementById('gi-gate').innerHTML = '<p>Sign in to see open opportunities.</p><button id="gi-signin-btn">Sign In</button>';
    var btn = document.getElementById('gi-signin-btn');
    if (btn) btn.addEventListener('click', function () { VEAuth.showAuthModal('Sign in to see opportunities.', init); });
  }

  function init() {
    if (!window.VEAuth || !VEAuth.isLoggedIn()) { showDenied(); return; }
    var token = VEAuth.getToken();
    document.getElementById('gi-gate').style.display = 'none';
    document.getElementById('gi-content').style.display = 'block';
    fetch(SUPABASE_URL + '/functions/v1/ve-rewards?action=list_opportunities', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ token: token })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.error) { document.getElementById('gi-list').innerHTML = '<p class="gi-empty">' + esc(d.error) + '</p>'; return; }
      renderList(d.opportunities || [], token);
    }).catch(function () {
      document.getElementById('gi-list').innerHTML = '<p class="gi-empty">Could not load opportunities right now.</p>';
    });
  }

  init();
</script>
</body>
</html>
