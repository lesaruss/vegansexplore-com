<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Community Manager Certification | Vegans Explore</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-deep:#1f5f22;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.78);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    a{color:var(--ve-green-deep);}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    .wrap{max-width:1200px;margin:0 auto;padding:28px 24px 56px;}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-dark);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,34px);font-weight:900;line-height:1.1;text-transform:uppercase;letter-spacing:-0.01em;}
    .back-dash{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;}
    .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start;}
    .side{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:18px;position:sticky;top:80px;}
    .prog-label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ve-text-75);margin-bottom:6px;}
    .prog{height:8px;border-radius:99px;background:#e6ece6;overflow:hidden;margin-bottom:16px;}
    .prog i{display:block;height:100%;background:var(--ve-green);width:0;transition:width 0.3s;}
    .mods{list-style:none;display:grid;gap:4px;}
    .mod-btn{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 8px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ve-text);}
    .mod-btn:hover{background:#f2f5f2;}
    .mod-btn[aria-current="true"]{background:var(--ve-green-light);}
    .num{width:26px;height:26px;border-radius:50%;border:2px solid #c9d4c9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ve-text-75);}
    .done .num{background:var(--ve-green);border-color:var(--ve-green);color:#fff;}
    .mod-sub{display:block;font-size:11.5px;font-weight:600;color:var(--ve-text-75);}
    .main{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:32px 36px;min-height:420px;}
    .crumb{font-size:11px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:var(--ve-green-dark);margin-bottom:8px;}
    .main h2{font-size:clamp(22px,2.4vw,28px);font-weight:900;line-height:1.15;margin-bottom:16px;}
    .content{font-size:16px;color:#2a2a2a;max-width:720px;}
    .content p{margin-bottom:14px;}
    .content h3{font-size:16px;font-weight:800;margin:20px 0 8px;color:var(--ve-green-deep);}
    .content ul,.content ol{margin:0 0 14px 22px;}
    .content li{margin-bottom:6px;}
    .q{border:1px solid var(--ve-border);border-radius:12px;padding:16px 18px;margin-bottom:12px;max-width:760px;}
    .q legend{font-size:15.5px;font-weight:800;margin-bottom:10px;padding:0;}
    .q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px;}
    .q label:hover{background:#f5f8f5;}
    .q input{margin-top:4px;accent-color:var(--ve-green-dark);}
    .q.right{border-color:#8fd18f;background:#f4fbf4;}
    .q.wrong{border-color:#f1b8b1;background:#fdf5f4;}
    .q .mark{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-top:6px;}
    .q.right .mark{color:#1f5f22;} .q.wrong .mark{color:#8a1c12;}
    .result{border-radius:12px;padding:14px 16px;margin:6px 0 4px;font-weight:700;max-width:760px;}
    .result.pass{background:var(--ve-green-light);border:1px solid #b8ddb9;color:#1f5f22;}
    .result.fail{background:#fff3e0;border:1px solid #f5cf8f;color:#7d4a00;}
    .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:13px 24px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:0;background:var(--ve-green-dark);color:#fff;}
    .btn:hover{background:var(--ve-green-deep);}
    .btn[disabled]{opacity:0.5;cursor:default;}
    .btn-link{background:none;color:var(--ve-green-deep);text-decoration:underline;text-underline-offset:3px;padding:13px 6px;}
    .btn-link:hover{background:none;}
    .gate{text-align:center;padding:60px 20px;max-width:560px;margin:0 auto;}
    .gate p{color:var(--ve-text-75);margin:10px 0 18px;}
    .cert{border:3px solid var(--ve-green);border-radius:16px;padding:40px 32px;text-align:center;max-width:760px;background:linear-gradient(180deg,#fff, #f4fbf4);}
    .cert .seal{width:74px;height:74px;border-radius:50%;background:var(--ve-green);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:34px;}
    .cert h2{text-transform:uppercase;margin-bottom:6px;}
    .cert .who{font-size:24px;font-weight:900;margin:14px 0 4px;}
    .cert .meta{font-size:13px;color:var(--ve-text-75);margin-top:14px;}
    .muted{color:var(--ve-text-75);}
    @media (max-width:900px){
      .layout{grid-template-columns:minmax(0,1fr);}
      .side{position:static;}
      .main{padding:22px 18px;}
    }
    @media print{ nav, .ve-nav, .ve-footer, .side, .top, .actions{display:none !important;} .layout{display:block;} .main{border:0;} }
  </style>
</head>
<body>
  <div class="page-frame">

  <script src="/public/nav.js"></script>

  <div class="wrap">
    <div class="top">
      <div>
        <p class="eyebrow">Community Manager</p>
        <h1 id="c-title">Certification</h1>
      </div>
      <a class="back-dash" href="/dashboard">&larr; Back to dashboard</a>
    </div>

    <div id="c-gate" class="gate" hidden></div>

    <div class="layout" id="c-layout" hidden>
      <aside class="side" aria-label="Course modules">
        <div class="prog-label"><span>Progress</span><span id="c-pct">0%</span></div>
        <div class="prog" aria-hidden="true"><i id="c-bar"></i></div>
        <ul class="mods" id="c-mods"></ul>
      </aside>
      <main class="main" id="c-main" aria-live="polite"></main>
    </div>
  </div>

  <script src="/public/ve-auth.js"></script>
  <script>
    (function () {
      var API = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-learn';
      var COURSE = 've-community-manager-certification';
      var S = { outline: null, flat: [], idx: 0 };
      var $ = function (id) { return document.getElementById(id); };
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function track(n, p) { try { if (window.gtag) gtag('event', n, p || {}); } catch (e) {} }

      function call(body) {
        var t = window.VEAuth && VEAuth.getToken();
        return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t }, body: JSON.stringify(Object.assign({ course: COURSE }, body)) })
          .then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); });
      }

      function gate(html) { $('c-layout').hidden = true; var g = $('c-gate'); g.hidden = false; g.innerHTML = html; }

      function load(targetKey) {
        return call({ action: 'outline' }).then(function (d) {
          if (d._status === 401) { gate('<h2>Sign in to continue</h2><p>Your certification is in your Vegans Explore account.</p><button type="button" class="btn" id="c-signin">Sign in</button>'); $('c-signin').onclick = function () { VEAuth.showAuthModal('Sign in to continue your certification.', function () { location.reload(); }, 'login'); }; return; }
          if (d._status === 403) { gate('<h2>For Community Managers</h2><p>This certification is for Vegans Explore Community Managers. Interested in leading your city?</p><a class="btn" href="/community-managers/onboarding">See what the role involves</a>'); return; }
          if (d.error) { gate('<h2>Something went wrong</h2><p>The certification did not load. Refresh the page, or email contact@vegansexplore.com.</p>'); return; }
          S.outline = d;
          S.flat = [];
          d.modules.forEach(function (m) { m.pages.forEach(function (p) { S.flat.push({ module: m.key, page: p.key, title: p.title, type: p.type, completed: p.completed, mnum: m.number, mtitle: m.title }); }); });
          $('c-title').textContent = d.course.title;
          $('c-gate').hidden = true; $('c-layout').hidden = false;
          renderSide();
          if (d.certificate && !targetKey) { showCert(); return; }
          var i = targetKey ? S.flat.findIndex(function (f) { return f.module + '/' + f.page === targetKey; }) : S.flat.findIndex(function (f) { return !f.completed; });
          openIdx(i < 0 ? 0 : i);
        }).catch(function () { gate('<h2>Could not connect</h2><p>Check your connection and refresh the page.</p>'); });
      }

      function renderSide() {
        var d = S.outline, pct = d.total ? Math.round((d.completed / d.total) * 100) : 0;
        $('c-pct').textContent = pct + '%'; $('c-bar').style.width = pct + '%';
        var cur = S.flat[S.idx] || {};
        $('c-mods').innerHTML = d.modules.map(function (m) {
          var done = m.pages.every(function (p) { return p.completed; });
          var sub = done ? 'Complete' + (m.best_score != null ? ' · ' + m.best_score + '%' : '') : m.pages.filter(function (p) { return p.completed; }).length + ' of ' + m.pages.length + ' done';
          return '<li><button type="button" class="mod-btn' + (done ? ' done' : '') + '" data-mod="' + esc(m.key) + '" aria-current="' + (cur.module === m.key) + '"><span class="num">' + (done ? '&#10003;' : esc(m.number)) + '</span><span>' + esc(m.title) + '<span class="mod-sub">' + sub + '</span></span></button></li>';
        }).join('') + (d.certificate ? '<li><button type="button" class="mod-btn done" data-cert="1"><span class="num">&#9733;</span><span>Your certificate<span class="mod-sub">Issued</span></span></button></li>' : '');
        Array.prototype.forEach.call($('c-mods').querySelectorAll('[data-mod]'), function (b) {
          b.onclick = function () { var k = b.getAttribute('data-mod'); var i = S.flat.findIndex(function (f) { return f.module === k && !f.completed; }); if (i < 0) i = S.flat.findIndex(function (f) { return f.module === k; }); openIdx(i); };
        });
        var cb = $('c-mods').querySelector('[data-cert]'); if (cb) cb.onclick = showCert;
      }

      function openIdx(i) {
        S.idx = Math.max(0, Math.min(S.flat.length - 1, i));
        var f = S.flat[S.idx];
        renderSide();
        $('c-main').innerHTML = '<p class="muted">Loading&hellip;</p>';
        call({ action: 'page', module: f.module, page: f.page }).then(function (d) {
          if (!d.page) { $('c-main').innerHTML = '<p>This page did not load. Try again.</p>'; return; }
          track('cm_cert_page', { module: f.module, page: f.page });
          var head = '<p class="crumb">Module ' + esc(f.mnum) + ' · ' + esc(f.mtitle) + '</p><h2>' + esc(d.page.title) + '</h2>';
          if (d.page.type === 'quiz') renderQuiz(head, d.page, f);
          else renderContent(head, d.page, f);
          window.scrollTo(0, 0);
        });
      }

      function navButtons(nextLabel, nextDisabled) {
        return '<div class="actions"><button type="button" class="btn" id="c-next"' + (nextDisabled ? ' disabled' : '') + '>' + nextLabel + '</button>' +
          (S.idx > 0 ? '<button type="button" class="btn btn-link" id="c-prev">Back</button>' : '') + '</div>';
      }
      function wirePrev() { var p = $('c-prev'); if (p) p.onclick = function () { openIdx(S.idx - 1); }; }

      function afterComplete(d) {
        S.flat[S.idx].completed = true;
        if (d && d.certificate) { load().then(function () {}); return true; }
        return false;
      }

      function renderContent(head, page, f) {
        $('c-main').innerHTML = head + '<div class="content">' + (page.content || '') + '</div>' + navButtons('Next');
        wirePrev();
        $('c-next').onclick = function () {
          var btn = this; btn.disabled = true;
          call({ action: 'complete', module: f.module, page: f.page }).then(function (d) {
            if (afterComplete(d)) return;
            refreshOutline().then(function () { openIdx(S.idx + 1); }).catch(function () {});
          });
        };
      }

      function renderQuiz(head, page, f) {
        var qs = page.questions || [];
        $('c-main').innerHTML = head + '<p class="muted" style="margin-bottom:16px;">Answer every question. You need ' + (page.pass_mark || 80) + '% to pass, and you can retry as many times as you need.</p>' +
          '<form id="c-quiz">' + qs.map(function (q, i) {
            return '<fieldset class="q" data-q="' + i + '"><legend>' + (i + 1) + '. ' + esc(q.question) + '</legend>' + q.options.map(function (o, j) {
              return '<label><input type="radio" name="q' + i + '" value="' + j + '"> <span>' + esc(o) + '</span></label>';
            }).join('') + '<p class="mark" hidden></p></fieldset>';
          }).join('') + '<div id="c-result"></div>' +
          '<div class="actions"><button type="submit" class="btn" id="c-submit">Submit answers</button>' + (S.idx > 0 ? '<button type="button" class="btn btn-link" id="c-prev">Back</button>' : '') + '</div></form>';
        wirePrev();
        $('c-quiz').onsubmit = function (e) {
          e.preventDefault();
          var answers = qs.map(function (_, i) { var c = document.querySelector('input[name="q' + i + '"]:checked'); return c ? Number(c.value) : null; });
          if (answers.some(function (a) { return a === null; })) { $('c-result').innerHTML = '<p class="result fail">Answer every question before submitting.</p>'; return; }
          $('c-submit').disabled = true;
          call({ action: 'quiz', module: f.module, page: f.page, answers: answers }).then(function (d) {
            track('cm_cert_quiz', { module: f.module, score: d.score, passed: d.passed });
            (d.results || []).forEach(function (ok, i) {
              var fs = document.querySelector('.q[data-q="' + i + '"]'); fs.classList.remove('right', 'wrong'); fs.classList.add(ok ? 'right' : 'wrong');
              var m = fs.querySelector('.mark'); m.hidden = false; m.textContent = ok ? 'Correct' : 'Not quite. Review the module and try again.';
            });
            if (d.passed) {
              $('c-result').innerHTML = '<p class="result pass">You scored ' + d.score + '%. Module passed.</p>';
              var acts = document.querySelector('#c-quiz .actions');
              acts.innerHTML = '<button type="button" class="btn" id="c-next">' + (S.idx < S.flat.length - 1 ? 'Next module' : 'See my certificate') + '</button>';
              $('c-next').onclick = function () { if (afterComplete(d)) return; refreshOutline().then(function () { openIdx(S.idx + 1); }).catch(function () {}); };
              if (d.certificate) { S.outline.certificate = d.certificate; }
            } else {
              $('c-result').innerHTML = '<p class="result fail">You scored ' + d.score + '%. You need ' + d.pass_mark + '% to pass. Review the questions marked above and try again.</p>';
              $('c-submit').disabled = false; $('c-submit').textContent = 'Try again';
            }
          });
        };
      }

      function refreshOutline() {
        return call({ action: 'outline' }).then(function (d) {
          if (d && d.modules) {
            S.outline = d;
            var keep = S.flat[S.idx];
            S.flat = [];
            d.modules.forEach(function (m) { m.pages.forEach(function (p) { S.flat.push({ module: m.key, page: p.key, title: p.title, type: p.type, completed: p.completed, mnum: m.number, mtitle: m.title }); }); });
            S.idx = Math.max(0, S.flat.findIndex(function (f) { return keep && f.module === keep.module && f.page === keep.page; }));
            if (d.certificate) { renderSide(); showCert(); return Promise.reject('certified'); }
            renderSide();
          }
        });
      }

      function showCert() {
        var d = S.outline, c = d.certificate;
        renderSide();
        Array.prototype.forEach.call($('c-mods').querySelectorAll('.mod-btn'), function (b) { b.setAttribute('aria-current', b.hasAttribute('data-cert') ? 'true' : 'false'); });
        var date = new Date(c.issued_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        track('cm_cert_certificate_view', {});
        $('c-main').innerHTML = '<div class="cert"><div class="seal" aria-hidden="true">&#10003;</div><p class="crumb">Vegans Explore</p><h2>Certified Community Manager</h2>' +
          '<p class="muted">This certifies that</p><p class="who">' + esc(d.member.name || d.member.email) + '</p>' +
          '<p class="muted">completed every module of the Vegans Explore Community Manager Certification and passed each assessment at 80% or above.</p>' +
          '<p class="meta">Issued ' + esc(date) + ' · Certificate ' + esc(String(c.id).slice(0, 8).toUpperCase()) + '</p></div>' +
          '<div class="actions"><button type="button" class="btn" onclick="window.print()">Print or save</button><a class="btn btn-link" href="/dashboard">Back to dashboard</a><button type="button" class="btn btn-link" id="c-review">Review the modules</button></div>';
        $('c-review').onclick = function () { openIdx(0); };
      }

      function start() {
        if (!window.VEAuth) { gate('<p>Loading&hellip;</p>'); return setTimeout(start, 200); }
        if (!VEAuth.isLoggedIn()) {
          gate('<h2>Sign in to continue</h2><p>Your certification is in your Vegans Explore account.</p><button type="button" class="btn" id="c-signin">Sign in</button>');
          $('c-signin').onclick = function () { VEAuth.showAuthModal('Sign in to continue your certification.', function () { location.reload(); }, 'login'); };
          return;
        }
        load();
      }
      start();
    })();
  </script>

  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
