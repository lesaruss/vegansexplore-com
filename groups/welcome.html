  <!-- The Group Partner Guide, rebuilt on the locked Guide layout (Sean, 2026-11-19: "rebuild the group guide"; it was on the old layout and
       still sold "Up to 50% of every Passport" though membership is free). Copied from /expo/events (a page a group reads before saying yes).
       Everything the old guide did is kept: the live groups and their events, the sample-club demo with its full-screen view, what you get,
       the numbers (tickets 5%, the share ladder with commissions paused from Nov 7, 2026), questions, the five-step application to ve-group
       'apply', Request a meeting (ve-group 'meet'), invite codes (?c=). New: a sponsored club night and the organizer paid $150 as a Community
       Manager (canon-ve-community-managers v2 to v4). Dani is the Guide; her lines wait for Sean to record (Play shows once a file is there).
       The old page is kept at scratchpad only; its content inventory is in the playbook. -->
  <style>
    /* Option C, Real things first (brief: /mocks/guide-panel2/BRIEF.md, 2026-11-18). Everything is a kit part (k-) or a thin layout
       rule around one. Order on every view: slim Guide bar with the parts in one visible row, title, one line, the Guide beside the
       title, the one orange action, then the real thing (nutrients, airports) as the hero. No how-to boxes. */
    html, body { overflow-x: hidden; }
    body { margin: 0; background: #fff; color: var(--k-ink); font-family: 'Montserrat', system-ui, sans-serif; }

    /* The slim Guide bar: the Guide's name and who it is for, then every part, visible. */
    .rf-bar { background: var(--k-pink); padding: 8px 40px 0; display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
    .rf-name { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; padding-bottom: 8px; }
    .rf-name a { font-size: 16px; font-weight: 900; letter-spacing: -.02em; color: var(--k-ink); text-decoration: none; white-space: nowrap; }
    .rf-name span { font-size: 12px; font-weight: 800; }
    .rf-tabwrap { position: relative; flex: 1 1 520px; min-width: 0; }
    .rf-bar .k-tabs { padding: 0 0 8px; gap: 6px; }
    .rf-bar .k-tabs > a { font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
    .rf-bar .k-tabs > a.on { background: var(--k-ink); color: #fff; }
    .rf-bar .k-tabs > a svg { flex: none; }
    .rf-bar .k-tabs > a.join { background: var(--k-pinkt); }
    .rf-stripe.k-stripe { margin: 0; border-radius: 0; height: 6px; }

    main { padding: 26px 40px 70px; }
    .rf-crumb { font-size: 12px; font-weight: 800; margin: 0 0 8px; color: var(--k-mute); }
    .rf-crumb a { color: var(--k-ink); }
    /* Head: title and one line on the left; the Guide on the right, the same height as the title. */
    .rf-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); grid-template-areas: "t g" "a g"; gap: 0 36px; align-items: start; }
    .rf-head .rf-t { grid-area: t; } .rf-head .rf-guide { grid-area: g; } .rf-head .rf-act { grid-area: a; }
    .rf-head .k-h1 { margin-bottom: 8px; }
    .rf-head .k-lede { margin-bottom: 14px; }
    .rf-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    .rf-price { font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--k-ink); margin: 0; max-width: 620px; }
    .rf-price b { font-weight: 900; }

    /* The Guide: a small square avatar, one short line, Play. Pink, so it reads as the Guides section. */
    .rf-guide { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-pinkt); border: 2px solid var(--k-ink); border-radius: var(--k-rc); box-shadow: 4px 4px 0 var(--k-pink); padding: 10px 12px; }
    .rf-guide .av { width: 64px; height: 64px; border: 2px solid var(--k-ink); border-radius: 10px; background: #fff center / cover no-repeat; }
    .rf-guide .who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .rf-guide q { display: block; font-size: 14px; font-weight: 800; line-height: 1.35; quotes: none; }
    .rf-guide .k-btn { padding: 9px 12px; }
    .rf-guide .k-btn svg { flex: none; }
    .rf-guide .msg { grid-column: 2 / -1; font-size: 11.5px; font-weight: 700; color: var(--k-mute); margin: -4px 0 0; display: none; }
    .rf-guide.said .msg { display: block; }

    .rf-sec { margin-top: 28px; }
    .rf-sec > .k-label { margin-bottom: 10px; }

    /* Nutrients as the hero: big tiles, number left, name middle, one tag right (the same on phones). */

    /* The rest of the Guide: rows, one tag each. */
    .rf-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px 14px; }
    .rf-parts .k-row { text-decoration: none; color: var(--k-ink); }
    .rf-parts .k-row:hover { background: var(--k-tint); }

    /* One nutrient, open in place, with the list beside it */

    /* The airports: picture left in its own shape (never cropped), code and name middle, one tag right. Same on phones. */

    .rf-foot { margin-top: 34px; display: grid; gap: 12px; }

    @media (max-width: 900px) {
      .rf-bar { padding: 6px 16px 0; gap: 0; }
      .rf-name { padding-bottom: 6px; }
      .rf-name a { font-size: 15px; }
      .rf-name span { font-size: 11px; }
      .rf-tabwrap { flex-basis: 100%; margin: 0 -16px; }
      .rf-bar .k-tabs { padding: 0 16px 8px; }
      .rf-tabwrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 8px; width: 34px; background: linear-gradient(90deg, rgba(255,158,196,0), var(--k-pink)); pointer-events: none; }
      main { padding: 16px 16px 110px; }
      .rf-head { grid-template-columns: minmax(0, 1fr); grid-template-areas: "t" "g" "a"; gap: 0; }
      .rf-head .rf-guide { margin-bottom: 12px; }
      .rf-crumb { display: none; }
      .rf-guide { grid-template-columns: 40px minmax(0, 1fr) auto; box-shadow: 3px 3px 0 var(--k-pink); }
      .rf-guide .av { width: 40px !important; height: 40px !important; border-radius: 8px; }
      .rf-guide .who { font-size: 9.5px; margin-bottom: 1px; }
      .rf-guide q { font-size: 12.5px; line-height: 1.3; }
      .rf-guide .k-btn { padding: 7px 9px; }
      .rf-sec { margin-top: 20px; }
      .rf-head .k-h1 { font-size: 28px; margin-bottom: 4px; }
      .rf-head .k-lede { font-size: 14px; margin-bottom: 10px; }
      .rf-act .k-btn.k-cta { width: 100%; }
      .rf-price { font-size: 12.5px; }
      .rf-guide { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; }
      .rf-guide .av { width: 48px; height: 48px; }
      .rf-guide q { font-size: 13px; }
    }

    /* This Guide's own parts, kit only */
    .gb-cover { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .6fr); gap: 24px 36px; align-items: start; margin-top: 26px; }
    .gb-cover .k-pic { aspect-ratio: 4 / 5; max-width: 360px; justify-self: end; width: 100%; }
    .gb-good { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
    .gb-good .k-block { font-size: 14px; font-weight: 600; line-height: 1.5; }
    .gb-next { margin-top: 34px; border-top: 2px solid var(--k-ink); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
    .gb-next a { font-size: 18px; font-weight: 900; color: var(--k-ink); }
    .gb-next span { font-size: 13px; font-weight: 700; color: var(--k-mute); }
    .gb-see { margin-top: 30px; border-top: 2px solid var(--k-line); padding-top: 18px; }
    .gb-see .k-label { color: var(--k-pinkd); }
    .gb-see h2 { font-size: 20px; font-weight: 900; margin: 2px 0 4px; }
    .gb-see p { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
    .gb-now .k-block .k-big { font-size: clamp(28px, 3vw, 40px); }
    .gb-quote { font-size: 16px; font-weight: 600; line-height: 1.55; border-left: 6px solid var(--k-or); padding: 4px 0 4px 16px; margin: 18px 0 6px; max-width: 900px; }
    .gb-fine { font-size: 12.5px; font-weight: 600; color: var(--k-mute); }
    .gb-form { max-width: 900px; }
    .rf-head .rf-act:empty { display: none; }
    /* The night (Sean, 2026-11-19: "maybe it's just one image, and then these three items stacked... in a column"): one picture, the
       three parts stacked beside it. One or all: the two ways and Good to know side by side. Tell us: the form with a tall picture beside it. */
    .ev-night { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px 32px; align-items: start; }
    .ev-night .k-pic { aspect-ratio: 4 / 5; width: 100%; }
    .ev-steps { display: grid; gap: 14px; }
    .ev-step { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; align-items: start; border-bottom: 2px solid var(--k-line); padding-bottom: 14px; }
    .ev-step:last-child { border-bottom: 0; }
    .ev-step .k-num { grid-row: 1 / 3; }
    .ev-step h3 { font-size: 19px; font-weight: 900; margin: 6px 0 0; letter-spacing: -.01em; }
    .ev-step p { font-size: 14px; font-weight: 600; line-height: 1.5; margin: 0; grid-column: 2; }

  function field(f, v) {
    var name = esc(f.k), req = f.req ? ' <i>*</i>' : '', hint = f.hint ? '<small>' + esc(f.hint) + '</small>' : '', body;
    if (f.type === 'select') body = '<select name="' + name + '"><option value="">Choose one</option>' + f.opts.map(function (o) { return '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    else if (f.type === 'radio' || f.type === 'multi') body = '<div class="gp-opts" role="group" aria-label="' + esc(f.l) + '">' + f.opts.map(function (o) {
      var on = f.type === 'multi' ? (v || []).indexOf(o) >= 0 : v === o;
      return '<label><input type="' + (f.type === 'multi' ? 'checkbox' : 'radio') + '" name="' + name + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' + esc(o) + '</label>'; }).join('') + '</div>';
    else if (f.type === 'textarea') body = '<textarea name="' + name + '" maxlength="1200"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>' + esc(v || '') + '</textarea>';
    else if (f.type === 'confirm') return '<label class="gp-f wide gp-confirm" data-k="' + name + '"><input type="checkbox" name="' + name + '"' + (v ? ' checked' : '') + '><span>' + esc(f.l) + '</span></label>';
    else body = '<input type="' + (f.type || 'text') + '" name="' + name + '" maxlength="300" value="' + esc(v || '') + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.k === 'email' ? ' autocomplete="email"' : f.k === 'name' ? ' autocomplete="name"' : '') + '>';
    return '<label class="gp-f' + (f.wide ? ' wide' : '') + '" data-k="' + name + '"><span>' + esc(f.l) + req + '</span>' + body + hint + '</label>';
  }
  function readStep(n) {
    var d = draft();
    FORM[n - 1].fields.forEach(function (f) {
      var els = main.querySelectorAll('[name="' + f.k + '"]');
      if (!els.length) return;
      if (f.type === 'multi') d[f.k] = [].filter.call(els, function (e) { return e.checked; }).map(function (e) { return e.value; });
      else if (f.type === 'radio') { var c = [].filter.call(els, function (e) { return e.checked; })[0]; d[f.k] = c ? c.value : ''; }
      else if (f.type === 'confirm') d[f.k] = els[0].checked;
      else d[f.k] = els[0].value.trim();
    });
    keep(d); return d;
  }
  function stepOk(n, d) {
    var bad = FORM[n - 1].fields.filter(function (f) {
      var v = d[f.k];
      if (f.k === 'email' && v && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) return true;
      return f.req && (f.type === 'multi' ? !(v && v.length) : !v);
    });
    [].forEach.call(main.querySelectorAll('.gp-f'), function (el) { el.classList.toggle('bad', bad.some(function (f) { return f.k === el.getAttribute('data-k'); })); });
    var err = $('gpErr');
    if (bad.length) { err.textContent = bad.length === 1 ? (bad[0].k === 'email' && d.email ? 'That email does not look right.' : 'One answer is missing: ' + bad[0].l + '.') : bad.length + ' answers are missing. They are outlined in red.';
      var first = main.querySelector('.gp-f.bad input, .gp-f.bad select, .gp-f.bad textarea'); if (first) first.focus(); }
    return !bad.length;
  }
  function applyView(k, s) {
    if (s === 'done') return head(k, '') + '<p class="gp-intro" style="margin-top:20px">Thank you. We have it. Our team reads every application and will write back to the email you gave, usually within a few days. A copy of your answers is on its way to you.</p>' +
      '<div class="rf-act">' + (code ? '<a class="k-btn k-cta" href="/invite?c=' + encodeURIComponent(code) + '">Open my invitation</a>' : '') + '<a class="k-btn" href="#/demo">Look at the demo again</a></div>';
    var n = Math.max(1, Math.min(FORM.length, parseInt(s, 10) || 1)), st = FORM[n - 1], d = draft();
    var steps = '<ol class="gp-steps">' + FORM.map(function (x, i) { return '<li class="' + (i + 1 === n ? 'on' : i + 1 < n ? 'done' : '') + '">' + (i + 1) + '. ' + esc(x.t) + '</li>'; }).join('') + '</ol>';
    var intro = n === 1 ? '<p class="gp-intro">Being a Group Partner can bring your group more people and more nights. So we ask for a few minutes and real answers. Our team reads every application to make sure it is a fit both ways. Small groups are welcome.</p>' : '';
    return head(k, '') + '<div class="gw-two"><div>' + steps + intro +
      '<form class="gp-form" id="gpForm" novalidate>' + st.fields.map(function (f) { return field(f, d[f.k]); }).join('') + '</form>' +
      '<p class="gp-err" id="gpErr" role="alert"></p>' +
      '<div class="gp-nav">' + (n > 1 ? '<a class="k-btn" href="#/yes/' + (n - 1) + '" data-apply-back>Back</a>' : '<a class="k-btn" href="#/meet">Request a meeting</a>') +
      '<span>Step ' + n + ' of ' + FORM.length + '</span>' +
      '<button type="button" class="k-btn k-cta" data-apply-next="' + n + '">' + (n < FORM.length ? 'Next' : 'Send my application') + '</button></div></div>' +
      '<div style="margin-top:22px">' + pic('/groups/sample/img/brunch-5.jpg', 'Friends at a brunch in the park') + '</div></div>';
  }
  function token() { return (window.VEAuth && VEAuth.getToken && VEAuth.getToken()) || ''; }
  function applyNext(n, btn) {
    var d = readStep(n);
    if (!stepOk(n, d)) return;
    if (n < FORM.length) { location.hash = '#/yes/' + (n + 1); return; }
    btn.disabled = true; btn.textContent = 'Sending...';
    fetch(SB + '/functions/v1/ve-group', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
      body: JSON.stringify({ action: 'apply', answers: d, invite_code: code || undefined }) })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (r) {
        if (r && r.ok) { try { localStorage.removeItem('gp_apply'); } catch (e) {} location.hash = '#/yes/done'; return; }
        btn.disabled = false; btn.textContent = 'Send my application';
        $('gpErr').textContent = (r && r.message) || 'That did not go through. Try again in a minute.';
      }, function () { btn.disabled = false; btn.textContent = 'Send my application'; $('gpErr').textContent = 'That did not go through. Check your connection and try again.'; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-meet-send]');
    if (!b) return;
    e.preventDefault();
    var d = draft(), form = $('gpMeet');
    MEET.forEach(function (f) { var el = form.querySelector('[name="' + f.k + '"]'); if (el) d[f.k] = el.value.trim(); });
    keep(d);
    var bad = MEET.filter(function (f) { return (f.req && !d[f.k]) || (f.k === 'email' && d.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d.email)); });
    [].forEach.call(form.querySelectorAll('.gp-f'), function (el) { el.classList.toggle('bad', bad.some(function (f) { return f.k === el.getAttribute('data-k'); })); });
    if (bad.length) { $('gpErr').textContent = bad.length === 1 ? (bad[0].k === 'email' && d.email ? 'That email does not look right.' : 'One answer is missing: ' + bad[0].l + '.') : bad.length + ' answers are missing. They are outlined in red.'; return; }
    b.disabled = true; b.textContent = 'Sending...';
    var m = {}; MEET.forEach(function (f) { m[f.k] = d[f.k] || ''; });
    fetch(SB + '/functions/v1/ve-group', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
      body: JSON.stringify({ action: 'meet', answers: m, invite_code: code || undefined }) })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (r) {
        if (r && r.ok) { location.hash = '#/meet/done'; return; }
        b.disabled = false; b.textContent = 'Send my request'; $('gpErr').textContent = (r && r.message) || 'That did not go through. Try again in a minute.';
      }, function () { b.disabled = false; b.textContent = 'Send my request'; $('gpErr').textContent = 'That did not go through. Check your connection and try again.'; });
  });
  document.addEventListener('change', function (e) { var m = location.hash.match(/^#\/yes\/(\d)/); if (m && e.target.closest('#gpForm')) readStep(+m[1]); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-apply-next]');
    if (b) { e.preventDefault(); applyNext(+b.getAttribute('data-apply-next'), b); return; }
    if (e.target.closest('[data-apply-back]')) { var m = location.hash.match(/^#\/yes\/(\d)/); if (m) readStep(+m[1]); }
  });

  // ---------- The live previews and the full-screen view.
  function fitThumbs() {
    [].forEach.call(main.querySelectorAll('[data-thumb]'), function (t) {
      var vw = innerWidth <= 900 ? 420 : 1280, s = t.clientWidth / vw, f = t.querySelector('iframe');
      f.style.width = vw + 'px'; f.style.height = Math.ceil(t.clientHeight / s) + 'px'; f.style.transform = 'scale(' + s + ')';
    });
  }
  addEventListener('resize', fitThumbs);
  var viewEl = null;
  function openView(url, title) {
    closeView();
    viewEl = document.createElement('div');
    viewEl.className = 'gp-view'; viewEl.setAttribute('role', 'dialog'); viewEl.setAttribute('aria-modal', 'true'); viewEl.setAttribute('aria-label', title);
    viewEl.innerHTML = '<div class="gp-view-bar"><b>' + esc(title) + '</b><a href="' + esc(url) + '" target="_blank" rel="noopener">Open in a new tab</a><button type="button" data-view-close>Close</button></div><iframe title="' + esc(title) + '" src="' + esc(url) + '"></iframe>';
    document.body.appendChild(viewEl); document.documentElement.classList.add('gp-view-on');
    viewEl.querySelector('[data-view-close]').focus();
  }
  function closeView() { if (!viewEl) return; viewEl.remove(); viewEl = null; document.documentElement.classList.remove('gp-view-on'); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeView(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-view-close]')) { closeView(); return; }
    var v = e.target.closest('[data-view-url]');
    if (v) { e.preventDefault(); openView(v.getAttribute('data-view-url'), v.getAttribute('data-view-title') || 'Vegans Explore'); return; }
    var d = e.target.closest('[data-demo]');
    if (d) {
      demoView = d.getAttribute('data-demo');
      if (demoView === 'owner') { try { sessionStorage.setItem('ve_group_demo', '1'); } catch (x) {} }
      [].forEach.call(main.querySelectorAll('[data-demo]'), function (b) { b.setAttribute('aria-pressed', String(b === d)); });
      $('gpDemoThumb').innerHTML = thumb(DEMO[demoView], demoView === 'owner' ? 'The sample club, as the organizer' : 'The sample club, as a member', 'Tap it to open it full screen.');
      fitThumbs();
    }
  });

  var audio = null, playing = null;
  function stop() { if (audio) audio.pause(); if (playing) playing.innerHTML = PLAY + '<span>Play</span>'; playing = null; }
  function render() {
    stop();
    var k = curKey(), p = PARTS[idx(k)];
    bar(k);
    main.innerHTML = VIEWS[k](k, sub());
    document.title = (k !== 'start' ? p[1] + ' | ' : '') + 'The Group Partner Guide — Vegans Explore';
    var g = main.querySelector('.rf-guide'), b = g && g.querySelector('[data-play]');
    if (b) {
      b.style.display = 'none';
      fetch(g.getAttribute('data-audio'), { method: 'HEAD' }).then(function (r) { if (r.ok) b.style.display = ''; }).catch(function () {});
      b.addEventListener('click', function () {
        if (playing === b) { stop(); return; }
        stop(); audio = new Audio(g.getAttribute('data-audio')); audio.addEventListener('ended', stop);
        audio.play(); b.innerHTML = PAUSE + '<span>Pause</span>'; playing = b;
      });
    }
    fitThumbs();
    if (window.scrollY > 120) window.scrollTo(0, 0);
  }
  if (window.VERegionDirectory) VERegionDirectory.css();
  addEventListener('hashchange', render);
  render();
})();
</script>
<script src="/public/footer.js"></script>
</body>
</html>
