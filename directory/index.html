<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegans Explore — Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ve-green:       #3A9B3E;
  --ve-green-dark:  #2d7d31;
  --ve-green-light: #e8f5e9;
  --ve-green-mid:   #c8e6c9;
  --ve-orange:      #F69820;
  --ve-orange-text: #7d4a00;
  --ve-border:      rgba(0,0,0,0.09);
  --ve-surface2:    #f7faf7;
  --ve-text:        #1a1a1a;
  --ve-text-75:     rgba(26,26,26,0.75);
  --ve-text-50:     rgba(26,26,26,0.50);
}

html { min-height: 100%; }
body {
  min-height: 100%;
  background: #f5f5f5;
  color: var(--ve-text);
  font-family: Montserrat, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---- Frame ---- */
#frame {
  width: 100%;
  max-width: 1200px;
  min-height: 100vh;
  background: #fff;
  display: flex;
  flex-direction: column;
}


/* ---- Filter bar ---- */
.filter-bar {
  position: sticky;
  top: 60px;
  z-index: 300;
  width: 100%;
  background: rgba(255,255,255,0.99);
  border-bottom: 2px solid var(--ve-green-mid);
  padding: 10px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Search */
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search-wrap input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--ve-border);
  border-radius: 4px;
  font-family: Montserrat, sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  background: var(--ve-surface2);
  color: var(--ve-text);
  outline: none;
  transition: border-color .15s;
}
.search-wrap input::placeholder { color: var(--ve-text-50); }
.search-wrap input:focus { border-color: var(--ve-green-dark); background: #fff; }
.search-wrap input:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }
.search-icon {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--ve-text-50);
}

/* Filter chips */
.chip {
  font-family: Montserrat, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--ve-surface2);
  border: 1px solid var(--ve-border);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  color: var(--ve-text-75);
  transition: .15s;
  white-space: nowrap;
}
.chip:hover { background: var(--ve-green-light); color: var(--ve-green-dark); border-color: var(--ve-green-dark); }
.chip.active { background: var(--ve-green-dark); color: #fff; border-color: var(--ve-green-dark); }
.chip:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }
.chip.chip-featured { border-color: var(--ve-orange); color: var(--ve-orange-text); }
.chip.chip-featured:hover { background: #fff3e0; border-color: var(--ve-orange); color: var(--ve-orange-text); }
.chip.chip-featured.active { background: var(--ve-orange); color: #fff; border-color: var(--ve-orange); }

.region-row { display: flex; gap: 6px; flex-wrap: wrap; }
.region-row.hidden { display: none; }

/* Divider label */
.filter-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ve-text-75);
  white-space: nowrap;
}

/* ---- Grid ---- */
.dir-main { padding: 24px; flex: 1; }
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.result-bar {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ve-text-75);
}
.page-size-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.page-size-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ve-text-75);
}
.page-size-wrap select {
  font-family: Montserrat, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  background: var(--ve-surface2);
  border: 1px solid var(--ve-border);
  border-radius: 4px;
  padding: 5px 8px;
  color: var(--ve-text);
  cursor: pointer;
  outline: none;
}
.page-size-wrap select:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
}

/* ---- Pagination ---- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px 0 8px;
  flex-wrap: wrap;
}
.pg-btn {
  font-family: Montserrat, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--ve-surface2);
  border: 1px solid var(--ve-border);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  color: var(--ve-text-75);
  transition: .15s;
}
.pg-btn:hover:not(:disabled) { background: var(--ve-green-light); color: var(--ve-green-dark); border-color: var(--ve-green-dark); }
.pg-btn.current { background: var(--ve-green-dark); color: #fff; border-color: var(--ve-green-dark); }
.pg-btn:disabled { opacity: 0.35; cursor: default; }
.pg-btn:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }
.pg-ellipsis { background: none; border-color: transparent; cursor: default; pointer-events: none; }
.pg-info {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ve-text-75);
  padding: 0 4px;
}

/* ---- Cards ---- */
.card {
  background: #fff;
  border: 1px solid var(--ve-border);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow .18s, transform .15s;
  position: relative;
}
.card:hover { box-shadow: 0 4px 20px rgba(45,125,49,.12); transform: translateY(-2px); }
.card a { text-decoration: none; color: inherit; display: flex; flex-direction: column; flex: 1; }
.card a:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 3px; border-radius: 6px; }
.card-img {
  width: 100%; height: 140px;
  object-fit: cover;
  background: var(--ve-green-light);
  display: block;
  border-bottom: 1px solid var(--ve-border);
}
.card-placeholder {
  width: 100%; height: 140px;
  background: linear-gradient(135deg, var(--ve-green-light) 0%, var(--ve-green-mid) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
  border-bottom: 1px solid var(--ve-border);
}

/* Featured star toggle (admin) */
.star-btn {
  position: absolute;
  top: 7px; left: 7px;
  z-index: 10;
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.92);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  transition: background .15s, transform .12s;
  padding: 0;
}
.star-btn:hover { background: #fff; transform: scale(1.1); }
.star-btn:focus-visible { outline: 2px solid var(--ve-green-dark); outline-offset: 2px; }
.star-btn svg { width: 14px; height: 14px; transition: fill .15s, stroke .15s; }
.star-btn.off svg { fill: none; stroke: #999; stroke-width: 2; }
.star-btn.on  svg { fill: #F69820; stroke: #F69820; stroke-width: 1.5; }

/* Featured corner ribbon */
.featured-ribbon {
  display: none;
  position: absolute;
  top: 0; right: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 0 36px 36px 0;
  border-color: transparent var(--ve-green-dark) transparent transparent;
  z-index: 9;
}
.card.featured .featured-ribbon { display: block; }
.card.featured { border-color: rgba(45,125,49,0.35); }
.card-body {
  padding: 12px 14px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card-name {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--ve-text);
  line-height: 1.4;
}
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; }
.tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
}
/* Tag colors - all WCAG AA verified */
.t-rest  { background: var(--ve-green-light); color: #1e5c22; }
.t-brand { background: #fff3e0; color: #7d3800; }
.t-npo   { background: #ede7f6; color: #311b92; }
.t-media { background: #fce4ec; color: #880e4f; }
.t-reg   { background: var(--ve-surface2); color: #2c4a2e; border: 1px solid var(--ve-border); }

.card.no-link:hover { transform: none; box-shadow: none; }

/* ---- Empty ---- */
.empty {
  grid-column: 1/-1;
  padding: 64px 24px;
  text-align: center;
  color: var(--ve-text-50);
}
.empty p { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }

.hidden { display: none !important; }

@media (max-width: 640px) {
  .filter-bar { padding: 10px 16px; }
  .dir-main { padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
  .card-img, .card-placeholder { height: 115px; }
  .search-wrap { max-width: 100%; }
  .chip { padding: 5px 10px; }
}

/* ---- Directory hero ---- */
.dir-hero {
  position: relative;
  min-height: 540px;
  background-image: url('/directory/banner.jpg');
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
}
.dir-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.96) 0%, transparent 82%);
  z-index: 1;
}
.dir-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.32) 0%, transparent 28%);
  z-index: 1;
}
.dir-hero .hero-inner {
  position: relative;
  z-index: 2;
  padding: 88px 56px 72px;
  max-width: 600px;
}
.dir-hero .hero-eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ve-green);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dir-hero .hero-eyebrow::before {
  content: '';
  width: 20px;
  height: 2px;
  background: var(--ve-green);
  flex-shrink: 0;
}
.dir-hero h1 {
  font-size: clamp(40px, 6.5vw, 80px);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 22px;
}
.dir-hero h1 em { color: var(--ve-green); font-style: normal; }
.dir-hero .hero-sub {
  font-size: 16px;
  font-weight: 400;
  line-height: 1.65;
  color: rgba(255,255,255,0.62);
  max-width: 520px;
  margin-bottom: 36px;
}
.dir-hero .hero-ctas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dir-hero .btn-hero-primary {
  background: var(--ve-orange);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 30px;
  border-radius: 4px;
  text-decoration: none;
  transition: background 0.15s;
  display: inline-block;
}
.dir-hero .btn-hero-primary:hover { background: #d4800f; }
.dir-hero .btn-hero-ghost {
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 14px 26px;
  border-radius: 4px;
  text-decoration: none;
  transition: all 0.15s;
  display: inline-block;
  border: 1.5px solid rgba(255,255,255,0.22);
}
.dir-hero .btn-hero-ghost:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
@media (max-width: 640px) {
  .dir-hero { min-height: 420px; }
  .dir-hero .hero-inner { padding: 64px 24px 48px; }
}
</style>
</head>

<div id="frame">

  <script src="/public/nav.js"></script>

  <!-- Directory hero -->
  <section class="dir-hero" aria-labelledby="dir-hero-h1">
    <div class="hero-inner">
      <p class="hero-eyebrow">Vegans Explore</p>
      <h1 id="dir-hero-h1">The Vegan<br><em>Directory.</em></h1>
      <p class="hero-sub">215+ restaurants, brands, nonprofits, and media outlets across South Florida, New York, Central Florida, Atlanta, and beyond.</p>
      <div class="hero-ctas">
        <a href="/passport.html" class="btn-hero-primary">Get Your Passport</a>
        <a href="#grid" class="btn-hero-ghost">Browse Listings</a>
      </div>
    </div>
  </section>

  <!-- Filter bar -->
  <nav class="filter-bar" aria-label="Directory filters">
    <div class="filter-row">
      <div class="search-wrap" role="search">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="search" placeholder="Search by name or city..." aria-label="Search directory">
      </div>
      <div role="tablist" aria-label="Filter by type" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="chip chip-featured active" data-type="Featured"   role="tab" aria-selected="true" >&#9733; Featured</button>
        <button class="chip"                      data-type="All"        role="tab" aria-selected="false">All</button>
        <button class="chip"                      data-type="Restaurant" role="tab" aria-selected="false">Restaurants</button>
        <button class="chip"        data-type="Brand"      role="tab" aria-selected="false">Brands</button>
        <button class="chip"        data-type="Nonprofit"  role="tab" aria-selected="false">Nonprofits</button>
        <button class="chip"        data-type="Media"      role="tab" aria-selected="false">Media</button>
      </div>
    </div>
    <div class="region-row hidden" id="region-row" role="group" aria-label="Filter by region">
      <span class="filter-label">Region:</span>
      <button class="chip active" data-region="All"            >All</button>
      <button class="chip"        data-region="South Florida"  >South Florida</button>
      <button class="chip"        data-region="Central Florida">Central Florida</button>
      <button class="chip"        data-region="New York"       >New York</button>
      <button class="chip"        data-region="Atlanta"        >Atlanta</button>
    </div>
  </nav>

  <!-- Grid -->
  <main class="dir-main">
    <div class="toolbar">
      <p class="result-bar" id="result-bar" role="status" aria-live="polite"></p>
      <div class="page-size-wrap">
        <span class="page-size-label">Show</span>
        <select id="page-size" aria-label="Listings per page">
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="250">250</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid" aria-label="Directory listings"></div>
    <div class="pagination" id="pagination" role="navigation" aria-label="Page navigation"></div>
  </main>

</div><!-- /frame -->

    const img = l.i
      ? `<img class="card-img" src="${esc(l.i)}" alt="${esc(l.t)}" loading="lazy">`
      : `<div class="card-placeholder" aria-hidden="true">${ICONS[l.type]||'🌱'}</div>`;
    const tb = `<span class="tag ${TC[l.type]||''}">${esc(l.type)}</span>`;
    const rb = l.region ? `<span class="tag t-reg">${esc(l.region.split(',')[0].trim())}</span>` : '';
    const body = `${img}<div class="card-body"><div class="card-name">${esc(l.t)}</div><div class="card-tags">${tb}${rb}</div></div>`;
    const al = `${esc(l.t)}, ${esc(l.type)}${l.region?', '+esc(l.region.split(',')[0].trim()):''}`;
    const inner = l.l
      ? `<a href="${esc(l.l)}" target="_blank" rel="noopener noreferrer" aria-label="${al}">${body}</a>`
      : `<div style="display:flex;flex-direction:column;flex:1">${body}</div>`;
    return `<article class="card${featClass}" data-title="${esc(l.t)}">
      <button class="star-btn ${starClass}" aria-label="${starLabel}" title="${starLabel}" data-title="${esc(l.t)}">${STAR_SVG}</button>
      <div class="featured-ribbon" aria-hidden="true"></div>
      ${inner}
    </article>`;
  }).join('');

  // Star click handlers
  grid.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const title = btn.dataset.title;
      if (featured.has(title)) {
        featured.delete(title);
      } else {
        featured.add(title);
      }
      saveFeatured(featured);
      render(true); // re-render keeping current page
    });
  });
}

function renderPagination(total) {
  const pg = document.getElementById('pagination');
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  const MAX_BTNS = 7;
  let pages = [];
  if (totalPages <= MAX_BTNS) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (currentPage > 3) pages.push('...');
    for (let i = Math.max(2, currentPage-1); i <= Math.min(totalPages-1, currentPage+1); i++) pages.push(i);
    if (currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }

  const btns = pages.map(p => {
    if (p === '...') return `<span class="pg-btn pg-ellipsis" aria-hidden="true">…</span>`;
    const cur = p === currentPage ? ' current' : '';
    return `<button class="pg-btn${cur}" data-page="${p}" aria-label="Page ${p}"${p===currentPage?' aria-current="page"':''}>${p}</button>`;
  }).join('');

  const prevDis = currentPage === 1 ? ' disabled' : '';
  const nextDis = currentPage === totalPages ? ' disabled' : '';
  pg.innerHTML =
    `<button class="pg-btn pg-prev"${prevDis} data-page="${currentPage-1}" aria-label="Previous page">&#8592; Prev</button>` +
    btns +
    `<button class="pg-btn pg-next"${nextDis} data-page="${currentPage+1}" aria-label="Next page">Next &#8594;</button>`;

  pg.querySelectorAll('[data-page]').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      currentPage = parseInt(btn.dataset.page);
      render(true);
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}

function render(keepPage) {
  if (!keepPage) currentPage = 1;

  const q = searchQ.toLowerCase().trim();
  const filtered = DATA.filter(l => {
    if (activeType === 'Featured' && !featured.has(l.t)) return false;
    if (activeType !== 'All' && activeType !== 'Featured' && l.type !== activeType) return false;
    if (activeRegion !== 'All' && !(l.region||'').includes(activeRegion)) return false;
    if (q && !l.t.toLowerCase().includes(q) && !(l.region||'').toLowerCase().includes(q)) return false;
    return true;
  });

  // Sort: featured first (preserving original order within each group)
  const sorted = [
    ...filtered.filter(l => featured.has(l.t)),
    ...filtered.filter(l => !featured.has(l.t))
  ];

  const total = sorted.length;
  const label = total + ' listing' + (total === 1 ? '' : 's');
  const hc = document.getElementById('header-count');
  if (hc) hc.textContent = label;
  document.getElementById('result-bar').textContent = label;

  // Paginate
  const start = (currentPage - 1) * pageSize;
  const page  = sorted.slice(start, start + pageSize);

  renderCards(page);
  renderPagination(total);
}

// --- Filter wire-ups ---
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-type]').forEach(b => {
      b.classList.remove('active'); b.setAttribute('aria-selected','false');
    });
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    activeType = btn.dataset.type; activeRegion = 'All';
    document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-region="All"]').classList.add('active');
    const rr = document.getElementById('region-row');
    rr.classList.toggle('hidden', activeType==='Featured'||activeType==='Brand'||activeType==='Nonprofit'||activeType==='Media');
    render();
  });
});

document.querySelectorAll('[data-region]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRegion = btn.dataset.region;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value;
  render();
});

document.getElementById('page-size').addEventListener('change', e => {
  pageSize = parseInt(e.target.value);
  render();
});

render();
</script>
<script src="/public/footer.js"></script>
</body>
