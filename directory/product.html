<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Vegans Explore</title>
  <meta name="description" content="A Vegan product in the Vegans Explore Directory, on its brand's page: every version of it, what it is made from, Nutrition Facts, the USDA label record and where to find it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- /products/<slug> (rewrite in vercel.json) is a product's shareable link. A product lives on its brand's page
       (Sean, 2026-10-08: "we can still link directly to the Oatly milk product page"), so this forwards to
       /directory/<brand>?tab=products&product=<slug>, keeping ?v=<version>. The product view is /public/ve-product-view.js. -->
  <style>
    body{font-family:Montserrat,sans-serif;color:#1a1a1a;background:#fff;margin:0}
    .vp-wait{padding:90px 24px;text-align:center;font-size:15px;color:rgba(26,26,26,.5)}
    .vp-wait a{color:#1f5f22}
  </style>
</head>
<body>
<script src="/public/nav.js"></script>
<main class="vp-wait" id="vp">Opening the product...</main>
<script src="/public/footer.js"></script>
<script>
(function () {
  var SB = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var q = new URLSearchParams(location.search);
  var slug = location.pathname.replace(/\/$/, '').split('/').pop();
  if (!/^[a-z0-9-]+$/.test(slug) || slug === 'product') slug = q.get('slug') || '';
  function missing() { document.getElementById('vp').innerHTML = 'We could not find that product. <a href="/directory">Browse the Directory</a>'; }
  if (!/^[a-z0-9-]+$/.test(slug)) return missing();
  fetch(SB + '/rest/v1/ve_products?slug=eq.' + encodeURIComponent(slug) + '&select=slug,guides,listings!ve_products_brand_listing_id_fkey(slug,status)&limit=1', { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var p = Array.isArray(rows) && rows[0], b = p && p.listings;
      if (!p || !b || b.status !== 'approved' || !(p.guides || []).length) return missing();
      location.replace('/directory/' + encodeURIComponent(b.slug) + '?tab=products&product=' + encodeURIComponent(p.slug) + (q.get('v') ? '&v=' + encodeURIComponent(q.get('v')) : ''));
    })
    .catch(function () { document.getElementById('vp').textContent = 'We could not open this product just now. Refresh to try again.'; });
})();
</script>
</body>
</html>
