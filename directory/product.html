<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Vegans Explore</title>
  <meta id="meta-description" name="description" content="A Vegan product in the Vegans Explore Directory: photos, what it is made from, the USDA label record, nutrition facts and where to buy it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- A product page (Sean, 2026-10-08): every product a Guide lists gets its own page at /products/<slug> (rewrite in
       vercel.json), the promotional page for that product. Tabs: Overview (photos, what it is, the brand's own words and
       certifications, the USDA FoodData Central label record, about the brand, where to buy, more from the brand; Nutrition
       Facts on the right), Gallery (every photo with its credit) and Campaigns & contests (a brand campaign's creator posts
       and contests; empty until a campaign runs). The brand's logo heads the page even for one product, with a way back to
       the brand. Data: ve_products (fdc, gallery, certifications, brand_says), ve_product_stores, listings (logo_url,
       details.about). Shared helpers in /public/ve-products.js. In a frame (a Guide, the dashboard) the nav, footer and
       breadcrumb drop away. The tab is in the address bar (?tab=gallery). -->
  <script>try { if (window.self !== window.top) document.documentElement.classList.add('ve-embedded'); } catch (e) {}</script>
  <style>
    *,::before,::after{box-sizing:border-box;margin:0;padding:0}
    :root{--g:#1f5f22;--g2:#3A9B3E;--gl:#e8f5e9;--line:rgba(0,0,0,0.09);--ink:#1a1a1a;--ink75:rgba(26,26,26,0.75);--ink50:rgba(26,26,26,0.5);--warm:#fff4e2;--soft:#f6f7f6;}
    body{font-family:Montserrat,sans-serif;color:var(--ink);background:#fff;}
    .ve-embedded .ve-nav,.ve-embedded .ve-footer,.ve-embedded .vp-crumb{display:none !important}
    a{color:inherit}
    /* Header: the brand leads, even on a single product */
    .vp-hero{background:#111;color:#fff;padding:32px 40px 0;}
    .vp-crumb{font-size:12px;font-weight:700;color:rgba(255,255,255,0.6);margin-bottom:14px;}
    .vp-crumb a{color:rgba(255,255,255,0.85);text-decoration:none;}
    .vp-crumb a:hover{text-decoration:underline;}
    .vp-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
    .vp-logo{width:96px;height:96px;flex:0 0 96px;border-radius:18px;background:#fff center/78% no-repeat;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#fff;overflow:hidden;}
    .vp-titles{flex:1;min-width:240px;}
    .vp-hero h1{font-size:clamp(26px,3.4vw,40px);font-weight:900;line-height:1.1;}
    .vp-by{font-size:14px;font-weight:700;margin-top:6px;color:rgba(255,255,255,0.8);}
    .vp-by a{color:#8fe3a6;text-decoration:none;}
    .vp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
    .vp-chip{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:#5EC47A;color:#0d2a12;text-decoration:none;}
    .vp-chip.o{background:transparent;border:1px solid #5EC47A;color:#8fe3a6;}
    .vp-back{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.35);color:#fff;text-decoration:none;white-space:nowrap;}
    .vp-back:hover{border-color:#5EC47A;color:#8fe3a6;}
    .vp-tabs{display:flex;gap:4px;margin-top:26px;overflow-x:auto;}
    .vp-tab{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:13px 18px;border:0;border-radius:10px 10px 0 0;background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;white-space:nowrap;}
    .vp-tab[aria-selected="true"]{background:#fff;color:var(--g);}
    .vp-tab:hover:not([aria-selected="true"]){color:#fff;}
    .vp-tab .n{margin-left:6px;font-size:10px;opacity:.7;}
    /* Body */
    .vp-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;padding:32px 40px 64px;align-items:start;}
    .vp-panel[hidden]{display:none;}
    .vp-sec{margin-bottom:34px;}
    .vp-sec h2{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink50);margin-bottom:12px;}
    .vp-what{font-size:15px;line-height:1.65;color:var(--ink75);}
    .vp-what b{color:var(--ink);}
    .vp-note{font-size:13px;color:#8a5a00;background:var(--warm);border-radius:8px;padding:8px 12px;margin-top:10px;display:inline-block;}
    .vp-quote{margin-top:14px;border-left:3px solid var(--g2);padding:4px 0 4px 14px;font-size:15px;line-height:1.6;color:var(--ink);}
    .vp-quote cite{display:block;font-style:normal;font-size:12px;color:var(--ink50);margin-top:4px;}
    .vp-quote cite a{color:var(--g);}
    /* Photos on the overview */
    .vp-shots{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;}
    .vp-shot{background:var(--soft) center/contain no-repeat;border-radius:14px;border:1px solid var(--line);cursor:pointer;min-height:120px;}
    .vp-shot.main{aspect-ratio:1/1;}
    .vp-thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .vp-thumbs .vp-shot{aspect-ratio:1/1;}
    .vp-more-shots{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g);background:var(--gl);}
    .vp-certs{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;align-items:center;}
    .vp-cert{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink75);}
    .vp-cert img{width:44px;height:44px;object-fit:contain;}
    /* The USDA record */
    .vp-rec{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
    .vp-rec dl{display:grid;grid-template-columns:200px minmax(0,1fr);}
    .vp-rec dt,.vp-rec dd{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;}
    .vp-rec dt{font-weight:800;color:var(--ink75);background:var(--soft);}
    .vp-rec dd{color:var(--ink);}
    .vp-rec .last{border-bottom:0;}
    .vp-rec details{border-top:1px solid var(--line);}
    .vp-rec summary{cursor:pointer;padding:12px 16px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g);}
    .vp-nut{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:0 24px;padding:0 16px 14px;}
    .vp-nut div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
    .vp-nut b{font-weight:800;}
    .vp-src{font-size:11.5px;line-height:1.5;color:var(--ink50);margin-top:8px;}
    .vp-src a{color:var(--g);}
    /* Stores */
    .vp-stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px;}
    .vp-store{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;}
    .vp-store-logo{width:48px;height:48px;flex:0 0 48px;border-radius:12px;border:1px solid var(--line);background:#fff center/72% no-repeat;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;}
    .vp-store-main{flex:1;min-width:0;}
    .vp-store b{font-size:15px;font-weight:800;display:block;}
    .vp-store-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;}
    .vp-btn{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:6px;background:#f0faf4;color:#2d7a4f;border:1px solid #b6e5c8;text-decoration:none;white-space:nowrap;display:inline-block;}
    .vp-btn:hover{background:#5EC47A;color:#000;border-color:#5EC47A;}
    .vp-link{font-size:12px;font-weight:700;color:var(--g);}
    .vp-more{display:flex;flex-wrap:wrap;gap:8px;}
    .vp-more a{font-size:12px;font-weight:800;letter-spacing:.04em;padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;}
    .vp-more a:hover{border-color:var(--g2);color:var(--g);}
    .vp-about{display:flex;gap:16px;align-items:flex-start;}
    .vp-about .vp-logo{width:64px;height:64px;flex-basis:64px;border-radius:14px;border:1px solid var(--line);font-size:24px;}
    /* Gallery */
    .vp-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:16px;}
    .vp-gal figure{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
    .vp-gal .ph{aspect-ratio:1/1;background:var(--soft) center/contain no-repeat;}
    .vp-gal figcaption{padding:10px 14px;font-size:13px;font-weight:700;}
    .vp-gal figcaption span{display:block;font-size:11px;font-weight:600;color:var(--ink50);margin-top:2px;}
    .vp-gal figcaption a{color:var(--ink50);}
    /* Campaigns */
    .vp-empty-box{border:1.5px dashed #c8e6c9;border-radius:14px;padding:28px;background:#fbfdfb;}
    .vp-empty-box h3{font-size:18px;font-weight:900;margin-bottom:8px;}
    .vp-empty-box p{font-size:14px;line-height:1.6;color:var(--ink75);max-width:760px;}
    .vp-empty-box ul{margin:12px 0 0 18px;font-size:14px;line-height:1.7;color:var(--ink75);}
    /* Side */
    .vp-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px;}
    .vp-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
    .vp-card h3{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink50);margin-bottom:10px;}
    .vp-card p{font-size:13px;line-height:1.55;color:var(--ink75);}
    .vp-brandcta{background:var(--gl);border-color:#c8e6c9;}
    .vp-empty{padding:80px 40px;text-align:center;color:var(--ink50);font-size:15px;}
    @media (max-width:980px){.vp-grid{grid-template-columns:minmax(0,1fr);}.vp-side{position:static;}}
    @media (max-width:640px){
      .vp-hero{padding:22px 16px 0;}.vp-logo{width:72px;height:72px;flex-basis:72px;font-size:28px;}
      .vp-back{order:3;}.vp-grid{padding:20px 16px 48px;}
      .vp-shots{grid-template-columns:minmax(0,1fr);}
      .vp-rec dl{grid-template-columns:minmax(0,1fr);}.vp-rec dt{border-bottom:0;padding-bottom:2px;}.vp-rec dd{padding-top:2px;}
      .vp-tab{padding:12px 13px;}.vp-wide{display:none;}
    }
  </style>
</head>
<body>
<script src="/public/nav.js"></script>
<main id="vp"><div class="vp-empty">Loading...</div></main>
<script src="/public/footer.js"></script>
<script src="/public/ve-products.js"></script>
<script>
(function () {
  var SB = 'https://fwbhwfxpncrsfhttimna.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
  var esc = VEProducts.esc, root = document.getElementById('vp');
  function rest(path) { return fetch(SB + '/rest/v1/' + path, { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }).then(function (r) { return r.json(); }); }
  var slug = location.pathname.replace(/\/$/, '').split('/').pop();
  if (!/^[a-z0-9-]+$/.test(slug)) slug = new URLSearchParams(location.search).get('slug') || '';
  VEProducts.css();
  function logo(l, cls) {
    return l.logo_url ? '<div class="' + cls + '" style="background-image:url(\'' + esc(l.logo_url) + '\')" role="img" aria-label="' + esc(l.name) + ' logo"></div>'
      : '<div class="' + cls + '" style="background:' + esc(l.color || '#1f5f22') + '">' + esc(l.initials || l.name.charAt(0)) + '</div>';
  }
  function lc(s) { s = String(s || ''); return s.charAt(0).toLowerCase() + s.slice(1); }
  function title(s) { return String(s || '').toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  var DATA_SOURCE = { LI: 'Label information from the brand', GDSN: 'GS1 Global Data Synchronization Network' };

  rest('ve_products?slug=eq.' + encodeURIComponent(slug) + '&select=id,slug,product_type,name,made_from,note,guides,department,nutrition,nutrition_source,image_url,image_credit,fdc,gallery,certifications,brand_says,brand_url,brand_listing_id,' +
    'listings!ve_products_brand_listing_id_fkey(id,slug,name,color,initials,logo_url,vegan_status,website,status,details),ve_product_stores(buy_url,affiliate_link_code,removed_at,listings(slug,name,website,details,status,logo_url,color,initials))&limit=1')
    .then(function (rows) {
      var p = Array.isArray(rows) && rows[0], b = p && p.listings;
      if (!p || !b || b.status !== 'approved' || !(p.guides || []).length) { root.innerHTML = '<div class="vp-empty">We could not find that product. <a href="/directory">Browse the Directory</a></div>'; return; }
      var name = VEProducts.title(p, b.name);
      document.title = name + ' — Vegans Explore';
      var stores = (p.ve_product_stores || []).filter(function (r) { return !r.removed_at && r.listings && r.listings.status === 'approved'; })
        .sort(function (x, y) { return x.listings.name.localeCompare(y.listings.name); });
      var guides = (p.guides || []).map(function (g) { return VEProducts.GUIDES[g]; }).filter(Boolean);
      var vegan = { fully_vegan: '100% Vegan', vegan: '100% Vegan' }[b.vegan_status];
      var gallery = Array.isArray(p.gallery) ? p.gallery : (p.image_url ? [{ url: p.image_url, caption: name, credit: p.image_credit }] : []);
      var about = (b.details && b.details.about) || null;
      var brandHref = '/directory/' + encodeURIComponent(b.slug);

      // ---- header
      var html = '<section class="vp-hero"><div class="vp-crumb"><a href="/directory">Directory</a> &rsaquo; <a href="' + brandHref + '">' + esc(b.name) + '</a> &rsaquo; ' + esc(p.name || p.product_type) + '</div>' +
        '<div class="vp-head">' + logo(b, 'vp-logo') + '<div class="vp-titles"><h1>' + esc(name) + '</h1><div class="vp-by">by <a href="' + brandHref + '">' + esc(b.name) + '</a></div>' +
        '<div class="vp-chips">' + (p.department ? '<span class="vp-chip">' + esc(p.department) + '</span>' : '') + '<span class="vp-chip o">' + esc(p.product_type) + '</span>' +
        (vegan ? '<span class="vp-chip o">' + vegan + '</span>' : '') +
        guides.map(function (g) { return '<a class="vp-chip o" href="' + esc(g[1]) + '" target="_top">In the ' + esc(g[0]) + '</a>'; }).join('') + '</div></div>' +
        '<a class="vp-back" href="' + brandHref + '">&larr; Back to ' + esc(b.name) + '</a></div>' +
        '<div class="vp-tabs" role="tablist"><button class="vp-tab" role="tab" data-tab="overview">Overview</button>' +
        '<button class="vp-tab" role="tab" data-tab="gallery">Gallery<span class="n">' + gallery.length + '</span></button>' +
        '<button class="vp-tab" role="tab" data-tab="campaigns">Campaigns<span class="vp-wide"> &amp; contests</span></button></div></section>';

      html += '<div class="vp-grid"><div>';

      // ---- Overview
      html += '<div class="vp-panel" data-panel="overview">';
      if (gallery.length) {
        var thumbs = gallery.slice(1, 4);
        html += '<div class="vp-sec"><div class="vp-shots"><div class="vp-shot main" data-go="gallery" style="background-image:url(\'' + esc(gallery[0].url) + '\')" role="img" aria-label="' + esc(gallery[0].caption || name) + '"></div>' +
          '<div class="vp-thumbs">' + thumbs.map(function (g) { return '<div class="vp-shot" data-go="gallery" style="background-image:url(\'' + esc(g.url) + '\')" role="img" aria-label="' + esc(g.caption || '') + '"></div>'; }).join('') +
          (gallery.length > 4 ? '<div class="vp-shot vp-more-shots" data-go="gallery">See all ' + gallery.length + ' photos</div>' : '') + '</div></div>' +
          '<p class="vp-src">Photos: ' + esc(gallery.map(function (g) { return g.credit; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; }).join('; ')) + '.</p></div>';
      }
      html += '<div class="vp-sec"><h2>What it is</h2><p class="vp-what">' + esc(name) + (p.made_from ? ' is made from ' + esc(lc(p.made_from)) + '.' : '.') + '</p>' +
        (p.note ? '<div class="vp-note">' + esc(p.note) + '</div>' : '') +
        (p.brand_says ? '<blockquote class="vp-quote">&ldquo;' + esc(p.brand_says) + '&rdquo;<cite>' + esc(b.name) + (p.brand_url ? ', <a href="' + esc(p.brand_url) + '" target="_blank" rel="noopener">on its website</a>' : '') + '</cite></blockquote>' : '') +
        (Array.isArray(p.certifications) && p.certifications.length ? '<div class="vp-certs">' + p.certifications.map(function (c) { return '<span class="vp-cert"><img src="' + esc(c.url) + '" alt="" loading="lazy">' + esc(c.name) + '</span>'; }).join('') + '</div>' : '') + '</div>';
      var f = p.fdc;
      if (f) {
        var rows2 = [
          ['Product on the record', esc(title(f.description)) + (f.brandName ? ' (' + esc(f.brandName) + ')' : '')],
          ['Brand owner', esc(f.brandOwner)],
          ['UPC', esc(f.gtinUpc)],
          ['Package size', esc(f.packageWeight)],
          ['Serving size', esc([f.householdServing, f.servingSize ? f.servingSize + ' ' + String(f.servingSizeUnit || '').replace(/^MLT$/, 'mL').replace(/^GRM$/, 'g') : ''].filter(Boolean).join(', '))],
          ['Category', esc(f.category)],
          ['Sold in', esc(f.marketCountry)],
          ['Ingredients', esc(f.ingredients)],
          ['On the record since', esc([f.availableDate, f.modifiedDate && f.modifiedDate !== f.availableDate ? 'label updated ' + f.modifiedDate : '', f.publicationDate ? 'published ' + f.publicationDate : ''].filter(Boolean).join(', '))],
          ['Source of the data', esc(DATA_SOURCE[f.dataSource] || f.dataSource || '')]
        ].filter(function (r) { return r[1]; });
        var nuts = (f.nutrients || []);
        var per = /ML|LT/i.test(f.servingSizeUnit || '') ? '100 mL' : '100 g';
        html += '<div class="vp-sec"><h2>From the label: the USDA record</h2><div class="vp-rec"><dl>' +
          rows2.map(function (r, i) { return '<dt' + (i === rows2.length - 1 ? ' class="last"' : '') + '>' + r[0] + '</dt><dd' + (i === rows2.length - 1 ? ' class="last"' : '') + '>' + r[1] + '</dd>'; }).join('') + '</dl>' +
          (nuts.length ? '<details><summary>All ' + nuts.length + ' nutrients, per ' + per + '</summary><div class="vp-nut">' + nuts.map(function (n) { return '<div><span>' + esc(n.name) + '</span><b>' + esc(Math.round(Number(n.value) * 100) / 100) + ' ' + esc(n.unit) + '</b></div>'; }).join('') + '</div></details>' : '') +
          '</div><p class="vp-src">USDA FoodData Central, Branded Foods, record ' + esc(f.id) + ' (<a href="https://fdc.nal.usda.gov/food-details/' + encodeURIComponent(f.id) + '/nutrients" target="_blank" rel="noopener">see the record</a>), as the brand reported it. Recipes change, so check the package.</p></div>';
      }
      html += '<div class="vp-sec"><h2>About ' + esc(b.name) + '</h2><div class="vp-about">' + logo(b, 'vp-logo') + '<div><p class="vp-what">' +
        (about ? esc(about.text) : esc(b.name) + ' is in the Vegans Explore Directory.') + '</p>' +
        '<p class="vp-src">' + (about && about.source ? 'Source: <a href="' + esc(about.source) + '" target="_blank" rel="noopener">' + esc(b.name) + '</a>. ' : '') +
        '<a href="' + brandHref + '">Everything ' + esc(b.name) + ' makes, in the Directory</a>' + (b.website ? ' &middot; <a href="' + esc(/^https?:/.test(b.website) ? b.website : 'https://' + b.website) + '" target="_blank" rel="noopener">' + esc(b.name) + '\'s website</a>' : '') + '</p></div></div></div>';
      html += '<div class="vp-sec"><h2>Where to buy</h2>' + (stores.length ? '<div class="vp-stores">' + stores.map(function (r) {
          var s = r.listings, by = VEProducts.buy(s, r, p, b.name);
          return '<div class="vp-store">' + logo(s, 'vp-store-logo') + '<div class="vp-store-main"><b>' + esc(s.name) + '</b><div class="vp-store-row">' +
            (by ? '<a class="vp-btn" href="' + esc(by.href) + '" target="_blank" rel="noopener' + (by.sponsored ? ' sponsored' : '') + '">' + esc(by.label) + '</a>' : '') +
            '<a class="vp-link" href="/directory/' + encodeURIComponent(s.slug) + '?product=' + encodeURIComponent(p.id) + '">Vegan aisle</a></div></div></div>';
        }).join('') + '</div><p class="vp-src">Stock changes by location, so check your store.</p>' : '<p class="vp-what">We have not mapped a store for this one yet.</p>') + '</div>';
      html += '<div class="vp-sec" id="vpMore" hidden><h2>More from ' + esc(b.name) + '</h2><div class="vp-more"></div></div>';
      html += '</div>';

      // ---- Gallery
      html += '<div class="vp-panel" data-panel="gallery" hidden><div class="vp-sec"><h2>' + gallery.length + ' photos</h2>' +
        (gallery.length ? '<div class="vp-gal">' + gallery.map(function (g) {
          return '<figure><div class="ph" style="background-image:url(\'' + esc(g.url) + '\')" role="img" aria-label="' + esc(g.caption || '') + '"></div><figcaption>' + esc(g.caption || '') +
            '<span>' + (g.source ? '<a href="' + esc(g.source) + '" target="_blank" rel="noopener">' + esc(g.credit || 'Source') + '</a>' : esc(g.credit || '')) + '</span></figcaption></figure>';
        }).join('') + '</div>' : '<p class="vp-what">No photos yet.</p>') + '</div></div>';

      // ---- Campaigns & contests
      html += '<div class="vp-panel" data-panel="campaigns" hidden><div class="vp-sec"><h2>Campaigns &amp; contests</h2><div class="vp-empty-box">' +
        '<h3>Nothing running for ' + esc(name) + ' yet</h3>' +
        '<p>When ' + esc(b.name) + ' runs a campaign with Vegans Explore, this is where it lives:</p>' +
        '<ul><li>the challenge, its tasks and points</li><li>photos and videos members make for it</li><li>contests, prizes and the leaderboard</li></ul>' +
        '<p style="margin-top:14px"><a class="vp-btn" href="/partners" target="_top">Start a campaign with us</a> &nbsp; <a class="vp-link" href="' + brandHref + '">Back to ' + esc(b.name) + '</a></p></div></div></div>';

      html += '</div><aside class="vp-side">' +
        '<div class="vp-card"><h3>Nutrition Facts</h3>' + (p.nutrition ? VEProducts.label(p.nutrition) +
          '<p class="vp-src">Shown: ' + esc(p.nutrition.product) + '. ' + esc(p.nutrition_source || '') + '. Recipes change, so check the package.</p>'
          : '<p>Nutrition facts for this product are not added yet.</p>') + '</div>' +
        '<div class="vp-card vp-brandcta"><h3>Is this your product?</h3><p>Our Guides put Vegan brands in front of people looking for them. Partner with us to showcase your products here.</p><p style="margin-top:10px"><a class="vp-btn" href="/partners" target="_top">Partner with us</a></p></div>' +
        '</aside></div>';
      root.innerHTML = html;

      // Tabs, kept in the address bar (?tab=)
      function show(t) {
        if (!{ overview: 1, gallery: 1, campaigns: 1 }[t]) t = 'overview';
        [].forEach.call(root.querySelectorAll('.vp-tab'), function (b2) { b2.setAttribute('aria-selected', String(b2.getAttribute('data-tab') === t)); });
        [].forEach.call(root.querySelectorAll('.vp-panel'), function (pn) { pn.hidden = pn.getAttribute('data-panel') !== t; });
        var u = new URL(location.href); if (t === 'overview') u.searchParams.delete('tab'); else u.searchParams.set('tab', t);
        if (u.href !== location.href) history.replaceState(null, '', u.pathname + u.search + u.hash);
      }
      root.addEventListener('click', function (e) {
        var t = e.target.closest('[data-tab]') || e.target.closest('[data-go]');
        if (!t) return;
        show(t.getAttribute('data-tab') || t.getAttribute('data-go'));
        if (t.hasAttribute('data-go')) root.scrollIntoView({ block: 'start' });
      });
      show(new URLSearchParams(location.search).get('tab') || 'overview');

      rest('ve_products?brand_listing_id=eq.' + encodeURIComponent(p.brand_listing_id) + '&id=neq.' + encodeURIComponent(p.id) + '&guides=neq.%7B%7D&select=slug,product_type,name&order=product_type').then(function (more) {
        if (!Array.isArray(more) || !more.length) return;
        var box = document.getElementById('vpMore'); box.hidden = false;
        box.querySelector('.vp-more').innerHTML = more.map(function (m) { return '<a href="/products/' + encodeURIComponent(m.slug) + '">' + esc(VEProducts.title(m, b.name)) + '</a>'; }).join('');
      }).catch(function () {});
    }).catch(function () { root.innerHTML = '<div class="vp-empty">We could not load this product just now. Refresh to try again.</div>'; });
})();
</script>
</body>
</html>
