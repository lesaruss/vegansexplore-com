<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loading... — Vegans Explore</title>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="VEGANS EXPLORE"/>
<meta id="og-title" property="og:title" content="VEGANS EXPLORE Directory"/>
<meta id="og-description" property="og:description" content="Find the best Vegan-friendly businesses near you."/>
<meta id="og-image" property="og:image" content="https://vegansexplore.com/public/og-default.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta id="meta-description" name="description" content="Find the best Vegan-friendly businesses near you."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#e8f5e9;
  --ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-surface:#f7faf7;
  --ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.50);
}
html,body{min-height:100%;font-family:Montserrat,sans-serif;color:var(--ve-text);background:#f5f5f5}
#frame{width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column}

/* HERO */
.listing-hero{background:#111;padding:40px 40px 32px;border-bottom:1px solid #222;display:flex;gap:28px;align-items:stretch}
.listing-hero-avatar{width:120px;height:120px;min-width:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:28px;font-weight:900;color:#fff;overflow:hidden;align-self:flex-start}
.listing-hero-content{display:flex;align-items:flex-start;gap:16px;flex:1;min-width:0}
.listing-hero-avatar img{width:100%;height:100%;object-fit:cover}
.listing-hero-body{flex:1;min-width:0}
.listing-breadcrumb{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#666;margin-bottom:8px}
.listing-breadcrumb a{color:#5EC47A;text-decoration:none}
.listing-breadcrumb a:hover{text-decoration:underline}
.listing-name{font-size:32px;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px}
.listing-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.badge-cat{font-size:10px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:#5EC47A;color:#000}
.badge-subcat{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,0.1);color:#ccc;border:1px solid #333}
.badge-verified{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:rgba(94,196,122,0.15);color:#5EC47A;border:1px solid rgba(94,196,122,0.3);display:inline-flex;align-items:center;gap:4px}
.listing-tagline{font-size:13px;color:#aaa;line-height:1.5;max-width:560px}
.listing-hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex-shrink:0}
.listing-rating{text-align:center}
.rating-num{font-size:28px;font-weight:900;color:#fff;line-height:1}
.rating-stars{font-size:12px;color:#F69820;letter-spacing:1px}
.rating-count{font-size:10px;font-weight:600;color:#666;letter-spacing:0.06em}
.vote-hero-btn{font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:12px 20px;border-radius:6px;background:#5EC47A;color:#000;border:none;cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.vote-hero-btn:hover{background:#4db368}
.vote-hero-btn:focus-visible{outline:3px solid #5EC47A;outline-offset:2px}
.vote-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(0,0,0,0.16);color:inherit;font-size:10px;font-weight:800;letter-spacing:0;line-height:1}
.save-hero-btn{font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:12px 24px;border-radius:6px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.35);cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.save-hero-btn:hover{border-color:#fff}
.save-hero-btn:focus-visible{outline:3px solid #5EC47A;outline-offset:2px}
.save-hero-btn.saved{background:#5EC47A;color:#000;border-color:#5EC47A}
.save-hero-btn.saved svg{fill:#000}

/* SOUTH FLORIDA REGION HERO — city-background treatment, scoped so other regions keep the flat #111 hero */
.listing-hero.city-bg{position:relative;background-color:#111;background-size:cover;background-position:center center}
.listing-hero.city-bg::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,14,10,0.82) 0%, rgba(6,14,10,0.68) 45%, rgba(6,14,10,0.88) 100%)}
.listing-hero.city-bg .listing-hero-avatar,.listing-hero.city-bg .listing-hero-content{position:relative}
.listing-hero.city-bg .listing-breadcrumb{color:rgba(255,255,255,0.72)}
.listing-hero.city-bg .badge-verified{background:rgba(6,14,10,0.55);color:#8ff0ac;border-color:rgba(143,240,172,0.6)}

/* QUICK INFO BAR */
.info-bar{background:#f9f9f9;border-bottom:1px solid var(--ve-border);padding:12px 40px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.info-chip{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ve-text-75);letter-spacing:0.04em}
.info-chip svg{color:#5EC47A;flex-shrink:0}
.info-chip.open-now{color:#2d7d31}
.info-chip.closed{color:#c62828}
.info-chip a{color:inherit;text-decoration:none}
.info-chip a:hover{text-decoration:underline}

/* CONTENT AREA */
.listing-body{display:grid;grid-template-columns:1fr 320px;gap:28px;padding:32px 40px;max-width:100%}
.listing-main{}

/* PERSISTENT TWO-COLUMN PAGE LAYOUT */
.listing-page-grid{display:grid;grid-template-columns:2fr 1fr;gap:0;align-items:start}
.listing-page-main{min-width:0}
.listing-sidebar{padding:28px 40px 40px 28px;position:sticky;top:0;max-height:100vh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.listing-sidebar::-webkit-scrollbar{display:none}

/* SECTION */
.section{margin-bottom:28px}
.section-title{font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-75);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ve-green-light)}
.about-text{font-size:14px;line-height:1.75;color:var(--ve-text)}

/* DELIVERY BADGES */
.delivery-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.delivery-btn{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:10px 18px;border-radius:6px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text);text-decoration:none;transition:.15s}
.delivery-btn:hover{border-color:#5EC47A;color:#2d7d31}
.delivery-btn:focus-visible{outline:2px solid #5EC47A;outline-offset:2px}

/* HOURS TABLE */
.hours-table{width:100%;border-collapse:collapse}
.hours-table td{padding:6px 0;font-size:12px;font-weight:600;color:var(--ve-text-75);border-bottom:1px solid var(--ve-border)}
.hours-table td:first-child{font-weight:800;color:var(--ve-text);width:100px}
.hours-table tr.today td{color:#2d7d31;font-weight:800}

/* PLATFORMS (MEDIA) */
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.platform-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;border:1px solid var(--ve-border);background:#fff;text-decoration:none;color:var(--ve-text);font-family:Montserrat,sans-serif;transition:.15s;cursor:pointer}
.platform-btn:hover{border-color:#5EC47A;background:var(--ve-green-light)}
.platform-btn:focus-visible{outline:2px solid #5EC47A;outline-offset:2px}
.platform-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.platform-label{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.platform-sub{font-size:10px;font-weight:600;color:var(--ve-text-50);margin-top:1px}

/* SIDEBAR CARDS */
.side-card{background:#fff;border:1px solid var(--ve-border);border-radius:10px;padding:18px;margin-bottom:14px}
.side-card-title{font-size:10px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:12px}
.contact-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--ve-text-75)}
.contact-row svg{flex-shrink:0;margin-top:1px;color:#5EC47A}
.contact-row a{color:var(--ve-text-75);text-decoration:none}
.contact-row a:hover{color:#2d7d31;text-decoration:underline}
.social-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.social-btn{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text-75);text-decoration:none;transition:.15s}
.social-btn:hover{border-color:#5EC47A;color:#2d7d31}
.claim-box{background:#0a1a0f;border:1px solid #2d5a3a;border-radius:8px;padding:14px 16px;text-align:center}
.claim-box p{font-size:11px;color:#aaa;line-height:1.5;margin-bottom:10px}
.claim-btn{display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:8px 16px;border-radius:4px;background:transparent;color:#5EC47A;border:1px solid #5EC47A;text-decoration:none;transition:.15s}
.claim-btn:hover{background:#5EC47A;color:#000}

/* PHOTOS - overview carousel (desktop + mobile) */
.photos-grid{display:none}
.photos-carousel-wrap{display:block}
.photos-track{display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;gap:8px}
.photos-track::-webkit-scrollbar{display:none}
.photo-slide{display:flex;gap:8px;flex:0 0 100%;scroll-snap-align:start}
.photo-slide .photo-item{flex:1;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#eee}
.photo-slide .photo-item img{width:100%;height:100%;object-fit:cover}
.photos-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.photo-dot{width:6px;height:6px;border-radius:50%;background:var(--ve-border);transition:background .2s;cursor:pointer}
.photo-dot.active{background:var(--ve-green)}

/* PHOTOS TAB — 2-col grid (sidebar is persistent on right) */
.photos-tab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos-tab-grid .photo-item{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#eee;cursor:pointer;position:relative}
.photos-tab-grid .photo-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.photos-tab-grid .photo-item:hover img{transform:scale(1.04)}
.photos-tab-grid .photo-item:focus-visible{outline:2px solid #5EC47A;outline-offset:2px}

/* LIGHTBOX */
.lb-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);align-items:center;justify-content:center}
.lb-overlay.open{display:flex}
.lb-img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;display:block}
.lb-close{position:absolute;top:16px;right:20px;font-size:28px;font-weight:700;color:#fff;cursor:pointer;line-height:1;background:none;border:none;font-family:inherit}
.lb-close:hover{color:#5EC47A}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;background:none;border:none;font-family:inherit;padding:12px;line-height:1}
.lb-arrow:hover{color:#fff}
.lb-prev{left:12px}
.lb-next{right:12px}
.lb-caption{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap}

/* AT A GLANCE */
.glance-groups{display:flex;flex-direction:column;gap:16px}
.glance-group-label{font-size:9px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:8px}
.glance-chips{display:flex;flex-wrap:wrap;gap:6px}
.glance-chip{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border-radius:20px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text-75);transition:.15s}
.glance-chip.on{background:var(--ve-green-light);color:#2d7d31;border-color:#c8e6c9}
.glance-chip.on.community{background:#0a1a0f;color:#5EC47A;border-color:#2d5a3a}
.glance-chip.off{opacity:0.3}

/* COMMUNITY SUPPORT */
.community-stats{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--ve-border);border-radius:10px;overflow:hidden}
.community-stat{flex:1;padding:16px 20px;text-align:center;background:#fff}
.community-stat+.community-stat{border-left:1px solid var(--ve-border)}
.cstat-num{font-size:28px;font-weight:900;color:var(--ve-text);line-height:1;margin-bottom:4px}
.cstat-label{font-size:9px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-50)}
.donate-card{background:var(--ve-surface);border:1px solid var(--ve-border);border-radius:10px;padding:18px}
.donate-text{font-size:12px;line-height:1.7;color:var(--ve-text-75);margin-bottom:14px}
.donate-row{display:flex;gap:8px;margin-bottom:10px}
.donate-input{flex:1;font-size:12px;font-weight:700;font-family:Montserrat,sans-serif;padding:10px 14px;border:1px solid var(--ve-border);border-radius:6px;outline:none;color:var(--ve-text)}
.donate-input:focus{border-color:var(--ve-green)}
.donate-btn{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:10px 18px;border-radius:6px;background:var(--ve-green);color:#fff;border:none;cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;transition:background .15s}
.donate-btn:hover{background:var(--ve-green-dark)}
.member-note{font-size:11px;color:var(--ve-text-50);line-height:1.5}
.member-note a{color:var(--ve-green-dark);font-weight:700;text-decoration:none}
.member-note a:hover{text-decoration:underline}
.donate-confirm{font-size:12px;font-weight:700;color:#2d7d31;margin-top:8px;display:none}

/* TABS */
.listing-tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ve-border);background:#fff;z-index:10;scrollbar-width:none;position:sticky;top:0}
.listing-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border:none;background:none;color:var(--ve-text-50);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:Montserrat,sans-serif;transition:color .15s,border-color .15s;white-space:nowrap}
.tab-btn:hover{color:var(--ve-text)}
.tab-btn.active{color:var(--ve-green-dark);border-bottom-color:var(--ve-green)}
.tab-btn:focus-visible{outline:2px solid var(--ve-green);outline-offset:-2px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* LOCKED TAB STATE */
.tab-locked{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;gap:12px}
.tab-locked-icon{width:56px;height:56px;border-radius:50%;background:var(--ve-green-light);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.tab-locked-title{font-size:15px;font-weight:900;color:var(--ve-text);letter-spacing:-.01em}
.tab-locked-sub{font-size:13px;color:var(--ve-text-50);max-width:260px;line-height:1.65}
.tab-locked-cta{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 20px;border-radius:6px;border:1px solid var(--ve-green);color:var(--ve-green-dark);background:var(--ve-green-light);text-decoration:none;margin-top:4px;display:inline-block}

/* LOADING / ERROR */
.listing-loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:13px;font-weight:700;color:var(--ve-text-50);letter-spacing:0.1em}
.listing-not-found{text-align:center;padding:80px 40px}
.listing-not-found h2{font-size:24px;font-weight:900;margin-bottom:12px}
.listing-not-found p{color:var(--ve-text-50);font-size:14px;margin-bottom:24px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#5EC47A;text-decoration:none}
.back-link:hover{text-decoration:underline}

/* OWNERSHIP TAGS */
.ownership-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ownership-tag{font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--ve-green-light);color:#2d7d31;border:1px solid #c8e6c9}

@media(max-width:768px){
  .listing-hero{flex-direction:row;padding:14px 16px;gap:12px;align-items:stretch}
  .listing-hero-avatar{width:100px;min-width:100px;height:100px;align-self:flex-start;border-radius:8px;font-size:20px;flex-shrink:0}
  .listing-hero-content{display:flex;flex-direction:row;flex:1;min-width:0;align-items:center;gap:10px}
  .listing-hero-body{flex:1;min-width:0}
  .listing-breadcrumb{font-size:9px;letter-spacing:0.15em}
  .listing-tagline{display:none}
  .listing-name{font-size:15px;margin-bottom:5px}
  .listing-badges{gap:5px;margin-bottom:0}
  .badge-cat{font-size:9px;padding:3px 8px}
  .badge-subcat{font-size:9px;padding:3px 8px}
  .listing-hero-right{flex-direction:column;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
  .vote-hero-btn{padding:10px 14px;font-size:10px}
  .save-hero-btn{padding:10px 14px;font-size:10px}
  .photos-grid{display:none}
  .photos-carousel-wrap{display:block}
  .donate-row{flex-direction:column}
  .vote-badge{font-size:9px;min-width:18px;height:18px}
  .listing-body{grid-template-columns:1fr;padding:20px 16px}
  .listing-page-grid{grid-template-columns:1fr}
  .listing-sidebar{position:static;padding:0 16px 24px;max-height:none}
  .info-bar{padding:10px 16px;gap:12px}
  .platform-grid{grid-template-columns:1fr}
  .photos-tab-grid{grid-template-columns:1fr 1fr}
  .vc-grid{grid-template-columns:1fr}
}

/* MOBILE STICKY BAR */
.mobile-sticky{display:none}
@media(max-width:768px){
  .mobile-sticky{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid var(--ve-border);padding:10px 12px;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .mobile-sticky-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:12px 6px;border-radius:8px;border:none;cursor:pointer;font-family:Montserrat,sans-serif;text-decoration:none;transition:.15s}
  .mobile-sticky-btn.primary{background:var(--ve-green);color:#fff}
  .mobile-sticky-btn.primary:hover{background:var(--ve-green-dark)}
  .mobile-sticky-btn.secondary{background:var(--ve-green-light);color:#2d7d31;border:1px solid #c8e6c9}
  /* Keep the fixed action bar from covering the end of the page (the shared footer). */
  body:has(.mobile-sticky){padding-bottom:80px}
}

/* UNLOCK SECTION */
.unlock-section{border:1px solid var(--ve-border);border-radius:10px;padding:24px;text-align:center;background:var(--ve-surface)}
.unlock-section h3{font-size:14px;font-weight:900;color:var(--ve-text);margin:10px 0 8px;letter-spacing:-.01em}
.unlock-section p{font-size:12px;color:var(--ve-text-50);line-height:1.65;max-width:340px;margin:0 auto 16px}
.unlock-features{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.unlock-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:20px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text-50)}

/* MENU TAB */
.menu-nav{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
/* Vegan aisle: a grocery store's page lists the Guide products it carries, one category at a time (Sean, 2026-10-08) */
.aisle{padding:28px 40px 40px}
.aisle-lede{font-size:14px;line-height:1.6;color:var(--ve-text-75);margin:0 0 16px;max-width:860px}
.aisle-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}

<script>
// ── Global lightbox (must be outside IIFE so event handlers can reach it) ──
var _lbReg = {};   // key → string[] of image URLs
var _lbKey = null;
var _lbIdx = 0;

function openLightbox(key, idx){
  var imgs = _lbReg[key];
  if(!imgs || !imgs.length) return;
  _lbKey = key; _lbIdx = idx;
  var overlay = document.getElementById('lb-overlay');
  var img    = document.getElementById('lb-img');
  var cap    = document.getElementById('lb-caption');
  if(!overlay || !img) return;
  img.src = imgs[_lbIdx];
  if(cap) cap.textContent = (_lbIdx+1) + ' / ' + imgs.length;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  var overlay = document.getElementById('lb-overlay');
  if(overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
}
function moveLightbox(dir){
  var imgs = _lbReg[_lbKey];
  if(!imgs) return;
  _lbIdx = (_lbIdx + dir + imgs.length) % imgs.length;
  var img = document.getElementById('lb-img');
  var cap = document.getElementById('lb-caption');
  if(img) img.src = imgs[_lbIdx];
  if(cap) cap.textContent = (_lbIdx+1) + ' / ' + imgs.length;
}

// Wire lightbox controls once DOM is ready
document.addEventListener('DOMContentLoaded', function(){
  var overlay = document.getElementById('lb-overlay');
  var closeBtn = document.getElementById('lb-close');
  var prevBtn  = document.getElementById('lb-prev');
  var nextBtn  = document.getElementById('lb-next');
  if(closeBtn) closeBtn.addEventListener('click', closeLightbox);
  if(prevBtn)  prevBtn.addEventListener('click',  function(){ moveLightbox(-1); });
  if(nextBtn)  nextBtn.addEventListener('click',  function(){ moveLightbox(1); });
  if(overlay)  overlay.addEventListener('click',  function(e){ if(e.target === overlay) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if(!overlay || !overlay.classList.contains('open')) return;
    if(e.key === 'Escape')     closeLightbox();
    if(e.key === 'ArrowLeft')  moveLightbox(-1);
    if(e.key === 'ArrowRight') moveLightbox(1);
  });
  // Event delegation for photo items
  document.addEventListener('click', function(e){
    var item = e.target.closest('[data-lb-key]');
    if(item) openLightbox(item.dataset.lbKey, parseInt(item.dataset.lbIdx, 10));
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var item = document.activeElement && document.activeElement.closest('[data-lb-key]');
    if(item){ e.preventDefault(); openLightbox(item.dataset.lbKey, parseInt(item.dataset.lbIdx, 10)); }
  });
});

function fetchListing(slug){
  var url = SUPABASE_URL + '/rest/v1/listings?slug=eq.' + encodeURIComponent(slug) + '&status=eq.approved&select=*&limit=1';
  return fetch(url, { headers:{ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })

function initials(name){
  var words = (name||'').trim().split(/\s+/);
  if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return (name||'').substring(0,2).toUpperCase();
}

function stars(rating){
  if(!rating) return '';
  var full = Math.floor(rating), half = (rating - full) >= 0.5 ? 1 : 0, empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

function getCategoryType(cat){
  if(FOOD_CATS.indexOf(cat) !== -1) return 'food';
  if(MEDIA_CATS.indexOf(cat) !== -1) return 'media';
  return 'general';
}

function hoursMap(hoursJson){
  // Normalize: array [{day,hours}] or [{day,openingHours}] → {Day: "hours string"}
  if(!hoursJson) return {};
  if(typeof hoursJson === 'string'){ try{ hoursJson = JSON.parse(hoursJson); }catch(e){ return {}; } }
  if(Array.isArray(hoursJson)){
    var map = {};
    hoursJson.forEach(function(h){
      var d = h.day || h.name || '';
      var t = h.hours || h.openingHours || h.time || '';
      if(d) map[d] = t;
    });
    return map;
  }
  return hoursJson; // already object
}

function renderHours(hoursJson){
  if(!hoursJson) return '<p style="font-size:12px;color:var(--ve-text-50)">Hours not available</p>';
  var map = hoursMap(hoursJson);
  var today = DAYS[new Date().getDay()];
  var rows = DAYS.map(function(day){
    var h = map[day] || map[day.toLowerCase()] || map[day.substring(0,3)] || 'N/A';
    var cls = day === today ? ' class="today"' : '';
    return '<tr'+cls+'><td>'+esc(day.substring(0,3))+'</td><td>'+esc(h)+'</td></tr>';
  }).join('');
  return '<table class="hours-table"><tbody>'+rows+'</tbody></table>';
}

function renderPhotos(photos, prefix, tabMode){
  if(!photos || !photos.length) return '';
  prefix = prefix || 'photos';
  var lbKey = prefix + '-lb';
  _lbReg[lbKey] = photos; // register in global lightbox registry

  function photoItem(url, idx){
    return '<div class="photo-item" tabindex="0" role="button" aria-label="View photo" data-lb-key="'+lbKey+'" data-lb-idx="'+idx+'">'+
      '<img src="'+esc(url)+'" alt="Photo" loading="lazy"/></div>';
  }

  if(tabMode){
    // Photos tab: 2-col full grid, all photos, lightbox on click
    return '<div class="photos-tab-grid">'+
      photos.map(function(url,i){ return photoItem(url, i); }).join('')+
    '</div>';
  }

  // Overview: desktop 3-col x 2-row (max 6), mobile 2-up carousel
  // Overview: 3-per-slide carousel with dots, desktop + mobile
  var triplets = [];
  for(var i=0; i<photos.length; i+=3) triplets.push(photos.slice(i, i+3));
  var slides = triplets.map(function(trip, ti){
    return '<div class="photo-slide">'+trip.map(function(url, j){
      return photoItem(url, ti*3+j);
    }).join('')+'</div>';
  }).join('');
  var dots = triplets.length > 1 ? '<div class="photos-dots" id="'+prefix+'-dots">'+
    triplets.map(function(_,i){ return '<span class="photo-dot'+(i===0?' active':'')+'"></span>'; }).join('')+
  '</div>' : '';
  var carouselHtml = '<div class="photos-carousel-wrap"><div class="photos-track" id="'+prefix+'-track">'+slides+'</div>'+dots+'</div>';

  return carouselHtml;
}

function wireCarousel(prefix){
  var track = document.getElementById(prefix+'-track');
  if(track && !track.dataset.wired){
    track.dataset.wired = '1';
    track.addEventListener('scroll', function(){
      var dots = document.querySelectorAll('#'+prefix+'-dots .photo-dot');
      if(!dots.length) return;
      var idx = Math.round(track.scrollLeft / track.offsetWidth);
      dots.forEach(function(d,i){ d.classList.toggle('active', i===idx); });
    }, {passive:true});
    document.querySelectorAll('#'+prefix+'-dots .photo-dot').forEach(function(dot,i){
      dot.addEventListener('click', function(){
        track.scrollTo({left: i * track.offsetWidth, behavior:'smooth'});
      });
    });
  }
}

function renderAtAGlance(l){
  var accom = l.accommodations || [];
  function has(val){ return accom.indexOf(val) !== -1; }

  // Build data objects first so we can count confirmed before rendering
  function c(label, active, type){ return {label:label, active:!!active, type:type||''}; }

  var groups = [
    { label:'Atmosphere', items:[
      c('Casual',       l.atmosphere==='casual'),
      c('Upscale',      l.atmosphere==='upscale'),
      c('Fine Dining',  l.atmosphere==='fine-dining'),
      c('Fast Casual',  l.atmosphere==='fast-casual'),
      c('Bar / Lounge', l.atmosphere==='bar-lounge'),
      c('Late Hours',   !!l.late_hours),
      c('Live Music',   has('Live Music')),
    ]},
    { label:'Seating', items:[
      c('Dine-In',         has('Dine-in')),
      c('Indoor Seating',  !!l.indoor_seating),
      c('Outdoor Seating', has('Outdoor Seating')),
      c('Reservations',    has('Reservations')),
    ]},
    { label:'Amenities', items:[
      c('WiFi',            has('WiFi')),
      c('High-Speed WiFi', !!l.high_speed_wifi),
      c('Parking',         has('Parking')),
      c('Takeout',         has('Takeout')),
      c('Catering',        has('Catering')||l.category==='Catering'),
      c('BYOB',            has('BYOB')),
      c('Dog-Friendly',    has('Dog-Friendly')),
      c('Family-Friendly', has('Family-Friendly')),
    ]},
    { label:'Accessibility', items:[
      c('Wheelchair Accessible',   has('Wheelchair Accessible')),
      c('Gender-Neutral Restroom', false),
      c('Service Animal Friendly', false),
    ]},
    { label:'Ownership', items:[
      c('LGBTQ+-Owned',          !!(l.lgbtq_friendly || l.is_lgbtq_owned), 'community'),
      c('Black-Owned',           !!l.is_black_owned,    'community'),
      c('Women-Owned',           !!l.is_women_owned,    'community'),
      c('Latino/Hispanic-Owned', !!l.is_latino_owned,   'community'),
      c('Asian-Owned',           !!l.is_asian_owned,    'community'),
      c('Immigrant-Owned',       !!l.is_immigrant_owned,'community'),
      c('Veteran-Owned',         !!l.is_veteran_owned,  'community'),
      c('Indigenous-Owned',      !!l.is_indigenous_owned, 'community'),
      c('Family-Owned',          !!l.is_family_owned,   'community'),
    ]}
  ];

  // Count confirmed attributes
  var confirmedCount = 0;
  groups.forEach(function(g){ g.items.forEach(function(ci){ if(ci.active) confirmedCount++; }); });

  // Cold start: unclaimed listing with fewer than 4 confirmed attributes
  var coldStart = !l.claimed_by_member_id && confirmedCount < 4;

  function chipHtml(item){
    var cls = 'glance-chip' + (item.active ? ' on'+(item.type?' '+item.type:'') : ' off');
    return '<span class="'+cls+'">'+item.label+'</span>';
  }

  // Empty cold start - no confirmed attributes at all
  if(coldStart && confirmedCount === 0){
    return '<div class="section"><h2 class="section-title">At a Glance</h2>'+
      '<div style="text-align:center;padding:20px;background:var(--ve-surface);border-radius:8px;border:1px solid var(--ve-border)">'+
        '<p style="font-size:12px;color:var(--ve-text-50);line-height:1.65;margin-bottom:12px">Atmosphere, seating, accessibility, and community attributes appear here once this business is claimed.</p>'+
        '<a href="/claim?listing='+encodeURIComponent(l.slug||'')+'" style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ve-green-dark);text-decoration:none;border:1px solid var(--ve-green);padding:8px 16px;border-radius:4px;background:var(--ve-green-light);display:inline-block">Own this business? Add details</a>'+
      '</div>'+
    '</div>';
  }

  var html = '<div class="glance-groups">';
  groups.forEach(function(g){
    // Only show confirmed attributes — never show grayed-out options
    var chips = g.items.filter(function(ci){ return ci.active; }).map(chipHtml);
    if(!chips.length) return;
    html += '<div><div class="glance-group-label">'+g.label+'</div><div class="glance-chips">'+chips.join('')+'</div></div>';
  });
  html += '</div>';

  var footer = coldStart
    ? '<div style="margin-top:14px;text-align:center"><a href="/claim?listing='+encodeURIComponent(l.slug||'')+'" style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ve-green-dark);text-decoration:none">Own this business? Add missing details</a></div>'
    : '';

  return '<div class="section"><h2 class="section-title">At a Glance</h2>'+html+footer+'</div>';
}

// A grocery store (tag ve-grocery-store, Sean 2026-10-08): its Vegan aisle is every Guide product mapped
// to it (ve_product_stores, filled automatically from the Guides). Buy link, best first: an affiliate deal
// (a /go/ tracked link), the product's own page at this store, the store's search for it (only where
// details.store.search_checked says the search works), then the store's website.
function isGroceryStore(l){ return (l.tags||[]).indexOf('ve-grocery-store') >= 0; }
// Department, category, search and sort (Sean, 2026-10-08: "whatever categories are available, a drop down,
// and then it just shows you those items"), most voted first, 12 at a time. Each card opens the product page.
function loadAisle(l){
  var url = SUPABASE_URL + '/rest/v1/ve_product_stores?select=product_id,buy_url,affiliate_link_code,ve_products(id,slug,product_type,name,made_from,note,guides,department,image_url,listings!ve_products_brand_listing_id_fkey(slug,name,status,color,initials,vote_count,logo_url))&store_listing_id=eq.' + encodeURIComponent(l.id) + '&removed_at=is.null';
  fetch(url, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } }).then(function(r){ return r.json(); }).catch(function(){ return []; }).then(function(rows){
    var panel = document.getElementById('tab-aisle'); if(!panel) return;
    rows = (Array.isArray(rows) ? rows : []).filter(function(r){ var p = r.ve_products; return p && p.guides && p.guides.length && p.listings && p.listings.status === 'approved'; });
    if(!rows.length){ panel.innerHTML = '<div class="aisle"><p class="aisle-lede">Our Guides have not found products at ' + esc(l.name) + ' yet. They show up here as soon as a Guide lists one.</p></div>'; showListingTab('aisle'); return; }
    var want = ''; try { want = new URLSearchParams(location.search).get('product') || ''; } catch(e){}
    function count(key, val){ return rows.filter(function(r){ return (r.ve_products[key] || '') === val; }).length; }
    function uniq(key, within){ var o = []; rows.forEach(function(r){ var p = r.ve_products, v = p[key] || ''; if(v && o.indexOf(v) < 0 && (!within || p.department === within)) o.push(v); }); return o.sort(); }
    var S = { dept: '', cat: '', q: '', sort: 'votes', all: false };
    var wanted = rows.filter(function(r){ return r.ve_products.id === want; })[0];
    if(wanted){ S.dept = wanted.ve_products.department || ''; S.cat = wanted.ve_products.product_type; }
    panel.innerHTML = '<div class="aisle"><p class="aisle-lede">' + rows.length + ' Vegan ' + (rows.length === 1 ? 'product' : 'products') + ' our Guides have found at ' + esc(l.name) + '. Stock changes by location, so check your store.</p>' +
      '<div class="aisle-tools"><select id="aisleDept" aria-label="Department"></select><select id="aisleCat" aria-label="Category"></select>' +
      '<input type="search" id="aisleQ" placeholder="Search this aisle (oat, cream cheese, a brand...)" aria-label="Search this aisle">' +
      '<select id="aisleSort" aria-label="Sort"><option value="votes">Most voted</option><option value="az">A to Z</option></select><span class="aisle-count" id="aisleCount"></span></div>' +
      '<div class="aisle-grid" id="aisleGrid"></div><button type="button" class="aisle-more" id="aisleMore" hidden></button></div>';
    var dEl = document.getElementById('aisleDept'), cEl = document.getElementById('aisleCat'), qEl = document.getElementById('aisleQ'), sEl = document.getElementById('aisleSort');
    function fillCats(){
      cEl.innerHTML = '<option value="">All categories</option>' + uniq('product_type', S.dept).map(function(c){ return '<option value="' + esc(c) + '"' + (c === S.cat ? ' selected' : '') + '>' + esc(c) + ' (' + rows.filter(function(r){ return r.ve_products.product_type === c && (!S.dept || r.ve_products.department === S.dept); }).length + ')</option>'; }).join('');
    }
    dEl.innerHTML = '<option value="">All departments</option>' + uniq('department').map(function(d){ return '<option value="' + esc(d) + '"' + (d === S.dept ? ' selected' : '') + '>' + esc(d) + ' (' + count('department', d) + ')</option>'; }).join('');
    fillCats();
    function card(r){
      var p = r.ve_products, b = p.listings;
      var pic = p.image_url || b.logo_url;
      var av = pic ? '<div class="aisle-av" style="background-image:url(\'' + esc(pic) + '\')"></div>' : '<div class="aisle-av" style="background:' + esc(b.color || '#1f5f22') + '">' + esc(b.initials || b.name.charAt(0)) + '</div>';
      return '<a class="aisle-card' + (p.id === want ? ' hit' : '') + '" id="product-' + esc(p.id) + '" href="/products/' + encodeURIComponent(p.slug) + '">' + av +
        '<div class="aisle-main"><div class="aisle-type">' + esc(p.product_type) + '</div><div class="aisle-name">' + esc(VEProducts.title(p, b.name)) + '</div>' +
        (p.made_from ? '<div class="aisle-sub">Made from ' + esc(p.made_from.charAt(0).toLowerCase() + p.made_from.slice(1)) + (p.note ? '. ' + esc(p.note) : '') + '</div>' : '') +
        '<div class="aisle-foot"><span class="aisle-votes">' + (b.vote_count || 0) + ' votes for ' + esc(b.name) + '</span></div></div></a>';
    }
    function draw(){
      var q = S.q.trim().toLowerCase();
      var list = rows.filter(function(r){ var p = r.ve_products;
        return (!S.dept || p.department === S.dept) && (!S.cat || p.product_type === S.cat) &&
          (!q || (p.listings.name + ' ' + p.product_type + ' ' + (p.name || '') + ' ' + (p.made_from || '') + ' ' + (p.note || '')).toLowerCase().indexOf(q) >= 0); });
      list.sort(function(x, y){ var a = x.ve_products, b = y.ve_products;
        return S.sort === 'az' ? VEProducts.title(a, a.listings.name).localeCompare(VEProducts.title(b, b.listings.name)) : ((b.listings.vote_count || 0) - (a.listings.vote_count || 0)) || a.listings.name.localeCompare(b.listings.name); });
      if(want) list.sort(function(x, y){ return (y.ve_products.id === want) - (x.ve_products.id === want); });
      var shown = S.all ? list : list.slice(0, 12);
      document.getElementById('aisleGrid').innerHTML = shown.map(card).join('') || '<div class="aisle-empty">Nothing matches. Try another word or category.</div>';
      document.getElementById('aisleCount').textContent = list.length + (list.length === 1 ? ' product' : ' products');
      var more = document.getElementById('aisleMore'); more.hidden = list.length <= 12 || S.all; more.textContent = 'Show all ' + list.length;
    }
    dEl.addEventListener('change', function(){ S.dept = dEl.value; S.cat = ''; S.all = false; fillCats(); draw(); });
    cEl.addEventListener('change', function(){ S.cat = cEl.value; S.all = false; draw(); });
    qEl.addEventListener('input', function(){ S.q = qEl.value; S.all = false; draw(); });
    sEl.addEventListener('change', function(){ S.sort = sEl.value; draw(); });
    document.getElementById('aisleMore').addEventListener('click', function(){ S.all = true; draw(); });
    // A card opens the product's page on Vegans Explore (Sean, 2026-10-08: keep people in our environment).
    draw();
    showListingTab('aisle');
    var hit = want && document.getElementById('product-' + want);
    if(hit) setTimeout(function(){ hit.scrollIntoView({ block: 'center' }); }, 150);
  });
}

// A brand page (Sean, 2026-10-08: "so we don't have like a thousand different pages let's just make it a little mini
// web experience for Oatly and then as they become partners more tabs open"). A brand with products in our Guides
// (a listings.details key in VEProducts.SOURCES) gets two tabs (Sean, 2026-10-09: "all we have for products is a main
// page, products, and then... a for Oatly page that only Oatly sees"; the Gallery tab was removed):
//   Overview  about the brand (details.about), its products, where to find them
//   Products  the list, then one product (?tab=products&product=<slug>&v=<version>), drawn by /public/ve-product-view.js;
//             its Nutrition Facts sit at the top of the right column, the billboard under them
// /products/<slug> forwards here. The Campaign tab shows only while the brand runs a campaign with us.
// Featured (Sean, 2026-10-08: "we do Oatly first, but then everyone else has like a basic page... this featured page
// for anyone who does the 111"): our city art. A brand we are pursuing is granted it
// (details.brand_featured), and a Brand Partner (ve_verified_tier 'brand', see ve-claims) keeps it.
function isFeaturedBrand(l){ var d = l.details || {}; return !!(d.brand_featured || verifiedTier(l) === 'brand'); }
// The For <Brand> tab: the brand's owner, a super admin, or a visitor who came on the link we sent (?tab=brand).
function brandDoorOpen(l){
  // Once someone arrives on the brand's link, the tab stays for the rest of their visit.
  var key = 've_door_' + l.slug;
  if(new URLSearchParams(location.search).get('tab') === 'brand'){ try{ sessionStorage.setItem(key, '1'); }catch(e){} return true; }
  try{ if(sessionStorage.getItem(key)) return true; }catch(e){}
  try{
    var m = window.VEAuth && VEAuth.isLoggedIn() ? (VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember()) : null;
    return !!(m && (m.is_superadmin || m.id === l.owner_member_id || m.id === l.claimed_by_member_id));
  }catch(e){ return false; }
}
function isProductBrand(l){
  var d = l.details || {};
  return !isGroceryStore(l) && !!window.VEProducts && !!window.VEProductView && (VEProducts.SOURCES || []).some(function(k){ return Array.isArray(d[k]) && d[k].length; });
}
var BSITE_SELECT = 'id,slug,product_type,name,made_from,note,guides,department,nutrition,nutrition_source,image_url,image_credit,fdc,gallery,certifications,brand_says,brand_url,variants,' +
  've_product_stores(removed_at,listings(slug,name,status,logo_url,color,initials))';
function loadBrandSite(l){
  var url = SUPABASE_URL + '/rest/v1/ve_products?brand_listing_id=eq.' + encodeURIComponent(l.id) + '&guides=neq.%7B%7D&select=' + BSITE_SELECT + '&order=product_type';
  var pane = document.getElementById('bsite-products'), side = document.getElementById('bsite-nf');
  var ov = document.querySelector('#tab-overview > div');
  VEProductView.css();
  Promise.all([fetch(url, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } }).then(function(r){ return r.json(); }).catch(function(){ return []; }), partnerStatus(l)]).then(function(res){
    var rows = Array.isArray(res[0]) ? res[0] : [], PS = res[1] || { partner: false };

// Is the signed-in visitor this brand's partner (ve-claims partner_status)? ?partner=preview shows the partner's view to
// anyone, labelled; its buttons work only for a real partner or a super admin.
function partnerStatus(l){
  var q = new URLSearchParams(location.search).get('partner');
  var signed = !!(window.VEAuth && VEAuth.isLoggedIn && VEAuth.isLoggedIn());
  var real = signed ? fetch(SUPABASE_URL + '/functions/v1/ve-claims', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + VEAuth.getToken() },
    body: JSON.stringify({ action: 'partner_status', listing_id: l.id }) }).then(function(r){ return r.json(); }).catch(function(){ return {}; }) : Promise.resolve({});
  return real.then(function(d){
    d = d || {};
    if(q === 'preview') return { partner: true, preview: true, real: !!d.partner, confirmed: !!d.confirmed, interests: d.interests || [] };
    // A super admin sees the offer as a brand would; ?partner=preview shows them the partner's home.
    return { partner: !!d.partner && !d.admin, real: !!d.partner, confirmed: !!d.confirmed, interests: d.interests || [], plan: d.plan || null };

function menuTabContent(items){
  if(!items||!items.length) return '<div class="tab-locked"><div class="tab-locked-title">No menu items yet</div><div class="tab-locked-sub">Menu items will appear here once this listing is updated.</div></div>';
  var cats=[];var catMap={};
  items.forEach(function(item){
    if(!catMap[item.category]){catMap[item.category]=[];cats.push(item.category);}
    catMap[item.category].push(item);
  });
  // Build dropdown options
  var opts='';
  cats.forEach(function(cat){
    opts+='<option value="'+esc(cat)+'">'+esc(cat)+'</option>';
  });
  // Build all category item blocks (hidden by default, first shown)
  var blocks='';
  cats.forEach(function(cat,ci){
    blocks+='<div class="menu-category" id="menu-cat-'+ci+'" style="display:'+(ci===0?'block':'none')+'">';
    catMap[cat].forEach(function(item){
      var tags='';
      if(item.is_featured) tags+='<span class="menu-item-tag pick">Chef\'s Pick</span>';
      if(item.is_gluten_free) tags+='<span class="menu-item-tag gf">GF</span>';
      blocks+='<div class="menu-item">'+
        ((item.image || item.image_url) ? '<img class="menu-item-img" src="'+esc(item.image || item.image_url)+'" alt="'+esc(item.name)+'" loading="lazy">' : '')+
        '<div class="menu-item-info">'+
          '<div class="menu-item-name">'+esc(item.name)+'</div>'+
          (item.description?'<div class="menu-item-desc">'+esc(item.description)+'</div>':'')+
          (tags?'<div class="menu-item-tags">'+tags+'</div>':'')+
          ((item.buy || item.nutrition) ? '<div class="menu-item-actions">'+
            (item.buy ? '<button type="button" class="menu-item-buy" data-buy="'+esc(item.buy)+'">Buy</button>' : '')+
            (item.nutrition && DEMO && DEMO.nutrition && DEMO.nutrition[item.nutrition] ? '<details class="menu-item-nut"><summary>Nutrition</summary><p>'+esc(DEMO.nutrition[item.nutrition])+'</p></details>' : '')+
          '</div>' : '')+
        '</div>'+
        (item.price_display?'<div class="menu-item-price">'+esc(item.price_display)+'</div>':'')+
      '</div>';
    });
    blocks+='</div>';
  });
  var firstCount = catMap[cats[0]] ? catMap[cats[0]].length : 0;
  var html=
    '<div style="padding:32px 40px 40px">'+
      '<div class="menu-nav">'+
        '<span class="menu-nav-label">Browse</span>'+
        '<select class="menu-cat-select" id="menu-cat-select" aria-label="Menu category">'+opts+'</select>'+
        '<span class="menu-item-count" id="menu-item-count">'+firstCount+' items</span>'+
      '</div>'+
      '<div id="menu-blocks">'+blocks+'</div>'+
    '</div>';
  // Attach event after render (use setTimeout so DOM is ready)
  setTimeout(function(){
    var sel=document.getElementById('menu-cat-select');
    var countEl=document.getElementById('menu-item-count');
    var catBlocks=document.querySelectorAll('.menu-category');
    var catList=cats;
    if(!sel) return;
    sel.addEventListener('change',function(){
      var idx=catList.indexOf(sel.value);
      catBlocks.forEach(function(b,i){b.style.display=(i===idx?'block':'none');});
      var cnt=catMap[sel.value]?catMap[sel.value].length:0;
      if(countEl) countEl.textContent=cnt+' item'+(cnt===1?'':'s');
    });
  },0);
  return html;
}

function getCommunityForListing(l){
  if(l.address_city && SF_CITIES.indexOf(l.address_city) > -1) return {slug:'south-florida', name:'South Florida'};
  if(l.address_city && CFL_CITIES.indexOf(l.address_city) > -1) return {slug:'central-florida', name:'Central Florida'};
  if(l.address_city && LA_CITIES.indexOf(l.address_city) > -1) return {slug:'los-angeles', name:'Los Angeles'};
  if(l.address_state === 'GA') return {slug:'atlanta', name:'Atlanta'};
  if(l.address_state === 'NY') return {slug:'new-york', name:'New York'};
  if(l.address_city === 'London') return {slug:'london', name:'London'};
  return null;
}

function qrSvg(seed){
  var n = 25, cells = '', h = 0; for(var i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  function rnd(){ h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h % 100; }
  function finder(x,y){ return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#111"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#111"/>'; }
  for(var y=0;y<n;y++) for(var x=0;x<n;x++){
    if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)) continue;
    if(rnd() < 46) cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#111"/>';
  }
  return '<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="Member QR code (illustrative)">'+cells+finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>';
}

  // Vote button (2026-09-17, Logan: wired to the real vote_listing backend --

  (function(){
    var voteBtn = document.getElementById('vote-btn');

    if(!voteBtn || !window.VEAuth || !window.VEVotes) return;

    // n: the new total from the server, or null to keep the number shown (already voted today).
    // next: when this member can vote for it again (24 hours after their last vote).
    function paintVoted(n, fresh, next){
      var badge = document.getElementById('vote-badge');
      var count = n != null ? n : ((badge ? parseInt(badge.textContent, 10) : 0) || 0);
      voteBtn.dataset.voted = '1';
      voteBtn.dataset.next = next || '';
      voteBtn.title = next ? 'You can vote for this one again ' + VEVotes.nextText(next) + '.' : '';
      voteBtn.innerHTML = '<svg width="14" height="14" fill="#000" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>Voted<span class="vote-badge" id="vote-badge">' + count + '</span>';
      voteBtn.style.background = '#2d7d31';
      var cv = document.getElementById('community-votes');
      if(cv){ cv.textContent = count; }
      var cl = document.getElementById('community-lesars');
      if(cl && fresh){ cl.textContent = (parseInt(cl.textContent)||0) + 1; }
    }
    // Voted in the last 24 hours? Show it after a refresh too.
    if(VEAuth.isLoggedIn() && window.VEVotes){
      VEVotes.today().then(function(d){ var n = d && d.next && d.next[listingId]; if(VEVotes.tooSoon(n)) paintVoted(null, false, n); }).catch(function(){});
    }
    voteBtn.addEventListener('click', function(){
      if(voteBtn.dataset.voted && VEVotes.tooSoon(voteBtn.dataset.next)){ VEVotes.notice(VEVotes.onceMessage(voteBtn.dataset.next)); return; }
      if(!VEAuth.isLoggedIn()){
        VEAuth.showAuthModal('Sign in to vote for this business.', function(){ window.location.reload(); });
        return;
      }
      voteBtn.disabled = true;
      VEVotes.cast(listingId).then(function(d){
        voteBtn.disabled = false;
        if(d && (d.error === 'already_voted' || d.error === 'already_voted_today')){ paintVoted(null, false, d.next_vote_at); VEVotes.notice(VEVotes.onceMessage(d.next_vote_at)); return; }
        if(d && d.error){ return; }
        paintVoted(d && d.vote_count != null ? d.vote_count : null, true, d && d.next_vote_at);
      }).catch(function(){ voteBtn.disabled = false; });
    });
  })();

function renderInstagramContent(veBusinessId){
  if(!veBusinessId) return;
  var url = SUPABASE_URL + '/rest/v1/ve_reel_business_matches' +
    '?select=display_role,confidence,ve_instagram_posts(id,shortcode,post_url,post_type,caption,video_url,thumbnail_url,like_count,posted_at,source_account)' +
    '&business_id=eq.' + encodeURIComponent(veBusinessId) +
    '&review_status=eq.approved' +
    '&order=confidence.desc';
  fetch(url, { headers:{ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!Array.isArray(rows)) return;
      var videos = [], photos = [];
      rows.forEach(function(row){
        var p = row.ve_instagram_posts;
        if(!p) return;
        if(p.post_type === 'Video') videos.push(p);
        else photos.push(p);
      });

      // ── Video tab ──────────────────────────────────────────────────────────
      var videoEl = document.getElementById('tab-video');
      if(videoEl && videos.length){
        var vHtml = '<div style="padding:24px 40px 40px">';
        vHtml += '<p style="font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:16px">Explorer Content — via VEGANS EXPLORE</p>';

        vHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">';
        videos.forEach(function(v){
          var caption = (v.caption||'').substring(0,100) + ((v.caption||'').length>100?'…':'');
          var src = v.source_account === 'vegansexplore' ? '@vegansexplore' : '@soflovegans';
          var date = v.posted_at ? new Date(v.posted_at).getFullYear() : '';
          vHtml += '<a href="'+esc(v.post_url)+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;background:var(--ve-surface);border:1px solid var(--ve-border);border-radius:10px;overflow:hidden">' +
            '<div style="position:relative;aspect-ratio:9/16;background:#111;overflow:hidden">' +
              (v.thumbnail_url ? '<img src="'+esc(v.thumbnail_url)+'" alt="'+esc(v.caption||'Video')+'" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>' : '') +
              '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)">' +
                '<div style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center">' +
                  '<svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div style="padding:12px 14px">' +
              '<p style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ve-green-dark);margin-bottom:4px">'+esc(src)+(date?' · '+date:'')+'</p>' +
              '<p style="font-size:12px;line-height:1.55;color:var(--ve-text-75);margin:0">'+esc(caption)+'</p>' +
              (v.like_count > 0 ? '<p style="font-size:10px;color:var(--ve-text-50);margin-top:6px">'+v.like_count.toLocaleString()+' likes</p>' : '') +
            '</div>' +
          '</a>';
        });
        vHtml += '</div></div>';
        // Append reels below promo video (if already injected) or replace locked state
        var promoEl = videoEl.querySelector('iframe');
        if(promoEl){
          videoEl.innerHTML += vHtml;
        } else {
          videoEl.innerHTML = vHtml;
        }
      }

      // ── Photos tab — Instagram photos (the business's own posts) ────────────
      var photoEl = document.getElementById('tab-photos');
      if(photoEl && photos.length){
        var igUrls = photos.filter(function(p){ return !!p.thumbnail_url; }).map(function(p){ return p.thumbnail_url; });
        var igLbKey = 'ig-photos-lb';
        _lbReg[igLbKey] = igUrls;
        var igSection = '<div style="padding:0 40px 40px">' +
          '<p style="font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:12px">Explorer Photos — via VEGANS EXPLORE</p>' +
          '<div class="photos-tab-grid">' +
          igUrls.map(function(url, i){
            return '<div class="photo-item" tabindex="0" role="button" aria-label="View photo" data-lb-key="'+igLbKey+'" data-lb-idx="'+i+'">'+
              '<img src="'+esc(url)+'" loading="lazy"/></div>';
          }).join('') +
          '</div></div>';
        photoEl.innerHTML += igSection;
      }
    })
    .catch(function(e){ console.warn('Instagram fetch failed', e); });
}

// What visitors do on a listing (Sean, 2026-10-08: the brand dashboard shows a business how its page performs):
// a view, a product opened, a store's Vegan aisle opened. ve_listing_track() keeps
// one count per visitor, action and item every 30 minutes; automated browsers are not counted. Read back only by the
// owner or a super admin, through ve-claims brand_stats.
function veTrack(l, kind, ref){
  try{
    // ?preview=1: a page shown inside a brand's tour, not a visit.
    if(!l || !l.id || DEMO || navigator.webdriver || new URLSearchParams(location.search).get('preview')) return;
    var vid = null;
    try{ vid = localStorage.getItem('ve_vid'); if(!vid){ vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('ve_vid', vid); } }catch(e){}
    var via = document.documentElement.classList.contains('ve-embedded') ? 'guide' : (new URLSearchParams(location.search).get('vl') ? 'link' : 'page');
    fetch(SUPABASE_URL + '/rest/v1/rpc/ve_listing_track', { method: 'POST', keepalive: true,
      headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_listing: l.id, p_kind: kind, p_ref: ref || null, p_visitor: vid, p_via: via }) }).catch(function(){});
  }catch(e){}
}

// we put internal ads... and then we promote the guide on this page as well, the dairy guide"). VEProducts.GUIDES
// holds each Guide's house ad: its Guide's picture, a line, and a /go/ tracked link.
function houseAd(l){
  var el = document.getElementById('bb-ad-landscape-1'); if(!el || !window.VEProducts) return;
  var d = l.details || {}, g = null;

// ── Video carousel ────────────────────────────────────────────────────────────
function extractYtId(url){
  var m = (url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function fetchListingVideos(listingId){
  var url = SUPABASE_URL + '/rest/v1/ve_listing_videos?listing_id=eq.' + encodeURIComponent(listingId) + '&order=sort_order.asc';
  return fetch(url, { headers:{ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
    .then(function(r){ return r.json(); })
    .catch(function(){ return []; });
}

function renderVideoCarousel(videos){
  var videoEl = document.getElementById('tab-video');
  if(!videoEl || !videos || !videos.length) return;

  // Filter to valid YouTube IDs
  var items = [];
  videos.forEach(function(v){
    var id = extractYtId(v.video_url);
    if(id) items.push({ id: id, title: v.title || '' });
  });
  if(!items.length) return;

  var carouselId = 'vc-' + Date.now();
  var perPage = 6; // 3 cols x 2 rows desktop; mobile single col
  var page = 0;
  var total = items.length;
  var pages = Math.ceil(total / perPage);

  function buildSlide(pageIdx){
    var start = pageIdx * perPage;
    var slice = items.slice(start, start + perPage);
    return slice.map(function(item){
      var thumb = 'https://img.youtube.com/vi/' + item.id + '/hqdefault.jpg';
      return '<div class="vc-item" data-ytid="' + item.id + '">' +
        '<div class="vc-thumb-wrap">' +
          '<img class="vc-thumb" src="' + thumb + '" alt="' + esc(item.title || 'Video') + '" loading="lazy"/>' +
          '<div class="vc-play-btn" role="button" tabindex="0" aria-label="Play video">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          '</div>' +
          '<div class="vc-iframe-wrap" style="display:none"></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function buildDots(){
    if(pages <= 1) return '';
    var d = '<div class="vc-dots" id="' + carouselId + '-dots">';
    for(var i=0;i<pages;i++) d += '<button class="vc-dot' + (i===0?' active':'') + '" data-page="' + i + '" aria-label="Slide ' + (i+1) + '"></button>';
    d += '</div>';
    return d;
  }

  var html =
    '<div class="vc-wrap" id="' + carouselId + '">' +
      '<p class="vc-label">VEGANS EXPLORE — Video</p>' +
      '<div class="vc-stage">' +
        '<div class="vc-track" id="' + carouselId + '-track">' +
          '<div class="vc-slide vc-grid">' + buildSlide(0) + '</div>' +
        '</div>' +
      '</div>' +
      (pages > 1 ?
        '<div class="vc-controls">' +
          '<button class="vc-arrow vc-prev" id="' + carouselId + '-prev" aria-label="Previous">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>' +
          '</button>' +
          buildDots() +
          '<button class="vc-arrow vc-next" id="' + carouselId + '-next" aria-label="Next">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</button>' +
        '</div>'
      : '') +
    '</div>';

  videoEl.innerHTML = html;

  // Wire up controls after render
  var track = document.getElementById(carouselId + '-track');
  var prevBtn = document.getElementById(carouselId + '-prev');
  var nextBtn = document.getElementById(carouselId + '-next');

  function goTo(p){
    if(p < 0 || p >= pages) return;
    var dir = p > page ? '-12px' : '12px';
    page = p;
    // Animate out / in
    track.style.opacity = '0';
    track.style.transform = 'translateX(' + dir + ')';
    setTimeout(function(){
      track.innerHTML = '<div class="vc-slide vc-grid">' + buildSlide(page) + '</div>';
      track.style.transform = 'translateX(0)';
      track.style.opacity = '1';
      wireThumbClicks();
      // Update dots
      var dots = document.querySelectorAll('#' + carouselId + '-dots .vc-dot');
      dots.forEach(function(d,i){ d.classList.toggle('active', i===page); });
    }, 180);
  }

  function wireThumbClicks(){
    track.querySelectorAll('.vc-item').forEach(function(item){
      var ytId = item.getAttribute('data-ytid');
      var playBtn = item.querySelector('.vc-play-btn');
      var iframeWrap = item.querySelector('.vc-iframe-wrap');
      var thumbImg = item.querySelector('.vc-thumb');
      function activateEmbed(){
        iframeWrap.style.display = 'block';
        iframeWrap.innerHTML = '<iframe src="https://www.youtube.com/embed/' + ytId + '?autoplay=1&rel=0&modestbranding=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"></iframe>';
        if(thumbImg) thumbImg.style.display = 'none';
        if(playBtn) playBtn.style.display = 'none';
      }
      if(playBtn){
        playBtn.addEventListener('click', activateEmbed);
        playBtn.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') activateEmbed(); });
      }
    });
    // Dot clicks
    track.closest('.vc-wrap') && track.closest('.vc-wrap').querySelectorAll('.vc-dot').forEach(function(dot){
      dot.addEventListener('click', function(){ goTo(parseInt(dot.getAttribute('data-page'))); });
    });
  }

  if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(page - 1); });
  if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(page + 1); });
  wireThumbClicks();
}

function fetchPulsePosts(listingId){

function bodyToHtml(raw){
  return (raw || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .split('\n\n').filter(function(p){ return p.trim(); })
    .map(function(p){ return '<p>' + p.trim().replace(/\n/g,'<br>') + '</p>'; })
    .join('');
}

function openArticle(post, listingName){
  var typeLabels = { article:'Article', update:'Update', press:'Press', event:'Event', collab:'Collab', announcement:'Announcement' };
  var typeClass = post.type === 'press' ? ' press' : post.type === 'event' ? ' event' : post.type === 'update' ? ' update' : '';
  var date = post.published_at ? new Date(post.published_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';

  // Update breadcrumb label
  var bcLabel = document.getElementById('article-bc-label');
  if(bcLabel) bcLabel.textContent = (post.headline||'').length > 42 ? (post.headline||'').substring(0,42)+'...' : (post.headline||'');

  // Update "Back to listing" label

  document.getElementById('article-content').innerHTML =
    '<div class="article-type-row">' +
      '<span class="pulse-type-badge' + typeClass + '">' + (typeLabels[post.type]||'Post') + '</span>' +
      (date ? '<span class="pulse-date">' + date + '</span>' : '') +
    '</div>' +
    '<h1 class="article-h1">' + esc(post.headline) + '</h1>' +
    (post.subhead ? '<p class="article-subhead">' + esc(post.subhead) + '</p>' : '') +
    '<div class="article-prose">' + bodyToHtml(post.body) + '</div>' +
    (post.source_url ?
      '<div class="article-cta">' +
        '<a href="' + esc(post.source_url) + '" target="_blank" rel="noopener" class="article-cta-btn">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          esc(post.source_label || 'Watch Now') +
        '</a>' +
      '</div>'
    : '');

  document.getElementById('frame').style.display = 'none';
  var av = document.getElementById('article-view');
  av.style.display = 'block';
  av.removeAttribute('aria-hidden');
  window.scrollTo(0,0);

function closeArticle(){
  document.getElementById('frame').style.display = '';
  var av = document.getElementById('article-view');
  av.style.display = 'none';
  av.setAttribute('aria-hidden','true');
  // Scroll back to pulse tab area
  var pulsePanel = document.getElementById('tab-pulse');

function renderPulse(posts, listingName){
  var panel = document.getElementById('tab-pulse');
  if(!panel) return;
  if(!posts || !posts.length){
    panel.innerHTML = '<div class="tab-locked"><div class="tab-locked-title">No posts yet</div><div class="tab-locked-sub">Updates, press, and stories will appear here.</div></div>';
    return;
  }
  var typeLabels = { article:'Article', update:'Update', press:'Press', event:'Event', collab:'Collab', announcement:'Announcement' };
  var html = '<div class="pulse-wrap">';
  posts.forEach(function(post, idx){
    var date = post.published_at ? new Date(post.published_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
    var typeClass = post.type === 'press' ? ' press' : post.type === 'event' ? ' event' : post.type === 'update' ? ' update' : '';
    // Excerpt: first paragraph only, capped at 200 chars
    var firstPara = (post.body || '').replace(/\*\*/g,'').split('\n\n')[0] || '';
    var excerpt = firstPara.length > 200 ? firstPara.substring(0,200).trimEnd() + '...' : firstPara;
    html +=
      '<div class="pulse-card" id="pulse-card-' + idx + '">' +
        '<div class="pulse-card-inner">' +
          '<div class="pulse-type-row">' +
            '<span class="pulse-type-badge' + typeClass + '">' + (typeLabels[post.type]||'Post') + '</span>' +
            (date ? '<span class="pulse-date">' + date + '</span>' : '') +
            (post.is_pinned ? '<span class="pulse-pinned">Pinned</span>' : '') +
          '</div>' +
          '<div class="pulse-headline" data-idx="' + idx + '">' + esc(post.headline) + '</div>' +
          (post.subhead ? '<div class="pulse-subhead">' + esc(post.subhead) + '</div>' : '') +
          (excerpt ? '<div class="pulse-excerpt">' + esc(excerpt) + '</div>' : '') +
          '<button class="pulse-read-more" data-idx="' + idx + '">' +
            'Read full article' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>';
  });
  html += '</div>';
  panel.innerHTML = html;

  // Wire clicks
  panel.querySelectorAll('[data-idx]').forEach(function(el){
    el.addEventListener('click', function(){
      openArticle(posts[parseInt(el.getAttribute('data-idx'))], listingName);
    });
  });
}
