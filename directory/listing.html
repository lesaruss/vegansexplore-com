<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loading... — Vegans Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-light:#e8f5e9;
  --ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-surface:#f7faf7;
  --ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.75);--ve-text-50:rgba(26,26,26,0.50);
}
html,body{min-height:100%;font-family:Montserrat,sans-serif;color:var(--ve-text);background:#f5f5f5}
#frame{width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column}

/* HERO */
.listing-hero{background:#111;padding:40px 40px 32px;border-bottom:1px solid #222;display:flex;gap:28px;align-items:stretch}
.listing-hero-avatar{width:auto;height:auto;aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:28px;font-weight:900;color:#fff;overflow:hidden}
.listing-hero-content{display:contents}
.listing-hero-avatar img{width:100%;height:100%;object-fit:cover}
.listing-hero-body{flex:1;min-width:0}
.listing-breadcrumb{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#666;margin-bottom:8px}
.listing-breadcrumb a{color:#5EC47A;text-decoration:none}
.listing-breadcrumb a:hover{text-decoration:underline}
.listing-name{font-size:32px;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px}
.listing-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.badge-cat{font-size:10px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:#5EC47A;color:#000}
.badge-subcat{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,0.1);color:#ccc;border:1px solid #333}
.badge-verified{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:rgba(94,196,122,0.15);color:#5EC47A;border:1px solid rgba(94,196,122,0.3);display:inline-flex;align-items:center;gap:4px}
.listing-tagline{font-size:13px;color:#aaa;line-height:1.5;max-width:560px}
.listing-hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex-shrink:0}
.listing-rating{text-align:center}
.rating-num{font-size:28px;font-weight:900;color:#fff;line-height:1}
.rating-stars{font-size:12px;color:#F69820;letter-spacing:1px}
.rating-count{font-size:10px;font-weight:600;color:#666;letter-spacing:0.06em}
.vote-hero-btn{font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:12px 24px;border-radius:6px;background:#5EC47A;color:#000;border:none;cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.vote-hero-btn:hover{background:#4db368}
.vote-hero-btn:focus-visible{outline:3px solid #5EC47A;outline-offset:2px}
.vote-count-display{font-size:10px;font-weight:700;color:#888;text-align:center;letter-spacing:0.08em}

/* QUICK INFO BAR */
.info-bar{background:#f9f9f9;border-bottom:1px solid var(--ve-border);padding:12px 40px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.info-chip{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ve-text-75);letter-spacing:0.04em}
.info-chip svg{color:#5EC47A;flex-shrink:0}
.info-chip.open-now{color:#2d7d31}
.info-chip.closed{color:#c62828}
.info-chip a{color:inherit;text-decoration:none}
.info-chip a:hover{text-decoration:underline}

/* CONTENT AREA */
.listing-body{display:grid;grid-template-columns:1fr 320px;gap:28px;padding:32px 40px;max-width:100%}
.listing-main{}
.listing-sidebar{}

/* SECTION */
.section{margin-bottom:28px}
.section-title{font-size:12px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-75);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ve-green-light)}
.about-text{font-size:14px;line-height:1.75;color:var(--ve-text)}

/* DELIVERY BADGES */
.delivery-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.delivery-btn{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:10px 18px;border-radius:6px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text);text-decoration:none;transition:.15s}
.delivery-btn:hover{border-color:#5EC47A;color:#2d7d31}
.delivery-btn:focus-visible{outline:2px solid #5EC47A;outline-offset:2px}

/* HOURS TABLE */
.hours-table{width:100%;border-collapse:collapse}
.hours-table td{padding:6px 0;font-size:12px;font-weight:600;color:var(--ve-text-75);border-bottom:1px solid var(--ve-border)}
.hours-table td:first-child{font-weight:800;color:var(--ve-text);width:100px}
.hours-table tr.today td{color:#2d7d31;font-weight:800}

/* PLATFORMS (MEDIA) */
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.platform-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;border:1px solid var(--ve-border);background:#fff;text-decoration:none;color:var(--ve-text);font-family:Montserrat,sans-serif;transition:.15s;cursor:pointer}
.platform-btn:hover{border-color:#5EC47A;background:var(--ve-green-light)}
.platform-btn:focus-visible{outline:2px solid #5EC47A;outline-offset:2px}
.platform-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.platform-label{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.platform-sub{font-size:10px;font-weight:600;color:var(--ve-text-50);margin-top:1px}

/* SIDEBAR CARDS */
.side-card{background:#fff;border:1px solid var(--ve-border);border-radius:10px;padding:18px;margin-bottom:14px}
.side-card-title{font-size:10px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-50);margin-bottom:12px}
.contact-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--ve-text-75)}
.contact-row svg{flex-shrink:0;margin-top:1px;color:#5EC47A}
.contact-row a{color:var(--ve-text-75);text-decoration:none}
.contact-row a:hover{color:#2d7d31;text-decoration:underline}
.social-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.social-btn{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:4px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text-75);text-decoration:none;transition:.15s}
.social-btn:hover{border-color:#5EC47A;color:#2d7d31}
.claim-box{background:#0a1a0f;border:1px solid #2d5a3a;border-radius:8px;padding:14px 16px;text-align:center}
.claim-box p{font-size:11px;color:#aaa;line-height:1.5;margin-bottom:10px}
.claim-btn{display:inline-block;font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:8px 16px;border-radius:4px;background:transparent;color:#5EC47A;border:1px solid #5EC47A;text-decoration:none;transition:.15s}
.claim-btn:hover{background:#5EC47A;color:#000}

/* PHOTOS - desktop 3x2 grid */
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos-grid .photo-item{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#eee}
.photos-grid .photo-item img{width:100%;height:100%;object-fit:cover}
/* PHOTOS - mobile 2-up carousel */
.photos-carousel-wrap{display:none}
.photos-track{display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;gap:8px}
.photos-track::-webkit-scrollbar{display:none}
.photo-slide{display:flex;gap:8px;flex:0 0 100%;scroll-snap-align:start}
.photo-slide .photo-item{flex:1;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#eee}
.photo-slide .photo-item img{width:100%;height:100%;object-fit:cover}
.photos-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.photo-dot{width:6px;height:6px;border-radius:50%;background:var(--ve-border);transition:background .2s;cursor:pointer}
.photo-dot.active{background:var(--ve-green)}

/* COMMUNITY SUPPORT */
.community-stats{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--ve-border);border-radius:10px;overflow:hidden}
.community-stat{flex:1;padding:16px 20px;text-align:center;background:#fff}
.community-stat+.community-stat{border-left:1px solid var(--ve-border)}
.cstat-num{font-size:28px;font-weight:900;color:var(--ve-text);line-height:1;margin-bottom:4px}
.cstat-label{font-size:9px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-text-50)}
.donate-card{background:var(--ve-surface);border:1px solid var(--ve-border);border-radius:10px;padding:18px}
.donate-text{font-size:12px;line-height:1.7;color:var(--ve-text-75);margin-bottom:14px}
.donate-row{display:flex;gap:8px;margin-bottom:10px}
.donate-input{flex:1;font-size:12px;font-weight:700;font-family:Montserrat,sans-serif;padding:10px 14px;border:1px solid var(--ve-border);border-radius:6px;outline:none;color:var(--ve-text)}
.donate-input:focus{border-color:var(--ve-green)}
.donate-btn{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:10px 18px;border-radius:6px;background:var(--ve-green);color:#fff;border:none;cursor:pointer;font-family:Montserrat,sans-serif;white-space:nowrap;transition:background .15s}
.donate-btn:hover{background:var(--ve-green-dark)}
.member-note{font-size:11px;color:var(--ve-text-50);line-height:1.5}
.member-note a{color:var(--ve-green-dark);font-weight:700;text-decoration:none}
.member-note a:hover{text-decoration:underline}
.donate-confirm{font-size:12px;font-weight:700;color:#2d7d31;margin-top:8px;display:none}

/* TABS */
.listing-tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ve-border);background:#fff;z-index:10;scrollbar-width:none;position:sticky;top:0}
.listing-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border:none;background:none;color:var(--ve-text-50);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:Montserrat,sans-serif;transition:color .15s,border-color .15s;white-space:nowrap}
.tab-btn:hover{color:var(--ve-text)}
.tab-btn.active{color:var(--ve-green-dark);border-bottom-color:var(--ve-green)}
.tab-btn:focus-visible{outline:2px solid var(--ve-green);outline-offset:-2px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* LOCKED TAB STATE */
.tab-locked{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;gap:12px}
.tab-locked-icon{width:56px;height:56px;border-radius:50%;background:var(--ve-green-light);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.tab-locked-title{font-size:15px;font-weight:900;color:var(--ve-text);letter-spacing:-.01em}
.tab-locked-sub{font-size:13px;color:var(--ve-text-50);max-width:260px;line-height:1.65}
.tab-locked-cta{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 20px;border-radius:6px;border:1px solid var(--ve-green);color:var(--ve-green-dark);background:var(--ve-green-light);text-decoration:none;margin-top:4px;display:inline-block}

/* LOADING / ERROR */
.listing-loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:13px;font-weight:700;color:var(--ve-text-50);letter-spacing:0.1em}
.listing-not-found{text-align:center;padding:80px 40px}
.listing-not-found h2{font-size:24px;font-weight:900;margin-bottom:12px}
.listing-not-found p{color:var(--ve-text-50);font-size:14px;margin-bottom:24px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#5EC47A;text-decoration:none}
.back-link:hover{text-decoration:underline}

/* OWNERSHIP TAGS */
.ownership-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ownership-tag{font-size:9px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--ve-green-light);color:#2d7d31;border:1px solid #c8e6c9}

@media(max-width:768px){
  .listing-hero{flex-direction:row;padding:14px 16px;gap:12px;align-items:stretch}
  .listing-hero-avatar{width:64px;min-width:64px;height:auto;align-self:stretch;border-radius:10px;font-size:18px;flex-shrink:0}
  .listing-hero-content{display:flex;flex-direction:row;flex:1;min-width:0;align-items:center;gap:10px}
  .listing-hero-body{flex:1;min-width:0}
  .listing-breadcrumb{font-size:9px;letter-spacing:0.15em}
  .listing-tagline{display:none}
  .listing-name{font-size:15px;margin-bottom:5px}
  .listing-badges{gap:5px;margin-bottom:0}
  .badge-cat{font-size:9px;padding:3px 8px}
  .badge-subcat{font-size:9px;padding:3px 8px}
  .listing-hero-right{flex-direction:column;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
  .vote-hero-btn{padding:10px 14px;font-size:10px}
  .photos-grid{display:none}
  .photos-carousel-wrap{display:block}
  .donate-row{flex-direction:column}
  .vote-count-display{font-size:9px}
  .listing-body{grid-template-columns:1fr;padding:20px 16px}
  .info-bar{padding:10px 16px;gap:12px}
  .platform-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
(function(){
var SUPABASE_URL = 'https://fwbhwfxpncrsfhttimna.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';

var FOOD_CATS = ['Restaurants','Bakeries & Cafes','Food Brands','Catering','Meal Prep'];
var MEDIA_CATS = ['Media','Content Creation & Media'];
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function getSlug(){
  var parts = window.location.pathname.replace(/\/$/,'').split('/');
  return parts[parts.length-1] || '';
}

function fetchListing(slug){
  var url = SUPABASE_URL + '/rest/v1/listings?slug=eq.' + encodeURIComponent(slug) + '&status=eq.approved&select=*&limit=1';
  return fetch(url, { headers:{ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
    .then(function(r){ return r.json(); });
}

function initials(name){
  var words = (name||'').trim().split(/\s+/);
  if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return (name||'').substring(0,2).toUpperCase();
}

function stars(rating){
  if(!rating) return '';
  var full = Math.floor(rating), half = (rating - full) >= 0.5 ? 1 : 0, empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
}

function getCategoryType(cat){
  if(FOOD_CATS.indexOf(cat) !== -1) return 'food';
  if(MEDIA_CATS.indexOf(cat) !== -1) return 'media';
  return 'general';
}

function renderOwnership(l){
  var tags = [];
  if(l.is_black_owned) tags.push('Black-Owned');
  if(l.is_women_owned) tags.push('Women-Owned');
  if(l.is_lgbtq_owned) tags.push('LGBTQ+-Owned');
  if(l.is_veteran_owned) tags.push('Veteran-Owned');
  if(l.is_family_owned) tags.push('Family-Owned');
  if(l.is_immigrant_owned) tags.push('Immigrant-Owned');
  if(!tags.length) return '';
  return '<div class="ownership-tags">' + tags.map(function(t){ return '<span class="ownership-tag">'+esc(t)+'</span>'; }).join('') + '</div>';
}

function hoursMap(hoursJson){
  // Normalize: array [{day,hours}] or [{day,openingHours}] → {Day: "hours string"}
  if(!hoursJson) return {};
  if(Array.isArray(hoursJson)){
    var map = {};
    hoursJson.forEach(function(h){
      var d = h.day || h.name || '';
      var t = h.hours || h.openingHours || h.time || '';
      if(d) map[d] = t;
    });
    return map;
  }
  return hoursJson; // already object
}

function renderHours(hoursJson){
  if(!hoursJson) return '<p style="font-size:12px;color:var(--ve-text-50)">Hours not available</p>';
  var map = hoursMap(hoursJson);
  var today = DAYS[new Date().getDay()];
  var rows = DAYS.map(function(day){
    var h = map[day] || map[day.toLowerCase()] || map[day.substring(0,3)] || 'N/A';
    var cls = day === today ? ' class="today"' : '';
    return '<tr'+cls+'><td>'+esc(day.substring(0,3))+'</td><td>'+esc(h)+'</td></tr>';
  }).join('');
  return '<table class="hours-table"><tbody>'+rows+'</tbody></table>';
}

function renderPhotos(photos){
  if(!photos || !photos.length) return '';

  // Desktop: 3-col x 2-row grid (max 6)
  var gridHtml = '<div class="photos-grid">'+
    photos.slice(0,6).map(function(url){
      return '<div class="photo-item"><img src="'+esc(url)+'" alt="Photo" loading="lazy"/></div>';
    }).join('')+
  '</div>';

  // Mobile: 2-up swipeable carousel
  var pairs = [];
  for(var i=0; i<photos.length; i+=2) pairs.push(photos.slice(i, i+2));
  var slides = pairs.map(function(pair){
    return '<div class="photo-slide">'+pair.map(function(url){
      return '<div class="photo-item"><img src="'+esc(url)+'" alt="Photo" loading="lazy"/></div>';
    }).join('')+'</div>';
  }).join('');
  var dots = pairs.length > 1 ? '<div class="photos-dots" id="photos-dots">'+
    pairs.map(function(_,i){ return '<span class="photo-dot'+(i===0?' active':'')+'"></span>'; }).join('')+
  '</div>' : '';
  var carouselHtml = '<div class="photos-carousel-wrap"><div class="photos-track" id="photos-track">'+slides+'</div>'+dots+'</div>';

  return gridHtml + carouselHtml;
}

var ORDER_PLATFORMS = {
  uber_eats:  {label:'Uber Eats',  color:'#06C167'},
  doordash:   {label:'DoorDash',   color:'#FF3008'},
  grubhub:    {label:'Grubhub',    color:'#F63440'},
  instacart:  {label:'Instacart',  color:'#43B02A'},
  chownow:    {label:'ChowNow',    color:'#E8473F'},
  toast:      {label:'Toast',      color:'#FF4C00'},
  square:     {label:'Square',     color:'#3E4348'},
  goldbelly:  {label:'Goldbelly',  color:'#F47920'},
  caviar:     {label:'Caviar',     color:'#1A1A1A'},
  seamless:   {label:'Seamless',   color:'#EA1917'},
  own_site:   {label:'Order Direct', color:'#2d7d31'}
};

function renderOrderingPlatforms(l){
  var btns = [];
  // New jsonb column (primary source)
  var op = l.ordering_platforms || {};
  // Fallback to legacy columns
  if(!op.uber_eats && l.uber_eats_url) op.uber_eats = l.uber_eats_url;
  if(!op.doordash && l.doordash_url) op.doordash = l.doordash_url;
  Object.keys(op).forEach(function(key){
    var url = op[key];
    if(!url) return;
    var meta = ORDER_PLATFORMS[key] || {label: key.replace(/_/g,' '), color:'#555'};
    btns.push('<a href="'+esc(url)+'" target="_blank" rel="noopener" class="delivery-btn" style="border-left:3px solid '+meta.color+'">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:'+meta.color+';display:inline-block;flex-shrink:0"></span>'+
      esc(meta.label)+'</a>');
  });
  if(!btns.length) return '';
  return '<div class="section"><h2 class="section-title">Order Online</h2><div class="delivery-row">'+btns.join('')+'</div></div>';
}

function renderAccommodations(l){
  var items = l.accommodations || [];
  if(!items.length) return '';
  var ICONS = {
    'Dine-in':'🍽','Takeout':'📦','Delivery':'🛵','Outdoor Seating':'☀️',
    'Reservations':'📅','WiFi':'📶','Parking':'🅿️','Dog-Friendly':'🐕',
    'Wheelchair Accessible':'♿','BYOB':'🍷','Live Music':'🎵','Family-Friendly':'👨‍👩‍👧'
  };
  return '<div class="section"><h2 class="section-title">Accommodations</h2>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    items.map(function(a){
      var icon = ICONS[a] || '•';

function lockedTab(tabName){

function renderListing(l){
  var catType = getCategoryType(l.category);

  // Avatar
  var av = l.logo_url
    ? '<img src="'+esc(l.logo_url)+'" alt="'+esc(l.name)+' logo"/>'
    : esc(l.initials || (l.name||'').substring(0,2).toUpperCase());
  var avBg = l.logo_url ? '#111' : (l.color || '#2d7d31');

  // Badges
  var verifiedBadge = l.ve_verified
    ? '<span class="badge-verified"><svg width="10" height="10" fill="#5EC47A" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="#5EC47A" stroke-width="2.5"/></svg>VE Verified</span>' : '';

  var votes = (l.favorites_count||0) + (l.likes_count||0);

  var statusBadge = '';

    statusBadge = '<div style="background:#b71c1c;color:#fff;font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:8px 16px;text-align:center">Permanently Closed</div>';
  } else if(l.business_status === 'CLOSED_TEMPORARILY'){
    statusBadge = '<div style="background:#e65100;color:#fff;font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:8px 16px;text-align:center">Temporarily Closed</div>';
  }

  // Info bar chips
  var todayHours = '';
  if(l.google_hours_json){
    var hmap = hoursMap(l.google_hours_json);
    var todayName = DAYS[new Date().getDay()];
    todayHours = hmap[todayName] || hmap[todayName.toLowerCase()] || hmap[todayName.substring(0,3)] || '';

  var priceDisplay = l.google_price_level || l.pricing_range || '';

  if(todayHours) infoChips.push('<span class="info-chip open-now"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+esc(todayHours)+'</span>');

  if(l.website) infoChips.push('<span class="info-chip"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg><a href="'+esc(l.website)+'" target="_blank" rel="noopener">Website</a></span>');

    overviewContent += '<div class="section"><h2 class="section-title">About</h2><p class="about-text">'+esc(l.description || l.tagline)+'</p>'+renderOwnership(l)+'</div>';
  }

  if(catType === 'food'){
    overviewContent += renderOrderingPlatforms(l);
    overviewContent += renderMenuOptions(l);
    overviewContent += renderAccommodations(l);
    if(l.google_hours_json){
      overviewContent += '<div class="section"><h2 class="section-title">Hours</h2>'+renderHours(l.google_hours_json)+'</div>';
    }
  } else if(catType === 'media'){
    overviewContent += renderPlatforms(l);
    if(l.target_audience) overviewContent += '<div class="section"><h2 class="section-title">Who It\'s For</h2><p class="about-text">'+esc(l.target_audience)+'</p></div>';
  } else {
    if(l.core_services && l.core_services.length){
      overviewContent += '<div class="section"><h2 class="section-title">Services</h2><div style="display:flex;gap:8px;flex-wrap:wrap">'+
        l.core_services.map(function(s){ return '<span style="font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;border:1px solid var(--ve-border);background:var(--ve-surface)">'+esc(s)+'</span>'; }).join('') + '</div></div>';
    }
    if(l.booking_url) overviewContent += '<div class="section"><a href="'+esc(l.booking_url)+'" target="_blank" rel="noopener" class="delivery-btn" style="display:inline-flex">Book a Session</a></div>';
  }

  // Community support section (universal)
  overviewContent +=
    '<div class="section">'+
      '<h2 class="section-title">Community Support</h2>'+
      '<div class="community-stats">'+
        '<div class="community-stat"><div class="cstat-num" id="community-votes">'+votes+'</div><div class="cstat-label">Community Votes</div></div>'+
        '<div class="community-stat"><div class="cstat-num" id="community-lesars">0</div><div class="cstat-label">LESARs Donated</div></div>'+
      '</div>'+
      '<div class="donate-card">'+
        '<p class="donate-text">Members earn LESARs through participation and can donate them directly to businesses they love. Businesses use LESARs to unlock professional photos, video, and marketing services from VEGANS EXPLORE. Every vote also earns the business +1 LESAR automatically.</p>'+
        '<div class="donate-row">'+
          '<input class="donate-input" id="donate-amount" type="number" min="1" placeholder="LESARs to donate" />'+
          '<button class="donate-btn" id="donate-btn">Donate LESARs</button>'+
        '</div>'+
        '<div class="donate-confirm" id="donate-confirm">Done! Your LESARs have been sent to this business.</div>'+
        '<p class="member-note">Not a member yet? <a href="#">Join for $11/mo</a> to earn LESARs, vote, and support Vegan businesses directly.</p>'+
      '</div>'+
    '</div>';

  // PHOTOS tab content
  var photoHtml = renderPhotos(l.google_photos);

    ? '<div style="padding:24px 40px 40px">'+photoHtml+'</div>'
    : lockedTab('photos');

  // Build page
  document.title = esc(l.name) + ' — Vegans Explore';
  document.getElementById('listing-root').innerHTML =
    '<div class="listing-hero">'+
      '<div class="listing-hero-avatar" style="background:'+esc(avBg)+'">'+av+'</div>'+
      '<div class="listing-hero-content">'+
        '<div class="listing-hero-body">'+
          breadcrumb+
          '<h1 class="listing-name">'+esc(l.name)+'</h1>'+
          '<div class="listing-badges">'+
            '<span class="badge-cat">'+esc(l.category)+'</span>'+
            (l.specialty && l.specialty !== l.category ? '<span class="badge-subcat">'+esc(l.specialty)+'</span>' : '')+
            (l.cuisine_type ? '<span class="badge-subcat">'+esc(l.cuisine_type)+'</span>' : '')+
            (l.vegan_status ? '<span class="badge-subcat" style="color:#5EC47A;border-color:#5EC47A">'+esc(l.vegan_status)+'</span>' : '')+
            (l.location_type ? '<span class="badge-subcat">'+esc(l.location_type)+'</span>' : '')+
            verifiedBadge+
          '</div>'+
          (l.tagline ? '<p class="listing-tagline">'+esc(l.tagline)+'</p>' : '')+
        '</div>'+
        '<div class="listing-hero-right">'+
          '<button class="vote-hero-btn" id="vote-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>Vote</button>'+
          '<div class="vote-count-display" id="vote-display">'+votes+' votes</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    statusBadge+
    (infoChips.length ? '<div class="info-bar">'+infoChips.join('')+'</div>' : '')+
    // Tab nav
    '<nav class="listing-tabs" role="tablist">'+
      '<button class="tab-btn active" data-tab="overview" role="tab" aria-selected="true">Overview</button>'+
      '<button class="tab-btn" data-tab="menu" role="tab" aria-selected="false">Menu</button>'+
      '<button class="tab-btn" data-tab="photos" role="tab" aria-selected="false">Photos</button>'+

    // Tab panels
    '<div class="tab-panel active" id="tab-overview" role="tabpanel">'+

        '<div class="listing-main">'+overviewContent+'</div>'+
        renderSidebar(l)+
      '</div>'+

    '<div class="tab-panel" id="tab-pulse" role="tabpanel">'+lockedTab('pulse')+'</div>';

  // Square avatar: read hero-body height after layout and match avatar dimensions
  requestAnimationFrame(function(){

      var h = body.offsetHeight;
      av.style.width = h + 'px';
      av.style.height = h + 'px';
    }
  });

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var target = this.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });

      this.setAttribute('aria-selected','true');

      if(target === 'photos'){
        wirePhotoCarousel();

  // Photo carousel in Overview is wired on load; Photos tab is wired on first click
  function wirePhotoCarousel(){
    var photoTrack = document.getElementById('photos-track');
    if(photoTrack && !photoTrack.dataset.wired){
      photoTrack.dataset.wired = '1';
      photoTrack.addEventListener('scroll', function(){
        var dots = document.querySelectorAll('.photo-dot');
        if(!dots.length) return;
        var idx = Math.round(photoTrack.scrollLeft / photoTrack.offsetWidth);
        dots.forEach(function(d,i){ d.classList.toggle('active', i===idx); });
      }, {passive:true});
      document.querySelectorAll('.photo-dot').forEach(function(dot, i){
        dot.addEventListener('click', function(){
          photoTrack.scrollTo({left: i * photoTrack.offsetWidth, behavior:'smooth'});
        });
      });
    }
  }

  // Vote button - increments vote display + community votes stat + gives business +1 LESARs
  document.getElementById('vote-btn').addEventListener('click', function(){
    if(this.dataset.voted) return;
    this.dataset.voted = '1';
    this.innerHTML = '<svg width="14" height="14" fill="#000" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>Voted!';
    this.style.background = '#2d7d31';
    var disp = document.getElementById('vote-display');
    if(disp){ disp.textContent = ((parseInt(disp.textContent)||0)+1) + ' votes'; }
    var cv = document.getElementById('community-votes');
    if(cv){ cv.textContent = (parseInt(cv.textContent)||0) + 1; }
    // +1 LESARs to business on every vote
    var cl = document.getElementById('community-lesars');
    if(cl){ cl.textContent = (parseInt(cl.textContent)||0) + 1; }
  });

  // Donate LESARs button
  var donateBtn = document.getElementById('donate-btn');
  if(donateBtn){
    donateBtn.addEventListener('click', function(){
      var input = document.getElementById('donate-amount');
      var amt = parseInt(input ? input.value : 0) || 0;
      if(amt < 1){ input && (input.style.borderColor='#c62828'); return; }
      input.style.borderColor = '';
      var cl = document.getElementById('community-lesars');
      if(cl){ cl.textContent = (parseInt(cl.textContent)||0) + amt; }
      var confirm = document.getElementById('donate-confirm');
      if(confirm){ confirm.style.display = 'block'; }
      input.value = '';
      donateBtn.disabled = true;
      donateBtn.textContent = 'Sent!';
      donateBtn.style.background = '#2d7d31';
      setTimeout(function(){
        donateBtn.disabled = false;
        donateBtn.textContent = 'Donate LESARs';
        donateBtn.style.background = '';
        if(confirm) confirm.style.display = 'none';
      }, 3000);
    });
  }
}

function showNotFound(){
  document.getElementById('listing-root').innerHTML =
    '<div class="listing-not-found">'+
      '<h2>Listing Not Found</h2>'+
      '<p>We couldn\'t find this listing. It may have been removed or the link is incorrect.</p>'+
      '<a href="/directory" class="back-link"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Back to Directory</a>'+
    '</div>';
}

// Init
var slug = getSlug();
if(!slug || slug === 'listing'){
  showNotFound();
} else {
  fetchListing(slug).then(function(data){
    if(data && data.length) renderListing(data[0]);
    else showNotFound();
  }).catch(function(){ showNotFound(); });
}

})();
</script>
