<!DOCTYPE html>
<html lang="en">
<head>
<!-- One framework for every brand: lesaruss.ai serves this page at /events and /funding (lesaruss-ai-site next.config.ts), where
     ve-brand.js sets window.VE_BRAND and it becomes LESARUSS.ai's calendar: business events and funding, picked in the banner. -->
<script src="/public/ve-brand.js"></script>
<script src="/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegan Events — Vegans Explore</title>
<meta name="description" content="Vegan festivals, meetups, markets and gatherings, in every city we serve and around the world. Pick a city, search, sort by city, and send us an event.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Events (Sean, 2026-10-26): open to everyone, works like the Directory, and looks like the dashboard's event tile
     ("I want the events to look more like how it looks on the dashboard with just that tile"). The calendar, its
     filters and Submit an event are /public/ve-events.js, the same component as the dashboard's Events tab; the banner is
     the shared city banner (/public/ve-city-banner.js). */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #1a1a1a; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid #F69820; outline-offset: 3px; }
  .page-frame { width: 100%; background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; max-width: none; margin: 0; padding: 36px 40px 80px; }
  @media (max-width: 700px) { main { padding: 24px 16px 64px; } }
</style>
</head>
<body>
<div class="page-frame">

<script src="/public/nav.js"></script>
<script src="/public/ve-auth.js"></script>
<script src="/public/ve-hubs.js"></script>
<script src="/public/ve-city-banner.js"></script>
<script src="/public/ve-events.js"></script>

<section id="ev-hero"></section>

<main id="main-content">
  <div class="vear-layout"><div class="vear-main" id="ev-cal"></div><aside class="vear-rail" data-ad-page="/events"></aside></div>
</main>

<script src="/public/footer.js"></script>
</div>

<script src="/public/ve-ad-rail.js"></script>
<script>
(function () {
  var cal = null;
  // LESARUSS.ai (Sean, 2026-10-29, canon canon-lesaruss-ai-front-door): conferences, summits, pitch nights and workshops, and
  // Funding, its own tab on the same engine (grants, loans, accelerators, pitch competitions; closing soon first). The banner
  // picks Events or Funding where Vegans Explore picks a city; /funding (or ?tab=funding) opens on Funding. No Submit or ads yet.
  var LR = window.VE_BRAND && VE_BRAND.calendar;
  if (LR) {
    var rail = document.querySelector('.vear-rail'); if (rail) { rail.parentNode.classList.remove('vear-layout'); rail.remove(); }
    var startKind = /^\/funding\/?$/.test(location.pathname) || new URLSearchParams(location.search).get('tab') === 'funding' ? 'funding' : 'event';
    var copy = function (k) { return LR[k]; };
    var path = function (k) { return k === 'funding' ? '/funding' : '/events'; };
    document.title = copy(startKind).title + ' | ' + VE_BRAND.name;
    var lrBanner = VECityBanner.mount('ev-hero', {
      key: 'events', eyebrow: VE_BRAND.name, title: 'Events and Funding', pickLabel: 'Show', param: false, art: LR.art,
      sub: copy(startKind).sub,
      choices: [{ value: 'event', label: 'Events' }, { value: 'funding', label: 'Funding' }],
      initial: startKind,
      home: { label: 'Calendar home', href: path(startKind) },
      onChange: function (k) {
        if (!cal || k === cal.kind()) return;
        cal.setKind(k); lrBanner.setHome(path(k)); document.title = copy(k).title + ' | ' + VE_BRAND.name;
        history.replaceState(history.state, '', path(k) + location.search.replace(/([?&])tab=funding&?/, '$1').replace(/[?&]$/, '') + location.hash);
      }
    });
    cal = VEEvents.mount('ev-cal', { key: 'events', tenant: VEEvents.LR_TENANT, kind: startKind, onInteract: function () { lrBanner.autoFold(); } });
    return;
  }
  var banner = VECityBanner.mount('ev-hero', {
    key: 'events', title: 'Vegan Events', allTitle: 'Every City', allLabel: 'All cities',
    sub: 'Festivals, meetups, markets and gatherings, in our cities and around the world. Pick a city, search, and find your next one.',
    // Events home: the calendar as the menu's Events opens it, in the city picked (Sean, 2026-10-27).
    home: { label: 'Events home', href: '/events' },
    onChange: function (slug) { if (cal) cal.setCity(slug); if (banner) banner.setHome('/events' + (slug ? '?city=' + encodeURIComponent(slug) : '')); },
    action: { label: 'Submit an event', onClick: function () { if (cal) cal.submit(); } }
  });
  cal = VEEvents.mount('ev-cal', { key: 'events', city: banner.current(), onInteract: function () { banner.autoFold(); } });
  // Arriving on a search, a filter or Submit an event is not the landing: start folded.
  var q = new URLSearchParams(location.search);
  if (q.get('q') || q.get('cat') || q.get('where') || q.get('when') || q.get('sort') || /^#(submit|mine)/.test(location.hash)) banner.autoFold();
})();
</script>
</body>
</html>
