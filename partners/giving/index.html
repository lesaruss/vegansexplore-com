  <style>
    /* Option C, Real things first (brief: /mocks/guide-panel2/BRIEF.md, 2026-11-18). Everything is a kit part (k-) or a thin layout
       rule around one. Order on every view: slim Guide bar with the parts in one visible row, title, one line, the Guide beside the
       title, the one orange action, then the real thing (nutrients, airports) as the hero. No how-to boxes. */
    html, body { overflow-x: hidden; }
    body { margin: 0; background: #fff; color: var(--k-ink); font-family: 'Montserrat', system-ui, sans-serif; }

    /* The slim Guide bar: the Guide's name and who it is for, then every part, visible. */
    .rf-bar { background: var(--k-pink); padding: 8px 40px 0; display: flex; align-items: center; gap: 6px 22px; flex-wrap: wrap; }
    .rf-name { display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; padding-bottom: 8px; }
    .rf-name a { font-size: 16px; font-weight: 900; letter-spacing: -.02em; color: var(--k-ink); text-decoration: none; white-space: nowrap; }
    .rf-name span { font-size: 12px; font-weight: 800; }
    .rf-tabwrap { position: relative; flex: 1 1 520px; min-width: 0; }
    .rf-bar .k-tabs { padding: 0 0 8px; gap: 6px; }
    .rf-bar .k-tabs > a { font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; }
    .rf-bar .k-tabs > a.on { background: var(--k-ink); color: #fff; }
    .rf-bar .k-tabs > a svg { flex: none; }
    .rf-bar .k-tabs > a.join { background: var(--k-pinkt); }
    .rf-stripe.k-stripe { margin: 0; border-radius: 0; height: 6px; }

    main { padding: 26px 40px 70px; }
    .rf-crumb { font-size: 12px; font-weight: 800; margin: 0 0 8px; color: var(--k-mute); }
    .rf-crumb a { color: var(--k-ink); }
    /* Head: title and one line on the left; the Guide on the right, the same height as the title. */
    .rf-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); grid-template-areas: "t g" "a g"; gap: 0 36px; align-items: start; }
    .rf-head .rf-t { grid-area: t; } .rf-head .rf-guide { grid-area: g; } .rf-head .rf-act { grid-area: a; }
    .rf-head .k-h1 { margin-bottom: 8px; }
    .rf-head .k-lede { margin-bottom: 14px; }
    .rf-act { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
    .rf-price { font-size: 13px; font-weight: 700; line-height: 1.45; color: var(--k-ink); margin: 0; max-width: 620px; }
    .rf-price b { font-weight: 900; }

    /* The Guide: a small square avatar, one short line, Play. Pink, so it reads as the Guides section. */
    .rf-guide { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--k-pinkt); border: 2px solid var(--k-ink); border-radius: var(--k-rc); box-shadow: 4px 4px 0 var(--k-pink); padding: 10px 12px; }
    .rf-guide .av { width: 64px; height: 64px; border: 2px solid var(--k-ink); border-radius: 10px; background: #fff center / cover no-repeat; }
    .rf-guide .who { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--k-pinkd); margin-bottom: 2px; }
    .rf-guide q { display: block; font-size: 14px; font-weight: 800; line-height: 1.35; quotes: none; }
    .rf-guide .k-btn { padding: 9px 12px; }
    .rf-guide .k-btn svg { flex: none; }
    .rf-guide .msg { grid-column: 2 / -1; font-size: 11.5px; font-weight: 700; color: var(--k-mute); margin: -4px 0 0; display: none; }
    .rf-guide.said .msg { display: block; }

    .rf-sec { margin-top: 28px; }
    .rf-sec > .k-label { margin-bottom: 10px; }

    /* Nutrients as the hero: big tiles, number left, name middle, one tag right (the same on phones). */

    /* The rest of the Guide: rows, one tag each. */
    .rf-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px 14px; }
    .rf-parts .k-row { text-decoration: none; color: var(--k-ink); }
    .rf-parts .k-row:hover { background: var(--k-tint); }

    /* One nutrient, open in place, with the list beside it */

    .rf-foot { margin-top: 34px; display: grid; gap: 12px; }

    @media (max-width: 900px) {

      .rf-guide .k-btn { padding: 7px 9px; }
      .rf-sec { margin-top: 20px; }
      .rf-head .k-h1 { font-size: 28px; margin-bottom: 4px; }
      .rf-head .k-lede { font-size: 14px; margin-bottom: 10px; }
      .rf-act .k-btn.k-cta { width: 100%; }
      .rf-price { font-size: 12.5px; }
      .rf-guide { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; }
      .rf-guide .av { width: 48px; height: 48px; }
      .rf-guide q { font-size: 13px; }
    }

  function art() { try { if (window.VEGuideArt) return window.VEGuideArt('liz', 'square'); } catch (e) {} return '/public/brand-kit/avatars/liz-v2.jpg'; }

  // The parts, in order: [key, tab label, title (html), one line, Liz's recorded line, her file, next-part line]
  var PARTS = [
    ['start', 'Overview', 'Present a day of our <span class="k-hl o">holiday giveaway</span> with up to <span class="k-hl g">$150</span> in product',
      'Vegans Explore opens January 1. Everyone who joins free by December 11 is entered, and from December 14 to Christmas Eve we draw winners live, one day at a time.',
      "Hi, I'm Liz. Vegans Explore opens January first, and we're counting down with a free giveaway. We'd love your brand to present one of the days.", 'liz-start-v1.mp3', 'The whole offer on one page'],
    ['give', 'What you give', 'Up to <span class="k-hl o">$150 in product</span>, and you ship only if someone wins',
      'One item, several, a bundle or a digital code. No fee, and nothing ships up front.',
      "Here's the ask: up to one hundred and fifty dollars in product. One item, a bundle or a code. And you only ship if someone wins.", 'liz-give-v1.mp3', 'Up to $150 in product, no fee'],
    ['day', 'Your day', 'You present a day, and we <span class="k-hl g">build the campaign around it</span>',
      'One of the 11 Days of Giving, December 14 to 24, with your prize drawn live.',
      "On your day, we draw your prize live, and your brand is in our post, our story, our email and our ads.", 'liz-seen-v1.mp3', 'Your live draw and your co-branded campaign'],
    ['today', 'Where we are today', 'We open January 1, and this is our <span class="k-hl p">founding season</span>',
      'Real numbers, counted live where we can.',
      "We're in our founding season, and we'll only ever show you real numbers. It's a small test, and the report helps you decide what's next.", 'liz-today-v1.mp3', 'Our numbers, said plainly'],
    ['report', 'Your report', 'A report on what your day <span class="k-hl o">did for your brand</span>',
      'By January 15, 2027, once every prize has shipped. Real numbers only.',
      "In January you get a report: where you showed up, the clicks, the new members, and proof your prize arrived.", 'liz-report-v1.mp3', 'What you get back in January'],
    ['dates', 'The dates', 'From yes to <span class="k-hl g">done</span>',
      'Say yes by Friday, December 4. You are done by January 15.',
      "Say yes by December fourth. Your prize helps people join until the eleventh, your day falls between the fourteenth and Christmas Eve, and you're done by mid-January.", 'liz-dates-v1.mp3', 'Yes by December 4, done by January 15'],
    ['join', 'Save your day', 'Tell us what you are giving, and <span class="k-hl o">we will save your day</span>',
      'Days are first come, first served. Nothing is final until you say yes, and there is never a fee.',
      "Tell us what you're giving, and we'll save your day. You'll hear from us within a business day.", 'liz-join-v2.mp3', 'A short form, about a minute']
  ];
  function idx(k) { for (var i = 0; i < PARTS.length; i++) if (PARTS[i][0] === k) return i; return 0; }
  function cur() { var k = (location.hash.match(/^#\/([a-z]+)/) || [])[1] || 'start'; return idx(k); }
  function link(k) { return k === 'start' ? '#/' : '#/' + k; }

  function bar(i) {
    document.getElementById('gTabs').innerHTML = PARTS.map(function (p, j) {
      return '<a href="' + link(p[0]) + '"' + (j === i ? ' class="on" aria-current="page"' : p[0] === 'join' ? ' class="join"' : '') + '>' + esc(p[1]) + '</a>';
    }).join('');
    var t = document.querySelector('#gTabs .on'); if (t && innerWidth < 900) document.getElementById('gTabs').scrollLeft = Math.max(0, t.offsetLeft - 16);
  }
  function guide(p) {
    return '<div class="rf-guide" data-audio="' + VB + p[5] + '"><span class="av" role="img" aria-label="Liz, our Guide for businesses" style="background-image:url(\'' + art() + '\')"></span>' +
      '<div><span class="who">Liz, Explorer</span><q>' + esc(p[4]) + '</q></div>' +
      '<button type="button" class="k-btn k-sm" data-play aria-label="Play Liz">' + PLAY + '<span>Play</span></button></div>';
  }
  function head(i, action) {
    var p = PARTS[i];
    return (i ? '<div class="rf-crumb"><a href="#/">11 Days of Giving for Brands</a> &rsaquo; ' + esc(p[1]) + '</div>' : '') +
      '<div class="rf-head"><div class="rf-t"><h1 class="k-h1">' + p[2] + '</h1><p class="k-lede">' + esc(p[3]) + '</p></div>' + guide(p) +
      '<div class="rf-act">' + (action || '') + '</div></div>';
  }
  var SAVE = '<a class="k-btn k-cta" href="#/join">Save your day</a><p class="rf-price">No fee. Up to $150 in product. Yes by Friday, December 4.</p>';
  function row(n, cls, title, body, tag) {
    return '<div class="k-row"><span class="k-num ' + cls + '">' + n + '</span><span class="k-row-t"><b>' + title + '</b><small>' + body + '</small></span>' + (tag ? '<span class="k-tag live">' + tag + '</span>' : '<span></span>') + '</div>';
  }
  function good(blocks) { return '<section class="rf-sec"><span class="k-label">Good to know</span><div class="gb-good">' + blocks.map(function (b) { return '<div class="k-block ' + b[0] + '"><span class="k-label">' + b[1] + '</span>' + b[2] + '</div>'; }).join('') + '</div></section>'; }
  function see() { return '<div class="gb-see"><span class="k-label">Ready?</span><h2>Save your day.</h2><p>Days are first come, first served, so if you would like one, save it by Friday, December 4.</p><a class="k-btn k-sm" href="#/join">Save your day &rsaquo;</a></div>'; }
  function next(i) { var n = PARTS[i + 1]; return n ? '<div class="gb-next"><a href="' + link(n[0]) + '">Next part: ' + esc(n[1]) + ' &rsaquo;</a><span>' + esc(n[6]) + '</span></div>' : ''; }
  var RULES = '/guides/holiday-guide#/giving/rules';

  var VIEWS = {
    start: function (i) {
      return head(i, SAVE) +
        '<div class="gb-cover"><div>' +
          '<div class="k-blocks"><div class="k-block k-dk"><span class="k-big">Up to $150</span><small>In product. No fee, ever</small></div>' +
          '<div class="k-block k-peach"><span class="k-big">Your own day</span><small>A live draw and a co-branded campaign</small></div>' +
          '<div class="k-block k-pink"><span class="k-big">Done Jan 15</span><small>A hard end date</small></div></div>' +
          '<section class="rf-sec"><span class="k-label">In this Guide</span><div class="rf-parts">' + PARTS.slice(1).map(function (p, j) {
            return '<a class="k-row" href="' + link(p[0]) + '"><span class="k-num ' + ['or', 'br', 'pk', 'pe', 'dk', 'ti'][j % 6] + '">' + (j + 1) + '</span><span class="k-row-t"><b>' + esc(p[1]) + '</b><small>' + esc(p[6]) + '</small></span><span></span></a>';
          }).join('') + '</div></section>' +
        '</div><div class="k-pic" style="--k-c:#FF9EC4"><img src="/public/partners/liz-giving-brands.jpg" alt="Liz, our Guide for businesses, putting together a holiday pack"></div></div>' + next(i);
    },
    give: function (i) {
      return head(i, SAVE) + '<section class="rf-sec"><span class="k-label">What you give</span><div class="k-rows">' +
        row(1, 'or', 'Up to $150 retail, in all', 'One item, several, a bundle, or a digital code people redeem on your site. Nothing perishable that needs cold shipping.', 'You choose') +
        row(2, 'br', 'Nothing to pay, nothing to ship now', 'When a member wins and confirms, we send you their address. You ship within 7 business days, or send the code the same day.', 'Free') +
        row(3, 'pk', 'Your prize, your words', 'Send a photo and a line about what is inside. You approve your logo and copy before anything posts.', 'Your brand') +
        row(4, 'pe', 'Fair to everyone', 'No purchase, share, tag or follow to enter. Winners are drawn at random, in the open, under our <a href="' + RULES + '">official rules</a>.', 'Trusted') +
        '</div></section>' + good([['k-tint', 'Who wins', 'Vegans Explore members: people who live Vegan, or are on their way, and look for brands they can trust. One prize per person.'], ['k-peach', 'Spots are limited', 'The whole giveaway is capped at $5,000 in prizes, so prizes are taken first come, first served.']]) + see() + next(i);
    },
    day: function (i) {
      return head(i, SAVE) + '<section class="rf-sec"><span class="k-label">Your day</span><div class="k-rows">' +
        row('A', 'pk', 'Your own day', 'One of the 11 Days of Giving, December 14 to 24, when we draw and announce winners live. First come, first served.', 'Yours') +
        row('B', 'or', 'A co-branded post and story', 'Both logos, your prize and its winner, on our accounts on your day; until December 11, your prize also invites people to join and be entered.', 'Your day') +
        row('C', 'br', 'Our email and our ads', 'A mention in that day\'s holiday email, and your prize on the house ads across Vegans Explore.', 'Your day') +
        row('D', 'pe', 'Your prize in the Prize Vault', 'On the giveaway page from the day you say yes, linked to your page in our Directory.', 'From now') +
        row('E', 'dk', 'Your link, your kit, your mark', 'Your own tracked link, a ready-to-share kit for your followers, and "Gave to 11 Days of Giving 2026" on your Directory page for good.', 'Yours') +
        '</div></section>' + good([['k-pink', 'Our goal, said plainly', 'Until December 11, every post invites people to join Vegans Explore free and be entered. Your prize is a reason to join, and your brand is part of how we open on January 1.'], ['k-tint', 'Your listing', 'Your brand has a page in our Directory (or gets one, free), for every shopper who looks you up after.']]) + see() + next(i);
    },
    today: function (i) {
      return head(i, SAVE) + '<section class="rf-sec gb-now"><span class="k-label">Our numbers</span><div class="k-blocks">' +
        '<div class="k-block k-dk"><span class="k-big" id="gbMembers">65</span><small>Founding members so far</small></div>' +
        '<div class="k-block k-peach"><span class="k-big">2,101</span><small>People our holiday emails reach</small></div>' +
        '<div class="k-block k-tint"><span class="k-big">2,864</span><small>Vegan and plant-based places and brands in our Directory</small></div></div>' +
        '<p class="gb-quote">It\'s a small-cost test with real numbers: one item or bundle, you ship only if a member wins, and you decide on 2027 from the report.</p>' +
        '<p class="gb-fine">Members are counted live. The email reach and the Directory count are as of November 19, 2026.</p></section>' + see() + next(i);
    },
    report: function (i) {
      return head(i, SAVE) + '<section class="rf-sec"><div class="k-card" style="max-width:900px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="k-label" style="margin:0">Your 11 Days of Giving report</span><span class="k-tag smp">Sample</span></div>' +
        '<div class="k-stats" style="margin:12px 0"><div class="k-stat"><b>Yours</b><small>Sends, opens and clicks on your day\'s email</small></div><div class="k-stat" style="--k-c:#F69820"><b>Yours</b><small>Clicks on your tracked link</small></div><div class="k-stat" style="--k-c:#FF9EC4"><b>Yours</b><small>Visits to your Directory page</small></div><div class="k-stat" style="--k-c:#22C55E"><b>Yours</b><small>New members during your day</small></div></div>' +
        '<div class="k-rows">' + row('&#10003;', 'ti', 'Where you appeared', 'Every post, email and ad spot, with a screenshot of each.', 'Included') + row('&#10003;', 'ti', 'Your winners', 'Who won your prize, and proof it arrived.', 'Included') + '</div></div></section>' +
        good([['k-peach', 'When', 'By January 15, 2027, once every prize has shipped.'], ['k-tint', 'Real numbers only', 'The boxes fill with your own campaign\'s numbers. We never estimate them.']]) + see() + next(i);
    },
    dates: function (i) {
      return head(i, SAVE) + '<section class="rf-sec"><span class="k-label">The dates</span><div class="k-steps">' +
        '<div class="you"><em>By Fri, Dec 4</em><b>Say yes</b>Pick one of the 11 days, first come, first served.</div>' +
        '<div><em>Now to Dec 11</em><b>We promote</b>Your prize helps people join free and be entered.</div>' +
        '<div><em>Dec 14 to 24</em><b>Your day</b>Your live draw, your winner, your co-branded post and story.</div>' +
        '<div class="you"><em>Within 7 business days</em><b>You ship</b>Only when your winner confirms. A digital code goes the same day.</div>' +
        '<div><em>By Jan 15</em><b>You\'re done</b>Your report arrives, and nothing more is owed.</div></div>' +
        '<p class="gb-fine" style="margin-top:14px">Orange is your part. Everything else is ours.</p></section>' + see() + next(i);
    },
    join: function (i) {
      return head(i, '') + '<section class="rf-sec gb-form"><div class="k-card" style="--k-c:#F69820"><form id="gvBrand" class="k-form" novalidate>' +
        '<div class="k-f"><label for="b-brand">Brand</label><input id="b-brand" maxlength="120" autocomplete="organization" required></div>' +
        '<div class="k-f"><label for="b-name">Your name</label><input id="b-name" maxlength="120" autocomplete="name" required></div>' +
        '<div class="k-f wide"><label for="b-email">Your email</label><input id="b-email" type="email" maxlength="200" autocomplete="email" required></div>' +
        '<div class="k-f wide"><label for="b-pack">What you\'re giving, and its retail value (up to $150)</label><textarea id="b-pack" maxlength="600" placeholder="Our holiday sampler: six flavors and a tote, $80 retail. Or a $50 code for our site."></textarea></div>' +
        '<div class="k-f wide"><button type="submit" class="k-btn k-cta" id="b-go">Save my day</button><p class="k-msg" id="b-msg" role="status"></p></div>' +
        '</form></div></section>' + good([['k-tint', 'What happens next', 'Our team writes back within a business day with your day and one page of terms. Nothing is final until you say yes, and there is never a fee.'], ['k-peach', 'The rules', 'Read the <a href="' + RULES + '">official rules</a> members enter under.']]);
    }
  };

  var audio = null, playing = null;
  function stop() { if (audio) audio.pause(); if (playing) playing.innerHTML = PLAY + '<span>Play</span>'; playing = null; }
  function render() {
    stop();
    var i = cur(), p = PARTS[i];
    bar(i);
    main.innerHTML = VIEWS[p[0]](i);
    document.title = (i ? p[1] + ' | ' : '') + '11 Days of Giving for Brands — Vegans Explore';
    var g = main.querySelector('.rf-guide'), b = g && g.querySelector('[data-play]');
    if (b) {
      // Play shows only when the recording is there; nothing plays until pressed.
      b.hidden = true;
      fetch(g.getAttribute('data-audio'), { method: 'HEAD' }).then(function (r) { if (r.ok) b.hidden = false; }).catch(function () {});
      b.addEventListener('click', function () {
        if (playing === b) { stop(); return; }
        stop(); audio = new Audio(g.getAttribute('data-audio')); audio.addEventListener('ended', stop);
        audio.play(); b.innerHTML = PAUSE + '<span>Pause</span>'; playing = b;
      });
    }
    if (p[0] === 'today') fetch('https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-giving', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"action":"status"}' })
      .then(function (r) { return r.json(); }).then(function (r) { var e = document.getElementById('gbMembers'); if (e && r && r.entries > 0) e.textContent = Number(r.entries).toLocaleString('en-US'); }).catch(function () {});
    if (p[0] === 'join') wireForm();
    if (window.scrollY > 120) window.scrollTo(0, 0);
  }
  function wireForm() {
    var f = document.getElementById('gvBrand'); if (!f) return;
    var $ = function (id) { return document.getElementById(id); };
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var m = $('b-msg'), b = $('b-go'), body = { action: 'brand_interest', brand: $('b-brand').value.trim(), name: $('b-name').value.trim(), email: $('b-email').value.trim(), quantity: 1, pack: $('b-pack').value.trim(), page: location.pathname + location.search };
      if (!body.brand || !body.name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email)) { m.textContent = 'Add your brand, your name and your email.'; return; }
      b.disabled = true; m.textContent = 'Sending...';
      fetch('https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-giving', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); }).then(function (r) {
          if (r && r.ok) { m.textContent = 'Thank you. Our team will write back within a business day with your day.'; f.querySelectorAll('input,textarea').forEach(function (x) { x.disabled = true; }); return; }
          b.disabled = false; m.textContent = r && r.error === 'too_many' ? 'We already have your note. Our team will be in touch.' : 'That did not go through. Try again in a moment.';
        }).catch(function () { b.disabled = false; m.textContent = 'That did not go through. Try again in a moment.'; });
    });
  }
  // Old slide links (#join, #dates...) still land on their part.
  var OLD = { '#start': '#/', '#give': '#/give', '#seen': '#/day', '#today': '#/today', '#report': '#/report', '#dates': '#/dates', '#join': '#/join' };
  if (OLD[location.hash]) history.replaceState(null, '', location.pathname + location.search + OLD[location.hash]);
  addEventListener('hashchange', render);
  render();
})();
</script>
<script src="/public/footer.js"></script>
</body>
