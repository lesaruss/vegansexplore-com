<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Business outreach | The Depot</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Business outreach (Sean, 2026-10-10): "see who is on the queue, approve who the emails are going to be going out
       to... on Monday, we're sending it to these 60... see what the draft is that's going to be sent to them... and we
       commit to it for like maybe 15 days before we make any drastic changes." One thing per view: cities and upcoming
       sends, then a send day's businesses, then one business with its three emails and its page. Data: ve-outreach. */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-deep:#1f5f22;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.8);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    [hidden]{display:none !important;}
    .wrap{max-width:none;margin:0;padding:28px 40px 56px;}
    @media (max-width:600px){.wrap{padding:24px 16px 48px;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-deep);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,32px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:8px;}
    h2{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
    .sub{font-size:14.5px;color:var(--ve-text-75);margin-bottom:16px;max-width:860px;}
    .gate{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:32px;text-align:center;}
    .crumbs{font-size:13px;font-weight:700;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ve-text-75);}
    .crumbs a{color:var(--ve-green-deep);text-decoration:none;}
    .crumbs a:hover{text-decoration:underline;}
    .card{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:16px 18px;margin:0 0 18px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;}
    .city{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;}
    .city h3{font-size:16px;font-weight:900;}
    .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
    .nums div{background:#f7f8f7;border-radius:8px;padding:6px 8px;}
    .nums b{display:block;font-size:18px;font-weight:900;line-height:1.1;}
    .nums span{font-size:10.5px;font-weight:700;color:var(--ve-text-75);}
    .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#eee;color:#444;white-space:nowrap;}
    .tag.on{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .tag.wait{background:#FFF1DC;color:#8a4b00;}
    .tag.off{background:#eee;color:#555;}
    .tag.guide{background:#EEE8FF;color:#4b2b9b;}
    .btn{font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:9px 16px;min-height:42px;border-radius:6px;cursor:pointer;border:0;background:var(--ve-green-deep);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
    .btn-ghost{background:#fff;color:var(--ve-text);border:1px solid rgba(0,0,0,.25);}
    .btn-warn{background:#fff;color:#a61b1b;border:1px solid #a61b1b;}
    .btn-sm{font-size:11px;padding:6px 12px;min-height:36px;}
    .btn:disabled{opacity:.55;cursor:wait;}
    .row-btns{display:flex;flex-wrap:wrap;gap:8px;}
    .msg{font-size:13px;font-weight:700;color:var(--ve-green-deep);}
    .msg.err{color:#a61b1b;}
    .list{display:flex;flex-direction:column;}
    .item{display:grid;grid-template-columns:44px minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1.2fr) 120px;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--ve-border);font-size:13px;}
    .item.head{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ve-text-75);padding-top:0;}
    .item small{display:block;color:var(--ve-text-75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .item .act{text-align:right;}
    .logo{width:40px;height:40px;border-radius:8px;background:var(--ve-green-light) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ve-green-deep);}
    @media (max-width:760px){.item{grid-template-columns:40px 1fr;}.item>div:nth-child(3),.item>div:nth-child(4){grid-column:2;}.item .act{grid-column:1/-1;text-align:left;}.item.head{display:none;}}
    .batches .item{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 170px 120px;}
    @media (max-width:760px){.batches .item{grid-template-columns:1fr 1fr;}}
    .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;}
    @media (max-width:980px){.two{grid-template-columns:1fr;}}
    .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
    .tabs button{font:inherit;font-size:12px;font-weight:800;padding:8px 14px;border-radius:6px;border:1px solid rgba(0,0,0,.2);background:#fff;cursor:pointer;}
    .tabs button[aria-selected="true"]{background:var(--ve-green-deep);color:#fff;border-color:var(--ve-green-deep);}
    .mail{border:1px solid var(--ve-border);border-radius:10px;background:#fff;}
    .mail-h{padding:10px 14px;border-bottom:1px solid var(--ve-border);font-size:13px;}
    .mail-h b{font-weight:800;}
    .mail-b{padding:14px;font-size:14px;white-space:pre-wrap;word-break:break-word;line-height:1.6;}
    .mail-b a{color:var(--ve-green-deep);}
    .frame{width:100%;height:min(78vh,900px);border:1px solid var(--ve-border);border-radius:10px;background:#fff;}
    .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px 12px;align-items:end;}
    .form label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ve-text-75);display:flex;flex-direction:column;gap:4px;}
    .form input{font:inherit;font-size:14px;padding:9px 10px;min-height:42px;border:1px solid rgba(0,0,0,.25);border-radius:6px;background:#fff;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ve-text);width:100%;}
    .hint{font-size:12.5px;color:var(--ve-text-75);margin-top:8px;}
    .note{background:#FFF8EC;border:1px solid #F5D9A8;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
    .found{font-size:12.5px;margin-top:8px;max-height:220px;overflow:auto;}
    .empty{font-size:14px;color:var(--ve-text-75);padding:16px 0;}
  </style>
</head>
<body>
  <div class="page-frame">
  <script>
  try { if (window.self !== window.top) document.documentElement.classList.add('ve-embedded'); } catch (e) {}
  </script>
  <style>.ve-embedded .ve-nav,.ve-embedded .ve-footer{display:none !important}.ve-embedded body{background:#fff}.ve-embedded .wrap{padding:20px 24px 40px}</style>
  <script src="/public/nav.js"></script>
  <div class="wrap">
    <p class="eyebrow">The Depot</p>
    <h1>Business outreach</h1>
    <div id="depot-tabs"></div>
    <div id="bo-gate" class="gate" hidden></div>
    <div id="bo-app" hidden>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div id="view"></div>
    </div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script src="/public/depot-tabs.js"></script>
  <script>
    (function () {
      var FN = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-outreach';
      var $ = function (id) { return document.getElementById(id); };
      var V = function () { return $('view'); };
      var data = null;
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
      function api(body) { return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + VEAuth.getToken() }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
      function day(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }
      function cityName(slug) { var c = (data && data.cities || []).filter(function (x) { return x.community_slug === slug; })[0]; return c ? c.name : slug; }
      function crumbs(parts) {
        $('crumbs').innerHTML = parts.map(function (p, i) { return i < parts.length - 1 ? '<a href="' + p[1] + '">' + esc(p[0]) + '</a> <span aria-hidden="true">&rsaquo;</span>' : '<span aria-current="page">' + esc(p[0]) + '</span>'; }).join(' ');
      }
      var STATUS = { proposed: ['Waiting for approval', 'wait'], approved: ['Approved', 'on'], sent: ['Sent', 'on'] };
      // One business's place in its three emails, in plain words.
      function who(r) {
        var m = { not_sent: ['Not sent yet', 'off'], in_sequence: ['Day ' + [0, 0, 4, 10][r.step] + ' email sent', 'on'], finished: ['All three sent', 'on'],
          interested: ['Interested', 'guide'], joined: ['Joined', 'on'], opted_out: ['Unsubscribed', 'off'], bounced: ['Bounced', 'wait'], held: ['Not emailing', 'off'] }[r.status] || [r.status, 'off'];
        return '<span class="tag ' + m[1] + '">' + esc(m[0]) + '</span>';
      }
      function linkify(t) { return esc(t).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }); }
      function logo(l) { return l && l.logo_url ? '<div class="logo" style="background-image:url(\'' + esc(l.logo_url) + '\')" aria-hidden="true"></div>' : '<div class="logo" aria-hidden="true">' + esc(((l && l.name) || '?').charAt(0)) + '</div>'; }
      function load() { return api({ action: 'overview' }).then(function (d) { if (!d.ok) throw new Error(d.error); data = d; }); }

      // ---- Views ----
      function viewHome() {
        crumbs([['Business outreach']]);
        var upcoming = data.batches.filter(function (b) { return b.status !== 'sent'; });
        V().innerHTML =
          '<p class="sub">Each send day is a batch. Open one to see every business in it, their page and the exact emails they will get, take anyone out, then approve it. Approving a batch approves all three emails for those businesses (Day 0 on the send day, Day 4 and Day 10 unless they answer). A city sends only once you turn it on: approved days go out from their send day, weekdays 9 AM to 5 PM Eastern, a few at a time, from you, with replies to contact@lesaruss.com.</p>' +
          '<section class="card batches"><h2>Upcoming sends</h2>' +
          (upcoming.length ? '<div class="list"><div class="item head"><div>Send day</div><div>City</div><div>Businesses</div><div>Status</div><div></div></div>' +
            upcoming.map(function (b) { var s = STATUS[b.status] || [b.status, 'off'];
              return '<div class="item"><div><strong>' + esc(day(b.send_on)) + '</strong></div><div>' + esc(cityName(b.community_slug)) + '</div><div>' + b.size + '</div><div><span class="tag ' + s[1] + '">' + s[0] + '</span></div><div class="act"><a class="btn btn-sm" href="#batch/' + b.id + '">Review</a></div></div>';
            }).join('') + '</div>'
          : '<p class="empty">No sends planned yet. Plan a city below.</p>') + '</section>' +
          '<section><h2>Cities</h2><div class="grid">' + data.cities.map(function (c) {
            var n = c.counts || {}, emailed = (n.in_sequence || 0) + (n.finished || 0);
            var inb = data.batches.filter(function (b) { return b.community_slug === c.community_slug && b.status !== 'sent'; }).reduce(function (a, b) { return a + b.size; }, 0);
            return '<div class="city"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>' + esc(c.name) + '</h3>' +
              (c.enabled ? '<span class="tag on">On</span>' : '<span class="tag off">Off</span>') + '</div>' +
              '<div class="nums"><div><b>' + (n.waiting || 0) + '</b><span>Not planned</span></div><div><b>' + inb + '</b><span>Planned</span></div><div><b>' + emailed + '</b><span>Emailed</span></div><div><b><a href="#interested" style="color:inherit">' + ((n.interested || 0) + (n.joined || 0)) + '</a></b><span>Interested</span></div></div>' +
              (c.committed_until ? '<small class="hint">Committed until ' + esc(day(c.committed_until)) + ': no big changes before then.</small>' : '') +
              '<div class="row-btns"><a class="btn btn-sm" href="#plan/' + c.community_slug + '">Plan sends</a><button type="button" class="btn btn-ghost btn-sm" data-find="' + c.community_slug + '">Find emails</button>' +
              '<button type="button" class="btn ' + (c.enabled ? 'btn-warn' : 'btn-ghost') + ' btn-sm" data-switch="' + c.community_slug + '" data-on="' + (c.enabled ? '0' : '1') + '">' + (c.enabled ? 'Pause sending' : 'Turn on sending') + '</button></div>' +
              '<div class="msg" data-found="' + c.community_slug + '" role="status"></div></div>';
          }).join('') + '</div></section>' +
          '<p class="hint" style="margin-top:16px"><a href="#interested">Interested businesses</a> &middot; <a href="#emails">See the three emails</a></p>';
        Array.prototype.forEach.call(V().querySelectorAll('[data-find]'), function (b) { b.addEventListener('click', function () { findEmails(b.dataset.find, b); }); });
        Array.prototype.forEach.call(V().querySelectorAll('[data-switch]'), function (b) {
          b.addEventListener('click', function () {
            var on = b.dataset.on === '1', name = cityName(b.dataset.switch);
            if (!confirm(on ? 'Turn on sending for ' + name + '? Approved send days go out from their day, weekdays 9 AM to 5 PM Eastern, a few at a time.' : 'Pause sending for ' + name + '? Nothing more goes out there until you turn it back on.')) return;
            b.disabled = true;
            api({ action: 'city', city: b.dataset.switch, enabled: on }).then(function (d) { if (!d.ok) { alert(d.error || 'That did not work.'); b.disabled = false; return; } return load().then(route); });
          });
        });
      }

      function findEmails(city, btn) {
        var out = V().querySelector('[data-found="' + city + '"]');
        btn.disabled = true; out.className = 'msg'; out.textContent = 'Reading their websites, about a minute...';
        api({ action: 'find_emails', city: city, limit: 20 }).then(function (d) {
          btn.disabled = false;
          if (!d.ok) { out.className = 'msg err'; out.textContent = d.error || 'That did not work.'; return; }
          out.innerHTML = 'Checked ' + d.checked + ', found ' + d.found + ' published emails.' + (d.left ? ' ' + d.left + ' websites left: press again.' : '') +
            '<div class="found">' + d.results.map(function (r) { return esc(r.name) + ': ' + (r.email ? '<strong>' + esc(r.email) + '</strong>' : esc(r.note)); }).join('<br>') + '</div>';
          return load();
        }).catch(function () { btn.disabled = false; out.className = 'msg err'; out.textContent = 'Could not reach the server.'; });
      }

      function nextMonday() { var d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return d.toLocaleDateString('en-CA'); }
      function viewPlan(city) {
        crumbs([['Business outreach', '#'], [cityName(city) + ': plan sends']]);
        var c = data.cities.filter(function (x) { return x.community_slug === city; })[0] || { counts: {} };
        V().innerHTML = '<section class="card"><h2>Plan sends for ' + esc(cityName(city)) + '</h2>' +
          '<p class="sub">' + ((c.counts || {}).waiting || 0) + ' businesses with an email are not planned yet. Pick the first send day and how many go out each weekday. Brands go first. Each day becomes a batch for you to review and approve.</p>' +
          '<form class="form" id="plan-f"><label>First send day<input type="date" id="p-start" required value="' + nextMonday() + '"></label>' +
          '<label>Businesses per day<input id="p-sizes" required value="30, 30, 30" placeholder="60, 30, 30"><span class="hint" style="text-transform:none;letter-spacing:0">One number per weekday, comma separated.</span></label>' +
          '<div><button class="btn" id="p-go">Propose these sends</button></div></form><p class="msg" id="p-msg" role="status"></p></section>';
        $('plan-f').addEventListener('submit', function (e) {
          e.preventDefault();
          var sizes = $('p-sizes').value.split(/[,\s]+/).map(Number).filter(function (n) { return n > 0; });
          $('p-go').disabled = true;
          api({ action: 'plan', city: city, start: $('p-start').value, sizes: sizes }).then(function (d) {
            $('p-go').disabled = false;
            if (!d.ok) { $('p-msg').className = 'msg err'; $('p-msg').textContent = d.error === 'start_in_past' ? 'Pick a day from today on.' : (d.error || 'That did not work.'); return; }
            $('p-msg').className = 'msg'; $('p-msg').textContent = d.planned ? d.planned + ' businesses planned. Review each day under Upcoming sends.' : 'Nobody is waiting to be planned in this city.';
            return load();
          });
        });
      }

      function viewBatch(id) {
        var b = data.batches.filter(function (x) { return x.id === id; })[0];
        if (!b) { location.hash = ''; return; }
        crumbs([['Business outreach', '#'], [cityName(b.community_slug) + ', ' + day(b.send_on)]]);
        V().innerHTML = '<p class="empty">Loading...</p>';
        api({ action: 'batch', batch_id: id }).then(function (d) {
          var rows = d.rows || [], s = STATUS[b.status] || [b.status, 'off'];
          var city = data.cities.filter(function (x) { return x.community_slug === b.community_slug; })[0] || {};
          V().innerHTML = '<section class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center">' +
            '<div><h2 style="margin:0">' + esc(day(b.send_on)) + ': ' + rows.length + (rows.length === 1 ? ' business in ' : ' businesses in ') + esc(cityName(b.community_slug)) + '</h2><span class="tag ' + s[1] + '">' + s[0] + '</span></div>' +
            (b.status === 'proposed' ? '<div class="row-btns"><button class="btn" id="b-ok">Approve this send</button><button class="btn btn-ghost" id="b-cancel">Cancel this day</button></div>' : '') + '</div>' +
            (b.status === 'proposed' && !city.enabled ? '<p class="hint">' + esc(cityName(b.community_slug)) + ' is off, so nothing goes out even once approved until the city is switched on.</p>' : '') +
            '<p class="msg" id="b-msg" role="status"></p></section>' +
            '<section class="card"><div class="list"><div class="item head"><div></div><div>Business</div><div>Email goes to</div><div>In our Guides</div><div></div></div>' +
            (rows.map(function (r) { var l = r.listing || {};
              return '<div class="item"><div>' + logo(l) + '</div><div><strong>' + esc(l.name) + '</strong><small>' + esc([l.category, l.address_city].filter(Boolean).join(' · ')) + (l.vote_count ? ' · ' + l.vote_count + ' votes' : '') + '</small></div>' +
                '<div>' + who(r) + ' ' + esc(r.contact_name || '') + '<small>' + esc(r.email) + '</small><small>' + esc(r.email_source && /^http/.test(r.email_source) ? 'from ' + r.email_source.replace(/^https?:\/\//, '') : 'on file') + '</small></div>' +
                '<div>' + (r.guides.length ? r.guides.map(function (g) { return '<span class="tag guide">' + esc(g) + '</span>'; }).join(' ') : '<small>Not yet</small>') + '</div>' +
                '<div class="act"><a class="btn btn-ghost btn-sm" href="#batch/' + id + '/' + r.id + '">Preview</a></div></div>';
            }).join('') || '<p class="empty">Nobody in this day.</p>') + '</div></section>';
          if ($('b-ok')) $('b-ok').addEventListener('click', function () {
            if (!confirm('Approve ' + rows.length + ' businesses for ' + day(b.send_on) + '? Each gets the three emails unless they answer.')) return;
            act({ action: 'approve', batch_id: id }, 'Approved.');
          });
          if ($('b-cancel')) $('b-cancel').addEventListener('click', function () { if (confirm('Cancel this day? Its businesses go back to Not planned.')) act({ action: 'cancel', batch_id: id }, '', '#'); });
        });
      }
      function act(body, ok, go) {
        return api(body).then(function (d) {
          if (!d.ok) { var m = $('b-msg') || $('c-msg'); if (m) { m.className = 'msg err'; m.textContent = d.error || 'That did not work.'; } return; }
          return load().then(function () { if (go != null) location.hash = go; else route(); var m = $('b-msg') || $('c-msg'); if (m && ok) m.textContent = ok; });
        });
      }

      function viewContact(bid, cid) {
        var b = data.batches.filter(function (x) { return x.id === bid; })[0];
        if (!b) { location.hash = ''; return; }
        V().innerHTML = '<p class="empty">Loading...</p>';
        Promise.all([api({ action: 'batch', batch_id: bid }), api({ action: 'preview', contact_id: cid })]).then(function (res) {
          var r = (res[0].rows || []).filter(function (x) { return x.id === cid; })[0];
          if (!r) { location.hash = '#batch/' + bid; return; }
          var l = r.listing || {}, mails = res[1].emails || [], open = b.status === 'proposed';
          crumbs([['Business outreach', '#'], [cityName(b.community_slug) + ', ' + day(b.send_on), '#batch/' + bid], [l.name]]);
          V().innerHTML = '<div class="two"><section class="card"><h2>' + esc(l.name) + '</h2>' +
            '<p class="sub" style="margin-bottom:10px">' + esc(l.tagline || l.brief_summary || '') + '</p>' +
            '<div class="tabs" role="tablist">' + mails.map(function (m, i) { return '<button type="button" role="tab" aria-selected="' + (i === 0) + '" data-i="' + i + '">Day ' + m.day + '</button>'; }).join('') + '</div>' +
            '<div id="mail"></div><div class="row-btns" style="margin-top:10px"><button type="button" class="btn btn-ghost btn-sm" id="c-test">Send me this as a test</button></div>' +
            (open ? '<h2 style="margin-top:18px">Fix before it goes</h2><form class="form" id="c-f"><label>Name<input id="c-name" value="' + esc(r.contact_name || '') + '" placeholder="First and last name"></label><label>Email<input id="c-email" type="email" value="' + esc(r.email) + '"></label><div><button class="btn btn-ghost">Save</button></div></form>' +
              '<div class="row-btns" style="margin-top:14px"><button class="btn btn-ghost btn-sm" id="c-out">Take out of this day</button><button class="btn btn-warn btn-sm" id="c-hold">Never email them</button></div>'
              : '<p class="hint">This day is approved, so the email can no longer be changed here.</p>') +
            '<p class="msg" id="c-msg" role="status"></p></section>' +
            '<section class="card"><h2>Their page, as they will see it</h2><iframe class="frame" title="' + esc(l.name) + ' on Vegans Explore" src="/directory/' + encodeURIComponent(l.slug) + '?preview=1"></iframe>' +
            '<p class="hint"><a href="/directory/' + encodeURIComponent(l.slug) + '" target="_blank" rel="noopener">Open their page</a> &middot; <a href="/directory/' + encodeURIComponent(l.slug) + '?tab=brand" target="_blank" rel="noopener">Partner Dashboard tab</a></p></section></div>';
          function show(i) {
            var m = mails[i] || {};
            $('mail').innerHTML = '<div class="mail"><div class="mail-h"><b>To</b> ' + esc(m.to_email) + '<br><b>From</b> Sean A. Russell &middot; replies to contact@lesaruss.com<br><b>Subject</b> ' + esc(m.subject) + '</div><div class="mail-b">' + linkify(m.body || '') + '</div></div>' +
              '<p class="hint">The page link becomes ' + esc(l.name) + '\'s own tracked link when it is sent, so a click shows here and on Leads.</p>';
            Array.prototype.forEach.call(V().querySelectorAll('.tabs button'), function (t) { t.setAttribute('aria-selected', t.dataset.i == i); });
          }
          var cur = 0;
          Array.prototype.forEach.call(V().querySelectorAll('.tabs button'), function (t) { t.addEventListener('click', function () { cur = +t.dataset.i; show(cur); }); });
          show(0);
          $('c-test').addEventListener('click', function () {
            var b = this; b.disabled = true;
            api({ action: 'test', contact_id: cid, step: cur + 1 }).then(function (d) {
              b.disabled = false; $('c-msg').className = d.ok ? 'msg' : 'msg err';
              $('c-msg').textContent = d.ok ? 'Sent to ' + d.to + ' with [Test] in the subject. Its page link is the plain one, so your click does not count.' : 'Not sent: ' + (d.error || d.result || 'unknown');
            });
          });
          if (!open) return;
          $('c-f').addEventListener('submit', function (e) { e.preventDefault(); act({ action: 'contact', contact_id: cid, email: $('c-email').value, contact_name: $('c-name').value }, 'Saved.'); });
          $('c-out').addEventListener('click', function () { act({ action: 'remove', contact_id: cid }, '', '#batch/' + bid); });
          $('c-hold').addEventListener('click', function () { if (confirm('Never email ' + l.name + '?')) act({ action: 'remove', contact_id: cid, hold: true }, '', '#batch/' + bid); });
        });
      }

      var REASON = { 'clicked their page': 'Clicked their page', replied: 'Replied', 'claimed their page': 'Claimed their page' };
      function viewInterested() {
        crumbs([['Business outreach', '#'], ['Interested']]);
        V().innerHTML = '<p class="empty">Loading...</p>';
        api({ action: 'interested' }).then(function (d) {
          var rows = d.rows || [];
          V().innerHTML = '<p class="sub">Everyone who clicked, replied or claimed. Their emails stop, and each one goes to their city\'s Community Manager, or to you while the city has none. Reach out personally.</p>' +
            '<section class="card"><div class="list"><div class="item head"><div></div><div>Business</div><div>What they did</div><div>Goes to</div><div></div></div>' +
            (rows.map(function (r) { var l = r.listing || {};
              return '<div class="item"><div>' + logo(l) + '</div><div><strong>' + esc(l.name) + '</strong><small>' + esc([l.category, l.address_city].filter(Boolean).join(' · ')) + '</small><small>' + esc(r.email) + (l.phone ? ' · ' + esc(l.phone) : '') + '</small></div>' +
                '<div>' + who(r) + '<small>' + esc(REASON[r.stop_reason] || r.stop_reason || '') + '</small></div>' +
                '<div>' + esc(r.route_to === 'community_manager' ? (r.assigned_name || 'Community Manager') : 'You') + '</div>' +
                '<div class="act"><a class="btn btn-ghost btn-sm" href="/directory/' + encodeURIComponent(l.slug || '') + '" target="_blank" rel="noopener">Their page</a></div></div>';
            }).join('') || '<p class="empty">Nobody yet. They show here as soon as they click, reply or claim.</p>') + '</div></section>';
        });
      }

      function viewEmails() {
        crumbs([['Business outreach', '#'], ['The three emails']]);
        V().innerHTML = '<p class="sub">What every business gets, from Sean. In each email the business\'s name, city and page link are filled in; a business featured in a Guide also gets a line with a link to where it is in that Guide. Open any business in a send day to read its exact copy.</p>' +
          '<div class="grid">' + data.templates.map(function (t) {
            return '<section class="mail"><div class="mail-h"><b>Day ' + t.day_offset + '</b><br><b>Subject</b> ' + esc(t.subject) + '</div><div class="mail-b">' + esc(t.body) + '</div></section>';
          }).join('') + '</div>';
      }

      function route() {
        var h = location.hash.replace(/^#/, '').split('/');
        if (h[0] === 'plan' && h[1]) return viewPlan(h[1]);
        if (h[0] === 'batch' && h[1] && h[2]) return viewContact(h[1], h[2]);
        if (h[0] === 'batch' && h[1]) return viewBatch(h[1]);
        if (h[0] === 'emails') return viewEmails();
        if (h[0] === 'interested') return viewInterested();
        viewHome();
      }
      window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

      function start() {
        if (!window.VEAuth) return setTimeout(start, 200);
        var m = VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember();
        if (!VEAuth.isLoggedIn() || !m || !m.is_superadmin) { $('bo-gate').hidden = false; $('bo-gate').textContent = 'This page is for Vegans Explore admins. Sign in with an admin account.'; return; }
        $('bo-app').hidden = false;
        load().then(route).catch(function (e) { V().innerHTML = '<p class="msg err">Could not load: ' + esc(e.message) + '</p>'; });
      }
      start();
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
