<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bounties | The Depot</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-deep:#1f5f22;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-orange-ink:#8a4a00;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.8);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    a{color:var(--ve-green-deep);}
    .wrap{max-width:none;margin:0;padding:28px 40px 56px;}
    @media (max-width:600px){.wrap{padding:24px 16px 48px;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-deep);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,32px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:8px;}
    h2{font-size:13px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:var(--ve-green-deep);margin:0 0 10px;}
    .sub{font-size:14.5px;color:var(--ve-text-75);max-width:860px;margin-bottom:14px;}
    .panel{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:18px 20px 20px;margin:0 0 16px;}
    .filters{display:flex;flex-wrap:wrap;gap:8px;}
    .filters button{font:inherit;font-size:13px;font-weight:800;border:1.5px solid rgba(0,0,0,0.15);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px;}
    .filters button[aria-pressed="true"]{background:var(--ve-green-deep);border-color:var(--ve-green-deep);color:#fff;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;border:none;background:var(--ve-green-deep);color:#fff;cursor:pointer;text-decoration:none;white-space:nowrap;}
    .btn:hover{background:#174a1a;}
    .btn:disabled{opacity:0.5;cursor:default;}
    .btn-ghost{background:#fff;color:var(--ve-text);border:1px solid rgba(0,0,0,0.25);}
    .btn-ghost:hover{background:#f4f4f4;}
    .btn-no{background:#fff;color:#8a1c12;border:1px solid rgba(0,0,0,0.25);}
    .btn-no:hover{background:#fbeeec;}
    .btn-sm{min-height:36px;padding:6px 14px;}
    .sub-card{background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
    .sub-card h3{font-size:15px;font-weight:800;line-height:1.3;}
    .meta{font-size:12.5px;color:var(--ve-text-75);}
    .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-right:6px;}
    .p-submitted{background:#fff4e2;color:#6b3f00;}
    .p-approved{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .p-changes,.p-rejected,.p-no_show{background:#fbeeec;color:#8a1c12;}
    .p-claimed{background:#eef3fb;color:#1d4f8a;}
    .files{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:6px;margin:10px 0;}
    .files a{display:block;font-size:13px;background:#f7f8f7;border-radius:8px;padding:8px 10px;color:var(--ve-green-deep);font-weight:700;overflow-wrap:anywhere;}
    .note{font-size:14px;white-space:pre-wrap;background:#f7f8f7;border-radius:8px;padding:10px 12px;margin-top:8px;max-height:22em;overflow:auto;}
    .links a{display:block;font-size:13px;color:var(--ve-green-deep);font-weight:700;overflow-wrap:anywhere;}
    .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;}
    .acts input{flex:1 1 260px;font:inherit;font-size:14px;padding:9px 12px;border:1px solid rgba(0,0,0,0.25);border-radius:8px;min-width:0;}
    .msg{font-size:13px;font-weight:700;color:var(--ve-green-deep);min-height:20px;margin-top:6px;}
    .msg.err{color:#8a1c12;}
    .gate{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:32px;text-align:center;}
    .empty{font-size:14px;color:var(--ve-text-75);padding:6px 0;}
    [hidden]{display:none !important;}
    /* One thing per view, breadcrumbs back (Sean, 2026-10-04: canon-sean-interface-defaults). */
    .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:800;margin:4px 0 16px;}
    .crumbs a{color:var(--ve-green-deep);text-decoration:none;}
    .crumbs a:hover{text-decoration:underline;}
    .crumbs .sep{color:var(--ve-text-75);font-weight:600;}
    .crumbs [aria-current]{color:var(--ve-text);}
    .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .quick{margin:0 0 14px;}
    .quick a{font-weight:800;}
    /* Campaign cards: the same cards members see, four across, every card the same shape. */
    .cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
    @media (max-width:1100px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr));}}
    @media (max-width:820px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media (max-width:520px){.cgrid{grid-template-columns:minmax(0,1fr);}}
    .ccard{display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--ve-border);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;min-width:0;}
    .ccard:hover{border-color:rgba(0,0,0,0.35);}
    .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;aspect-ratio:16/7;padding:12px;background:linear-gradient(135deg,var(--ve-green-dark),var(--ve-green-deep));background-size:cover;background-position:center;}
    .ctop.k-place{background-image:linear-gradient(135deg,#b8640a,var(--ve-orange-ink));}
    .ctop.k-ongoing{background-image:linear-gradient(135deg,#3b5998,#22345c);}
    .ckind{white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;background:rgba(0,0,0,0.55);color:#fff;border-radius:99px;padding:3px 9px;}
    .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1;}
    .cbody h3{font-size:15.5px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .alerts{margin-top:auto;padding-top:6px;}
    /* Status is a tag, never a button: the only action on any row is the button at its end. */
    .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;}
    .t-wait{background:#fff4e2;color:#6b3f00;}
    .t-live{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .t-off{background:#efefef;color:#3d3d3d;}
    .ctop .tag{box-shadow:0 0 0 1px rgba(0,0,0,0.06);}
    .head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
    .head h2.title{font-size:clamp(20px,2.4vw,26px);letter-spacing:0;text-transform:none;color:var(--ve-text);margin:6px 0 4px;line-height:1.2;}
    .head-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
    .head-acts input{font:inherit;font-size:14px;padding:9px 12px;border:1px solid rgba(0,0,0,0.25);border-radius:8px;min-width:0;width:220px;max-width:100%;}
    .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px 20px;}
    .facts dt{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ve-text-75);}
    .facts dd{font-size:14px;}
    .story{font-size:14.5px;white-space:pre-wrap;}
    /* Jobs: one row per job, the same columns and the same Edit button on every row. */
    .jrows{display:grid;}
    .jrow{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) 90px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ve-border);font-size:14px;}
    .jrow.jhead{border-top:none;padding-top:0;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ve-text-75);}
    .jname b{display:block;font-size:14.5px;}
    .jname small{display:block;font-size:12.5px;color:var(--ve-text-75);}
    .jact{text-align:right;}
    @media (max-width:760px){
      .jrow{grid-template-columns:1fr 1fr;gap:6px 12px;}
      .jrow.jhead{display:none;}
      .jname{grid-column:1/-1;}
      .jrow [data-l]::before{content:attr(data-l) ": ";font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ve-text-75);}
      .jact{grid-column:1/-1;text-align:left;}
    }
    /* Forms */
    .cform{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px 14px;align-items:start;}
    .cform label{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ve-text-75);display:flex;flex-direction:column;gap:4px;}
    .cform input,.cform select,.cform textarea{font:inherit;font-size:14px;padding:9px 11px;min-height:42px;border:1px solid rgba(0,0,0,0.25);border-radius:8px;background:#fff;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ve-text);width:100%;}
    .cform textarea{min-height:110px;resize:vertical;}
    .cform .wide{grid-column:1/-1;}
    .hint{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ve-text-75);}
    .kinds,.chk{display:flex;flex-wrap:wrap;gap:8px 16px;}
    .kinds label{flex-direction:row;align-items:center;gap:8px;border:1.5px solid rgba(0,0,0,0.15);border-radius:99px;padding:8px 14px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ve-text);cursor:pointer;}
    .chk label{flex-direction:row;align-items:center;gap:6px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ve-text);}
    .kinds input,.chk input{width:auto;min-height:0;}
    .hits{list-style:none;display:grid;gap:4px;margin-top:6px;}
    .hits button{width:100%;text-align:left;font:inherit;font-size:13px;background:#fff;border:1px solid rgba(0,0,0,0.15);border-radius:8px;padding:8px 10px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600;}
    .hits button:hover{border-color:var(--ve-green-deep);}
    .danger{border-color:#f0c9c4;}
    .danger h2{color:#8a1c12;}
    .qa{list-style:none;display:grid;gap:6px;}
  </style>
</head>
<body>
  <div class="page-frame">
  <script>
  try { if (window.self !== window.top) document.documentElement.classList.add('ve-embedded'); } catch (e) {}
  </script>
  <style>.ve-embedded .ve-nav,.ve-embedded .ve-footer{display:none !important}.ve-embedded body{background:#fff}.ve-embedded .wrap{padding:20px 24px 40px}@media (max-width:600px){.ve-embedded .wrap{padding:16px 14px 32px}}</style>
  <script src="/public/nav.js"></script>
  <div class="wrap">
    <p class="eyebrow">The Depot</p>
    <h1>Bounties</h1>
    <div id="depot-tabs"></div>
    <div id="bq-gate" class="gate" hidden></div>
    <div id="view" hidden><p class="empty">Loading...</p></div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script src="/public/depot-tabs.js"></script>
  <script>
    // Depot > Bounties (playbook: Bounty Lifecycle). One thing per view, with breadcrumbs back
    // (Sean, 2026-10-04): the campaign list, one campaign, one job, the campaign form (new or
    // edit), the review queue, strikes. The address bar carries the view (#campaign/<id>,
    // #campaign/<id>/job/<id>, #campaign/<id>/edit, #new, #review, #strikes), so back works.
    (function () {
      var FN = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-bounties';
      var $ = function (id) { return document.getElementById(id); };
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
      function api(body) { return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + VEAuth.getToken() }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
      var TZ = { london: 'Europe/London', 'los-angeles': 'America/Los_Angeles' };
      function day(iso, city) { return iso ? new Date(iso).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: TZ[city] || 'America/New_York', timeZoneName: 'short' }) : ''; }
      function size(n) { return n > 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : n > 1048576 ? Math.round(n / 1048576) + ' MB' : Math.max(1, Math.round((n || 0) / 1024)) + ' KB'; }
      function local(iso) { if (!iso) return ''; var d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
      function iso(v) { return v ? new Date(v).toISOString() : null; }
      var LABEL = { submitted: 'To review', changes: 'Changes asked', approved: 'Approved', rejected: 'Declined', claimed: 'Claimed', no_show: 'Missed', released: 'Released' };
      var REASON = { no_show: 'No-show', late_release: 'Released after claims closed', violation: 'Violation' };
      var CITY = { 'south-florida': 'South Florida', 'central-florida': 'Central Florida', atlanta: 'Atlanta', dmv: 'DMV', 'new-york': 'New York', philadelphia: 'Philadelphia', 'los-angeles': 'Los Angeles', london: 'London', sandbox: 'Sandbox (test)' };
      var KIND = { event: 'Event', place: 'Restaurant night', ongoing: 'Ongoing' };
      var EXTRA = { photo_shoot: 'Photo shoot ($150)', reel: 'Reel ($200)', social_post: 'Social feature post ($75)', event_table: 'Sampling table ($100)', challenge_month: 'Passport Challenge stop ($100)' };
      // Plain words for status, one look for every status tag.
      var CSTATUS = { proposed: 'Waiting for approval', open: 'Live', closed: 'Closed', declined: 'Declined', canceled: 'Canceled' };
      var JSTATUS = { draft: 'Not live yet', open: 'Live', closed: 'Closed', canceled: 'Removed' };
      function tag(status, kind) {
        var words = (kind === 'job' ? JSTATUS : CSTATUS)[status] || status;
        var tone = status === 'open' ? 't-live' : (status === 'proposed' || status === 'draft') ? 't-wait' : 't-off';
        return '<span class="tag ' + tone + '">' + esc(words) + '</span>';
      }
      function crumbs(items) {
        return '<nav class="crumbs" aria-label="Breadcrumb">' + items.map(function (it, i) {
          return i === items.length - 1 ? '<span aria-current="page">' + esc(it[0]) + '</span>' : '<a href="#' + it[1] + '">' + esc(it[0]) + '</a>';
        }).join('<span class="sep" aria-hidden="true">&rsaquo;</span>') + '</nav>';
      }
      function short(t) { return String(t || '').replace(/^[^:]+:\s*/, ''); }

      var state = { camps: null, review: null, reviewer: false, me: null, filter: 'all', rstatus: 'submitted' };
      function loadAll() {
        var ps = [api({ action: 'campaign_admin_list' }).then(function (d) { state.camps = d.campaigns ? d : { campaigns: [], cities: [], admin: false, families: [] }; })];
        if (state.reviewer) ps.push(api({ action: 'review_list', status: 'submitted' }).then(function (d) { state.review = d.submissions ? d : null; }));
        return Promise.all(ps);
      }
      function camp(id) { return (state.camps.campaigns || []).filter(function (c) { return c.id === id; })[0] || null; }
      function liveJobs(c) { return (c.jobs || []).filter(function (j) { return j.status !== 'canceled'; }); }
      function jobIds(c) { return (c.jobs || []).map(function (j) { return j.id; }); }
      function waitingFor(c) {
        if (!state.review) return 0;
        var ids = jobIds(c);
        return state.review.submissions.filter(function (s) { return s.bounty && ids.indexOf(s.bounty.id) > -1; }).length;
      }
      function eventFor(c) {
        if (!state.review) return null;
        var ids = jobIds(c);
        return (state.review.events || []).filter(function (e) { return e.bounties.some(function (b) { return ids.indexOf(b.id) > -1; }); })[0] || null;
      }
      function holdersFor(jid) {
        var out = [];
        ((state.review && state.review.events) || []).forEach(function (e) { e.bounties.forEach(function (b) { if (b.id === jid) out = b.holders; }); });
        return out;
      }
      function canEdit(c) { return c.can_decide || (c.status === 'proposed' && c.proposed_by === state.me); }
      function when(c) {
        var city = c.community_slug;
        return c.kind === 'ongoing' ? (c.due_at ? 'Window closes ' + day(c.due_at, city) : 'No window set') : (c.starts_at ? day(c.starts_at, city) : 'No date set');
      }

      // ---- Router -----------------------------------------------------------------------------
      function route() {
        if (!state.camps) return;
        var p = location.hash.replace(/^#\/?/, '').split('/');
        window.scrollTo(0, 0);
        if (p[0] === 'new') return viewForm(null);
        if (p[0] === 'campaign' && p[1]) {
          var c = camp(p[1]);
          if (!c) return show(crumbs([['Campaigns', ''], ['Not found']]) + '<p class="empty">That campaign is not here any more.</p>');
          if (p[2] === 'edit') return canEdit(c) ? viewForm(c) : viewCampaign(c);
          if (p[2] === 'job' && p[3]) return viewJob(c, p[3]);
          return viewCampaign(c);
        }
        if (p[0] === 'review' && state.reviewer) return viewReview(p[1] || '');
        if (p[0] === 'strikes' && state.reviewer) return viewStrikes();
        return viewHome();
      }
      window.addEventListener('hashchange', route);
      function go(h) { if (location.hash.replace(/^#/, '') === h) route(); else location.hash = h; }
      function reloadTo(h) { return loadAll().then(function () { go(h); }); }
      // After a save, show the result for a moment, then reload; never pull someone back from a view they moved on to.
      function soon(h, ms) { var at = location.hash; setTimeout(function () { if (location.hash === at) reloadTo(h); else loadAll(); }, ms); }
      function show(html) { $('view').innerHTML = html; }
      function say(el, r, okText) {
        if (r && r.error) { el.className = 'msg err'; el.textContent = r.message || 'That did not go through.'; return false; }
        el.className = 'msg'; el.textContent = okText; return true;
      }

      // ---- Campaigns: the list ----------------------------------------------------------------
      var ORDER = { proposed: 0, open: 1, closed: 2, declined: 3, canceled: 4 };
      var GROUP = { all: null, proposed: ['proposed'], open: ['open'], closed: ['closed', 'declined', 'canceled'] };
      function viewHome() {
        var all = state.camps.campaigns || [];
        var n = function (k) { return GROUP[k] ? all.filter(function (c) { return GROUP[k].indexOf(c.status) > -1; }).length : all.length; };
        var list = all.filter(function (c) { return !GROUP[state.filter] || GROUP[state.filter].indexOf(c.status) > -1; })
          .sort(function (a, b) { return (ORDER[a.status] - ORDER[b.status]) || String(a.starts_at || a.due_at || '9').localeCompare(String(b.starts_at || b.due_at || '9')); });
        var chips = [['all', 'All'], ['proposed', 'Waiting for approval'], ['open', 'Live'], ['closed', 'Closed']].map(function (x) {
          return '<button type="button" data-filter="' + x[0] + '" aria-pressed="' + (state.filter === x[0]) + '">' + x[1] + ' (' + n(x[0]) + ')</button>';
        }).join('');
        var waiting = state.review ? state.review.submissions.length : 0, strikes = state.review ? (state.review.strikes || []).length : 0;
        show(crumbs([['Campaigns']]) +
          '<p class="sub">Members see live campaigns at <a href="/bounties" target="_blank" rel="noopener">vegansexplore.com/bounties</a>. Any leadership member proposes a campaign; the city\'s Community Manager decides.</p>' +
          '<div class="bar"><div class="filters" id="cfilter" role="group" aria-label="Show">' + chips + '</div><a class="btn" href="#new">New campaign</a></div>' +
          (state.reviewer ? '<p class="meta quick"><a href="#review">Work to review (' + waiting + ')</a> &middot; <a href="#strikes">Open strikes (' + strikes + ')</a></p>' : '') +
          (list.length ? '<div class="cgrid">' + list.map(campCard).join('') + '</div>' : '<p class="empty">No campaigns here. <a href="#new">Start a new one.</a></p>'));
        $('cfilter').addEventListener('click', function (e) { var b = e.target.closest('[data-filter]'); if (!b) return; state.filter = b.getAttribute('data-filter'); viewHome(); });
      }
      function campCard(c) {
        var jobs = liveJobs(c), slots = 0, taken = 0, open = false;
        jobs.forEach(function (j) { taken += j.taken || 0; if (j.slots == null) open = true; else slots += j.slots; });
        var wait = waitingFor(c), ev = eventFor(c), q = ev ? ev.unanswered : 0;
        var cover = c.cover_url ? ' style="background-image:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),url(\'' + esc(c.cover_url).replace(/'/g, '%27') + '\')"' : '';
        return '<a class="ccard" href="#campaign/' + c.id + '"><div class="ctop k-' + c.kind + '"' + cover + '>' + tag(c.status) + '<span class="ckind">' + esc(KIND[c.kind]) + '</span></div>' +
          '<div class="cbody"><h3>' + esc(c.title) + '</h3><p class="meta">' + esc(CITY[c.community_slug] || c.community_slug) + ' &middot; ' + esc(when(c)) + '</p>' +

        $('subs').addEventListener('click', function (e) {
          var dd = e.target.getAttribute('data-d'); if (!dd) return;
          var card = e.target.closest('.sub-card'), msg = card.querySelector('.msg');
          var f = function (k) { var el = card.querySelector('[data-f="' + k + '"]'); return el ? el.value.trim() : ''; };
          var note = f('note'), points = Number(f('points')), full = Number(card.getAttribute('data-points'));
          if ((dd === 'changes' || dd === 'violation') && !note) { msg.className = 'msg err'; msg.textContent = dd === 'changes' ? 'Say what needs to change.' : 'Say what was wrong.'; return; }
          if (dd === 'approve' && points < full && !note) { msg.className = 'msg err'; msg.textContent = 'Say why it is paying fewer points.'; return; }
          if (dd === 'reject' && !confirm('Decline this submission? The member gets an email.')) return;
          if (dd === 'violation' && !confirm('Mark this as a violation? It declines the work and pauses the member\'s bounties until someone clears the strike.')) return;
          Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = true; });
          msg.className = 'msg'; msg.textContent = dd === 'approve' ? 'Paying the points...' : 'Saving...';
          api({ action: 'review', id: card.getAttribute('data-id'), decision: dd, note: note, coaching: f('coaching'), points: dd === 'approve' ? points : undefined }).then(function (r) {
            if (r.error) { msg.className = 'msg err'; msg.textContent = r.message || 'That did not go through.'; Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = false; }); return; }
            msg.textContent = dd === 'approve' ? 'Approved. ' + (r.points || '') + ' points paid.' : 'Done. The member has been emailed.';
            setTimeout(function () { loadAll().then(function () { viewReview(cid); }); }, 900);
          });
        });
      }
      function subCard(s) {
        var b = s.bounty || {}, m = s.member || {}, h = s.history || { coaching: [], strikes: [] };
        var reviewable = s.status === 'submitted' || s.status === 'changes';
        var hist = (h.coaching.length ? '<p class="meta" style="margin-top:8px"><b>Earlier coaching:</b> ' + h.coaching.map(function (x) { return esc(x.note) + ' <i>(' + esc(x.bounty) + ')</i>'; }).join(' &middot; ') + '</p>' : '') +
          (h.strikes.length ? '<p class="meta"><b>Strikes:</b> ' + h.strikes.map(function (x) { return esc(REASON[x.reason] || x.reason) + (x.cleared_at ? ' (cleared)' : ''); }).join(', ') + '</p>' : '');
        var parts = (b.parts || []).length ? '<p class="meta" style="margin-top:6px"><b>Parts ticked:</b> ' + (s.parts_done || []).length + ' of ' + b.parts.length + '</p>' : '';
        return '<div class="sub-card" data-id="' + s.id + '" data-points="' + (b.points || 0) + '">' +
          '<span class="pill p-' + s.status + '">' + esc(LABEL[s.status] || s.status) + '</span>' +
          (s.overdue ? '<span class="pill p-rejected">Waiting ' + s.waited_days + ' days</span>' : '') +
          (s.auto_submitted ? '<span class="pill p-submitted">Sent in at the deadline</span>' : '') +
          '<span class="meta">' + esc(s.submitted_at ? 'Submitted ' + day(s.submitted_at) : 'Claimed ' + day(s.claimed_at)) + (s.revisions ? ' &middot; changes asked ' + s.revisions + ' of 2' : '') + '</span>' +
          '<h3>' + esc(b.title || 'Bounty') + ' &middot; ' + (b.points || 0).toLocaleString() + ' points</h3>' +
          '<p class="meta">' + esc(m.name || 'Member') + (m.email ? ' &middot; ' + esc(m.email) : '') + '</p>' + parts +
          (s.files.length ? '<ul class="files">' + s.files.map(function (f) { return '<li><a href="' + esc(f.url || '#') + '" target="_blank" rel="noopener">' + esc(f.name) + ' (' + size(f.size) + ')</a></li>'; }).join('') + '</ul><p class="meta">' + s.files.length + (s.files.length === 1 ? ' file' : ' files') + '. Download links last one hour; refresh for new ones.</p>' : '') +
          (s.links && s.links.length ? '<div class="links" style="margin-top:8px">' + s.links.map(function (l) { return '<a href="' + esc(l) + '" target="_blank" rel="noopener noreferrer">' + esc(l) + '</a>'; }).join('') + '</div>' : '') +
          (s.note ? '<div class="note">' + esc(s.note) + '</div><p class="meta">' + s.note.trim().split(/\s+/).length.toLocaleString() + ' words</p>' : '') +
          (s.review_note ? '<p class="meta" style="margin-top:8px"><b>Your note:</b> ' + esc(s.review_note) + '</p>' : '') +
          (s.coaching_note ? '<p class="meta"><b>Coaching:</b> ' + esc(s.coaching_note) + '</p>' : '') +
          hist +
          (s.status === 'approved' ? '<p class="meta" style="margin-top:8px"><b>Paid ' + (s.points_awarded || 0).toLocaleString() + ' points.</b></p>' : '') +
          (reviewable ?
            '<div class="acts"><input type="text" data-f="note" maxlength="2000" placeholder="Note to the member (needed for changes or fewer points)" aria-label="Note to the member"></div>' +
            '<div class="acts"><input type="text" data-f="coaching" maxlength="2000" placeholder="Coaching for next time (optional)" aria-label="Coaching for next time"></div>' +
            '<div class="acts"><label class="meta" style="display:flex;align-items:center;gap:8px">Points <input type="number" data-f="points" min="1" max="' + (b.points || 0) + '" value="' + (b.points || 0) + '" style="flex:0 0 110px" aria-label="Points to pay"></label>' +
            '<button type="button" class="btn" data-d="approve">Approve and pay</button>' +
            '<button type="button" class="btn btn-ghost" data-d="changes"' + (s.revisions >= 2 ? ' disabled title="Both rounds of changes are used"' : '') + '>Ask for changes</button>' +
            '<button type="button" class="btn btn-no" data-d="reject">Decline</button>' +
            '<button type="button" class="btn btn-no" data-d="violation" title="Recycled footage or someone else\'s work. Pauses their bounties.">Violation</button></div><p class="msg" role="status"></p>' : '') +
          '</div>';
      }

      // ---- Strikes ----------------------------------------------------------------------------
      function viewStrikes() {
        var list = (state.review && state.review.strikes) || [];
        show(crumbs([['Campaigns', ''], ['Strikes']]) +
          '<p class="sub">1 strike: 30 days without claiming. 2 in 6 months: 90 days. 3, or a violation: paused until cleared. A release after claims close is half a strike. Clear one when a member explains what happened.</p>' +
          '<div id="strikes">' + (list.length ? list.map(function (s) {
            return '<div class="sub-card" data-strike="' + s.id + '"><b>' + esc(s.member) + '</b> &middot; ' + esc(REASON[s.reason] || s.reason) + ' (' + s.weight + ') &middot; <span class="meta">' + esc(day(s.created_at)) + '</span>' +
              '<div class="acts"><input type="text" maxlength="1000" placeholder="Why it is cleared (optional)" aria-label="Why it is cleared"><button type="button" class="btn btn-ghost" data-clear="' + s.id + '">Clear strike</button></div></div>';
          }).join('') : '<p class="empty">No open strikes.</p>') + '</div>');
        $('strikes').addEventListener('click', function (e) {
          var id = e.target.getAttribute('data-clear'); if (!id) return;
          var card = e.target.closest('[data-strike]'); e.target.disabled = true;
          api({ action: 'strike_clear', id: id, note: card.querySelector('input').value.trim() }).then(function (r) { if (r.error) { e.target.disabled = false; alert(r.message || 'That did not go through.'); return; } reloadTo('strikes'); });
        });
      }

      function start() {
        if (!window.VEAuth) return setTimeout(start, 200);
        var m = VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember();
        if (!VEAuth.isLoggedIn()) { $('bq-gate').hidden = false; $('bq-gate').innerHTML = '<h2>Sign in</h2><p>This page is for Vegans Explore admins and Community Managers.</p><button type="button" class="btn" id="bq-signin">Sign in</button>'; $('bq-signin').onclick = function () { VEAuth.showAuthModal('Sign in to review bounties.', function () { location.reload(); }); }; return; }
        var leader = m && (m.is_superadmin || m.ve_role === 'community_manager' || ['community_manager', 'creative_producer', 'executive_assistant'].indexOf(m.staff_role) > -1);
        if (!leader) { $('bq-gate').hidden = false; $('bq-gate').innerHTML = '<h2>Leadership only</h2><p>This page is for Vegans Explore leadership: admins, Community Managers and the production team.</p>'; return; }
        // Reviewing claims and work is for admins and the city's Community Manager.
        state.reviewer = !!(m.is_superadmin || m.ve_role === 'community_manager' || m.staff_role === 'community_manager');
        state.me = m.id;
        $('view').hidden = false;
        loadAll().then(route).catch(function () { show('<p class="empty">Bounties did not load. Refresh to try again.</p>'); });
      }
      start();
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
