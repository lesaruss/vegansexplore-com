  <!-- Depot > Guides (Sean, 2026-11-07, canon-ve-guide-tour-standard v3): the back end of every Guide's and tool's tour video, every
       asset in one place. #list is every tour; #t/<slug>/lookbook (the shots per chapter, Approve or Redo with a note before anything
       is animated), #t/<slug>/script (each chapter's line and recording with its word-for-word check), #t/<slug>/video (the edit).
       Data: ve-depot tours, tour, shot_decide, chapter_approve (tables ve_video_tours, ve_video_chapters, ve_video_shots). -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-deep:#1f5f22;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.8);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    .wrap{max-width:none;margin:0;padding:28px 40px 56px;}
    @media (max-width:600px){.wrap{padding:24px 16px 48px;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-deep);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,32px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:8px;}
    h2{font-size:18px;font-weight:800;line-height:1.25;}
    .sub{font-size:14.5px;color:var(--ve-text-75);max-width:860px;margin-bottom:14px;}
    .crumb{font-size:12.5px;margin-bottom:12px;}.crumb a{color:var(--ve-green-deep);font-weight:700;}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
    .tabs a{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:6px;border:1px solid var(--ve-border);background:#fff;color:var(--ve-text);text-decoration:none;}
    .tabs a.on{background:var(--ve-green-deep);color:#fff;border-color:var(--ve-green-deep);}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px;}
    .card{background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none;}
    .card:hover{border-color:var(--ve-green);}
    .card.pic{padding:0;overflow:hidden;gap:0;}
    .card.pic .face{display:block;}
    .card.pic .face img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:center 18%;background:#f1f3f1;}
    .card.pic .tx .meta:first-child{margin-bottom:2px;}
    .card.pic .tx{display:flex;flex-direction:column;gap:6px;padding:12px 16px 16px;}
    .meta{font-size:12.5px;color:var(--ve-text-75);}
    .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#eef1ee;color:#333;}
    .tag.approved{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .tag.redo{background:#fde7e5;color:#8a1c12;}
    .tag.proposed{background:#fff1dc;color:#8a5200;}
    .tag.k{background:#eef1ee;color:#333;}
    .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;}
    .steps span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;border:1px solid var(--ve-border);background:#fff;color:#888;}
    .steps span.done{background:var(--ve-green-light);color:var(--ve-green-deep);border-color:transparent;}
    .steps span.now{background:var(--ve-green-deep);color:#fff;border-color:var(--ve-green-deep);}
    .bar{background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:13.5px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
    .bar b{font-size:15px;}
    .chap{background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:16px 18px;margin:0 0 14px;}
    .chap-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;}
    .chap-h .n{flex:none;width:34px;height:34px;border-radius:8px;background:var(--ve-green-deep);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px;}
    .chap-h .tx{flex:1 1 320px;min-width:0;}
    .chap-h .line{font-size:14px;color:var(--ve-text-75);margin-top:2px;}
    .chap-h audio{height:36px;max-width:100%;}
    .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px;}
    .shot{border:1px solid var(--ve-border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#fff;}
    .shot.approved{border-color:var(--ve-green);}
    .shot.redo{border-color:#e59a92;}
    .shot .pic{aspect-ratio:16/9;background:#f1f3f1 center/cover no-repeat;cursor:zoom-in;display:grid;place-items:center;}
    .shot .pic.square{background-size:contain;background-color:#fff;}
    .shot .pic.empty{cursor:default;color:#888;font-size:12.5px;font-weight:700;text-align:center;padding:16px;background:repeating-linear-gradient(45deg,#f7f8f7,#f7f8f7 10px,#f1f3f1 10px,#f1f3f1 20px);}
    .shot .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
    .shot .brief{font-size:13px;line-height:1.5;}
    .shot .note{font-size:12.5px;background:#fff7ec;border-left:3px solid var(--ve-orange);padding:6px 10px;border-radius:6px;}
    .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:0;background:var(--ve-green-deep);color:#fff;text-decoration:none;}
    .btn-quiet{background:#fff;color:var(--ve-green-deep);border:1px solid var(--ve-green-deep);}
    .btn-red{background:#fff;color:#8a1c12;border:1px solid rgba(138,28,18,.45);}
    .btn:disabled{opacity:.5;cursor:default;}
    textarea{font-family:inherit;font-size:13.5px;width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--ve-border);border-radius:6px;}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ve-border);border-radius:12px;overflow:hidden;font-size:13.5px;}
    th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ve-text-75);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ve-border);}
    td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
    td audio{height:34px;width:220px;max-width:100%;}
    .ok{color:var(--ve-green-deep);font-weight:800;}
    .gate{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:32px;text-align:center;}
    .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;cursor:zoom-out;}
    .lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff;}
    @media (max-width:700px){table,thead,tbody,tr,td{display:block;}thead{display:none;}tr{border-bottom:1px solid var(--ve-border);padding:8px 0;}td{border:0;padding:4px 12px;}}
    .player{background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:16px;margin:0 0 14px;}
    /* video on the left with its controls under it; the line, the facts and the frame numbers on the right (Sean, 2026-11-08) */
    .player{display:grid;grid-template-columns:var(--pvw,minmax(0,1.6fr)) minmax(0,1fr);gap:20px;align-items:start;}
    .player.tall{--pvw:clamp(280px,32vw,460px);}
    .pside{display:flex;flex-direction:column;gap:14px;min-width:0;}
    .pside .fbtns{padding-top:12px;border-top:1px solid var(--ve-border);}
    .st-img{aspect-ratio:var(--ar,16/9);border-radius:10px;background:#f1f3f1 center 18%/cover no-repeat;border:1px solid var(--ve-border);}
    .st-img.square{background-size:contain;background-color:#fff;}
    .st-img.empty{background:repeating-linear-gradient(45deg,#f7f8f7,#f7f8f7 10px,#f1f3f1 10px,#f1f3f1 20px);}
    /* every picture shown whole in the tour's shape: a wide one sits over a blurred copy of itself, never cropped (Sean, 2026-11-08) */
    .fit{position:relative;overflow:hidden;background:#0f1f14 !important;}
    .fit::before{content:'';position:absolute;inset:-24px;background:var(--img) center/cover no-repeat;filter:blur(20px) brightness(.72);}
    .fit::after{content:'';position:absolute;inset:0;background:var(--img) center/contain no-repeat;}
    .fit .fn{z-index:2;}
    /* a slight slow zoom on each frame in the player, as the edit does (Sean, 2026-11-08: image to image, about every 3 s) */
    #lbImg.zoom::after{transform-origin:50% 40%;animation:lbz 4.5s ease-out forwards;}
    #lbImg.paused::after{animation-play-state:paused;}
    @keyframes lbz{from{transform:scale(1);}to{transform:scale(1.07);}}
    @media (prefers-reduced-motion:reduce){#lbImg.zoom::after{animation:none;}}
    .cap{display:flex;gap:12px;align-items:flex-start;}
    .cap .fn{flex:none;font-weight:900;font-size:22px;color:var(--ve-green-deep);}
    .q{font-size:15px;font-weight:700;line-height:1.45;}
    .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px;}
    .ctl .meta{margin-left:auto;font-variant-numeric:tabular-nums;}
    .prog{height:8px;background:#eef1ee;border-radius:6px;cursor:pointer;overflow:hidden;margin-bottom:10px;}
    .prog span{display:block;height:100%;width:0;background:var(--ve-green);}
    .fbtns{display:flex;flex-wrap:wrap;gap:6px;}
    .fbtns button{font-family:inherit;font-size:12px;font-weight:800;min-width:38px;height:32px;border-radius:6px;border:1px solid var(--ve-border);background:#fff;cursor:pointer;color:#555;}
    .fbtns button.approved{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .fbtns button.redo{background:#fde7e5;color:#8a1c12;}
    .fbtns button.on{outline:2px solid var(--ve-green-deep);outline-offset:1px;}
    .legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ve-text-75);margin:0 0 14px;align-items:center;}
    .legend b{color:var(--ve-text);}
    .tag.rd.ready{background:#e8f0fb;color:#1d4f91;}.tag.rd.recapture{background:#fff1dc;color:#8a5200;}.tag.rd.mock{background:#f1e8fb;color:#5b2d91;}.tag.rd.broll{background:#e6f6f4;color:#0f6158;}
    .flag-dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ve-orange);vertical-align:middle;}
    .frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px;}
    .frames.tall{grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));}
    .frame{background:#fff;border:1px solid var(--ve-border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
    .frame.approved{border-color:var(--ve-green);}.frame.redo{border-color:#e59a92;}
    .frame .pic,.brcard .pic{position:relative;aspect-ratio:var(--ar,16/9);background:#f1f3f1 center/cover no-repeat;cursor:zoom-in;}
    .frame .pic.square{background-size:contain;background-color:#fff;}
    .frame .pic.empty{cursor:default;display:grid;place-items:center;color:#888;font-size:12.5px;font-weight:700;background:repeating-linear-gradient(45deg,#f7f8f7,#f7f8f7 10px,#f1f3f1 10px,#f1f3f1 20px);}
    .frame .fn{position:absolute;left:10px;top:10px;background:#fff;color:var(--ve-green-deep);font-weight:900;font-size:13px;padding:2px 8px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15);}
    .frame .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
    .fh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}.fh .time{font-size:12px;font-weight:800;color:#555;margin-right:4px;font-variant-numeric:tabular-nums;}
    .sec{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ve-green-deep);}
    .frame .brief{font-size:13px;line-height:1.5;}
    .flag{font-size:12.5px;background:#fff4e5;border-left:3px solid var(--ve-orange);padding:6px 10px;border-radius:6px;color:#7a4300;}
    .note{font-size:12.5px;background:#fff7ec;border-left:3px solid var(--ve-orange);padding:6px 10px;border-radius:6px;}
    .linkbtn{align-self:flex-start;font-family:inherit;font-size:12px;font-weight:800;color:var(--ve-green-deep);background:none;border:0;cursor:pointer;padding:0;}
    .dec{display:flex;flex-direction:column;gap:8px;}
    .brcard{border:1px dashed #9fd3cc;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fbfefd;margin-top:4px;}
    .brcard.approved{border-style:solid;border-color:var(--ve-green);}
    @media (max-width:800px){.player,.player.tall{grid-template-columns:1fr;}.player.tall .pv{max-width:420px;width:100%;margin:0 auto;}.ctl .meta{margin-left:0;width:100%;}}
    [hidden]{display:none !important;}
  </style>
</head>
<body>
  <div class="page-frame">
  <script>
  try { if (window.self !== window.top) document.documentElement.classList.add('ve-embedded'); } catch (e) {}
  </script>
  <style>.ve-embedded .ve-nav,.ve-embedded .ve-footer{display:none !important}.ve-embedded body{background:#fff}.ve-embedded .wrap{padding:20px 24px 40px}@media (max-width:600px){.ve-embedded .wrap{padding:16px 14px 32px}}</style>
  <script src="/public/nav.js"></script>
  <div class="wrap">
    <p class="eyebrow">The Depot</p>
    <h1 id="title">Guides and tours</h1>
    <div id="depot-tabs"></div>
    <div id="gate" class="gate" hidden></div>
    <main id="app" hidden><div id="view"></div></main>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script src="/public/depot-tabs.js"></script>
  <script>
    (function () {
      var FN = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-depot';
      var $ = function (id) { return document.getElementById(id); };
      // The narrator's face on each tour card (square art; V's from her business tour frames).
      var FACE = { v: 'https://fwbhwfxpncrsfhttimna.supabase.co/storage/v1/object/public/geekfon-media/artists/v/business-tour/join-1-v2.jpg',
        liz: '/public/guides/liz.jpg', maya: '/public/guides/maya.jpg', river: '/public/guides/river.jpg', dani: '/public/guides/dani.jpg',
        nori: '/public/guides/nori.jpg', pascal: '/public/guides/pascal.jpg' };
      var NARR = { v: 'V', liz: 'Liz', maya: 'Maya', river: 'River', dani: 'Dani', nori: 'Nori', theo: 'Theo', kai: 'Kai', pascal: 'Pascal' };
      var STEPS = [['script', 'Script'], ['recorded', 'Recorded'], ['lookbook', 'Lookbook'], ['animating', 'Animation'], ['editing', 'The edit'], ['live', 'Live']];
      var KIND = { on_camera: 'On camera', screen: 'Page capture', illustration: 'Illustration' };
      var ST = { proposed: 'Waiting for you', approved: 'Approved', redo: 'Redo' };
      var data = null;
      // tours cut with no zoom-in, so the player does not zoom them either (Sean, 2026-11-08, Green Leaf v3)
      var NOZOOM = { 'green-leaf-tour': 1 };
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
      function api(body) { return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + VEAuth.getToken() }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
      function secs(n) { n = Math.round(Number(n) || 0); return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }
      function route() { var h = location.hash.replace(/^#/, '').split('/'); return h[0] === 't' ? { v: 'tour', slug: h[1], tab: h[2] || 'lookbook' } : { v: 'list' }; }

      function list() {
        $('title').textContent = 'Guides and tours';
        $('view').innerHTML = '<p class="sub">Every Guide\'s and tool\'s tour video, with everything behind it: the script, each recorded chapter, the lookbook of shots to approve before anything is animated, and the finished video.</p><div id="tl" class="grid"><p class="meta">Loading...</p></div>';
        api({ action: 'tours' }).then(function (d) {
          if (!d || !d.ok) { $('tl').innerHTML = '<p class="meta">Could not load the tours.</p>'; return; }
          $('tl').innerHTML = d.tours.length ? d.tours.map(function (t) {
            var step = STEPS.filter(function (s) { return s[0] === t.status; })[0];
            var face = FACE[t.narrator];
            return '<a class="card pic" href="#t/' + esc(t.slug) + '">' +
              (face ? '<span class="face"><img src="' + face + '" alt="' + esc(NARR[t.narrator] || '') + '" loading="lazy" decoding="async"></span>' : '') +
              '<span class="tx"><span class="meta">' + (t.kind === 'tool' ? 'Tool' : 'Guide') + ' · narrated by ' + esc(NARR[t.narrator] || t.narrator) + '</span><h2>' + esc(t.title) + '</h2><span><span class="tag">' + esc(step ? step[1] : t.status) + '</span></span>' +
              '<span class="meta">' + t.chapters + ' chapters, ' + secs(t.seconds) + ' · ' + t.approved + ' of ' + t.shots + ' shots approved' + (t.redo ? ', ' + t.redo + ' to redo' : '') + '</span></span></a>';
          }).join('') : '<p class="meta">No tours yet.</p>';
        });
      }

      function tour(r) {
        api({ action: 'tour', slug: r.slug }).then(function (d) {
          if (!d || !d.ok) { $('view').innerHTML = '<p class="crumb"><a href="#">Guides and tours</a></p><p class="sub">That tour was not found.</p>'; return; }
          data = d; draw(r);
        });
      }
      function draw(r) {
        var t = data.tour, si = STEPS.map(function (s) { return s[0]; }).indexOf(t.status);
        $('title').textContent = t.title;
        var total = data.chapters.reduce(function (a, c) { return a + Number(c.seconds || 0); }, 0);
        var ap = data.shots.filter(function (s) { return s.status === 'approved'; }).length, rd = data.shots.filter(function (s) { return s.status === 'redo'; }).length;
        var cam = data.shots.filter(function (s) { return s.kind === 'on_camera'; });
        var camSecs = cam.reduce(function (a, s) { return a + Math.max(3, Number(s.audio_to || 0) - Number(s.audio_from || 0)); }, 0);
        var html = '<p class="crumb"><a href="#">Guides and tours</a> &rsaquo; ' + esc(t.title) + '</p>' +
          '<div class="steps">' + STEPS.map(function (s, i) { return '<span class="' + (i < si ? 'done' : i === si ? 'now' : '') + '">' + (i + 1) + '. ' + s[1] + '</span>'; }).join('') + '</div>' +
          '<div class="bar"><span>Narrated by <b>' + esc(NARR[t.narrator] || t.narrator) + '</b></span><span><b>' + data.chapters.length + '</b> chapters, <b>' + secs(total) + '</b></span>' +
          '<span><b>' + ap + '</b> of ' + data.shots.length + ' shots approved' + (rd ? ', <b>' + rd + '</b> to redo' : '') + '</span>' +
          (cam.length ? '<span><b>' + cam.length + '</b> on-camera moments, about <b>' + Math.round(camSecs) + ' s</b> to animate</span>' : '<span>No lip sync: a new picture about every <b>' + (data.shots.length ? (total / data.shots.length).toFixed(1) : 0) + ' s</b>, each with a slight zoom</span>') +
          (t.page_url ? '<a class="btn btn-quiet" href="' + esc(t.page_url) + '">Open the page</a>' : '') + '</div>' +
          '<div class="tabs">' + [['lookbook', 'Lookbook'], ['script', 'Script and recordings'], ['video', 'Video']].map(function (x) {
            return '<a href="#t/' + esc(t.slug) + '/' + x[0] + '" class="' + (r.tab === x[0] ? 'on' : '') + '">' + x[1] + '</a>';
          }).join('') + '</div><div id="pane"></div>';
        $('view').innerHTML = html;
        if (r.tab === 'script') script(); else if (r.tab === 'video') video(); else lookbook();
      }
      // The lookbook (LOCKED by Sean 2026-11-07, from the Nonprofit Guide's lookbook): a white player that plays the tour
      // frame by frame, then one card per frame with its readiness (Ready, Recapture, Mock, B-roll) kept apart from the
      // decision (Waiting for you, Approved, Redo). An illustration is B-roll inside the frame it belongs to, with its own decision.
      var RD = { ready: ['Ready', 'The picture is in hand.'], recapture: ['Recapture', 'The page changed; take it again.'], mock: ['Mock', 'A stand-in for something not built yet.'], broll: ['B-roll', 'An illustration, drawn only once you approve it.'] };
      function frames() {
        var off = {}, t = 0;
        data.chapters.forEach(function (c) { off[c.n] = t; t += Number(c.seconds || 0); });
        var main = [], broll = [];
        data.shots.slice().sort(function (a, b) { return a.chapter_n - b.chapter_n || a.ord - b.ord; }).forEach(function (s) { (s.readiness === 'broll' ? broll : main).push(s); });
        var fr = main.map(function (s, i) {
          var c = data.chapters.filter(function (x) { return x.n === s.chapter_n; })[0] || {};
          var a = Number(s.audio_from || 0), b = s.audio_to != null ? Number(s.audio_to) : Number(c.seconds || 0);
          return { n: i + 1, s: s, c: c, from: a, to: b, g0: off[s.chapter_n] + a, g1: off[s.chapter_n] + b, broll: [] };
        });
        broll.forEach(function (s) {
          var a = Number(s.audio_from || 0);
          var host = fr.filter(function (f) { return f.s.chapter_n === s.chapter_n && a >= f.from && a < f.to; })[0] || fr.filter(function (f) { return f.s.chapter_n === s.chapter_n; }).pop();
          if (host) host.broll.push(s);
        });
        return { list: fr, total: t, off: off };
      }
      function pad(n) { return String(n).padStart(2, '0'); }
      function decide(s) {
        return '<div class="dec" data-id="' + esc(s.id) + '">' +
          (s.note ? '<p class="note"><b>Your note:</b> ' + esc(s.note) + '</p>' : '') +
          '<div class="redo-box" hidden><textarea placeholder="What should change? Type it or tap the mic and say it." aria-label="What should change?"></textarea><div class="acts"><button type="button" class="btn btn-red" data-do="redo-send">Send it back</button><button type="button" class="btn btn-quiet" data-do="redo-cancel">Cancel</button></div></div>' +
          '<div class="acts main">' + (s.status !== 'approved' ? '<button type="button" class="btn" data-do="approved">Approve</button>' : '') +
          (s.status !== 'redo' ? '<button type="button" class="btn btn-red" data-do="redo">Redo</button>' : '') +
          (s.status !== 'proposed' ? '<button type="button" class="btn btn-quiet" data-do="proposed">Undo</button>' : '') + '</div></div>';
      }
      function frameCard(f) {
        var s = f.s, sq = s.kind === 'on_camera';
        var pic = s.image_url ? '<div class="pic fit" data-big="' + esc(s.image_url) + '" style="--img:url(\'' + esc(s.image_url) + '\')" role="img" aria-label="Frame ' + f.n + '"><span class="fn">' + pad(f.n) + '</span></div>'
          : '<div class="pic empty"><span class="fn">' + pad(f.n) + '</span>No picture yet.</div>';
        var rd = RD[s.readiness] || RD.ready;
        var br = f.broll.map(function (b) {
          return '<div class="brcard ' + esc(b.status) + '"><div class="br-h"><span class="tag rd broll">B-roll</span> <span class="tag ' + esc(b.status) + '">' + esc(ST[b.status]) + '</span></div>' +
            (b.image_url ? '<div class="pic fit" data-big="' + esc(b.image_url) + '" style="--img:url(\'' + esc(b.image_url) + '\')"></div>' : '') +
            '<p class="brief">' + esc(b.brief) + '</p>' + decide(b) + '</div>';
        }).join('');
        return '<article class="frame ' + esc(s.status) + '" id="f' + f.n + '">' + pic + '<div class="body">' +
          '<div class="fh"><span class="time">' + secs(f.g0) + ' to ' + secs(f.g1) + '</span><span class="tag rd ' + esc(s.readiness || 'ready') + '" title="' + esc(rd[1]) + '">' + rd[0] + '</span> <span class="tag ' + esc(s.status) + '">' + esc(ST[s.status]) + '</span></div>' +
          '<p class="sec">' + f.c.n + '. ' + esc(f.c.title) + (sq ? ' · ' + esc(NARR[data.tour.narrator] || data.tour.narrator) + ' on camera' : '') + '</p>' +
          '<p class="q">“' + esc(s.line || f.c.line) + '”</p>' +
          '<p class="brief"><b>On screen:</b> ' + esc(s.brief) + '</p>' +
          (s.flag ? '<p class="flag">' + esc(s.flag) + '</p>' : '') +
          '<button type="button" class="linkbtn" data-play="' + f.n + '">▶ Play from here</button>' +
          decide(s) + br + '</div></article>';
      }
      var LB = null;
      function lookbook() {
        LB = frames();
        var ar = String(data.tour.aspect || '16:9'), tall = /^(4:5|9:16|1:1)$/.test(ar);
        $('pane').style.setProperty('--ar', ar.replace(':', '/'));
        var fr = LB.list, all = data.shots.length, ap = data.shots.filter(function (s) { return s.status === 'approved'; }).length;
        var html = '<p class="sub">The tour frame by frame, the way it will play. Press Play to watch it with ' + esc(NARR[data.tour.narrator] || data.tour.narrator) + '\'s voice, or go frame by frame. Approve what works; Redo what doesn\'t with a note (type it or tap the mic and say it). Nothing is animated or drawn until its frame is approved.</p>' +
          '<section class="player' + (tall ? ' tall' : '') + '" aria-label="The tour"><div class="pv"><div class="st-img" id="lbImg"></div>' +
          '<div class="ctl"><button type="button" class="btn" id="lbPlay">▶ Play the tour</button><button type="button" class="btn btn-quiet" id="lbPrev" aria-label="Back">Back</button><button type="button" class="btn btn-quiet" id="lbNext" aria-label="Next">Next</button><span class="meta" id="lbT">0:00 / ' + secs(LB.total) + '</span></div>' +
          '<div class="prog" id="lbBar"><span id="lbFill"></span></div></div>' +
          '<div class="pside"><div class="cap"><span class="fn" id="lbN"></span><div><p class="q" id="lbQ"></p><p class="meta" id="lbM"></p></div></div>' +
          '<div class="fbtns">' + fr.map(function (f) { return '<button type="button" data-go="' + f.n + '" class="' + esc(f.s.status) + '">' + pad(f.n) + '</button>'; }).join('') + '</div></div>' +
          '<audio id="lbAu" preload="none"></audio>' + (data.tour.music_url ? '<audio id="lbMu" preload="none" loop src="' + esc(data.tour.music_url) + '"></audio>' : '') + '</section>' +
          '<div class="legend"><b>' + fr.length + ' frames · ' + ap + ' of ' + all + ' decisions approved</b>' +
          Object.keys(RD).map(function (k) { return '<span><span class="tag rd ' + k + '">' + RD[k][0] + '</span> ' + RD[k][1] + '</span>'; }).join('') +
          '<span><span class="flag-dot"></span> Orange: the script says something that is not built yet.</span></div>' +
          '<div class="frames' + (tall ? ' tall' : '') + '" id="lbGrid">' + fr.map(frameCard).join('') + '</div>';
        $('pane').innerHTML = html;
        wireGrid();
        wirePlayer();
      }
      function wireGrid() {
        Array.prototype.forEach.call($('lbGrid').querySelectorAll('.dec'), wireShot);
        Array.prototype.forEach.call($('lbGrid').querySelectorAll('[data-big]'), function (el) {
          el.onclick = function () { var lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<img alt="" src="' + esc(el.getAttribute('data-big')) + '">'; lb.onclick = function () { lb.remove(); }; document.body.appendChild(lb); };
        });
        Array.prototype.forEach.call($('lbGrid').querySelectorAll('[data-play]'), function (b) {
          b.onclick = function () { LB.go(Number(b.getAttribute('data-play')), true); $('pane').querySelector('.player').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        });
      }
      function wirePlayer() {
        var fr = LB.list, au = $('lbAu'), cur = 1, playing = false, chap = null;
        function show(n) {
          var f = fr[n - 1]; if (!f) return; cur = n;
          var img = f.s.image_url || (f.broll[0] && f.broll[0].image_url) || '';
          var el = $('lbImg'), zoom = img && f.s.kind !== 'on_camera' && !NOZOOM[data.tour.slug];
          el.style.setProperty('--img', img ? 'url(\'' + img + '\')' : 'none');
          el.className = 'st-img'; void el.offsetWidth;
          el.className = 'st-img' + (img ? ' fit' : ' empty') + (zoom ? ' zoom' : '') + (playing ? '' : ' paused');
          $('lbN').textContent = pad(n);
          $('lbQ').textContent = '“' + (f.s.line || f.c.line) + '”';
          $('lbM').textContent = secs(f.g0) + ' to ' + secs(f.g1) + ' · ' + f.c.n + '. ' + f.c.title + ' · ' + KIND[f.s.kind] + ' · ' + ST[f.s.status];
          Array.prototype.forEach.call($('pane').querySelectorAll('.fbtns button'), function (b) { b.classList.toggle('on', Number(b.getAttribute('data-go')) === n); });
        }
        function tick() {
          if (chap == null) return;
          var g = LB.off[chap] + au.currentTime;
          $('lbT').textContent = secs(g) + ' / ' + secs(LB.total);
          $('lbFill').style.width = Math.min(100, g / LB.total * 100) + '%';
          var f = fr.filter(function (x) { return x.s.chapter_n === chap && au.currentTime >= x.from - 0.05; }).pop();
          if (f && f.n !== cur) show(f.n);
        }
        function load(n, at, play) {
          var c = data.chapters.filter(function (x) { return x.n === n; })[0];
          if (!c || !c.audio_url) { playing = false; $('lbPlay').textContent = '▶ Play the tour'; return; }
          if (chap !== n) { au.src = c.audio_url; chap = n; }
          var seek = function () { try { au.currentTime = at || 0; } catch (e) {} if (play && playing) au.play().catch(function () {}); tick(); };
          if (au.readyState >= 1) seek(); else { au.addEventListener('loadedmetadata', seek, { once: true }); au.load(); }
        }
        LB.go = function (n, play) {
          var f = fr[n - 1]; if (!f) return; show(n); playing = !!play;
          $('lbPlay').textContent = playing ? '❚❚ Pause' : '▶ Play the tour';
          load(f.s.chapter_n, f.from, playing);
          if (!playing) au.pause();
        };
        au.addEventListener('timeupdate', tick);
        // the music bed under the voice, low and looping, playing only while the tour plays (Sean, 2026-11-08)
        var mu = $('lbMu');
        if (mu) {
          mu.volume = 0.16;
          au.addEventListener('play', function () { mu.play().catch(function () {}); });
          au.addEventListener('pause', function () { setTimeout(function () { if (!playing) mu.pause(); }, 120); });
        }
        // a play() that lands after Pause was pressed is stopped at once (Sean, 2026-11-08: pause did not stop right away)
        au.addEventListener('playing', function () { if (!playing) au.pause(); });
        au.addEventListener('ended', function () {
          var next = data.chapters.filter(function (c) { return c.n > chap; })[0];
          if (next && playing) load(next.n, 0, true); else { playing = false; $('lbPlay').textContent = '▶ Play the tour'; }
        });
        $('lbPlay').onclick = function () {
          if (playing) { playing = false; au.pause(); $('lbImg').classList.add('paused'); $('lbPlay').textContent = '▶ Play the tour'; return; }
          if (chap == null) { LB.go(cur, true); return; }
          playing = true; $('lbImg').classList.remove('paused'); $('lbPlay').textContent = '❚❚ Pause'; au.play().catch(function () {});
        };
        $('lbPrev').onclick = function () { LB.go(Math.max(1, cur - 1), playing); };
        $('lbNext').onclick = function () { LB.go(Math.min(fr.length, cur + 1), playing); };
        $('lbBar').onclick = function (e) {
          var r = this.getBoundingClientRect(), g = (e.clientX - r.left) / r.width * LB.total;
          var f = fr.filter(function (x) { return x.g0 <= g; }).pop() || fr[0];
          show(f.n); load(f.s.chapter_n, g - LB.off[f.s.chapter_n], playing);
        };
        Array.prototype.forEach.call($('pane').querySelectorAll('[data-go]'), function (b) { b.onclick = function () { LB.go(Number(b.getAttribute('data-go')), playing); }; });
        show(1);
      }
      function wireShot(card) {
        var id = card.getAttribute('data-id'), box = card.querySelector('.redo-box'), main = card.querySelector('.acts.main');
        Array.prototype.forEach.call(card.querySelectorAll('button[data-do]'), function (b) {
          b.onclick = function () {
            var d = b.getAttribute('data-do');
            if (d === 'redo') { box.hidden = false; main.hidden = true; box.querySelector('textarea').focus(); return; }
            if (d === 'redo-cancel') { box.hidden = true; main.hidden = false; return; }
            var status = d === 'redo-send' ? 'redo' : d, note = d === 'redo-send' ? box.querySelector('textarea').value.trim() : '';
            if (status === 'redo' && !note) { box.querySelector('textarea').focus(); return; }
            b.disabled = true;
            api({ action: 'shot_decide', id: id, status: status, note: note }).then(function (r) {
              if (!r || !r.ok) { b.disabled = false; return; }
              data.shots = data.shots.map(function (s) { return s.id === id ? Object.assign({}, s, r.shot) : s; });
              var y = window.scrollY;
              LB = Object.assign(frames(), { go: LB.go });
              $('lbGrid').innerHTML = LB.list.map(frameCard).join('');
              wireGrid();
              Array.prototype.forEach.call($('pane').querySelectorAll('.fbtns button'), function (x) { var f = LB.list[Number(x.getAttribute('data-go')) - 1]; if (f) x.className = f.s.status + (x.classList.contains('on') ? ' on' : ''); });
              window.scrollTo(0, y);
            });
          };
        });
      }
      function script() {
        var t = data.tour;
        $('pane').innerHTML = '<p class="sub">Each chapter is recorded on its own in ' + esc(NARR[t.narrator] || t.narrator) + '\'s voice and checked word for word.' + (t.script_doc ? ' The script lives in <code>' + esc(t.script_doc) + '</code>.' : '') + ' A changed line is recorded again as a new version.</p>' +
          '<table><thead><tr><th>#</th><th>Chapter and line</th><th>Recording</th><th>Checked</th></tr></thead><tbody>' + data.chapters.map(function (c) {
            return '<tr><td><b>' + c.n + '</b></td><td><b>' + esc(c.title) + '</b><br>' + esc(c.line) + '</td>' +
              '<td>' + (c.audio_url ? '<audio controls preload="none" src="' + esc(c.audio_url) + '"></audio><br><span class="meta">Version ' + c.audio_ver + ', ' + Number(c.seconds || 0).toFixed(1) + ' s</span>' : '<span class="meta">Not recorded</span>') + '</td>' +
              '<td>' + (c.stt_ok ? '<span class="ok">Matches</span>' : c.stt_ok === false ? '<span style="color:#8a1c12;font-weight:800">Does not match</span>' : '<span class="meta">Not checked</span>') + (c.stt_text ? '<br><span class="meta">Heard: ' + esc(c.stt_text) + '</span>' : '') + '</td></tr>';
          }).join('') + '</tbody></table>';
      }
      function video() {
        var t = data.tour;
        $('pane').innerHTML = t.video_url
          ? '<video controls style="width:100%;max-width:960px;border-radius:12px;background:#000" src="' + esc(t.video_url) + '"></video><p class="meta"><a class="btn btn-quiet" href="' + esc(t.video_url) + '" download>Download</a> ' + (t.youtube_url ? '<a class="btn btn-quiet" href="' + esc(t.youtube_url) + '" target="_blank" rel="noopener">On YouTube</a>' : '') + '</p>'
          : '<div class="chap"><h2>Not made yet</h2><p class="sub" style="margin-top:6px">The video is put together once every shot in the lookbook is approved and the on-camera moments are animated. It will play here, with a download, its chapters, and the YouTube link once it is up.</p></div>';
      }
      function render() { var r = route(); if (r.v === 'tour') { if (data && data.tour.slug === r.slug) draw(r); else tour(r); } else { data = null; list(); } window.scrollTo(0, 0); }
      window.addEventListener('hashchange', render);
      function start() {
        if (!window.VEAuth) return setTimeout(start, 200);
        var m = VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember();
        if (!VEAuth.isLoggedIn()) { $('gate').hidden = false; $('gate').innerHTML = '<h2>Sign in</h2><p>This page is for Vegans Explore admins.</p><button type="button" class="btn" id="si">Sign in</button>'; $('si').onclick = function () { VEAuth.showAuthModal('Sign in to open the Depot.', function () { location.reload(); }); }; return; }
        if (!m || !m.is_superadmin) { $('gate').hidden = false; $('gate').innerHTML = '<h2>Admins only</h2><p>This page is for Vegans Explore admins.</p>'; return; }
        $('app').hidden = false; render();
      }
      start();
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
