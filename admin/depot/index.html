  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-dark:#2d7d31;--ve-green-deep:#1f5f22;--ve-green-light:#EAF7EA;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.8);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    .wrap{max-width:none;margin:0;padding:28px 40px 56px;}
    @media (max-width:600px){.wrap{padding:24px 16px 48px;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-deep);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,32px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:8px;}
    .sub{font-size:14.5px;color:var(--ve-text-75);max-width:860px;margin-bottom:14px;}
    .crumb{font-size:12.5px;margin-bottom:12px;}.crumb a{color:var(--ve-green-deep);font-weight:700;}
    .find{font-family:inherit;font-size:14px;min-height:44px;width:100%;max-width:520px;padding:10px 14px;border:1px solid var(--ve-border);border-radius:6px;background:#fff;margin:0 0 18px;}
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px;}
    .tile{position:relative;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:16px 18px;min-height:132px;color:inherit;text-decoration:none;cursor:pointer;font:inherit;text-align:left;transition:border-color .15s,box-shadow .15s;}
    .tile:hover{border-color:var(--ve-green);box-shadow:0 4px 14px rgba(0,0,0,.05);}
    .tile .ic{width:38px;height:38px;border-radius:10px;background:var(--ve-green-light);display:grid;place-items:center;}
    .tile .ic svg{width:20px;height:20px;stroke:var(--ve-green-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .tile b{font-size:16px;font-weight:800;line-height:1.25;}
    .tile span.ln{font-size:12.5px;color:var(--ve-text-75);line-height:1.45;}
    .tile .ct{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;background:#eef1ee;color:#333;}
    .tile .ct.hot{background:var(--ve-orange);color:#1a1a1a;}
    .tile.dash{border-style:dashed;}
    /* Section tiles wear a picture (Sean, 2026-11-07: "insert thumbnails to give it a little bit more life"): our illustrated art, reused. */
    .tile.pic{padding:0;overflow:hidden;gap:0;}
    .tile.pic img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#f1f3f1;}
    .tile.pic .tx{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;}
    .tile.pic .ct{top:10px;right:10px;box-shadow:0 1px 4px rgba(0,0,0,.18);}
    .tile.pic.dash img{filter:saturate(.75);}
    @media (max-width:600px){
      .tile.pic{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px;padding:10px;min-height:0;}
      .tile.pic img{aspect-ratio:1/1;border-radius:8px;}
      .tile.pic .tx{padding:0 64px 0 0;}
      .tile.pic .ct{top:10px;right:10px;box-shadow:none;}
    }
    .tile.dash .ic{background:#f1f1f1;}.tile.dash .ic svg{stroke:#777;}
    .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#eef1ee;color:#333;}
    .tag.r{background:var(--ve-green-light);color:var(--ve-green-deep);}
    .list{display:grid;gap:10px;}
    .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--ve-border);border-radius:12px;padding:14px 16px;}
    .row b{font-size:15px;}
    .row p{font-size:13px;color:var(--ve-text-75);margin-top:2px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px;border-radius:6px;font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border:0;background:var(--ve-green-deep);color:#fff;text-decoration:none;white-space:nowrap;}
    .btn-quiet{background:#fff;color:var(--ve-green-deep);border:1px solid var(--ve-green-deep);}
    .btn:disabled{opacity:.5;cursor:default;}
    .gate{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--ve-border);border-radius:14px;padding:32px;text-align:center;}
    .msg{font-size:13px;font-weight:700;color:var(--ve-green-deep);margin:0 0 12px;}
    @media (max-width:600px){.row{grid-template-columns:1fr;}}
    /* Tool cards: the tool's own page as its picture, a count when something waits, and a star for My list (Sean, 2026-11-07). */
    .tile.tool img{object-position:top center;border-bottom:1px solid var(--ve-border);}
    .tile .noimg{display:grid;place-items:center;aspect-ratio:16/9;background:var(--ve-green-light);}
    .tile .noimg svg{width:34px;height:34px;stroke:var(--ve-green-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .tile.tool .ct{left:10px;right:auto;}
    .star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:8px;border:1px solid var(--ve-border);background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);z-index:2;}
    .star svg{width:19px;height:19px;fill:none;stroke:#777;stroke-width:1.8;stroke-linejoin:round;}
    .star.on svg{fill:var(--ve-orange);stroke:#c47000;}
    .star.flat{position:static;box-shadow:none;}
    .gart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;overflow-x:auto;margin:0 0 16px;padding-bottom:4px;}
    .gart a{display:block;text-decoration:none;color:inherit;font-size:12px;font-weight:800;}
    .gart img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;border-radius:10px;border:1px solid var(--ve-border);margin-bottom:4px;}
    @media (max-width:600px){.tile.tool .tx{padding-right:44px;}.tile.tool .star{top:auto;bottom:10px;}}
    [hidden]{display:none !important;}
  </style>
</head>

        if (k === 'directory') return { v: n('events_waiting') + n('claims_waiting') + n('listings_on_hold'), w: 'waiting' };
        if (k === 'content') return { v: n('inbox_open') + n('search_questions_open'), w: 'open' };
        if (k === 'bounties') return { v: n('bounty_proofs') + n('checkin_actions') + n('watchlist'), w: 'waiting' };
        if (k === 'ideas') return { v: n('ideas_new') + n('feedback_new'), w: 'new' };
        if (k === 'guides') return { v: n('guides_live'), w: 'live', info: true };
        return null;
      }
      function toolsOf(label) { return TABS.filter(function (t) { return t.group === label; }); }
      // A tool's picture (Sean, 2026-11-07: "I should see their demo page... these things need to have thumbnails"). Demos are
      // public pages, so their pictures are in the repo; every other tool is a live admin page, so its picture sits in the private
      // bucket depot-thumbs and ve-depot home hands a one-hour link to super admins only.
      function slugOf(href) { return href.replace(/^\//, '').replace(/[^a-z0-9]+/gi, '-').replace(/-$/, ''); }
      // BrandDesk rooms open in HQ, so they wear our illustrated art rather than a capture.
      var HQ_PIC = { social: 't-featured', campaigns: 't-next', days: 't-audit', playbooks: 't-fixes', podcast: 't-pulse', insights: 't-dashboard' };
      function hqPic(href) { var m = href.match(/[?&](?:p|b|view)=([a-z]+)(?!.*[?&](?:p|b)=)/); var k = m ? m[1] : ''; return HQ_PIC[k] ? '/public/guides/restaurant-guide/' + HQ_PIC[k] + '.jpg' : ''; }
      function thumbOf(t) { var sl = slugOf(t.href); return t.kind === 'demo' ? '/public/depot/demos/' + sl + '.jpg' : t.kind === 'hq' ? hqPic(t.href) : (thumbs[sl] || ''); }
      // What waits in one tool today, for its badge.
      var TOOL_COUNT = { '/admin/depot/directory-review': ['listings_on_hold', 'on hold'], '/admin/depot/directory-review#logos': ['logos_to_do', 'to do'],
        '/admin/depot/events': ['events_waiting', 'waiting'], '/admin/depot/claims': ['claims_waiting', 'waiting'], '/admin/depot/inbox': ['inbox_open', 'open'],
        '/admin/depot/search-questions': ['search_questions_open', 'open'], '/admin/depot/bounties': ['bounty_proofs', 'waiting'],
        '/admin/depot/checkins': ['checkin_actions', 'waiting'], '/admin/depot/watchlist': ['watchlist', 'watching'], '/admin/depot/ideas': ['ideas_new', 'new'],
        '/admin/depot/feedback': ['feedback_new', 'new'] };
      var STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8-4.3-4.1 5.9-.8z"/></svg>';
      // Guide banners for the Guides section (Sean: "we have thumbnails for the guides. Why aren't we using them there?").
      var GUIDE_ART = [['vegan-dairy-guide', 'Dairy'], ['vegan-restaurant-guide', 'Restaurant'], ['vegan-events-guide', 'Events'], ['nutrition-guide', 'Nutrition'],
        ['airport-guide', 'Airport'], ['stadium-arena-guide', 'Stadium & Arena'], ['creator-guide', 'Creator'], ['nonprofit-guide', 'Nonprofit'], ['pre-vegan-business-guide', 'Pre-Vegan Business']];
      function toolCard(t, k) {
        var how = t.kind === 'demo' ? 'Opens in a new tab, as the public sees it' : t.kind === 'hq' ? 'Opens BrandDesk in HQ, in a new tab' : t.kind === 'dash' ? 'Opens in the dashboard' : (t.restored ? 'Restored from the trash bin' : (k === 'mine' ? t.group : ''));
        var c = TOOL_COUNT[t.href], ct = '';
        if (c && n(c[0]) != null) ct = '<span class="ct' + (n(c[0]) > 0 && c[1] !== 'watching' ? ' hot' : '') + '">' + fmt(n(c[0])) + ' ' + c[1] + '</span>';
        var on = pins.indexOf(t.href) >= 0, src = thumbOf(t);
        var star = '<button type="button" class="star' + (on ? ' on' : '') + '" data-pin="' + esc(t.href) + '" aria-pressed="' + on + '" aria-label="' + (on ? 'Take ' + esc(t.label) + ' off My list' : 'Add ' + esc(t.label) + ' to My list') + '" title="' + (on ? 'On My list' : 'Add to My list') + '">' + STAR + '</button>';
        var pic = src ? '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async">' : '<span class="noimg"><svg viewBox="0 0 24 24">' + (t.kind === 'demo' ? IC.demos : IC.tool) + '</svg></span>';
        return '<a class="tile pic tool" href="' + esc(t.href) + '" data-tool="' + esc(t.href) + '">' + pic + ct + star + '<span class="tx"><b>' + esc(t.label) + '</b><span class="ln">' + esc(how) + '</span></span></a>';
      }
      function wirePins(root) {
        Array.prototype.forEach.call(root.querySelectorAll('[data-pin]'), function (b) {
          b.onclick = function (e) {
            e.preventDefault(); e.stopPropagation();
            var href = b.getAttribute('data-pin'), on = pins.indexOf(href) < 0;
            pins = on ? pins.concat([href]) : pins.filter(function (h) { return h !== href; });
            b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); savePins();
            api({ action: 'pin_set', href: href, pinned: on }).then(function (d) { if (d && d.ok) { pins = d.pins; savePins(); } if (/^#?s\/mine/.test(location.hash.replace(/^#/, ''))) render(); });
          };
        });
      }
      function savePins() { try { localStorage.setItem('ve_depot_pins', JSON.stringify(pins)); } catch (e) {} }
      // A picture per section, from art we already have (no new credits). A section with none keeps its icon.
      var PIC = {
        directory: '/public/guides/pre-vegan-business/t-found.jpg',
        mine: '/public/guides/restaurant-guide/t-featured.jpg',
        content: '/public/guides/restaurant-guide/t-pulse.jpg',
        bounties: '/public/guides/venues/river-report.webp',
        guides: '/public/guides/welcome-guide.jpg',
        ideas: '/public/guides/restaurant-guide/t-mylist.jpg',
        demos: '/public/guides/restaurant-guide/t-demo.jpg',
        moving: '/public/guides/restaurant-guide/t-dashboard.jpg',
        branddesk: '/public/guides/restaurant-guide/t-promos.jpg'
      };
      function tile(href, k, title, line, ct, extra) {
        var badge = ct ? '<span class="ct' + (ct.hot ? ' hot' : '') + '">' + esc(ct.t) + '</span>' : '';
        var words = '<b>' + esc(title) + '</b><span class="ln">' + esc(line) + '</span>';
        if (PIC[k]) return '<a class="tile pic' + (extra || '') + '" href="' + href + '"><img src="' + PIC[k] + '" alt="" loading="lazy" decoding="async">' + badge + '<span class="tx">' + words + '</span></a>';
        return '<a class="tile' + (extra || '') + '" href="' + href + '"><span class="ic"><svg viewBox="0 0 24 24">' + (IC[k] || IC.tool) + '</svg></span>' + badge + words + '</a>';
      }
      function home() {
        $('title').textContent = 'The Depot';
        var html = '<p class="sub">Where we run Vegans Explore behind the scenes. Each tile is a section; the number is what is waiting today.</p>' +
          '<input id="find" class="find" type="search" placeholder="Find a tool by name" aria-label="Find a tool by name" data-dictate="off">' +
          '<div id="hits" class="list" style="margin-bottom:18px" hidden></div><div class="tiles">';
        var mine = pins.map(function (h) { return TABS.filter(function (t) { return t.href === h; })[0]; }).filter(Boolean);
        html += tile('#s/mine', 'mine', 'My list', mine.length ? mine.map(function (t) { return t.label; }).join(', ') : 'Star any tool and it waits here for you. Tap a section to start.', { t: mine.length + ' saved' });
        SECTIONS.forEach(function (s) {
          var w = waiting(s.k), ct = null;
          if (w && w.v != null) ct = { t: fmt(w.v) + ' ' + w.w, hot: !w.info && w.v > 0 };
          else if (s.k === 'demos' || s.k === 'moving' || s.k === 'branddesk') ct = { t: toolsOf(s.label).length + (s.k === 'demos' ? ' demos' : ' tools') };
          var href = '#s/' + s.k;
          html += tile(href, s.k, s.label, s.line, ct, s.k === 'moving' ? ' dash' : '');
        });
        var inTrash = TRASH.filter(function (t) { return restored.indexOf(t.href) < 0; }).length;
        html += tile('#trash', 'trash', 'Trash bin', 'Retired tools. Nothing is deleted; restore any of them.', { t: String(inTrash) }, ' dash') + '</div>';
        if (!counts) html += '<p class="sub" style="margin-top:14px">Counting what is waiting...</p>';
        $('view').innerHTML = html;
        $('find').oninput = function () {
          var q = this.value.trim().toLowerCase(), hits = $('hits');
          if (!q) { hits.hidden = true; hits.innerHTML = ''; return; }
          var m = TABS.filter(function (t) { return (t.label + ' ' + t.group).toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
          hits.hidden = false;
          hits.innerHTML = m.length ? m.map(toolRow).join('') : '<p class="sub">No tool by that name. Retired ones are in the Trash bin.</p>';
          wireTools(hits); wirePins(hits);
        };
      }
      function toolRow(t) {
        var how = t.kind === 'demo' ? 'Opens in a new tab' : t.kind === 'hq' ? 'Opens BrandDesk in HQ' : t.kind === 'dash' ? 'Opens in the dashboard' : '';
        var on = pins.indexOf(t.href) >= 0;
        return '<div class="row"><div><b>' + esc(t.label) + '</b> ' + (t.restored ? '<span class="tag r">Restored</span>' : '') + '<p>' + esc(t.group) + (how ? ' · ' + how : '') + '</p></div>' +
          '<div style="display:flex;gap:8px;align-items:center"><button type="button" class="star flat' + (on ? ' on' : '') + '" data-pin="' + esc(t.href) + '" aria-pressed="' + on + '" aria-label="My list">' + STAR + '</button><a class="btn" href="' + esc(t.href) + '" data-tool="' + esc(t.href) + '">Open</a></div></div>';
      }
      // A demo opens in a new tab; a dashboard page asks the dashboard around this frame to open it (as the Go to menu does).
      function wireTools(root) {
        Array.prototype.forEach.call(root.querySelectorAll('[data-tool]'), function (a) {
          a.onclick = function (e) {
            var t = TABS.filter(function (x) { return x.href === a.getAttribute('data-tool'); })[0]; if (!t) return;
            if (window.VE_DEPOT_USE) window.VE_DEPOT_USE(t.href);
            if (t.kind === 'demo' || t.kind === 'hq') { e.preventDefault(); window.open(t.href, '_blank', 'noopener'); return; }
            if (t.kind === 'dash') {
              var inDash = false; try { inDash = window.self !== window.top && /^\/dashboard/.test(window.top.location.pathname); } catch (x) {}
              if (inDash) { e.preventDefault(); window.top.postMessage({ type: 've-open-tool', href: t.href, label: t.label }, location.origin); }
            }
          };
        });
      }
      function section(k) {
        var mineView = k === 'mine';
        var s0 = mineView ? { k: 'mine', label: 'My list' } : SECTIONS.filter(function (x) { return x.k === k; })[0]; if (!s0) return home();
        $('title').textContent = s0.label;
        var tools = mineView ? pins.map(function (h) { return TABS.filter(function (t) { return t.href === h; })[0]; }).filter(Boolean) : toolsOf(s0.label);
        var note = k === 'moving' ? '<p class="sub">BrandDesk is taking these over. Each one stays here, working, until BrandDesk does everything it does. The ones BrandDesk already does are in the BrandDesk section and the old copies are in the trash bin.</p>'
          : k === 'branddesk' ? '<p class="sub">BrandDesk lives in HQ. These open it in a new tab, signed in with your LESARUSS account. Nothing here is a copy.</p>'
          : mineView ? '<p class="sub">The tools you use most. Tap the star on any tool, in any section or in search, to add it here or take it off.</p>'
          : '<p class="sub">Tap the star on a tool to keep it in My list on the Depot home.</p>';
        var art = k === 'guides' ? '<div class="gart">' + GUIDE_ART.map(function (g) { return '<a href="/guides/' + g[0] + '" target="_blank" rel="noopener"><img src="/public/guides/' + g[0] + '.jpg" alt="" loading="lazy"><span>' + esc(g[1]) + '</span></a>'; }).join('') + '</div>' : '';
        $('view').innerHTML = '<p class="crumb"><a href="#">The Depot</a> &rsaquo; ' + esc(s0.label) + '</p>' + note + art +
          (tools.length ? '<div class="tiles">' + tools.map(function (t) { return toolCard(t, k); }).join('') + '</div>' : '<p class="sub">Nothing here yet. Open a section and tap the star on a tool.</p>');
        wireTools($('view')); wirePins($('view'));
      }
      function trash(msg) {
        $('title').textContent = 'Trash bin';
        $('view').innerHTML = '<p class="crumb"><a href="#">The Depot</a> &rsaquo; Trash bin</p>' +
          '<p class="sub">Retired tools. Nothing is deleted: each page, its data and its server side stay exactly as they were. Restore puts a tool back in its section at once.</p>' +
          (msg ? '<p class="msg">' + esc(msg) + '</p>' : '') + '<div class="list">' + TRASH.map(function (t) {
            var back = restored.indexOf(t.href) >= 0;
            return '<div class="row"><div><b>' + esc(t.label) + '</b> ' + (back ? '<span class="tag r">Restored to ' + esc(t.group) + '</span>' : '') + '<p>' + esc(t.why) + '</p></div>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-quiet" href="' + esc(t.href) + '">Look at it</a>' +
              '<button type="button" class="btn" data-href="' + esc(t.href) + '" data-to="' + (back ? '0' : '1') + '">' + (back ? 'Retire it again' : 'Restore') + '</button></div></div>';
          }).join('') + '</div>';
        Array.prototype.forEach.call($('view').querySelectorAll('button[data-href]'), function (b) {
          b.onclick = function () {
            b.disabled = true;
            var t = TRASH.filter(function (x) { return x.href === b.getAttribute('data-href'); })[0];
            api({ action: 'trash_set', href: t.href, restored: b.getAttribute('data-to') === '1' }).then(function (d) {
              if (!d || !d.ok) { b.disabled = false; return trash('That did not save. Try again.'); }
              restored = d.restored; save();
              // The Go to menu is built when the page loads, so reload to put the tool back in it.
              location.reload();
            }).catch(function () { b.disabled = false; trash('That did not save. Try again.'); });
          };
        });
      }
      function save() { try { localStorage.setItem('ve_depot_restored', JSON.stringify(restored)); } catch (e) {} }
      function render() {
        var h = location.hash.replace(/^#/, '').split('/');
        if (h[0] === 's') section(h[1]); else if (h[0] === 'trash') trash(); else home();
        window.scrollTo(0, 0);
      }
      window.addEventListener('hashchange', render);
      function start() {
        if (!window.VEAuth) return setTimeout(start, 200);
        var m = VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember();
        if (!VEAuth.isLoggedIn()) { $('gate').hidden = false; $('gate').innerHTML = '<h2>Sign in</h2><p>The Depot is for Vegans Explore admins.</p><button type="button" class="btn" id="si">Sign in</button>'; $('si').onclick = function () { VEAuth.showAuthModal('Sign in to open the Depot.', function () { location.reload(); }); }; return; }
        if (!m || !m.is_superadmin) { $('gate').hidden = false; $('gate').innerHTML = '<h2>Admins only</h2><p>The Depot is for Vegans Explore admins.</p>'; return; }
        $('app').hidden = false; render();
        api({ action: 'home' }).then(function (d) {
          if (!d || !d.ok) return;
          counts = d.counts; pins = d.pins || pins; thumbs = d.thumbs || {}; savePins();
          var before = JSON.stringify(restored);
          restored = d.restored || []; save();
          if (before !== JSON.stringify(restored) && localStorage.getItem('ve_depot_restored_seen') !== JSON.stringify(restored)) {
            try { localStorage.setItem('ve_depot_restored_seen', JSON.stringify(restored)); } catch (e) {}
            return location.reload();
          }
          render();
        });
      }
      try { restored = JSON.parse(localStorage.getItem('ve_depot_restored') || '[]') || []; } catch (e) {}
      try { pins = JSON.parse(localStorage.getItem('ve_depot_pins') || '[]') || []; } catch (e) {}
      start();
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
