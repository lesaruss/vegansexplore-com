<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>In this story | The Depot</title>
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--ve-green:#3A9B3E;--ve-green-deep:#1f5f22;--ve-orange:#F69820;--ve-border:rgba(0,0,0,0.09);--ve-text:#1a1a1a;--ve-text-75:rgba(26,26,26,0.8);}
    body{font-family:"Montserrat",sans-serif;background:#f7f8f7;color:var(--ve-text);line-height:1.6;}
    :focus-visible{outline:3px solid var(--ve-orange);outline-offset:2px;}
    .wrap{max-width:none;margin:0;padding:28px 40px 56px;}
    @media (max-width:600px){.wrap{padding:24px 16px 48px;}}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:var(--ve-green-deep);margin-bottom:6px;}
    h1{font-size:clamp(24px,3vw,32px);font-weight:900;text-transform:uppercase;line-height:1.1;margin-bottom:8px;}
    .sub{font-size:14.5px;color:var(--ve-text-75);max-width:820px;margin-bottom:16px;}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
    .toolbar input,.toolbar select,.tabs button{font:inherit;font-size:13.5px;padding:10px 12px;min-height:44px;border:1px solid rgba(0,0,0,0.25);border-radius:6px;background:#fff;}
    .toolbar input{flex:1;min-width:min(220px,100%);}
    .tabs{display:flex;gap:6px;margin-bottom:12px;}
    .tabs button{cursor:pointer;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;}
    .tabs button[aria-pressed="true"]{background:var(--ve-green-deep);border-color:var(--ve-green-deep);color:#fff;}
    .count{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ve-text-75);margin-bottom:10px;}
    .card{background:#fff;border:1px solid var(--ve-border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;}
    .main{min-width:0;flex:1 1 360px;}
    .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ve-text-75);margin-bottom:4px;}
    .pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#eef0ee;}
    .name{font-size:15px;font-weight:800;line-height:1.35;}
    .name a{color:inherit;}
    .article{font-size:13px;color:var(--ve-text-75);margin-top:2px;}
    .article a{color:inherit;}
    .btn{font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;min-height:40px;border-radius:6px;border:1px solid rgba(0,0,0,.25);background:#fff;cursor:pointer;}
    .btn:disabled{opacity:.5;cursor:wait;}
    .msg{font-size:12px;font-weight:700;color:#a61b1b;margin-top:4px;}
    .empty{font-size:14px;color:var(--ve-text-75);padding:24px 0;}
    .gate{max-width:520px;margin:40px auto;background:#fff;border:1px solid var(--ve-border);border-radius:10px;padding:32px;text-align:center;}
    [hidden]{display:none !important;}
  </style>
</head>
<body>
  <div class="page-frame">
  <script>
  try { if (window.self !== window.top) document.documentElement.classList.add('ve-embedded'); } catch (e) {}
  </script>
  <style>.ve-embedded .ve-nav,.ve-embedded .ve-footer{display:none !important}.ve-embedded body{background:#fff}.ve-embedded .wrap{padding:20px 24px 40px}</style>
  <script src="/public/nav.js"></script>
  <div class="wrap">
    <p class="eyebrow">The Depot</p>
    <h1>In this story</h1>
    <div id="depot-tabs"></div>
    <p class="sub">The people, restaurants and brands each Pulse article names, the way they show at the foot of the article. The rebuild checks each article every day and finds new listings. Take a wrong match off here and it stays off. Put it back any time.</p>
    <div id="mx-gate" class="gate" hidden></div>
    <div id="mx-app" hidden>
      <div class="tabs" role="group" aria-label="Matches">
        <button type="button" id="tab-shown" aria-pressed="true">Showing</button>
        <button type="button" id="tab-removed" aria-pressed="false">Taken off</button>
      </div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search by name or article" aria-label="Search by name or article">
      </div>
      <p class="count" id="count"></p>
      <div id="cards"><p class="empty">Loading...</p></div>
    </div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script src="/public/depot-tabs.js"></script>
  <script>
    (function () {
      var FN = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-mentions';
      var $ = function (id) { return document.getElementById(id); };
      var items = [], status = 'shown', SHOW = 150;
      function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
      function api(body) {
        return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + VEAuth.getToken() }, body: JSON.stringify(body) })
          .then(function (r) { return r.json(); });
      }
      function matches(m) {
        var q = $('q').value.trim().toLowerCase();
        if (!q) return true;
        var a = m.ve_pulse_content || {}, l = m.listings || {};
        return (String(l.name || '') + ' ' + String(a.title || '') + ' ' + String(m.matched || '')).toLowerCase().indexOf(q) >= 0;
      }
      var SOURCE = { credit: 'Credited on the episode', link: 'Linked in the article', name: 'Named in the text' };
      function render() {
        var list = items.filter(matches);
        $('count').textContent = list.length + ' ' + (status === 'shown' ? 'showing' : 'taken off') + (list.length > SHOW ? ', showing the first ' + SHOW + ' (search to narrow)' : '');
        if (!list.length) { $('cards').innerHTML = '<p class="empty">Nothing here.</p>'; return; }
        $('cards').innerHTML = list.slice(0, SHOW).map(function (m) {
          var a = m.ve_pulse_content || {}, l = m.listings || {};
          return '<article class="card" data-id="' + esc(m.id) + '">' +
            '<div class="main"><div class="meta"><span class="pill">' + esc(l.category || '') + '</span><span>' + esc(SOURCE[m.source] || m.source) + '</span></div>' +
            '<p class="name"><a href="/directory/' + esc(l.slug) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>' +
            (m.matched && m.source !== 'name' ? ' <span class="article">(' + esc(m.matched) + ')</span>' : '') + '</p>' +
            '<p class="article">In <a href="/pulse/' + esc(a.slug) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></p></div>' +
            '<div><button type="button" class="btn" data-set="' + (status === 'shown' ? 'removed' : 'shown') + '">' + (status === 'shown' ? 'Take it off' : 'Put it back') + '</button><p class="msg" role="status"></p></div>' +
            '</article>';
        }).join('');
      }
      function load() {
        $('cards').innerHTML = '<p class="empty">Loading...</p>';
        api({ action: 'list', status: status }).then(function (d) {
          if (!d.items) throw new Error(d.error || 'failed');
          items = d.items; render();
        }).catch(function () { $('cards').innerHTML = '<p class="empty">Did not load. Refresh to try again.</p>'; });
      }
      $('cards').addEventListener('click', function (e) {
        var b = e.target.closest('[data-set]'); if (!b) return;
        var card = b.closest('.card'), id = card.getAttribute('data-id'), next = b.getAttribute('data-set');
        b.disabled = true; card.querySelector('.msg').textContent = '';
        api({ action: 'set', id: id, status: next }).then(function (d) {
          if (!d.ok) throw new Error(d.error);
          items = items.filter(function (m) { return m.id !== id; }); render();
        }).catch(function () { b.disabled = false; card.querySelector('.msg').textContent = 'Did not save. Try again.'; });
      });
      function pick(s) {
        status = s;
        $('tab-shown').setAttribute('aria-pressed', String(s === 'shown'));
        $('tab-removed').setAttribute('aria-pressed', String(s === 'removed'));
        load();
      }
      $('tab-shown').addEventListener('click', function () { pick('shown'); });
      $('tab-removed').addEventListener('click', function () { pick('removed'); });
      $('q').addEventListener('input', render);
      function start() {
        if (!window.VEAuth) return setTimeout(start, 200);
        var m = VEAuth.getRealMember ? VEAuth.getRealMember() : VEAuth.getMember();
        if (!VEAuth.isLoggedIn() || !m || !m.is_superadmin) { $('mx-gate').hidden = false; $('mx-gate').textContent = 'This page is for Vegans Explore admins. Sign in with an admin account.'; return; }
        $('mx-app').hidden = false;
        load();
      }
      start();
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
