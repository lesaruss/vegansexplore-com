<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Plant-Based Dish, Pre-Vegan Certified">
  <!-- Pre-Vegan Certification stamp, DRAFT for Sean (B5, 2026-11-06). "Pre-Vegan" is the working name until the trademark search (A5) and the diner comprehension test.
       For print, convert the text to outlines (Montserrat 800/900). Never use this as a restaurant seal: it always sits beside named dishes or with the decal's count. -->
  <defs>
    <path id="top" d="M95 300a205 205 0 0 1 410 0"/>
    <path id="bot" d="M78 300a222 222 0 0 0 444 0"/>
  </defs>
  <circle cx="300" cy="300" r="290" fill="#2D5C27"/>
  <circle cx="300" cy="300" r="272" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="300" cy="300" r="170" fill="#ffffff"/>
  <circle cx="300" cy="300" r="170" fill="none" stroke="#ffffff" stroke-width="4"/>
  <g font-family="Montserrat, Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">
    <text font-size="50" letter-spacing="5"><textPath href="#top" startOffset="50%">PLANT-BASED DISH</textPath></text>
    <text font-size="46" letter-spacing="5"><textPath href="#bot" startOffset="50%" dominant-baseline="hanging">PRE-VEGAN CERTIFIED</textPath></text>
    <circle cx="96" cy="300" r="9"/><circle cx="504" cy="300" r="9"/>
  </g>
  <path d="M300 372c-58-30-88-82-78-152 60 2 100 34 78 152zm0 0c58-30 88-82 78-152-60 2-100 34-78 152z" transform="translate(0,-28)" fill="#3A9B3E"/>
  <text x="300" y="398" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="2.5" fill="#2D5C27" text-anchor="middle">VEGANS EXPLORE</text>
</svg>
