  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Montserrat", sans-serif; background: #fff; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    .login-wrap { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px 80px; }
    .login-card { width: 100%; max-width: 400px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo img { height: 36px; width: auto; }
    h1 { font-size: 24px; font-weight: 900; color: #1a1a1a; text-align: center; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: #666; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #555; margin-bottom: 5px; }
    .login-field { margin-bottom: 14px; }
    .login-hint { font-size: 11px; color: #888; margin: -8px 0 14px; }
    input[type="password"] { display: block; width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 6px; font-family: "Montserrat", sans-serif; font-size: 14px; color: #1a1a1a; background: #fff; transition: border-color 0.15s; -webkit-appearance: none; }
    input:focus { outline: none; border-color: #22C55E; }
    .login-submit { display: block; width: 100%; padding: 14px; background: #22C55E; color: #fff; font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; transition: background 0.15s; margin-top: 6px; }
    .login-submit:hover { background: #16A34A; }
    .login-submit:disabled { background: #9CA3AF; cursor: not-allowed; }
    .login-error { display: none; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; padding: 12px 14px; font-size: 13px; color: #dc2626; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
    .login-error.visible { display: block; }
    .login-success { display: none; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 6px; padding: 14px 16px; font-size: 13px; color: #15803D; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
    .login-success.visible { display: block; }
    .login-join { text-align: center; margin-top: 24px; font-size: 13px; color: #555; }
    .login-join a { color: #22C55E; font-weight: 700; text-decoration: none; }
    @media (max-width: 480px) { .login-wrap { padding: 32px 16px 60px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <script src="/public/nav.js"></script>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="/public/logo-ve-landscape-v2.svg" alt="Vegans Explore">
      </div>
      <h1>Set a new password</h1>
      <p class="login-sub" id="rp-sub">Choose a new password for your Passport.</p>
      <div id="rp-error" class="login-error" role="alert"></div>
      <div id="rp-success" class="login-success" role="status"></div>
      <form id="rp-form" novalidate>
        <div class="login-field">
          <label for="rp-password">New Password</label>
          <input type="password" id="rp-password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        </div>
        <p class="login-hint">Must be at least 8 characters.</p>
        <div class="login-field">
          <label for="rp-password-confirm">Confirm New Password</label>
          <input type="password" id="rp-password-confirm" name="password_confirm" autocomplete="new-password" placeholder="Re-enter your new password" required>
        </div>
        <button type="submit" class="login-submit" id="rp-submit">Reset Password</button>
      </form>
      <p class="login-join"><a href="/login">Back to Sign In</a></p>
    </div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    var form = document.getElementById('rp-form');
    var submitBtn = document.getElementById('rp-submit');
    var errorBox = document.getElementById('rp-error');
    var successBox = document.getElementById('rp-success');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('visible'); successBox.classList.remove('visible'); }
    function showSuccess(msg) { successBox.textContent = msg; successBox.classList.add('visible'); errorBox.classList.remove('visible'); }
    function setLoading(on) { submitBtn.disabled = on; submitBtn.textContent = on ? 'Resetting...' : 'Reset Password'; }

    if (!token) {
      document.getElementById('rp-sub').textContent = '';
      form.style.display = 'none';
      showError('This reset link is missing its token. Please request a new one from the Forgot Password page.');
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorBox.classList.remove('visible');
      var pw = document.getElementById('rp-password').value;
      var pwConfirm = document.getElementById('rp-password-confirm').value;
      if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (pw !== pwConfirm) { showError('Passwords do not match.'); return; }
      setLoading(true);
      VEAuth.resetPassword(token, pw)
        .then(function(d) {
          setLoading(false);
          if (d.error) { showError(d.error); return; }
          form.style.display = 'none';
          showSuccess((d.message || 'Password updated.') + ' Redirecting you to sign in...');
          setTimeout(function() { window.location.href = '/login'; }, 2200);
        })
        .catch(function() { setLoading(false); showError('Something went wrong. Please try again.'); });
    });
  </script>
<script src="/public/footer.js"></script>
</body>
