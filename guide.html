<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Your Guide is for members, inside the dashboard window (Sean, 2026-10-04: "it opened up outside
    // of the frame"). Opened on its own by someone signed in, the page moves into /dashboard/guide.
    // Signed out, it shows a sign-in gate. Depot previews (?preview=) stay where they are.
    (function () {
      var alone = true; try { alone = window.self === window.top; } catch (e) { alone = false; }
      var signedIn = false; try { signedIn = !!localStorage.getItem('ve_token'); } catch (e) {}
      var preview = /[?&]preview=/.test(location.search);
      if (alone && signedIn && !preview) location.replace('/dashboard/guide' + location.search);
    })();
  </script>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Guide — Vegans Explore</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Your Guide (rebuilt 2026-10-04, Sean). For registered members only. Setting it up is a dashboard
       action item: 1. meet your Guide (Passport members choose one; everyone else has Liz), 2. the
       Guide gets to know you (the Mission Survey, when you have not done it), 3. how to use your Guide.
       After that, the dock's Guide icon opens the conversation. ve-guide (edge function) holds the
       chosen Guide and whether setup is done; the survey is /public/ve-mission-survey.js. */
    :root{
      --ink:#1A1A1A; --ink-muted:#555555; --ink-faint:#8a8a85;
      --accent:#F69820; --accent-dark:#7d4a00;
      --primary:#3A9B3E; --primary-dark:#1a5c3a; --primary-light:#e8f5ee;
      --line:#e2e2de; --surface:#ffffff; --bg:#faf9f5;
    }
    *{box-sizing:border-box;}
    body{margin:0;color:var(--ink);font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(rgba(10,20,14,.62),rgba(10,20,14,.62)),url('/communities/south-florida/banner.jpg') center/cover fixed no-repeat #0d1a12;}
    .page-frame{display:flex;flex-direction:column;min-height:100vh;}
    /* Full width (Sean, 2026-10-04: "we don't do fixed width"). */
    .guide-frame{flex:1 0 auto;width:100%;max-width:none;margin:36px 0 40px;padding:0 40px;}
    .guide-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px -16px rgba(0,0,0,.10);overflow-x:hidden;}
    .guide-wrap{padding:28px 28px 32px;min-height:60vh;}
    /* Inside the dashboard window: no backdrop, no card around the card. */
    .ve-embedded body{background:#fff;}
    .ve-embedded .guide-frame{margin:0;padding:0;}
    .ve-embedded .guide-panel{border:0;box-shadow:none;border-radius:0;}
    .ve-embedded .guide-wrap{padding:8px 4px 24px;min-height:0;}
    @media (max-width:700px){.guide-frame{padding:0 16px;margin:20px 0 28px;}.guide-wrap{padding:22px 18px 26px;}}

    .g-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-dark);background:var(--primary-light);display:inline-block;padding:5px 10px;border-radius:6px;margin-bottom:12px;}
    h1.g-title{font-size:24px;font-weight:900;margin:0 0 6px;line-height:1.2;}
    .g-sub{font-size:14px;color:var(--ink-muted);line-height:1.6;margin:0 0 16px;max-width:860px;}
    .steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none;}
    .steps li{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink-faint);}
    .steps li.on{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-light);}
    .steps li.done{border-color:var(--primary);color:#fff;background:var(--primary);}

    /* Guide picker */
    .guide-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;margin-top:6px;}
    .guide-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:border-color .15s;}
    .guide-row:hover{border-color:var(--primary);}
    .guide-row[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-light);}
    .guide-row img{width:56px;height:56px;border-radius:14px;object-fit:cover;object-position:top center;flex:0 0 auto;background:var(--primary-light);}
    .g-copy{flex:1;min-width:0;}
    .g-name{font-size:15px;font-weight:800;margin-bottom:2px;}
    .g-path{font-size:10px;color:var(--accent-dark);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
    .g-bio{font-size:12.5px;color:var(--ink-muted);line-height:1.45;}

    /* The Guide speaking */
    .chat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;}
    .chat-hdr{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;}
    .chat-hdr img{width:38px;height:38px;border-radius:10px;object-fit:cover;object-position:top center;}
    .chat-hdr .nm{font-size:14px;font-weight:800;}
    .chat-hdr .role{font-size:11px;color:var(--ink-faint);font-weight:700;}
    .chat-hdr .hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
    .chat-thread{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:52vh;overflow-y:auto;}
    .ve-embedded .chat-thread{max-height:none;}
    .msg{max-width:84%;font-size:14px;line-height:1.55;padding:10px 14px;border-radius:14px;}
    .msg.guide{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px;}
    .msg.user{align-self:flex-end;background:var(--primary-light);color:var(--primary-dark);border-bottom-right-radius:4px;font-weight:600;}
    .msg.guide a{color:var(--primary-dark);font-weight:800;}
    .says{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;}
    .says img{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:top center;flex:0 0 auto;}
    .says .msg{max-width:none;}
    .typing{align-self:flex-start;font-size:12px;color:var(--ink-faint);padding:4px;}
    .input-row{margin-top:14px;display:flex;gap:8px;}
    .input-pill{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-size:14px;font-family:inherit;}
    .input-pill:focus{outline:none;border-color:var(--primary);}
    .send-btn,.mic-btn{border-radius:50%;width:42px;height:42px;font-size:16px;cursor:pointer;flex:0 0 auto;}
    .send-btn{border:none;background:var(--primary);color:#fff;}
    .mic-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-muted);}
    .mic-btn.recording{border-color:#d33;background:#fdecec;color:#d33;}

    /* How to use your Guide: four ideas, each one a question you can send */
    .uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:4px 0 18px;}
    /* Sean, 2026-10-05: the Guide in a portrait on the right, the ideas in two columns on the left
       (restaurants and things to do on top, can't find something and anything Vegan under them). */
    .uses-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:32px;align-items:start;}
    .uses-guide{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
    .uses-guide img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top center;}
    .uses-guide-who{padding:14px 16px 16px;}
    .uses-guide-who b{display:block;font-size:15px;font-weight:900;margin-bottom:8px;}
    .uses-guide-who p{margin:0;font-size:14px;line-height:1.55;color:var(--ink);}
    @media (max-width:860px){
      .uses-split{grid-template-columns:minmax(0,1fr);gap:16px;}
      .uses-guide{order:-1;display:flex;gap:12px;align-items:flex-start;padding:12px;}
      .uses-guide img{flex:0 0 auto;width:56px;height:56px;border-radius:10px;}
      .uses-guide-who{padding:0;}
    }
    @media (max-width:560px){ .uses{grid-template-columns:minmax(0,1fr);} }
    .use{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px;}
    .use b{font-size:14.5px;font-weight:900;}
    .use p{margin:0;font-size:13px;color:var(--ink-muted);line-height:1.5;}
    .use button{margin-top:auto;align-self:flex-start;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px;}
    .chip-btn{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--primary);color:var(--primary-dark);border-radius:20px;padding:8px 14px;background:var(--primary-light);cursor:pointer;text-align:left;}
    .chip-btn:hover{background:var(--primary);color:#fff;}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:10px;padding:13px 22px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.04em;cursor:pointer;text-decoration:none;}
    .btn.primary{background:var(--primary);color:#fff;}
    .btn.primary:hover{background:var(--primary-dark);}
    .btn.accent{background:var(--accent);color:#3a2400;}
    .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
    .btn.small{padding:8px 14px;font-size:12px;}
    .row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;}
    .note{font-size:12.5px;color:var(--ink-faint);line-height:1.5;margin-top:12px;}
    .link-btn{background:none;border:none;font:inherit;font-size:12.5px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;padding:0;}
    .done-card{border:1.5px solid var(--primary);background:var(--primary-light);border-radius:14px;padding:16px;font-size:14px;color:var(--primary-dark);font-weight:700;margin-bottom:16px;}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
    /* Getting to know you: the Community Manager application look. Full width, but the width goes to
       the Guide beside the question, never to stretched fields. */
    .gk-stage{position:relative;border-radius:16px;overflow:hidden;background:#0d130e center/cover no-repeat;}
    .gk-stage::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.93) 0%,rgba(0,0,0,.86) 50%,rgba(0,0,0,.55) 100%);}
    .gk-split{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:center;padding:44px 48px;min-height:520px;}
    .gk-guide{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);border-radius:14px;overflow:hidden;color:#fff;text-align:center;max-width:420px;justify-self:center;width:100%;}
    /* The mid shot fills the card edge to edge, the words under it (Sean, 2026-10-05: the full body
       "looks a little slapped on"; a mid shot filling the whole thing, almost a headshot). */
    .gk-guide img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top center;background:#fff;}
    .gk-who{padding:16px 20px 20px;}
    .gk-name{font-size:16px;font-weight:900;}
    .gk-meta{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);margin-top:4px;}
    .gk-line{background:#fff;color:#1a1a1a;border-radius:14px;border-top-left-radius:4px;padding:12px 16px;font-size:14.5px;line-height:1.5;margin-top:14px;text-align:left;}
    @media (max-width:860px){
      .gk-split{grid-template-columns:minmax(0,1fr);gap:20px;padding:22px 18px 26px;min-height:0;}
      .gk-guide{order:-1;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;max-width:none;}
      .gk-guide img{flex:0 0 auto;width:56px;height:56px;border-radius:10px;}
      .gk-who{padding:0;}
      .gk-name{font-size:14px;}
      .gk-line{margin-top:8px;font-size:13.5px;}
    }
  </style>
</head>
<body>
  <div class="page-frame">

  <script src="/public/nav.js"></script>

  <div class="guide-frame">
    <div class="guide-panel">
      <div class="guide-wrap" id="guideApp" aria-live="polite"></div>
    </div>
  </div>

  <script src="/public/ve-auth.js"></script>
  <script src="/public/ve-preview.js"></script>
  <script src="/public/ve-hubs.js"></script>
  <script src="/public/ve-mission-survey.js"></script>
  <script>
  (function(){
    var GUIDES = [
      { id: 'liz',   name: 'Liz',   title: 'Explorer',       image: 'https://d8j0ntlcm91z4.cloudfront.net/user_3CDGnUNmLloVUBJsrfOxR8cZFdv/hf_20261005_015752_69e54fd1-337e-4e81-8708-8029766146a8_min.webp',   desc: 'Still figuring it out. No rush. Explore what the Vegan world has to offer.' },
      { id: 'maya',  name: 'Maya',  title: 'Pre-Vegan',      image: '/public/guides/maya.png',  desc: 'Vegan-curious. Real answers, real support, and a clear path to make the shift.' },
      { id: 'theo',  name: 'Theo',  title: 'Seasoned Vegan', image: '/public/guides/theo.png',  desc: 'Already living it. Deepen your impact, mentor others, and connect with the global movement.' },
      { id: 'nori',  name: 'Nori',  title: 'Entrepreneur',   image: '/public/guides/nori.png',  desc: 'Building a Vegan business. Get listed, grow your audience, and connect with customers.' },
      { id: 'dani',  name: 'Dani',  title: 'Nonprofit',      image: '/public/guides/dani.png',  desc: 'Running a Vegan org. Build your community on the platform and grow your base.' },
      { id: 'river', name: 'River', title: 'Creator',        image: '/public/guides/river.jpg', desc: 'Creating content in the Vegan space. Grow your audience and earn through the ecosystem.' }
    ];
    var DEFAULT_GUIDE = 'liz';
    var SB = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/';
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Ymh3ZnhwbmNyc2ZodHRpbW5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjAxMzksImV4cCI6MjA5MDIzNjEzOX0.9mxjK0bn5WATCbNLWrHPakD6yHUDtHFHrOaklPnWkOA';
    var app = document.getElementById('guideApp');
    var EMBEDDED = document.documentElement.classList.contains('ve-embedded');

    // Preview mode (Depot > Preview journeys > Your Guide): ?preview=<step> opens that step with a
    // sample member (Alex, South Florida). Nothing is saved or sent and the visitor's own Guide is left alone.
    var PREVIEW = '';
    try { PREVIEW = new URLSearchParams(location.search).get('preview') || ''; } catch(e){}
    var PV_MEMBER = { guide_slug: 'liz', setup_at: null, can_choose: true, survey: { completed: false, eligible: true }, name: 'Alex Rivera', home_community: 'south-florida' };
    var PREVIEWS = {
      'gate':     { status: null },
      'meet':     { status: PV_MEMBER, view: 'meet' },
      'meet-liz': { status: Object.assign({}, PV_MEMBER, { can_choose: false }), view: 'meet' },
      'survey':   { status: PV_MEMBER, view: 'survey' },
      'uses':     { status: Object.assign({}, PV_MEMBER, { survey: { completed: true, eligible: true } }), view: 'uses' },
      'talk':     { status: Object.assign({}, PV_MEMBER, { setup_at: '2026-10-04', survey: { completed: true, eligible: true } }), view: 'talk' }
    };
    if (PREVIEW && !PREVIEWS.hasOwnProperty(PREVIEW)) PREVIEW = 'meet';

    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function token(){ try { return localStorage.getItem('ve_token'); } catch(e){ return null; } }
    // Square mid shot for small and square spots, 9:16 full body only for tall ones (Sean, 2026-10-05).
    // The pictures live in one map, /public/footer.js (VEGuideArt); g.image is the fallback.
    function art(g, shape){ return window.VEGuideArt ? window.VEGuideArt(g.id, shape) : g.image; }
    function guideBySlug(slug){ for (var i=0;i<GUIDES.length;i++) if (GUIDES[i].id === slug) return GUIDES[i]; return GUIDES[0]; }
    function firstName(){ return status && status.name ? String(status.name).split(' ')[0] : ''; }
    function cityName(){
      var slug = status && status.home_community, hubs = window.VE_HUBS || [];
      for (var i=0;i<hubs.length;i++) if (hubs[i].slug === slug) return hubs[i].name;
      return 'your city';
    }
    // Tell the dashboard around this page (the dock icon wears the chosen Guide; the dashboard checks
    // the action item again). The dock reads the Guide from ve_guide_flow_state, /public/footer.js.
    function tellParent(type, extra){
      if (!EMBEDDED) return;
      try { window.parent.postMessage(Object.assign({ type: type }, extra || {}), location.origin); } catch(e){}
    }
    function rememberGuide(slug){
      if (PREVIEW) return;
      try { localStorage.setItem('ve_guide_flow_state', JSON.stringify({ guide_slug: slug })); } catch(e){}
      tellParent('ve-guide-changed', { slug: slug });
    }

    function guideCall(body){
      if (PREVIEW) return Promise.resolve(Object.assign({}, status, body.guide_slug ? { guide_slug: body.guide_slug } : {}, body.finished ? { setup_at: 'preview' } : {}));
      return fetch(SB + 've-guide', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() }, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw d; return d; }); });
    }
    function authCall(action, body){
      if (PREVIEW && action === 'guide_chat_send') return Promise.resolve({ reply: 'This is a preview, so I am not really answering. On the live page your Guide replies here.', memory: { used: 18, max: 20 }, balance: 8 });
      if (PREVIEW && action === 'guide_ask_person') return Promise.resolve({ ok: true, to_cm: false });
      if (PREVIEW && action === 'guide_ask') return Promise.resolve(/join|\$11|member/i.test(body.message)
        ? { answer: { answer: 'This is a preview of a quick answer. On the live page, saved answers come back here free.', link_url: '/welcome', link_label: 'Join Vegans Explore' }, related: [{ question: 'How do points work?' }] }
        : { answer: null, related: [{ question: 'How do I join Vegans Explore?' }] });
      if (PREVIEW) return Promise.resolve({});
      return fetch(SB + 've-auth?action=' + action, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON }, body: JSON.stringify(body || {}) })
        .then(function(r){ return r.json().then(function(d){ return Object.assign({ _status: r.status }, d); }); });
    }

    var status = null, view = '';

    // ---- Which screen ----------------------------------------------------------------------------
    // Not set up yet: meet -> survey (only if not done and they can take it) -> uses -> talk.
    function nextAfter(v){
      if (v === 'meet') return (status.survey.eligible && !status.survey.completed) ? 'survey' : 'uses';
      if (v === 'survey') return 'uses';
      return 'talk';
    }
    function show(v){ view = v; app.innerHTML = ''; ({ gate: renderGate, meet: renderMeet, survey: renderSurvey, uses: renderUses, talk: renderTalk, change: renderChange })[v](); try { window.scrollTo(0, 0); } catch(e){} }

    function stepper(on){
      var list = [['meet','Meet your Guide']];
      // The survey step shows when they still owe it, or took it during this setup (then it shows as done).
      if (status.survey.eligible && (!status.survey.completed || status.survey.here)) list.push(['survey','Tell your Guide about you']);
      list.push(['uses','How your Guide helps']);
      var idx = list.map(function(x){ return x[0]; }).indexOf(on);
      return '<ol class="steps" aria-label="Setting up your Guide">' + list.map(function(x, i){
        return '<li class="' + (i < idx ? 'done' : i === idx ? 'on' : '') + '"' + (i === idx ? ' aria-current="step"' : '') + '>' + (i + 1) + '. ' + x[1] + '</li>';
      }).join('') + '</ol>';
    }
    function says(g, html){
      return '<div class="says"><img src="' + art(g, 'square') + '" alt=""><div class="msg guide">' + html + '</div></div>';
    }

    // ---- Signed out -------------------------------------------------------------------------------
    function renderGate(){
      app.innerHTML = '<div class="g-eyebrow">Members</div><h1 class="g-title">Your Guide is for members.</h1>' +
        '<p class="g-sub">Every member gets a Guide: someone to ask where to eat, what to do in your city, and where to find what you need. Sign in to meet yours.</p>' +
        '<div class="row-btns"><button type="button" class="btn primary" id="gateIn">Sign in</button><a class="btn ghost" href="/welcome">Join Vegans Explore</a></div>';
      document.getElementById('gateIn').onclick = function(){
        if (PREVIEW) return;
        if (window.VEAuth) VEAuth.showAuthModal('Sign in to meet your Guide.', function(){ location.replace('/dashboard/guide'); });
      };
    }

    // ---- 1. Meet your Guide -----------------------------------------------------------------------
    function renderMeet(){
      var g = guideBySlug(status.guide_slug);
      if (!status.can_choose) {
        app.innerHTML = stepper('meet') + '<div class="g-eyebrow">Your Guide</div><h1 class="g-title">Meet ' + g.name + ', your Guide.</h1>' +
          says(g, 'Hi' + (firstName() ? ' ' + esc(firstName()) : '') + ', I am ' + g.name + '. I am here whenever you need something Vegan: a place to eat, something to do, or someone to ask. ' + (nextAfter('meet') === 'survey' ? 'Let me get to know you first.' : 'Let me show you how I can help.')) +
          '<div class="row-btns"><button type="button" class="btn primary" id="meetNext">Let&rsquo;s go</button></div>' +
          '<p class="note">Passport members can choose a different Guide. <button type="button" class="link-btn" id="meetPass">Get Passport</button></p>';
        document.getElementById('meetNext').onclick = function(){ saveGuide(g.id, nextAfter('meet')); };
        document.getElementById('meetPass').onclick = startPassport;
        return;
      }
      app.innerHTML = stepper('meet') + '<div class="g-eyebrow">Passport &middot; Choose your Guide</div><h1 class="g-title">Who feels like the right fit right now?</h1>' +
        '<p class="g-sub">Pick the Guide that matches where you are. You can change your Guide any time.</p><div class="guide-list" id="glist"></div>';
      pickerInto(document.getElementById('glist'), function(id){ saveGuide(id, nextAfter('meet')); });
    }
    function pickerInto(list, onPick){
      GUIDES.forEach(function(g){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'guide-row';
        b.setAttribute('aria-pressed', g.id === status.guide_slug ? 'true' : 'false');
        b.innerHTML = '<img src="' + art(g, 'square') + '" alt=""><div class="g-copy"><div class="g-name">' + g.name + '</div><div class="g-path">' + g.title + '</div><div class="g-bio">' + g.desc + '</div></div>';
        b.onclick = function(){ onPick(g.id); };
        list.appendChild(b);
      });
    }
    function saveGuide(slug, then){
      guideCall({ action: 'setup', guide_slug: slug }).then(function(s){
        status = Object.assign(status, s); rememberGuide(status.guide_slug); show(then);
      }).catch(function(e){
        var err = document.createElement('p'); err.className = 'note'; err.style.color = '#b91c1c';
        err.textContent = e && e.error === 'passport_required' ? 'Choosing a Guide comes with Passport.' : 'Could not save that. Please try again.';
        app.appendChild(err);
      });
    }

    // ---- 2. Tell your Guide about you (the Mission Survey) ----------------------------------------
    var SURVEY_LINES = [
      'First, the basics, so I know where you are and what you do.',
      'Now your Vegan journey. There are no wrong answers.',
      'Tell me about where you live. This shapes what we build in your city.',
      'How can I and Vegans Explore be most useful to you?',
      'Last bit, in your own words.'
    ];
    // One question at a time on a dark stage, the Guide beside it (Sean, 2026-10-05: five stacked
    // full-width fields read "blown out"). The Community Manager application's layout: the question
    // and its answer on the left, the Guide on the right with a line for each part, over the member's
    // city art. On phones the Guide becomes a strip above the question.
    var CITY_ART = { philadelphia: 'banner.png', dmv: 'banner.png' };
    function cityArt(){
      var slug = status && status.home_community, hubs = window.VE_HUBS || [];
      var known = hubs.some(function(h){ return h.slug === slug; });
      slug = known ? slug : 'south-florida';
      return '/communities/' + slug + '/' + (CITY_ART[slug] || 'banner.jpg');
    }
    function renderSurvey(){
      var g = guideBySlug(status.guide_slug);
      status.survey.here = true;
      app.innerHTML = stepper('survey') +
        '<div class="gk-stage" style="background-image:url(\'' + cityArt() + '\')"><div class="gk-split">' +
          '<div class="gk-q" id="survey"></div>' +
          '<aside class="gk-guide" aria-label="' + g.name + ', your Guide">' +
            // The square mid shot, filling the card on desktop and a small square in the phone strip.
            '<img src="' + art(g, 'square') + '" alt="">' +
            '<div class="gk-who"><div class="gk-name">' + g.name + ' is getting to know you</div>' +
            '<div class="gk-meta">About 3 minutes &middot; earns 250 points</div>' +
            '<div class="gk-line" id="gkLine"></div></div>' +
          '</aside>' +
        '</div></div>';
      var line = document.getElementById('gkLine'), lastStep = -1;
      VEMissionSurvey.mount(document.getElementById('survey'), {
        theme: 'dark',
        preview: !!PREVIEW,
        onQuestion: function(info){
          if (info.stepIndex === lastStep) return;
          lastStep = info.stepIndex;
          var hi = info.index === 0 && firstName() ? 'Hi ' + firstName() + '! ' : '';
          line.textContent = hi + (SURVEY_LINES[info.stepIndex] || '');
        },
        onDone: function(){
          status.survey.completed = true;
          tellParent('ve-guide-progress');
          show('uses');
        }
      });
    }

    // ---- 3. How your Guide helps ------------------------------------------------------------------
    function ideas(){
      var city = cityName();
      return [
        { title: 'Looking for a restaurant?', text: 'Tell me what you are in the mood for and where, and I will point you to Vegan spots.', ask: 'Where can I get Vegan brunch in ' + city + ' this weekend?' },
        { title: 'Things to do in your city', text: 'Events, meetups and places worth a visit, for tonight or for the weekend.', ask: 'What Vegan events are coming up in ' + city + '?' },
        { title: 'Can’t find something?', text: 'A product, a service, a group: if you don’t know where to find it, ask me.', ask: 'Where can I find Vegan catering for a birthday party?' },
        { title: 'Anything about Vegan life', text: 'Recipes, swaps, talking to family, staying on track. No question is too small.', ask: 'What are easy Vegan swaps for my favorite comfort foods?' }
      ];
    }
    function renderUses(){
      var g = guideBySlug(status.guide_slug);
      app.innerHTML = stepper('uses') +
        '<div class="g-eyebrow">How your Guide helps</div><h1 class="g-title">Use ' + g.name + ' whenever you need something.</h1>' +
        '<div class="uses-split"><div>' +
          '<div class="uses" id="uses"></div>' +
          '<div class="row-btns"><button type="button" class="btn primary" id="usesDone">I&rsquo;m all set</button></div>' +
          '<p class="note">Quick answers are free. Asking your Guide directly uses 4 points a message: every member gets 60 points a month for their Guide, and Passport members get 300.</p>' +
        '</div><aside class="uses-guide" aria-label="' + g.name + ', your Guide"><img src="' + art(g, 'square') + '" alt="">' +
          '<div class="uses-guide-who"><b>' + g.name + '</b><p>' + (firstName() ? 'Thanks, ' + esc(firstName()) + '. ' : '') +
          'Here is how I can help. Try one now, or just ask me anything. I live in the Guide button at the bottom of your dashboard.</p></div></aside></div>';
      var host = document.getElementById('uses');
      ideas().forEach(function(it){
        var d = document.createElement('div'); d.className = 'use';
        d.innerHTML = '<b>' + esc(it.title) + '</b><p>' + esc(it.text) + '</p>';
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip-btn'; b.textContent = '“' + it.ask + '”';
        b.onclick = function(){ finishSetup(it.ask); };
        d.appendChild(b); host.appendChild(d);
      });
      document.getElementById('usesDone').onclick = function(){ finishSetup(''); };
    }
    function finishSetup(firstQuestion){
      guideCall({ action: 'setup', finished: true }).then(function(s){
        status = Object.assign(status, s);
        tellParent('ve-guide-progress');
        show('talk');
        if (firstQuestion) sendQuestion(firstQuestion);
      }).catch(function(){ show('talk'); if (firstQuestion) sendQuestion(firstQuestion); });
    }

    // ---- Talk to your Guide -----------------------------------------------------------------------
    var thread = null;
    function renderTalk(){
      var g = guideBySlug(status.guide_slug);
      app.innerHTML = '<div class="chat-card">' +
        '<div class="chat-hdr"><img src="' + art(g, 'square') + '" alt=""><div><div class="nm">' + g.name + '</div><div class="role">Your Guide &middot; ' + g.title + '</div></div>' +
          '<div class="hdr-actions"><button type="button" class="btn ghost small" id="newConv">New conversation</button>' + (status.can_choose ? '<button type="button" class="btn ghost small" id="changeGuide">Change Guide</button>' : '') + '</div></div>' +
        '<div class="chat-thread" id="thread"></div>' +
        '<div class="chips" id="chips" style="margin-top:12px"></div>' +
        '<div class="input-row"><input class="input-pill" id="ask" placeholder="Ask ' + g.name + ' anything" aria-label="Your question"><button class="mic-btn" id="mic" title="Say it out loud" aria-label="Record your question">&#127908;</button><button class="send-btn" id="send" aria-label="Send">&rarr;</button></div>' +
        '<p class="note">' + (EMBEDDED ? 'Need a person instead? <button type="button" class="link-btn" id="human">Send us a message</button>. ' : '') + 'Quick answers and Ask a person are free. Asking ' + g.name + ' directly uses 4 points from your monthly Guide allowance.</p>' +
        '</div>';
      thread = document.getElementById('thread');
      addMsg('guide', 'Hi' + (firstName() ? ' ' + firstName() : '') + ', what can I help you find today?');
      var chips = document.getElementById('chips');
      function fillChips(list){
        if (!chips.isConnected) return;
        chips.innerHTML = '';
        list.forEach(function(q){
          var b = document.createElement('button'); b.type = 'button'; b.className = 'chip-btn'; b.textContent = q;
          b.onclick = function(){ sendQuestion(q); };
          chips.appendChild(b);
        });
      }
      // The most useful saved questions (guide_kb_answers, featured), the setup ideas until they load.
      fillChips(ideas().map(function(it){ return it.ask; }));
      authCall('guide_topics', {}).then(function(d){
        if (d && d.topics && d.topics.length) fillChips(d.topics.map(function(t){ return t.question; }));
      }).catch(function(){});
      var ch = document.getElementById('changeGuide'); if (ch) ch.onclick = function(){ show('change'); };
      document.getElementById('newConv').onclick = newConversation;
      var hu = document.getElementById('human'); if (hu) hu.onclick = function(){ tellParent('ve-open-help'); };
      var input = document.getElementById('ask');
      document.getElementById('send').onclick = function(){ var v = input.value.trim(); if (v) { input.value = ''; sendQuestion(v); } };
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') document.getElementById('send').click(); });
      wireMic(document.getElementById('mic'), function(text){ sendQuestion(text); });
    }
    function addMsg(role, text){
      var m = document.createElement('div'); m.className = 'msg ' + role; m.textContent = text;
      thread.appendChild(m); thread.scrollTop = thread.scrollHeight; return m;
    }
    // Quick answers first (Sean, 2026-10-06): a question goes to the Guide knowledge base, which is
    // free (no AI, no points). With no saved answer, the member chooses whether to ask their Guide
    // (AI, 4 points). Related questions and a person are always offered, so nobody hits a dead end,
    // even with no points left.
    function typingNow(){
      var t = document.createElement('div'); t.className = 'typing'; t.textContent = guideBySlug(status.guide_slug).name + ' is typing...';
      thread.appendChild(t); thread.scrollTop = thread.scrollHeight; return t;
    }
    function clearOffers(){ Array.prototype.forEach.call(thread.querySelectorAll('.offer'), function(o){ o.remove(); }); }
    function sendQuestion(text){
      if (!thread) return;
      var chips = document.getElementById('chips'); if (chips) chips.remove();
      clearOffers();
      addMsg('user', text);
      var typing = typingNow();
      authCall('guide_ask', { agent_slug: status.guide_slug, message: text, token: token() }).then(function(d){
        typing.remove();
        if (d.answer) { addAnswer(d.answer); return offerNext(text, d.related, true); }
        addMsg('guide', 'I don’t have a saved answer for that yet, so I’ve noted your question for the team to add.');
        offerNext(text, d.related, false);
      }).catch(function(){ typing.remove(); addMsg('guide', 'I couldn’t reach the server. Check your connection and try again.'); });
    }
    function addAnswer(a){
      var m = addMsg('guide', a.answer);
      if (a.link_url) {
        var l = document.createElement('a'); l.href = a.link_url; l.textContent = a.link_label || a.link_url;
        if (EMBEDDED) l.target = '_top';
        m.appendChild(document.createElement('br')); m.appendChild(l);
      }
    }
    function offerNext(text, related, answered){
      var g = guideBySlug(status.guide_slug);
      var box = document.createElement('div'); box.className = 'chips offer';
      (related || []).forEach(function(r){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'chip-btn'; b.textContent = r.question;
        b.onclick = function(){ sendQuestion(r.question); };
        box.appendChild(b);
      });
      var ask = document.createElement('button'); ask.type = 'button'; ask.className = 'btn ghost small';
      ask.textContent = (answered ? 'Not what you needed? Ask ' : 'Ask ') + g.name + ' directly (4 points)';
      ask.onclick = function(){ askGuide(text); };
      box.appendChild(ask);
      box.appendChild(personBtn(text));
      thread.appendChild(box); thread.scrollTop = thread.scrollHeight;
    }
    // Ask a person (Sean, 2026-10-06): one tap sends the question to the team (Sean and the city's
    // Community Manager, never named to the member), who reply by email (ve-auth guide_ask_person).
    function personBtn(text){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost small'; b.textContent = 'Ask a person';
      b.onclick = function(){ askPerson(text); };
      return b;
    }
    function askPerson(text){
      clearOffers();
      authCall('guide_ask_person', { agent_slug: status.guide_slug, message: text, token: token() }).then(function(d){
        if (d.ok) return addMsg('guide', 'Sent to the team. You’ll get an answer by email as soon as we can.');
        if (d._status === 429) return addMsg('guide', 'You’ve sent the team five questions today, so this one has to wait until tomorrow. Quick answers are still free here.');
        addMsg('guide', 'That didn’t send. Try again in a minute.');
      }).catch(function(){ addMsg('guide', 'I couldn’t reach the server. Check your connection and try again.'); });
    }
    // A conversation's memory (Sean, 2026-10-06: warn them near the limit and prompt a new one). The
    // Guide remembers the latest 20 messages of a conversation; New conversation starts a fresh one.
    function convKey(){ return 've_guide_conv_' + status.guide_slug; }
    function conversationId(){ try { return localStorage.getItem(convKey()) || ''; } catch(e){ return ''; } }
    function newConversation(){
      var id = Math.random().toString(36).slice(2, 12).replace(/[^a-z0-9]/g, '') || String(Date.now());
      try { localStorage.setItem(convKey(), id); } catch(e){}
      show('talk');
    }
    function memoryNote(m){
      if (!m || !m.max || m.used < m.max - 4) return;
      var box = document.createElement('div'); box.className = 'chips offer';
      var p = document.createElement('p'); p.className = 'note'; p.style.margin = '0 0 6px'; p.style.width = '100%';
      p.textContent = m.used >= m.max
        ? guideBySlug(status.guide_slug).name + ' has started forgetting the beginning of this conversation. Start a new one to keep answers sharp.'
        : 'This conversation is getting long. ' + guideBySlug(status.guide_slug).name + ' remembers the last ' + (m.max / 2) + ' questions, so a new conversation soon keeps answers sharp.';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost small'; b.textContent = 'Start a new conversation';
      b.onclick = newConversation;
      box.appendChild(p); box.appendChild(b);
      thread.appendChild(box); thread.scrollTop = thread.scrollHeight;
    }
    function pointsNote(balance){
      if (balance == null || balance >= 12) return;
      var left = Math.floor(balance / 4);
      var p = document.createElement('p'); p.className = 'note offer'; p.style.margin = '0';
      p.textContent = left > 0 ? 'Heads up: you have ' + left + ' Guide message' + (left === 1 ? '' : 's') + ' left this month. Quick answers and Ask a person stay free.'
                               : 'That was your last Guide message this month. Quick answers and Ask a person stay free.';
      thread.appendChild(p); thread.scrollTop = thread.scrollHeight;
    }
    function askGuide(text){
      clearOffers();
      var typing = typingNow();
      authCall('guide_chat_send', { agent_slug: status.guide_slug, message: text, token: token(), conversation: conversationId() }).then(function(d){
        typing.remove();
        if (d.reply) { addMsg('guide', d.reply); memoryNote(d.memory); return pointsNote(d.balance); }
        if (d._status === 402) {
          addMsg('guide', 'You have used this month’s Guide messages. Your allowance refreshes next month' + (status.can_choose ? '.' : ', and Passport members get five times as many.') + ' Quick answers stay free, and a person can still answer this one.');
          var box = document.createElement('div'); box.className = 'chips offer'; box.appendChild(personBtn(text)); thread.appendChild(box); return;
        }
        addMsg('guide', 'I can’t answer right now. Try again in a few minutes' + (EMBEDDED ? ', or tap Send us a message and a person will get back to you.' : '.'));
      }).catch(function(){ typing.remove(); addMsg('guide', 'I couldn’t reach the server. Check your connection and try again.'); });
    }
    function wireMic(btn, onText){
      var rec = null, chunks = [], on = false;
      btn.onclick = function(){
        if (on) { if (rec) rec.stop(); on = false; btn.classList.remove('recording'); btn.innerHTML = '&#127908;'; return; }
        if (PREVIEW || !navigator.mediaDevices || typeof MediaRecorder === 'undefined') return addMsg('guide', PREVIEW ? 'Recording is off in preview.' : 'Voice recording is not supported in this browser. Type it instead.');
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
          chunks = []; rec = new MediaRecorder(stream);
          rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
          rec.onstop = function(){
            stream.getTracks().forEach(function(t){ t.stop(); });
            var blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' }), fr = new FileReader();
            fr.onloadend = function(){
              var b64 = String(fr.result || '').split(',')[1] || ''; if (!b64) return;
              authCall('transcribe_audio', { audio_b64: b64, mime: blob.type }).then(function(d){
                var t = (d && d.text || '').trim(); if (t) onText(t); else addMsg('guide', 'I did not catch that. Try again or type it.');
              });
            };
            fr.readAsDataURL(blob);
          };
          rec.start(); on = true; btn.classList.add('recording'); btn.innerHTML = '&#9632;';
        }).catch(function(){ addMsg('guide', 'I could not use your microphone. Check your browser permissions.'); });
      };
    }

    // ---- Change Guide (Passport) ------------------------------------------------------------------
    function renderChange(){
      app.innerHTML = '<div class="g-eyebrow">Passport &middot; Change your Guide</div><h1 class="g-title">Choose your Guide.</h1><div class="guide-list" id="glist"></div>' +
        '<div class="row-btns"><button type="button" class="btn ghost" id="keep">Keep ' + guideBySlug(status.guide_slug).name + '</button></div>';
      pickerInto(document.getElementById('glist'), function(id){ saveGuide(id, 'talk'); });
      document.getElementById('keep').onclick = function(){ show('talk'); };
    }

    function startPassport(){
      if (PREVIEW) return;
      fetch(SB + 've-passport-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
        body: JSON.stringify({ success_url: location.origin + '/dashboard/guide', cancel_url: location.origin + '/dashboard/guide' }) })
        .then(function(r){ return r.json(); }).then(function(d){ if (d.url) (window.top || window).location.href = d.url; });
    }

    // ---- Start ------------------------------------------------------------------------------------
    function start(){
      if (PREVIEW) {
        var p = PREVIEWS[PREVIEW];
        status = p.status ? JSON.parse(JSON.stringify(p.status)) : null;
        return show(status ? p.view : 'gate');
      }
      if (!token()) return show('gate');
      app.innerHTML = '<p class="note">Loading your Guide&hellip;</p>';
      guideCall({ action: 'status' }).then(function(s){
        status = s;
        rememberGuide(status.guide_slug);
        // ?guide=<slug> from the Choose Your Guide tile: a Passport member switching Guides.
        var want = new URLSearchParams(location.search).get('guide');
        if (want && status.can_choose && want !== status.guide_slug && GUIDES.some(function(g){ return g.id === want; })) {
          return saveGuide(want, status.setup_at ? 'talk' : nextAfter('meet'));
        }
        show(status.setup_at ? 'talk' : 'meet');
      }).catch(function(e){
        if (e && e.error === 'not_authenticated') return show('gate');
        app.innerHTML = '<p class="note">Could not load your Guide. Please refresh the page.</p>';
      });
    }
    // footer.js (below) holds the Guide pictures, so start once the page has loaded it.
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  })();
  </script>

  <script src="/public/footer.js"></script>
  </div>
</body>
</html>
