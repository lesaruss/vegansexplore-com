<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - VEGANS EXPLORE</title>
  <meta name="description" content="Reset the password on your VEGANS EXPLORE Passport.">
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Montserrat", sans-serif; background: #fff; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    .login-wrap { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px 80px; }
    .login-card { width: 100%; max-width: 400px; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo img { height: 36px; width: auto; }
    h1 { font-size: 24px; font-weight: 900; color: #1a1a1a; text-align: center; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: #666; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #555; margin-bottom: 5px; }
    .login-field { margin-bottom: 14px; }
    input[type="email"] { display: block; width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 6px; font-family: "Montserrat", sans-serif; font-size: 14px; color: #1a1a1a; background: #fff; transition: border-color 0.15s; -webkit-appearance: none; }
    input:focus { outline: none; border-color: #22C55E; }
    .login-submit { display: block; width: 100%; padding: 14px; background: #22C55E; color: #fff; font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; transition: background 0.15s; margin-top: 6px; }
    .login-submit:hover { background: #16A34A; }
    .login-submit:disabled { background: #9CA3AF; cursor: not-allowed; }
    .login-error { display: none; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; padding: 12px 14px; font-size: 13px; color: #dc2626; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
    .login-error.visible { display: block; }
    .login-success { display: none; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 6px; padding: 14px 16px; font-size: 13px; color: #15803D; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
    .login-success.visible { display: block; }
    .login-join { text-align: center; margin-top: 24px; font-size: 13px; color: #555; }
    .login-join a { color: #22C55E; font-weight: 700; text-decoration: none; }
    @media (max-width: 480px) { .login-wrap { padding: 32px 16px 60px; } h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <script src="/public/nav.js"></script>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="/public/logo-ve-landscape-v1.svg" alt="Vegans Explore">
      </div>
      <h1>Forgot your password?</h1>
      <p class="login-sub">Enter the email on your Passport and we'll send you a link to reset your password.</p>
      <div id="fp-error" class="login-error" role="alert"></div>
      <div id="fp-success" class="login-success" role="status"></div>
      <form id="fp-form" novalidate>
        <div class="login-field">
          <label for="fp-email">Email</label>
          <input type="email" id="fp-email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="login-submit" id="fp-submit">Send Reset Link</button>
      </form>
      <p class="login-join"><a href="/login">Back to Sign In</a></p>
    </div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script>
    var form = document.getElementById('fp-form');
    var submitBtn = document.getElementById('fp-submit');
    var errorBox = document.getElementById('fp-error');
    var successBox = document.getElementById('fp-success');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('visible'); successBox.classList.remove('visible'); }
    function showSuccess(msg) { successBox.textContent = msg; successBox.classList.add('visible'); errorBox.classList.remove('visible'); }
    function setLoading(on) { submitBtn.disabled = on; submitBtn.textContent = on ? 'Sending...' : 'Send Reset Link'; }
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorBox.classList.remove('visible');
      var email = document.getElementById('fp-email').value.trim();
      if (!email || email.indexOf('@') === -1) { showError('Please enter a valid email address.'); return; }
      setLoading(true);
      VEAuth.forgotPassword(email)
        .then(function(d) {
          setLoading(false);
          if (d.error) { showError(d.error); return; }
          form.querySelector('#fp-submit').disabled = true;
          document.getElementById('fp-email').disabled = true;
          showSuccess(d.message || "If an account exists for that email, we've sent a reset link. Check your inbox.");
        })
        .catch(function() { setLoading(false); showError('Something went wrong. Please try again.'); });
    });
  </script>
</body>
</html>
