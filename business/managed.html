      (C.photos ? '<div><span>Photos, up to 8 dishes (one time)</span><b>' + $(A.photos) + '</b></div>' : '') +
      (C.video ? '<div><span>Video, a narrated photo slideshow (one time)</span><b>' + $(A.video) + '</b></div>' : '') +
      '<div class="tot"><span>Due today</span><span>' + $(t.today) + '</span></div>' +
      '<div><span>' + (site() ? 'Then every 3 months' : 'Then each month') + '</span><b>' + $(t.again) + '</b></div></div>';
  }
  function stepsBar(s) {
    return '<div class="steps">' + ['Your plan', 'The agreement', 'Review and pay'].map(function (n, i) { return '<span class="' + (i + 1 === s ? 'on' : i + 1 < s ? 'done' : '') + '">' + (i + 1) + '. ' + n + '</span>'; }).join('') + '</div>';
  }
  function navRow(s, nextLabel) {
    return '<p class="err" id="err" aria-live="polite"></p><div class="nav">' + (s > 1 ? '<button type="button" class="btn ghost" data-back>Back</button>' : '<span></span>') +
      '<small>Step ' + s + ' of 3</small><button type="button" class="btn" data-next>' + nextLabel + '</button></div>';
  }

  function viewPlan() {
    var A = P.amounts;
    var opts = [['site', 'Site', 'Your website on our frame, your brand kit and your Directory page, with Vegans Explore member sign-in on your site. A Community Manager gets you set up and checks in every quarter. No setup fee.', $(A.site) + ' every 3 months'],
      ['managed', 'Managed', 'Everything in Site, and a real person on our team does the rest: Google, a campaign every month and a check-in every month. We set it all up with you live, in one Hot Lab call.', $(A.managed) + ' a month + ' + $(A.managed_setup) + ' setup']];
    var box = function (name, on, title, text, price) { return '<label class="opt' + (on ? ' on' : '') + '"><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '><b>' + title + '</b><p>' + text + '</p><strong>+' + price + '</strong></label>'; };
    return head('Pick how much you want us to do. Either way, your website, your brand and your photos are yours to keep.') + stepsBar(1) +
      '<h2>Your plan</h2><div class="grid">' + opts.map(function (o) {
        return '<label class="opt' + (C.plan === o[0] ? ' on' : '') + '"><input type="radio" name="plan" value="' + o[0] + '"' + (C.plan === o[0] ? ' checked' : '') + '><b>' + o[1] + '</b><p>' + o[2] + '</p><strong>' + o[3] + '</strong></label>';
      }).join('') + '</div>' +
      '<h2>Add photos or a video?</h2><div class="grid">' +
        box('photos', C.photos, 'Photos', 'Up to 8 dishes, shot to one standard. Or upload your own, free.', $(A.photos) + ' one time') +
        box('video', C.video, 'Video', 'A narrated slideshow of your photos, for your site and social.', $(A.video) + ' one time') + '</div>' +
      (site() || P.social_open === false ? '' : '<h2>Add social media?</h2><div class="grid">' + box('social', C.social, 'Social media, two platforms', 'We plan, make and post on two platforms you pick.', $(A.social) + ' a month') + '</div>') +
      '<h2>What you pay</h2>' + summary() + navRow(1, 'Next');
  }
  function viewAgree() {
    return head('Read the agreement before you sign. Here is what matters most.') + stepsBar(2) +
      '<ul class="keys">' + (site() ? '<li><b>Every 3 months</b>, billed at the start of each 3 months. To stop, give notice before the next 3 months start.</li>' :
        '<li><b>12 months</b>, then month to month.</li><li><b>Leaving early</b>: the service ends at the end of the month you paid for.</li><li><b>Pause</b> up to 3 months a year for $99 a month.</li>') +
      '<li><b>You own what we make</b>: photos, your logo and brand kit, your copy. Your domain, Google profile and social accounts stay yours.</li>' +
      '<li><b>When it ends</b>, you get every file and your asset sheet, and 30 days to download anything else.</li></ul>' +
      '<p><a href="/business/agreement" target="_blank" rel="noopener" style="font-weight:800;color:var(--g)">Read the full Managed Marketing Agreement</a></p>' +
      '<label class="f">Your full name<input name="name" autocomplete="name" value="' + esc(C.name) + '"></label>' +
      '<label class="ck"><input type="checkbox" name="agree"' + (C.agree ? ' checked' : '') + '><span>I agree to the Managed Marketing Agreement for ' + esc(P.listing.name) + ', and I am authorized to sign for this business.</span></label>' +
      navRow(2, 'Next');
  }
  function viewPay(note) {
    return head(note || 'Check it over. The next screen is Stripe\'s secure checkout.') + stepsBar(3) + summary() +
      '<div class="box" style="margin-top:14px">Signed by <b>' + esc(C.name) + '</b>. Our team confirms you run ' + esc(P.listing.name) + ' before work starts; if not, we refund you in full.</div>' +
      navRow(3, 'Continue to secure checkout');
  }
  function viewMine(a) {
    var A = P.amounts, adds = (a.addons || []).length ? ' Add-ons: ' + a.addons.join(' and ') + '.' : '';
    if (a.plan === 'site') return head('You are with us. Thank you.') + '<div class="box"><span class="tag">' + (a.status === 'canceling' ? 'Ending at the end of these 3 months' : 'Active') + '</span>' +
      '<p>Site, ' + $(A.site) + ' every 3 months. Started ' + esc((a.activated_at || '').slice(0, 10)) + '.' + adds + '</p><p>To change your plan or give notice, write to contact@lesaruss.com.</p></div><p class="err" id="err"></p>';
    var plan = a.plan === 'managed' ? 'Managed, setup paid' + (adds ? '.' + adds.replace(/\.$/, '') : '') : a.setup_plan === 'full' ? 'Setup paid in full' : 'Setup in ' + a.setup_plan + ' payments';
    var paused = a.pause_from ? '<div class="box"><span class="tag">Pause set</span><p>Paused from <b>' + esc(a.pause_from) + '</b> to <b>' + esc(a.pause_until) + '</b>, at ' + $(A.pause) + ' a month. Your site stays up.</p>' +
      '<button type="button" class="btn ghost" data-unpause>Cancel the pause</button></div>' :
      '<div class="box"><b>Need a break?</b><p>Pause up to 3 months a year for ' + $(A.pause) + ' a month, starting on your next billing date. Your website and Library stay up.</p>' +
      '<select id="months"><option value="1">1 month</option><option value="2">2 months</option><option value="3">3 months</option></select> <button type="button" class="btn ghost" data-pause>Pause</button></div>';
    return head('You are with us. Thank you.') + '<div class="box"><span class="tag">' + (a.status === 'canceling' ? 'Ending at the end of this month' : 'Active') + '</span>' +
      '<p>' + plan + '. ' + $(A.monthly) + ' a month' + (a.social ? ', plus social media ' + $(A.social) : '') + '. Started ' + esc((a.activated_at || '').slice(0, 10)) + '.</p>' +
      '<p>To change your plan or give notice, write to contact@lesaruss.com.</p></div>' + (a.status === 'active' ? paused : '') + '<p class="err" id="err"></p>';
  }

  function draw() {
    if (!SLUG) { app.innerHTML = head('Open this page from the link we sent you, or tell us about your business and we will reach out.') + talk(); return; }
    if (!P) { app.innerHTML = '<p>Loading...</p>'; call({ action: 'plan', slug: SLUG }).then(function (d) { if (d.error) { app.innerHTML = head('We could not find that business.') + talk(); return; } P = d; if (d.social_open === false) C.social = false; draw(); }); return; }
    var status = q.get('status');
    if (PV === 'done') { app.innerHTML = head('Welcome aboard! We sent the details to your email. Someone from our team reaches out within a day to book your welcome call.') + viewMine(P.account).replace(/^[\s\S]*?<div class="box">/, '<div class="box">'); return; }
    if (status === 'done' && !P.account) {
      app.innerHTML = head('Payment received. Setting things up...');
      var tries = 0; (function poll() { call({ action: 'plan', slug: SLUG }).then(function (d) { if (d.account) { P = d; app.innerHTML = head('Welcome aboard! We sent the details to your email. Someone from our team reaches out within a day to book your welcome call.') + viewMine(d.account).replace(/^[\s\S]*?<div class="box">/, '<div class="box">'); return; } if (++tries < 10) setTimeout(poll, 2500); else app.innerHTML = head('Your payment went through. It is taking a moment to show here; we will email you either way.'); }); })();
      return;
    }
    if (P.account) { app.innerHTML = viewMine(P.account); return; }
    if (P.managed) { app.innerHTML = head(esc(P.listing.name) + ' is already with us. Sign in with the account that signed up to see your plan.'); return; }
    if (!token()) {
      app.innerHTML = head('Sign in with the account for your business to continue.') + '<button type="button" class="btn" data-signin>Sign in</button> ' + talk();
      return;
    }
    if (!P.allowed) { app.innerHTML = head('BrandDesk is not open for ' + esc(P.listing.name) + ' yet. We are starting with a small group of restaurants, city by city. Tell us about yours and our team will reach out.') + talk(); return; }
    var s = step();
    if (s >= 2 && !C.plan) s = 1;
    if (s === 3 && !(C.agree && C.name.trim().length >= 3)) s = 2;
    app.innerHTML = s === 1 ? viewPlan() : s === 2 ? viewAgree() : viewPay(status === 'cancelled' ? 'Checkout was closed. Nothing was charged. Pick up where you left off.' : status === 'unpaid' ? 'The payment did not go through. Nothing was charged. Try again.' : '');
  }

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'plan') { C.plan = t.value; if (C.plan === 'site') C.social = false; save(); draw(); }
    if (t.name === 'social' || t.name === 'photos' || t.name === 'video') { C[t.name] = t.checked; save(); draw(); }
    if (t.name === 'agree') { C.agree = t.checked; save(); }
  });
  app.addEventListener('input', function (e) { if (e.target.name === 'name') { C.name = e.target.value; save(); } });
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    var err = document.getElementById('err'), say = function (m) { if (err) err.textContent = m; };
    if (t.hasAttribute('data-signin')) { VEAuth.showAuthModal('Sign in with the account for your business.', function () { P = null; draw(); }, 'login'); return; }
    if (t.hasAttribute('data-back')) { go(step() - 1); return; }
    if (t.hasAttribute('data-next')) {
      var s = step();
      if (s === 2 && C.name.trim().length < 3) { say('Type your full name to sign.'); return; }
      if (s === 2 && !C.agree) { say('Tick the box to agree.'); return; }
      if (s < 3) { go(s + 1); return; }
      if (PV) { say('Preview: here the owner goes on to Stripe\'s secure checkout. Nothing is charged.'); return; }
      t.disabled = true; t.textContent = 'Opening checkout...';
      call({ action: 'checkout', slug: SLUG, plan: C.plan, photos: C.photos, video: C.video, social: !site() && C.social, agreed_name: C.name.trim(), agree: C.agree, origin: location.origin }).then(function (d) {
        if (d.url) { location.href = d.url; return; }
        t.disabled = false; t.textContent = 'Continue to secure checkout'; say(d.message || 'Checkout did not open. Try again in a minute.');
      }).catch(function () { t.disabled = false; t.textContent = 'Continue to secure checkout'; say('Checkout did not open. Try again in a minute.'); });
      return;
    }
    if (PV && (t.hasAttribute('data-pause') || t.hasAttribute('data-unpause'))) { say('Preview: a pause starts on the next billing date. Nothing is saved.'); return; }
    if (t.hasAttribute('data-pause') || t.hasAttribute('data-unpause')) {
      var body = t.hasAttribute('data-pause') ? { action: 'pause', account_id: P.account.id, months: +document.getElementById('months').value } : { action: 'pause_cancel', account_id: P.account.id };
      t.disabled = true;
      call(body).then(function (d) { if (d.ok) { P = null; draw(); } else { t.disabled = false; say(d.message || 'That did not go through.'); } });
    }
  });
  draw();
})();
</script>
</body>
</html>
