    The Vegans Explore Podcast's frame (BrandDesk, 2026-10-31): the pictures the show makes every week, drawn from its brand kit
    (/business/brand?listing=vegans-explore-podcast, parent /business/brand?brand=vegans-explore). A render target, not a page:
    no nav or footer (listed under the exceptions in CLAUDE.md). The social studio screenshots it at the kind's size.
      ?kind=episode   3000 x 3000  the episode's art (the cover's art, the episode title in the sky)
      ?kind=youtube   1920 x 1080  the full episode's video frame (the studio scene)
      ?kind=story     1080 x 1920  a Story or Reel frame
      ?kind=carousel  1080 x 1350  the first slide of a carousel
    &title= &sub= (the line under it) &n= (episode number) &date= (YYYY-MM-DD) &kicker= (the small line on top)
