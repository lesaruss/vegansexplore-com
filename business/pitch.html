<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Prepared for You — Vegans Explore</title>
  <meta name="description" content="A page we prepared for your business: what we found, your home page on our frame, your first two weeks and what it costs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* The BrandDesk pitch (canon canon-ve-front-of-house v1 "The pitch", v3 "The door, the pitch and the reveal"). One personal
       page per business, prepared by our team and sent from Sean: what we found (their latest full audit, never dressed as an
       instant scan), their home page on our frame as a still, the two weeks, the price, then I'm ready / Let me think about it /
       Talk to someone / Not now, each landing in the Inbox (ve-branddesk pitch_view, pitch_choice). I'm ready stays on this page
       (Sean, 2026-10-31: "keep it in the same look and feel so it looks like they haven't been sent somewhere else"): the plan,
       the agreement and Review and pay are the ready path's slides (#su-plan, #su-agree, #su-pay), then Stripe, which comes
       back here (ve-branddesk checkout `back`). The stage wears their chapter's city art, dark. /business/pitch?c=<code>;
       ?c=sample is Green Leaf Kitchen for Preview journeys; &preview=1 (or a super admin) never counts a view, saves a choice
       or opens checkout. */
    body{margin:0;background:#0d130e;}
    .vg-note{background:#14301a;color:#e9f7ea;font:600 13px/1.4 'Montserrat',sans-serif;padding:9px 40px;}
    .vg-note strong{display:inline-block;margin-right:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#86efac;}
    /* The city, dark, behind every slide. */
    .vg-stage.vg-photo::before{background:linear-gradient(to right,rgba(5,12,7,.93) 0%,rgba(5,12,7,.86) 45%,rgba(5,12,7,.74) 100%) !important;}
    .pt-cover-art{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100%;text-align:center;}
    .pt-logo{width:min(340px,80%);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 24px 60px rgba(0,0,0,.55);}
    .pt-letter{width:min(340px,80%);aspect-ratio:1;border-radius:18px;background:#1e3a24;display:flex;align-items:center;justify-content:center;font:900 140px/1 'Montserrat',sans-serif;color:#86efac;box-shadow:0 24px 60px rgba(0,0,0,.55);}
    .pt-place{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#c5f2c7;}
    .pt-tone{margin-top:22px;padding:16px 18px;border-left:3px solid #22C55E;background:rgba(255,255,255,.06);border-radius:6px;font-size:15px;line-height:1.6;max-width:640px;}
    .pt-big{font:900 clamp(64px,9vw,120px)/1 'Montserrat',sans-serif;color:#86efac;}
    .pt-bars{display:grid;gap:14px;margin-top:18px;}
    .pt-bar b{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
    .pt-bar i{display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;}
    .pt-bar i span{display:block;height:100%;background:#22C55E;}
    .pt-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px;}
    .pt-list li{padding:12px 14px;background:rgba(255,255,255,.06);border-radius:8px;font-size:14.5px;line-height:1.45;}
    .pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px;margin-top:16px;}
    .pt-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;}
    .pt-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;}
    @media (max-width:1100px){.pt-g3{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media (max-width:640px){.pt-g2,.pt-g3{grid-template-columns:1fr;}}
    .pt-card{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px 16px;}
    .pt-card b{display:block;font-size:15px;margin-bottom:4px;}
    .pt-card small{display:block;font-size:13px;line-height:1.5;opacity:.88;}
    .pt-card .pt-area{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#86efac;margin-bottom:6px;}
    .pt-card .pt-area svg{width:18px;height:18px;flex:none;}
    .pt-pcard{padding:0;overflow:hidden;display:grid;grid-template-columns:132px minmax(0,1fr);}
    .pt-pcard .pt-pic{display:block;width:100%;height:100%;min-height:132px;object-fit:cover;background:#fff;}
    .pt-pcard .pt-pic.pt-contain{object-fit:contain;padding:10px;box-sizing:border-box;}
    .pt-pcard .pt-pbody{padding:12px 14px 14px;}
    @media (max-width:640px){.pt-pcard{grid-template-columns:96px minmax(0,1fr);}.pt-pcard .pt-pic{min-height:96px;}}
    .pt-when{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#86efac;margin-bottom:6px;}
    .pt-cap{font-size:12px;opacity:.75;margin-top:10px;}
    .pt-still{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.45);}
    .pt-still iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none;}
    .pt-still.pt-phone{width:min(250px,70%);aspect-ratio:390/780;border-radius:26px;border:8px solid #050806;margin:0 auto;}
    .pt-still.pt-phone iframe{width:390px;height:780px;}
    .pt-still::after{content:"";position:absolute;inset:0;}
    .pt-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;}
    .pt-strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#fff;}
    .pt-strip img.pt-contain{object-fit:contain;padding:6px;box-sizing:border-box;}
    .pt-guide .pt-hero{aspect-ratio:2/1;background:#fff;object-fit:contain;}
    .pt-guide .su-keys{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
    .pt-guide .su-keys li{padding:8px 10px;font-size:13px;line-height:1.4;}
    @media (max-width:640px){.pt-guide .su-keys{grid-template-columns:1fr;}}
    .pt-hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);}
    .pt-price{font:900 clamp(30px,3.4vw,46px)/1.05 'Montserrat',sans-serif;}
    .pt-price small{font-size:15px;font-weight:700;opacity:.85;}
    .pt-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px;}
    @media (max-width:640px){.pt-choices{grid-template-columns:1fr;}}
    .pt-choice{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;font:inherit;color:#fff;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:16px 18px;}
    .pt-choice svg{width:26px;height:26px;flex:none;color:#86efac;margin-top:2px;}
    .pt-choice b{display:block;font-size:17px;margin-bottom:4px;}
    .pt-choice small{font-size:13px;opacity:.88;line-height:1.45;}
    .pt-choice:hover{border-color:rgba(255,255,255,.6);}
    .pt-choice.vg-picked{border-color:#22C55E !important;box-shadow:0 0 0 2px #22C55E inset;background:rgba(6,40,16,.85) !important;}
    .pt-choice.vg-picked b::after{content:"  ✓";color:#86efac;}
    .pt-form{margin-top:16px;display:grid;gap:10px;max-width:640px;}
    .pt-form label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:grid;gap:5px;}
    .pt-form input,.pt-form textarea{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;font-weight:500;padding:11px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;}
    .pt-form textarea{min-height:84px;}
    .pt-msg{font-size:14px;font-weight:700;min-height:20px;color:#86efac;}
    .pt-msg.err{color:#fca5a5;}
    .vg-split.pt-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;}
    .vg-split.pt-two.pt-top{align-items:start;}
    @media (max-width:900px){.vg-split.pt-two{grid-template-columns:1fr;gap:22px;}.vg-note{padding:9px 16px;}}
    /* The sign-up steps (the ready path). */
    .su-steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
    .su-steps span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);}
    .su-steps span.on{background:#22C55E;color:#03170a;}.su-steps span.done{background:rgba(34,197,94,.18);color:#c5f2c7;}
    .su-opt{display:block;cursor:pointer;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:12px 14px;}
    .su-opt.on{border-color:#22C55E;box-shadow:0 0 0 2px #22C55E inset;background:rgba(6,40,16,.85);}
    .su-opt input{accent-color:#22C55E;margin-right:6px;}
    .su-opt b{font-size:15px;}.su-opt small{display:block;font-size:13px;opacity:.85;margin-top:4px;}
    .su-opt strong{display:block;font-size:20px;font-weight:900;color:#86efac;margin-top:6px;}
    .su-sum{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 16px;font-size:14.5px;margin-top:14px;}
    .su-sum div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);}
    .su-sum div:last-child{border:0;}.su-sum .tot{font-weight:900;font-size:16px;color:#86efac;}
    .su-keys{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;}
    .su-keys li{padding:10px 12px;background:rgba(0,0,0,.45);border-radius:8px;font-size:14px;line-height:1.5;}
    .su-ck{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14.5px;line-height:1.5;cursor:pointer;}
    .su-ck input{margin-top:3px;width:18px;height:18px;accent-color:#22C55E;flex:none;}
    .su-sign{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.55;margin-top:12px;}
    .su-link{background:none;border:0;padding:0;font:inherit;color:#86efac;font-weight:800;text-decoration:underline;cursor:pointer;}
    .su-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;}
    .su-modal .su-doc{background:#fff;color:#14261a;border-radius:12px;max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:26px 28px;font-family:'Montserrat',sans-serif;font-size:14.5px;line-height:1.6;}
    .su-modal .su-doc h1{font-size:24px;margin:0 0 6px;}.su-modal .su-doc h2{font-size:17px;margin:20px 0 6px;}
    .su-modal .su-close{position:sticky;top:0;float:right;background:#14532D;color:#fff;border:0;border-radius:6px;padding:9px 14px;font:800 12px/1 'Montserrat',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
    .pt-gate{max-width:560px;margin:60px auto;padding:30px;color:#fff;font-family:'Montserrat',sans-serif;text-align:center;}
  </style>
</head>
<body>
  <div class="page-frame">
  <script src="/public/nav.js"></script>
  <div class="vg-note" id="ptNote" hidden></div>
  <main class="vg-stage" id="ptStage" aria-label="Prepared for your business">
    <section class="vg-slide" id="cover" data-title="Prepared for you"><p class="vg-lede" style="padding-top:40px">Loading...</p></section>
  </main>
  <script src="/public/ve-auth.js"></script>
  <script src="/public/ve-hubs.js"></script>
  <script src="/business/sample/cartridge.js"></script>
  <script>
  (function () {
    var API = 'https://fwbhwfxpncrsfhttimna.supabase.co/functions/v1/ve-branddesk';
    var Q = new URLSearchParams(location.search), CODE = (Q.get('c') || '').toLowerCase(), SAMPLE = CODE === 'sample', PREVIEW = SAMPLE || Q.get('preview') === '1';
    var STATUS = Q.get('status') || '';
    var IMG = '/business/sample/img/';
    var D = null, P = null, stage = document.getElementById('ptStage');
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function money(c) { return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0 }); }
    function token() { try { return window.VEAuth && VEAuth.isLoggedIn() ? VEAuth.getToken() : ''; } catch (e) { return ''; } }
    function api(body) {
      var t = token(), h = { 'Content-Type': 'application/json' }; if (t) h.Authorization = 'Bearer ' + t;
      return fetch(API, { method: 'POST', headers: h, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
    }
    // Green Leaf Kitchen is made up; Alex Rivera is its made-up owner (the same sample owner as /claim's previews).
    function sampleData() {
      var C = window.VE_CARTRIDGE;
      return { team: true, business: { name: C.business.name, slug: 'sample', city: 'Fort Lauderdale', state: 'FL', chapter: 'south-florida', logo: C.brand.logo.primary.src, photos: [] }, contact: { name: 'Alex Rivera', email: '' },
        note: 'Alex, we met at the Sunday market in the spring and I still think about your jackfruit bowl.', look: 'fresh', look_name: 'Their brand',
        summary: { looked_on: new Date(Date.now() - 6 * 864e5).toISOString(), presence: 58, areas: [{ name: 'Google', pct: 71 }, { name: 'Your website', pct: 52 }, { name: 'Being found in search', pct: 64 }, { name: 'Social', pct: 33 }],
          fixes: [{ area: 'Google', label: 'Your Google photos show your food', found: 'Google has 4 photos, none of a dish.' }, { area: 'Your website', label: 'Your website loads fast on a phone', found: 'It took 7.9 seconds on a phone.' },
            { area: 'Your website', label: 'Your menu is on your website as text', found: 'The menu is a photo of the printed menu.' }, { area: 'Social', label: 'You have posted on Instagram in the last month', found: 'Your last post was in June.' },
            { area: 'Being found in search', label: 'Your name, address and phone match everywhere', found: 'Google and your website list different phone numbers.' }],
          fix_count: 11, goods: ['Your Google Business Profile can be found', 'Your hours are on Google', 'People rate you well on Google'], good_count: 23, google: { rating: 4.7, reviews: 312 } },
        plan: null, prices: { setup: 150000, setup3: 50000, setup6: 25000, monthly: 50000, social: 50000 }, who: null, sample: true };
    }
    var PLAN = [
      { when: 'Day 1', title: 'A welcome call', text: 'We meet, you tell us what you want people to know, and we start your brand kit from what you already have.' },
      { when: 'Days 1 to 3', title: 'Your Google profile', text: 'Claimed, hours, photos, categories and the details people search for. Google\'s own verification can take longer; that part is theirs.' },
      { when: 'Days 2 to 5', title: 'Your logo and brand kit', text: 'A clean logo in every size, your colors, your type and your voice, written down so everything matches.' },
      { when: 'Days 3 to 7', title: 'Your starter photo shoot', text: 'Up to 15 dishes and your space, shot to one standard, so every photo of your food looks like it belongs together.' },
      { when: 'Days 5 to 10', title: 'Your new website', text: 'Built on our frame and fed by your Directory page: menu, hours, ordering and directions, ready for phones.' },
      { when: 'Days 10 to 14', title: 'Launch', text: 'Your site goes live, your Vegans Explore page and dashboard are ready, and we pick your first month\'s campaign together.' }
    ];
    // One picture per step of the two weeks, from the sample restaurant (captioned as such on a real business's page).
    var PLAN_PICS = ['s-owner.webp', 's-outside-day.webp', 'logo.jpg', 'm-noodles.webp', 's-room-back.webp', 's-outside-dusk.webp'];
    var ICON = {
      'Google': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
      'Your website': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>',
      'Being found in search': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
      'Social': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><path d="M17 7h.01"/></svg>',
      ready: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      think: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      talk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>',
      no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12h7"/></svg>'
    };
    function iconOf(area) { return ICON[area] || ICON['Your website']; }
    function hubOf(B) {
      var H = window.VE_HUBS || [];
      for (var i = 0; i < H.length; i++) if (H[i].slug === B.chapter) return H[i];
      return null;
    }
    function siteUrl(phone) { return SAMPLE ? '/business/sample/site?look=theirs' : '/business/site?pitch=' + encodeURIComponent(CODE); }
    function still(id, phone) { return '<div class="pt-still' + (phone ? ' pt-phone' : '') + '" data-w="' + (phone ? 390 : 1440) + '" id="' + id + '"><iframe src="' + esc(siteUrl(phone)) + '" title="' + esc(D.business.name) + ' home page preview" tabindex="-1" aria-hidden="true" loading="lazy"></iframe></div>'; }
    function sampleCap() { return SAMPLE ? '' : '<p class="pt-cap">Pictures from our sample restaurant, to show the standard. Yours will be of your food and your place.</p>'; }

    function slide(id, title, html, extra) { return '<section class="vg-slide" id="' + id + '" data-title="' + esc(title) + '"' + (extra || '') + '>' + html + '</section>'; }
    function render() {
      var B = D.business, S = D.summary, name = esc(B.name), first = (D.contact.name || '').split(' ')[0], hub = hubOf(B);
      var logo = B.logo ? '<img class="pt-logo" src="' + esc(B.logo) + '" alt="' + name + '">' : '<div class="pt-letter">' + esc(B.name.charAt(0)) + '</div>';
      var looked = S && S.looked_on ? new Date(S.looked_on).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) : '';
      var place = [B.city, hub ? hub.name : ''].filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' · ');
      if (hub && hub.page && hub.page.banner) stage.setAttribute('data-bg', hub.page.banner);
      var html = slide('cover', 'Prepared for you', '<div class="vg-split pt-two"><div><div class="vg-eyebrow">Prepared for ' + name + '</div>' +
          '<h1 class="vg-h vg-xl">We looked at ' + name + ' before we reached out.</h1>' +
          (D.note ? D.note.split(/\n\s*\n/).map(function (p) { return '<p class="vg-lede">' + esc(p) + '</p>'; }).join('') : '<p class="vg-lede">' + (first ? esc(first) + ', this' : 'This') + ' page is yours: what we found when we looked at how people find you online, what your home page could look like, and what your first two weeks with us would be.</p>') +
          '<div class="pt-tone">Running a Vegan business is a lot. Google, your website, photos, social, the menu that changed last week. You don\'t have to carry all of it. A real person on our team does the hard parts, and you keep everything we make.</div>' +
          '<p style="margin-top:22px"><button class="vg-btn" type="button" data-vg-next>See what we found</button></p></div>' +
          '<div class="pt-cover-art">' + logo + (place ? '<div class="pt-place">' + esc(place) + '</div>' : '') + '</div></div>');
      if (S) {
        html += slide('found', 'What we found', '<div class="vg-split pt-two"><div><div class="vg-eyebrow">What we found' + (looked ? ' · ' + esc(looked) : '') + '</div>' +
          '<h2 class="vg-h">How easy ' + name + ' is to find, and how good it looks when people do</h2>' +
          '<p class="vg-lede">We checked ' + (S.fix_count + S.good_count) + ' things people see before they ever walk in: Google, your website, search and social.</p>' +
          '<div class="pt-bars">' + S.areas.map(function (a) { return '<div class="pt-bar"><b><span>' + esc(a.name) + '</span><span>' + a.pct + '%</span></b><i><span style="width:' + a.pct + '%"></span></i></div>'; }).join('') + '</div></div>' +
          '<div><div class="pt-big">' + S.presence + '%</div><p class="vg-lede" style="margin-top:6px">of what a well-run presence has</p>' +

      if (t.name === 'su-agree') { C.agree = t.checked; saveC(); var m = document.getElementById('suAgreeErr'); if (m) m.textContent = ''; }
    });
    stage.addEventListener('input', function (e) { if (e.target.name === 'su-name') { C.name = e.target.value; saveC(); } });
    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-send]'); if (s) return send(s.dataset.send, s);
      var p = e.target.closest('[data-pay]'); if (p) return pay(p);
      if (e.target.closest('[data-read]')) readAgreement();
    });

    function gate(t, line) { stage.outerHTML = '<div class="pt-gate"><h1 style="font-size:26px">' + esc(t) + '</h1><p>' + line + '</p></div>'; }
    if (SAMPLE) { D = sampleData(); var fresh = true; try { fresh = !sessionStorage.getItem(KEY); } catch (e) {} loadC(); if (fresh) { C.name = 'Alex Rivera'; C.agree = true; } render(); loadPlan(); return; }
    if (!/^[a-z0-9]{8,20}$/.test(CODE)) return gate('This page was not found', 'Check the link in the email we sent you.');
    api({ action: 'pitch_view', code: CODE, preview: PREVIEW }).then(function (d) {
      if (!d || !d.ok) return gate('This page was not found', 'Check the link in the email we sent you, or write to contact@lesaruss.com.');
      D = d; KEY = 've_bd_choice_' + d.business.slug; loadC(); render(); loadPlan();
    }, function () { gate('This page did not load', 'Check your connection and try again.'); });
  })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
