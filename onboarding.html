<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/analytics.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Your Passport - VEGANS EXPLORE</title>
  <meta name="description" content="Tell us a bit about you so we can match you with a guide and personalize your VEGANS EXPLORE experience.">
  <link rel="icon" href="/public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Montserrat", sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }
    .ob-wrap { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 32px 20px 80px; }
    .ob-card { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,0.06); padding: 32px 28px; }
    .ob-progress-track { height: 5px; background: #EEE; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .ob-progress-fill { height: 100%; background: #22C55E; border-radius: 3px; transition: width 0.3s ease; width: 0%; }
    .ob-step-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #999; margin-bottom: 22px; }
    h1 { font-size: 22px; font-weight: 900; color: #1a1a1a; margin-bottom: 6px; line-height: 1.25; }
    .ob-sub { font-size: 13px; color: #666; margin-bottom: 22px; line-height: 1.5; }
    .ob-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .ob-opt { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1.5px solid rgba(0,0,0,0.12); border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: #1a1a1a; transition: border-color 0.15s, background 0.15s; background: #fff; }
    .ob-opt:hover { border-color: #86EFAC; }
    .ob-opt.selected { border-color: #22C55E; background: #F0FDF4; }
    .ob-opt-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); flex-shrink: 0; position: relative; }
    .ob-opt.selected .ob-opt-check { border-color: #22C55E; background: #22C55E; }
    .ob-opt.selected .ob-opt-check::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .ob-field { margin-bottom: 16px; }
    label.ob-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
    input[type="text"] { display: block; width: 100%; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 8px; font-family: "Montserrat", sans-serif; font-size: 14px; color: #1a1a1a; background: #fff; }
    input:focus { outline: none; border-color: #22C55E; }
    .ob-detect { font-size: 12px; color: #22C55E; font-weight: 700; cursor: pointer; background: none; border: none; text-decoration: underline; padding: 0; margin-top: 6px; font-family: "Montserrat", sans-serif; }
    .ob-guide-reveal { text-align: center; padding: 8px 0 4px; }
    .ob-guide-img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; display: block; border: 4px solid #F0FDF4; background: #EAF5EB; }
    .ob-guide-name { font-size: 20px; font-weight: 900; margin-bottom: 2px; }
    .ob-guide-title { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #22C55E; margin-bottom: 12px; }
    .ob-guide-desc { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 4px; }
    .ob-interests-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .ob-interest { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border: 1.5px solid rgba(0,0,0,0.12); border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; color: #1a1a1a; background: #fff; }
    .ob-interest.selected { border-color: #22C55E; background: #F0FDF4; color: #166534; }
    .ob-points-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
    .ob-points-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #F9FAFB; border-radius: 8px; font-size: 13px; }
    .ob-points-row span.pts { font-weight: 800; color: #22C55E; }
    .ob-summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 13px; }
    .ob-summary-row span:first-child { color: #777; font-weight: 600; }
    .ob-summary-row span:last-child { font-weight: 700; text-align: right; }
    .ob-actions { display: flex; gap: 10px; margin-top: 22px; }
    .ob-btn { flex: 1; padding: 14px; border-radius: 8px; font-family: "Montserrat", sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; border: none; cursor: pointer; transition: background 0.15s; }
    .ob-btn-primary { background: #22C55E; color: #fff; }
    .ob-btn-primary:hover { background: #16A34A; }
    .ob-btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
    .ob-btn-back { background: #F3F4F6; color: #555; flex: 0 0 90px; }
    .ob-btn-back:hover { background: #E5E7EB; }
    .ob-error { display: none; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; padding: 12px 14px; font-size: 13px; color: #dc2626; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
    .ob-error.visible { display: block; }
    .ob-skip { text-align: center; margin-top: 14px; }
    .ob-skip a { font-size: 12px; color: #999; text-decoration: underline; }
    @media (max-width: 480px) { .ob-card { padding: 24px 20px; } .ob-interests-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <script src="/public/nav.js"></script>
  <div class="ob-wrap">
    <div class="ob-card">
      <div class="ob-progress-track"><div class="ob-progress-fill" id="ob-progress"></div></div>
      <div class="ob-step-label" id="ob-step-label">Step 1 of 8</div>
      <div id="ob-error" class="ob-error" role="alert"></div>
      <div id="ob-steps"></div>
      <div class="ob-actions" id="ob-actions"></div>
    </div>
  </div>
  <script src="/public/ve-auth.js"></script>
  <script>
    if (!VEAuth.isLoggedIn()) window.location.replace('/join');
    var member = VEAuth.getMember();
    if (member && member.onboarding_completed) window.location.replace('/dashboard');

    // ---- Content ported from the abandoned Sapphire mobile app's onboarding
    // wizard (2026-08-18, V direction): that app never shipped and its save
    // path was broken end to end, so nobody ever completed this. Copy and
    // guide-assignment logic below is copied verbatim from its source so the
    // web version matches what was already designed and approved.
    var GUIDES = [
      { id: 'maya',  name: 'Maya',  title: 'Pre-Vegan',      image: '/public/guides/maya.png',  desc: 'Vegan-curious. Real answers, real support, and a clear path to make the shift.' },
      { id: 'theo',  name: 'Theo',  title: 'Seasoned Vegan', image: '/public/guides/theo.png',  desc: 'Already living it. Deepen your impact, mentor others, and connect with the global movement.' },
      { id: 'nori',  name: 'Nori',  title: 'Entrepreneur',   image: '/public/guides/nori.png',  desc: 'Building a Vegan business. Get listed, grow your audience, and connect with customers.' },
      { id: 'dani',  name: 'Dani',  title: 'Nonprofit',      image: '/public/guides/dani.png',  desc: 'Running a Vegan org. Build your community on the platform and grow your base.' },
      { id: 'river', name: 'River', title: 'Creator',        image: '/public/guides/river.jpg', desc: 'Creating content in the Vegan space. Grow your audience and earn through the ecosystem.' },
      { id: 'liz',   name: 'Liz',   title: 'Explorer',       image: '/public/guides/liz.png',   desc: 'Still figuring it out. No rush. Explore what the Vegan world has to offer.' }
    ];
    var JOURNEY_OPTS = ["I'm not Vegan yet but I'm curious", "I'm fairly new (under a year)", "I've been Vegan for a while", "I've been Vegan for years"];
    var BRINGS_OPTS = ['Find Vegan food and spots near me', 'Learn how to go or stay Vegan', 'Connect with other Vegans', 'Grow or start a Vegan business', 'Give back to the community', 'Share my story or create content'];
    var FOCUS_OPTS = ['My own health and lifestyle', 'My family - cooking, kids, household', 'My work or business', 'Community and advocacy'];
    var INTERESTS = [
      { id: 'recipes', label: 'Recipes' }, { id: 'fitness', label: 'Fitness' },
      { id: 'community', label: 'Community' }, { id: 'business', label: 'Business' },
      { id: 'activism', label: 'Activism' }, { id: 'travel', label: 'Travel' },
      { id: 'wellness', label: 'Wellness' }, { id: 'news', label: 'News' }
    ];
    var POINTS_ROWS = [
      { label: 'Complete missions', pts: '+50-200 pts' }, { label: 'Daily activities', pts: '+10-50 pts' },
      { label: 'Invite a friend', pts: '+250 pts' }, { label: 'Spend in the store', pts: 'Use pts' },
      { label: 'Support a business', pts: '$111/mo via pts' }
    ];

    function assignGuide(journeyStage, brings, focus, hasBusiness) {
      var wantsBiz = brings.indexOf(3) !== -1 || focus.indexOf(2) !== -1;
      var wantsContent = brings.indexOf(5) !== -1;
      var wantsCommunity = brings.indexOf(4) !== -1 || focus.indexOf(3) !== -1;
      if (journeyStage <= 1) return 'maya';
      if (hasBusiness && wantsBiz && wantsCommunity) return 'dani';
      if (hasBusiness && wantsBiz) return 'nori';
      if (wantsContent) return 'river';
      if (wantsCommunity) return 'dani';
      return 'theo';
    }

    var STEPS = ['journey', 'brings', 'focus', 'business', 'location', 'reveal', 'interests', 'name', 'points', 'confirm'];
    var state = { journeyStage: null, brings: [], focus: [], hasBusiness: null, city: '', displayName: (member && member.name) || '', interests: [], guide: null };
    var stepIdx = 0;

    var stepsEl = document.getElementById('ob-steps');
    var actionsEl = document.getElementById('ob-actions');
    var progressEl = document.getElementById('ob-progress');
    var stepLabelEl = document.getElementById('ob-step-label');
    var errorEl = document.getElementById('ob-error');
    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('visible'); }
    function clearError() { errorEl.classList.remove('visible'); }

    function toggleInArray(arr, val, max) {
      var i = arr.indexOf(val);
      if (i !== -1) { arr.splice(i, 1); return; }
      if (max && arr.length >= max) arr.shift();
      arr.push(val);
    }

    function renderChoiceStep(title, sub, opts, selectedArr, max, onSingleSelect) {
      var html = '<h1>' + title + '</h1><p class="ob-sub">' + sub + '</p><div class="ob-opts">';
      opts.forEach(function(o, i) {
        var sel = selectedArr.indexOf(i) !== -1;
        html += '<div class="ob-opt' + (sel ? ' selected' : '') + '" data-i="' + i + '"><div class="ob-opt-check"></div>' + o + '</div>';
      });
      html += '</div>';
      stepsEl.innerHTML = html;
      Array.prototype.forEach.call(stepsEl.querySelectorAll('.ob-opt'), function(el) {
        el.addEventListener('click', function() {
          var i = parseInt(el.getAttribute('data-i'), 10);
          // NOTE: selectedArr here is a real reference into state (state.brings /
          // state.focus) for multi-select steps, so mutating it in place is safe.
          // Single-select steps (journey, business) pass a freshly-computed
          // throwaway array instead (it can't be a live reference to a scalar
          // field), so max===1 clicks are handled via onSingleSelect below,
          // which writes straight to the real state field.
          if (max === 1) { if (onSingleSelect) onSingleSelect(i); }
          else toggleInArray(selectedArr, i, max);
          render();
        });
      });
    }

    function render() {
      clearError();
      progressEl.style.width = Math.round(((stepIdx) / (STEPS.length - 1)) * 100) + '%';
      stepLabelEl.textContent = 'Step ' + (stepIdx + 1) + ' of ' + STEPS.length;
      var step = STEPS[stepIdx];
      var nextLabel = stepIdx === STEPS.length - 1 ? 'Start Exploring' : 'Continue';
      var canGoBack = stepIdx > 0;

      if (step === 'journey') {
        renderChoiceStep("Where are you with plant-based eating?", "Be honest - there's no wrong answer.", JOURNEY_OPTS, state.journeyStage === null ? [] : [state.journeyStage], 1, function(i) { state.journeyStage = i; });
      } else if (step === 'brings') {
        renderChoiceStep('What brings you to VEGANS EXPLORE?', 'Pick up to 2.', BRINGS_OPTS, state.brings, 2);
      } else if (step === 'focus') {
        renderChoiceStep("What's your biggest focus right now?", 'Pick up to 2.', FOCUS_OPTS, state.focus, 2);
      } else if (step === 'business') {
        renderChoiceStep('Do you have a Vegan business or project - even just an idea?', ' ', ['Yes, I do', 'Not yet'], state.hasBusiness === null ? [] : [state.hasBusiness === true ? 0 : 1], 1, function(i) { state.hasBusiness = (i === 0); });
      } else if (step === 'location') {
        stepsEl.innerHTML = '<h1>Where are you based?</h1><p class="ob-sub">Helps us connect you to local events, businesses, and community.</p>' +
          '<div class="ob-field"><label class="ob-label">City</label><input type="text" id="ob-city" placeholder="Your city" value="' + (state.city || '').replace(/"/g,'&quot;') + '"></div>' +
          '<button type="button" class="ob-detect" id="ob-detect">Detect my location</button>';
        document.getElementById('ob-city').addEventListener('input', function(e) { state.city = e.target.value; });
        document.getElementById('ob-detect').addEventListener('click', function() {
          var btn = document.getElementById('ob-detect');
          if (!navigator.geolocation) { showError('Location detection is not available in this browser.'); return; }
          btn.textContent = 'Detecting...';
          navigator.geolocation.getCurrentPosition(function(pos) {
            fetch('https://nominatim.openstreetmap.org/reverse?lat=' + pos.coords.latitude + '&lon=' + pos.coords.longitude + '&format=json')
              .then(function(r) { return r.json(); })
              .then(function(d) {
                var a = d.address || {};
                var city = a.city || a.town || a.village || a.county || '';
                if (city) { state.city = city; document.getElementById('ob-city').value = city; }
                btn.textContent = 'Detect my location';
              }).catch(function() { btn.textContent = 'Detect my location'; showError("Couldn't detect your location. Please type your city."); });
          }, function() { btn.textContent = 'Detect my location'; showError("Couldn't detect your location. Please type your city."); });
        });
      } else if (step === 'reveal') {
        state.guide = assignGuide(state.journeyStage, state.brings, state.focus, state.hasBusiness === true);
        var g = GUIDES.filter(function(x) { return x.id === state.guide; })[0];
        stepsEl.innerHTML = '<div class="ob-guide-reveal"><img class="ob-guide-img" src="' + g.image + '" alt="' + g.name + '">' +
          '<div class="ob-guide-name">Say hello to ' + g.name + '!</div>' +
          '<div class="ob-guide-title">Your path: ' + g.title + '</div>' +
          '<p class="ob-guide-desc">' + g.desc + '</p></div>';
      } else if (step === 'interests') {
        stepsEl.innerHTML = '<h1>What excites you?</h1><p class="ob-sub">Pick at least one. We\'ll personalize your feed.</p><div class="ob-interests-grid" id="ob-interests-grid"></div>';
        var grid = document.getElementById('ob-interests-grid');
        INTERESTS.forEach(function(it) {
          var sel = state.interests.indexOf(it.id) !== -1;
          var el = document.createElement('div');
          el.className = 'ob-interest' + (sel ? ' selected' : '');
          el.textContent = it.label;
          el.addEventListener('click', function() {
            var i = state.interests.indexOf(it.id);
            if (i !== -1) state.interests.splice(i, 1); else state.interests.push(it.id);
            render();
          });
          grid.appendChild(el);
        });
      } else if (step === 'name') {
        stepsEl.innerHTML = '<h1>What should we call you?</h1><p class="ob-sub">Your display name inside the app.</p>' +
          '<div class="ob-field"><label class="ob-label">Name</label><input type="text" id="ob-name" placeholder="Your name" value="' + (state.displayName || '').replace(/"/g,'&quot;') + '"></div>';
        document.getElementById('ob-name').addEventListener('input', function(e) { state.displayName = e.target.value; });
      } else if (step === 'points') {
        var rowsHtml = POINTS_ROWS.map(function(r) { return '<div class="ob-points-row"><span>' + r.label + '</span><span class="pts">' + r.pts + '</span></div>'; }).join('');
        stepsEl.innerHTML = '<h1>How to Earn Points</h1><p class="ob-sub">Points unlock perks, products, and your next level. You get +100 points just for finishing this.</p><div class="ob-points-rows">' + rowsHtml + '</div>';
      } else if (step === 'confirm') {
        var g2 = GUIDES.filter(function(x) { return x.id === state.guide; })[0];
        stepsEl.innerHTML = '<h1>You\'re all set' + (state.displayName ? ', ' + state.displayName : '') + '!</h1>' +
          '<p class="ob-sub">Your guide ' + g2.name + ' is ready. Time to explore.</p>' +
          '<div class="ob-summary-row"><span>Location</span><span>' + (state.city || 'Not set') + '</span></div>' +
          '<div class="ob-summary-row"><span>Guide</span><span>' + g2.name + ' - ' + g2.title + '</span></div>' +
          '<div class="ob-summary-row"><span>Interests</span><span>' + (state.interests.length ? state.interests.join(', ') : 'None selected') + '</span></div>' +
          '<div class="ob-summary-row"><span>Starting points</span><span>100 pts on completion</span></div>';
      }

      actionsEl.innerHTML = '';
      if (canGoBack) {
        var backBtn = document.createElement('button');
        backBtn.className = 'ob-btn ob-btn-back'; backBtn.textContent = 'Back'; backBtn.type = 'button';
        backBtn.addEventListener('click', function() { stepIdx--; render(); });
        actionsEl.appendChild(backBtn);
      }
      var nextBtn = document.createElement('button');
      nextBtn.className = 'ob-btn ob-btn-primary'; nextBtn.textContent = nextLabel; nextBtn.type = 'button';
      nextBtn.addEventListener('click', onNext);
      actionsEl.appendChild(nextBtn);
    }

    function validateStep() {
      var step = STEPS[stepIdx];
      if (step === 'journey' && state.journeyStage === null) return 'Please choose one.';
      if (step === 'brings' && state.brings.length === 0) return 'Please pick at least one.';
      if (step === 'focus' && state.focus.length === 0) return 'Please pick at least one.';
      if (step === 'business' && state.hasBusiness === null) return 'Please choose one.';
      if (step === 'interests' && state.interests.length === 0) return 'Please pick at least one.';
      if (step === 'name' && (!state.displayName || state.displayName.trim().length < 2)) return 'Please enter at least 2 characters.';
      return null;
    }

    function onNext() {
      clearError();
      var err = validateStep();
      if (err) { showError(err); return; }
      if (stepIdx < STEPS.length - 1) { stepIdx++; render(); window.scrollTo(0,0); return; }
      submitOnboarding();
    }

    function submitOnboarding() {
      var btn = actionsEl.querySelector('.ob-btn-primary');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      VEAuth.completeOnboarding({
        guide_slug: state.guide,
        display_name: state.displayName,
        interests: state.interests,
        journey_stage: state.journeyStage,
        city: state.city || null,
        brings_reasons: state.brings,
        biggest_focus: state.focus,
        has_vegan_business: state.hasBusiness === true,
        language: 'en'
      }).then(function(d) {
        if (d.error) { showError(d.error); if (btn) { btn.disabled = false; btn.textContent = 'Start Exploring'; } return; }
        window.location.replace('/dashboard');
      }).catch(function() {
        showError('Something went wrong saving your answers. Please try again.');
        if (btn) { btn.disabled = false; btn.textContent = 'Start Exploring'; }
      });
    }

    render();
  </script>
</body>
</html>
