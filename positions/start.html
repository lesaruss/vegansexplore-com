  var D = null, PREVIEW = false, STEP = 'big', LOCAL = { check: false, agreed: false, meta: false };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(c) { return '$' + (Number(c || 0) / 100).toFixed(2).replace(/\.00$/, ''); }
  function nice(s) { if (!s) return ''; var d = new Date(s + 'T12:00:00Z'); return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function msg(t, ok) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (t ? (ok ? ' ok' : ' err') : ''); }
  function post(body) {
    return fetch(SB + '/functions/v1/ve-positions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (window.VEAuth ? VEAuth.getToken() : '') }, body: JSON.stringify(Object.assign({ slug: SLUG }, body)) })
      .then(function (r) { return r.json().then(function (d) { d._status = r.status; return d; }); });
  }
  function steps() { var s = (D && D.person && D.person.steps) || {}; return { check: s.check || LOCAL.check, agreed: s.agreement || LOCAL.agreed, meta: s.meta || LOCAL.meta, payouts: s.payouts }; }

  function paintStatic() {
    var c = COPY;
    $('eb').textContent = c.eyebrow;
    var b = c.big; $('bigBlocks').innerHTML = b.blocks.map(function (x) { return '<div class="k-block ' + x[2] + '"><span class="k-big">' + esc(x[0]) + '</span><small>' + esc(x[1]) + '</small></div>'; }).join('');
    $('whyH').textContent = b.whyH; $('why').textContent = b.why; $('pagesH').textContent = b.pagesH; $('pages').textContent = b.pages;
    var r = c.role, row = function (x, i, cls) { return '<div class="k-row"><span class="k-num ' + cls + '">' + (i + 1) + '</span><span class="k-row-t"><b>' + esc(x[0]) + '</b><small>' + esc(x[1]) + '</small></span></div>'; };
    $('doH').textContent = r.doH; $('doRows').innerHTML = r.does.map(function (x, i) { return row(x, i, 'or'); }).join('');
    $('neverH').textContent = r.neverH; $('neverRows').innerHTML = r.nevers.map(function (x, i) { return row(x, i, 'pk'); }).join('');
    $('dayH').textContent = r.dayH; $('day').innerHTML = r.day.map(function (x) { return '<div><em>' + esc(x[0]) + '</em><b>' + esc(x[1]) + '</b>' + esc(x[2]) + '</div>'; }).join('');
    $('dayNote').textContent = r.dayNote;
    $('checkIntro').textContent = c.check.intro;
    $('qs').innerHTML = c.check.qs.map(function (q) {
      return '<div class="q" data-q="' + q.k + '"><h3>' + esc(q.q) + '</h3>' + q.a.map(function (a) { return '<label><input type="radio" name="q_' + q.k + '" value="' + a[0] + '"><span>' + esc(a[1]) + '</span></label>'; }).join('') + '</div>';
    }).join('');
    $('agrH').textContent = c.agrH; $('agreeL').textContent = c.agree; $('snameL').textContent = c.sname;
    var n = c.next; $('n1H').textContent = n.n1H; $('n1').textContent = n.n1; $('metaL').textContent = n.metaL; $('metaHint').textContent = n.metaHint; $('metaGo').textContent = n.metaGo;
    if (n.names) { var mi = $('metaEmail'); mi.type = 'text'; mi.removeAttribute('inputmode'); mi.setAttribute('autocomplete', 'off'); }
    $('n2H').textContent = n.n2H; $('n2').textContent = n.n2; $('n3H').textContent = n.n3H; $('n3').textContent = n.n3; $('n3Tag').textContent = n.tagWaiting;
  }
  function paintData() {
    var p = D.position, per = D.person, np = per.next_payout || {};
    $('payBlocks').innerHTML = '<div class="k-block k-dk"><span class="k-big">' + money(p.pay_cents) + '</span><small>' + esc(COPY.pay.every) + '</small></div>' +
      '<div class="k-block k-peach"><span class="k-big">' + Math.round((p.trial_days || 30) / 30) + ' month</span><small>' + esc(COPY.pay.trial) + '</small></div>' +
      (np.payOn ? '<div class="k-block k-tint"><span class="k-big">' + esc(nice(np.payOn)) + '</span><small>' + esc(COPY.pay.first) + ': ' + money(np.amount_cents) + '</small></div>' : '');
    var dr = p.draft;
    $('agr').textContent = dr ? dr.text : (p.agreement && p.agreement.text) || '';
    $('agrDraft').hidden = !dr; $('agrNote').hidden = !dr; $('agrNote').textContent = COPY.agrDraftNote;
    if (per.meta_email) $('metaEmail').value = per.meta_email;
    paintNext();
  }
  function paintNext() {
    var s = steps();
    $('n1Tag').textContent = s.meta ? COPY.next.tagDone : COPY.next.tagWaiting; $('n1Tag').className = 'k-tag ' + (s.meta ? 'live' : 'not');
    $('payGo').textContent = s.payouts ? COPY.next.payDone : COPY.next.payGo; $('payGo').disabled = !!s.payouts;
    $('doneNote').hidden = !(s.meta && s.payouts); $('doneNote').textContent = COPY.next.done;
  }

  // Kai's recorded line for the step: nothing plays until Play is pressed, one at a time, and it stops when the step changes.
  var KAI = new Audio(); KAI.preload = 'none';
  KAI.addEventListener('ended', function () { $('kplay').innerHTML = '&#9654; ' + COPY.play; });
  function kaiStop() { try { KAI.pause(); } catch (e) {} $('kplay').innerHTML = '&#9654; ' + COPY.play; }
  $('kplay').addEventListener('click', function () {
    if (!KAI.paused) return kaiStop();
    var src = COPY.audio[STEP]; if (!src) return;
    if (KAI.getAttribute('src') !== src) KAI.src = src; else KAI.currentTime = 0;
    KAI.play().then(function () { $('kplay').innerHTML = '&#9632; ' + COPY.stop; }).catch(kaiStop);
  });
  function go(name, push) {
    if (ORDER.indexOf(name) < 0) name = 'big';
    // Never skip ahead past an unfinished step: the quick check before I'm in, signing before Next steps (preview walks freely).
    var s = steps(), max = !s.check ? 2 : !s.agreed ? 3 : 4;
    if (!PREVIEW && ORDER.indexOf(name) > max) name = ORDER[max];
    STEP = name;
    var at = ORDER.indexOf(name);
    [].forEach.call(document.querySelectorAll('[data-step]'), function (el) { el.hidden = el.getAttribute('data-step') !== name; });
    $('stepper').innerHTML = ORDER.map(function (k, n) { return '<li class="' + (n < at ? 'done' : n === at ? 'on' : '') + '">' + esc(COPY.steps[k]) + '</li>'; }).join('');
    $('count').textContent = 'Step ' + (at + 1) + ' of ' + ORDER.length;
    $('h1').textContent = COPY.h1[name]; $('lede').textContent = COPY.lede[name]; $('say').textContent = COPY.say[name];
    kaiStop(); $('kplay').hidden = !COPY.audio[name];
    $('back').hidden = at === 0;
    $('next').hidden = name === 'next';
    $('next').textContent = name === 'in' ? 'Sign and continue' : 'Next';
    msg('');
    if (push !== undefined) { var u = new URL(location.href); if (name === 'big') u.searchParams.delete('step'); else u.searchParams.set('step', name); history[push ? 'pushState' : 'replaceState']({ step: name }, '', u.pathname + u.search); }
    window.scrollTo(0, 0);
  }
  function answers() { var a = {}; COPY.check.qs.forEach(function (q) { var el = document.querySelector('input[name=q_' + q.k + ']:checked'); a[q.k] = el ? el.value : null; }); return a; }
  var RIGHT = COPY.check.right || { owner: 'send_link', account: 'business_suite', footage: 'send_us' };
  function nextFrom(name) {
    if (name === 'check') {
      var a = answers(), wrong = Object.keys(RIGHT).filter(function (k) { return a[k] !== RIGHT[k]; });
      [].forEach.call(document.querySelectorAll('.q'), function (q) { q.classList.toggle('bad', wrong.indexOf(q.getAttribute('data-q')) >= 0); });
      if (wrong.length) return msg(COPY.check.wrong);
      if (PREVIEW) { LOCAL.check = true; return go('in', true); }
      return post({ action: 'role_read', answers: a }).then(function (d) { if (!d.ok) return msg(d.message || COPY.check.wrong); D = d; paintData(); go('in', true); });
    }
    if (name === 'in') {
      var name_ = $('sname').value.trim();
      if (!$('agree').checked || name_.length < 2) return msg(COPY.signFirst);
      if (D.position.draft) { if (PREVIEW) { LOCAL.agreed = true; return go('next', true); } return msg(COPY.agrDraftNote); }
      if (PREVIEW) { LOCAL.agreed = true; return go('next', true); }
      return post({ action: 'sign', signed_name: name_, agree: true, sha: D.position.agreement.sha }).then(function (d) { if (!d.ok) return msg(d.message || 'That did not save. Try again.'); D = d; paintData(); go('next', true); });
    }
    go(ORDER[ORDER.indexOf(name) + 1], true);
  }
  $('next').onclick = function () { nextFrom(STEP); };
  $('back').onclick = function () { var at = ORDER.indexOf(STEP); if (at > 0) go(ORDER[at - 1], true); };
  window.addEventListener('popstate', function () { go(new URLSearchParams(location.search).get('step') || 'big'); });
  $('metaGo').onclick = function () {
    var e = $('metaEmail').value.trim();
    if (COPY.next.names ? e.length < 3 : !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e)) return msg(COPY.next.names ? 'Add the names on your Facebook and Meetup profiles.' : 'That does not look like an email address. Use the one you sign in to Facebook with.');
    if (PREVIEW) { LOCAL.meta = true; paintNext(); return msg(COPY.next.metaSaved, true); }
    post({ action: 'meta_email', email: e }).then(function (d) { if (!d.ok) return msg(d.message || 'That did not save. Try again.'); D = d; paintData(); msg(COPY.next.metaSaved, true); });
  };
  $('payGo').onclick = function () {
    if (PREVIEW) return msg('Preview: this opens Stripe for the real person.', true);
    $('payGo').disabled = true;
    post({ action: 'payout_start' }).then(function (d) { if (d.ok && d.url) location.href = d.url; else { $('payGo').disabled = false; msg(d.message || 'Stripe did not open. Try again in a minute.'); } });
  };

  function gate(text, signin) {
    $('gate').hidden = false; $('app').hidden = true;
    $('gate').innerHTML = '<p class="k-lede">' + esc(text) + '</p>' + (signin ? '<a class="k-btn k-cta" href="/login?next=' + encodeURIComponent(location.pathname + location.search) + '">' + esc(COPY.gate.signinBtn) + '</a>' : '');
  }
  function start(d) {
    D = d; PREVIEW = !!d.preview;
    $('pv').hidden = !PREVIEW; $('app').hidden = false; $('gate').hidden = true;
    paintData();
    var q = new URLSearchParams(location.search);
    go(q.get('step') || 'big');
    if (!PREVIEW && q.get('stripe') === 'return') post({ action: 'payout_status' }).then(function (x) { if (x.ok) { D = x; paintData(); } });
  }
  function boot() {
    paintStatic(); go('big');
    $('app').hidden = true;
    var art = window.VEGuideArt ? VEGuideArt('kai', 'square') : '/public/brand-kit/avatars/kai-v2.jpg';
    $('av').style.backgroundImage = 'url("' + art + '")';
    var tok = window.VEAuth ? VEAuth.getToken() : '';
    if (!tok) return gate(COPY.gate.signin, true);
    var wantPreview = new URLSearchParams(location.search).get('preview') === '1';
    (wantPreview ? post({ action: 'preview' }) : post({ action: 'me' })).then(function (d) {
      if (d.ok) return start(d);
      if (!wantPreview && (d.error === 'not_invited' || d._status === 403)) return post({ action: 'preview' }).then(function (p) { if (p.ok) start(p); else gate(d.message || COPY.gate.notInvited, false); });
      if (d.error === 'sign_in' || d._status === 401) return gate(COPY.gate.signin, true);
      gate(d.message || COPY.gate.notInvited, false);
    }).catch(function () { gate('Something went wrong loading this page. Try again in a minute.', false); });
  }
  if (document.readyState === 'complete') boot(); else window.addEventListener('load', boot);
})();
</script>
<script src="/public/footer.js"></script>
</body>
