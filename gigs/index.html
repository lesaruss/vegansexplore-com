  <style>
    /* The Gig Board (Sean, 2026-10-30). /gigs is the live board (today: our bounties as points gigs, for signed-in members);
       /gigs/sample (a rewrite to this page) is the sample, Kai Monroe and illustrative gigs from /gigs/sample/demo.js. Both draw
       /public/ve-gigs.js; this page adds the shared banner, whose dropdown moves between the board's views. The sample is also the
       creator pathway (Sean, 2026-10-30: "this really should be the guide itself"): it opens on the Overview (the opportunity, Kai
       on the right), walks Your dashboard, Open gigs, My gigs, Your media kit and How you rise with Next at the top and the bottom,
       and ends on Apply, the creator application (VEGigs guide: true). */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; font-family: 'Montserrat', sans-serif; color: #1a1a1a; }
    main { max-width: none; margin: 0; padding: 24px 40px 80px; }
    .gate { border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 32px; text-align: center; }
    .gate p { color: rgba(26,26,26,.75); line-height: 1.6; margin: 0 0 16px; }
    .gate a { display: inline-flex; margin: 4px; padding: 11px 20px; border-radius: 6px; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; background: #2d7d31; color: #fff; }
    .gate a.ghost { background: #fff; color: #1a1a1a; border: 1.5px solid rgba(0,0,0,.12); }
    @media (max-width: 600px) { main { padding: 16px 16px 60px; } }
  </style>
</head>
<body>
  <div class="page-frame">
  <script src="/public/nav.js"></script>
  <script src="/public/ve-hubs.js"></script>
  <script src="/public/ve-city-banner.js"></script>
  <section id="gig-banner"></section>
  <main><div id="gigs"></div></main>
  <script src="/public/ve-gigs.js"></script>
  <script>
    (function () {
      var demo = /^\/gigs\/sample/.test(location.pathname);
      // The dropdown is the only menu (Sean, 2026-10-30); in the demo the line under the title says Demo.
      var VIEWS = (demo ? [{ value: 'overview', label: 'Overview' }] : []).concat([{ value: 'dashboard', label: 'Your dashboard' }, { value: 'board', label: 'Open gigs' }, { value: 'mine', label: 'My gigs' }, { value: 'profile', label: 'Your media kit' }, { value: 'how', label: 'How you rise' }])
        .concat(demo ? [{ value: 'join', label: 'Apply' }] : []);
      var HOME = demo ? 'overview' : 'dashboard';
      var ready = false;
      var banner = VECityBanner.mount('gig-banner', {
        key: 'gigs', title: 'Creator Dashboard', pickLabel: 'Creator Dashboard menu', param: false, art: '/communities/south-florida/banner.jpg',
        sub: demo ? 'Paid work for Vegan creators, city by city. Walk through it with Kai, then apply.' : 'Find gigs, follow the ones you are in, keep your media kit sharp, and rise by results. Use the menu to move around.',
        choices: VIEWS, home: { label: demo ? 'Overview' : 'Dashboard home', href: demo ? '/gigs/sample#overview' : '/gigs#dashboard' },
        actions: demo ? [{ label: 'Apply to be a creator', short: 'Apply', href: '/gigs/sample#join/1', go: true }] : [],
        onChange: function (v) { if (!ready) return; var cur = (location.hash || '#' + HOME).slice(1).split('/')[0]; if (v && v !== cur && !(v === 'board' && (cur === 'gig' || cur === 'apply'))) location.hash = '#' + (v === 'join' ? 'join/1' : v); }
      });
      // Inside a Guide's preview the banner starts folded, so the board is what shows.
      ready = true;
      if (demo) banner.setLabel('Demo');
      if (window.top !== window) banner.fold(true);
      function sync(view) { var v = view === 'gig' || view === 'apply' ? 'board' : view; if (banner.current() !== v) banner.setQuiet(v); }
      // The banner's own pick at mount follows the address.
      ready = false; sync(((location.hash || '#' + HOME).slice(1).split('/')[0]) || HOME); ready = true;
      var el = document.getElementById('gigs');
      el.addEventListener('click', function () { banner.autoFold(); });
      function load(src) { return new Promise(function (ok) { var s = document.createElement('script'); s.src = src; s.onload = ok; document.head.appendChild(s); }); }
      if (demo) {
        load('/gigs/sample/demo.js').then(function () { VEGigs.mount(el, { demo: true, guide: true, data: window.VE_GIGS_DEMO, onView: sync }); });
        return;
      }
      function start() {
        if (!(window.VEAuth && VEAuth.isLoggedIn())) {
          el.innerHTML = '<div class="gate"><p><b>The Gig Board is for members.</b> Sign in to see the gigs in your city, or open the sample to see how it works.</p><a href="/gigs/sample">See the sample board</a><a class="ghost" href="/login?next=/gigs">Sign in</a></div>';
          return;
        }
        VEGigs.live(el, { onView: sync }).catch(function () { el.innerHTML = '<div class="gate"><p>The board could not load. Refresh to try again.</p></div>'; });
      }
      if (window.VEAuth) start(); else window.addEventListener('load', start);
    })();
  </script>
  <script src="/public/footer.js"></script>
  </div>
</body>
